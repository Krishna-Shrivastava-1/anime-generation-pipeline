name: Generate and Download Duck.ai Story Frames

on:
  workflow_dispatch:
    inputs:
      headed:
        description: "Run non-headless Chrome under Xvfb (less detectable)"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  generate-story-frames:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Tor
        timeout-minutes: 4
        run: |
          sudo apt-get update
          sudo apt-get install -y tor netcat-openbsd xvfb
          sudo service tor start
          for i in {1..30}; do
            if nc -z 127.0.0.1 9050; then echo "Tor ready"; break; fi
            sleep 2
          done
          nc -z 127.0.0.1 9050

      - name: Install Python dependencies
        timeout-minutes: 6
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi playwright pillow requests
          playwright install --with-deps chromium

      - name: Verify connection (curl_cffi, Chrome TLS impersonation)
        timeout-minutes: 3
        run: |
          python - <<'PY'
          from curl_cffi import requests
          p = "socks5h://127.0.0.1:9050"
          r = requests.get("https://check.torproject.org/api/ip", proxies={"http": p, "https": p}, impersonate="chrome", timeout=60)
          r.raise_for_status()
          data = r.json()
          print("Connection info:", data)
          if not data.get("IsTor"):
              raise RuntimeError("Traffic is not using Tor.")
          PY

      - name: Automate Duck.ai Story Pipeline
        timeout-minutes: 110
        env:
          HEADED: ${{ inputs.headed }}
        run: |
          mkdir -p debug

          cat > generate_story.py <<'PY'
          import os, re, sys, json, base64, subprocess, time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from curl_cffi import requests

          HEADED = os.environ.get("HEADED") == "true"
          MAX_ATTEMPTS = 2

          DEBUG_DIR = Path("debug"); DEBUG_DIR.mkdir(parents=True, exist_ok=True)
          RUN_LOG = DEBUG_DIR / "run.log"

          TOR_PROXY = "socks5h://127.0.0.1:9050"
          BROWSER_PROXY = "socks5://127.0.0.1:9050"

          CONTINUE_LABELS = re.compile(
              r"^(agree and continue|continue|i agree|accept|accept all|get started|got it|next|done)$", re.I)

          def log(msg):
              line = f"[{time.strftime('%H:%M:%S')}] {msg}"
              print(line, flush=True)
              with open(RUN_LOG, "a", encoding="utf-8") as f:
                  f.write(line + "\n")

          def snap(page, name):
              try:
                  page.screenshot(path=str(DEBUG_DIR / f"{name}.png"), full_page=True, timeout=15000)
                  (DEBUG_DIR / f"{name}.html").write_text(page.content(), encoding="utf-8")
                  log(f"snapshot {name} | url={page.url}")
              except Exception as e:
                  log(f"snapshot failed: {e}")

          def new_tor_circuit():
              log("Restarting Tor for a new exit IP...")
              subprocess.run(["sudo", "timeout", "60", "service", "tor", "restart"], check=False)
              for _ in range(30):
                  if subprocess.run(["nc", "-z", "127.0.0.1", "9050"]).returncode == 0:
                      break
                  time.sleep(2)
              time.sleep(3)

          def click_continue(page):
              clicked_any = False
              for _ in range(3):
                  clicked = False
                  try:
                      buttons = page.get_by_role("button", name=CONTINUE_LABELS)
                      for i in range(buttons.count()):
                          btn = buttons.nth(i)
                          if btn.is_visible():
                              log(f"Clicking button: {(btn.inner_text() or '').strip()!r}")
                              btn.click(timeout=3000)
                              page.wait_for_timeout(1000)
                              clicked = clicked_any = True
                              break
                  except Exception:
                      pass
                  if not clicked:
                      break
              return clicked_any

          def get_prompt_box(page):
              return page.locator(
                  "textarea[name='user-prompt'], textarea[placeholder*='ask' i], "
                  "textarea[placeholder*='message' i], textarea").first

          def human_paste_prompt(page, box, text):
              """Pastes prompt via clipboard to simulate natural human behavior without bot delay."""
              box.click()
              page.wait_for_timeout(400)
              page.evaluate("t => navigator.clipboard.writeText(t)", text)
              page.wait_for_timeout(200)
              page.keyboard.press("Control+v")
              page.wait_for_timeout(500)
              box.press("Enter")

          # --- CHAT EXTRACTION & COMPLETION TRACKER ---
          def wait_for_chat_response(page, state, max_wait=180):
              log("Waiting for Duck.ai to finish writing JSON response...")
              start = time.time()
              last_text = ""
              stable_ticks = 0

              page.wait_for_timeout(4000)

              while time.time() - start < max_wait:
                  click_continue(page)

                  # 1. Check if generation is still running (Stop button is visible)
                  is_generating = False
                  try:
                      stop_btn = page.locator("button:has-text('Stop'), button[aria-label*='Stop' i], button[title*='Stop' i]")
                      if stop_btn.count() > 0 and stop_btn.first.is_visible():
                          is_generating = True
                  except Exception:
                      pass

                  # 2. Extract ONLY the Assistant response containing JSON
                  extracted = page.evaluate("""() => {
                      const codeBlocks = document.querySelectorAll('pre code, pre');
                      for (let i = codeBlocks.length - 1; i >= 0; i--) {
                          const t = codeBlocks[i].innerText;
                          if (t.includes('beats') || t.includes('start_sec')) return t;
                      }

                      const turns = document.querySelectorAll('[data-testid*="conversation-turn"], [data-testid*="message"], article');
                      for (let i = turns.length - 1; i >= 0; i--) {
                          const t = turns[i].innerText;
                          if (t.includes("You said") && !t.includes("beats")) continue;
                          if (t.includes("beats") || (t.includes("{") && t.includes("start_sec"))) {
                              return t;
                          }
                      }
                      return '';
                  }""").strip()

                  cleaned = re.sub(r"^Duck\.ai(?:\s+said)?\s*", "", extracted, flags=re.I).strip()

                  if cleaned and cleaned == last_text:
                      stable_ticks += 1
                  else:
                      stable_ticks = 0
                      last_text = cleaned

                  has_json_envelope = "{" in cleaned and "}" in cleaned

                  # Must be complete: Stop button gone + valid { ... } + stable text
                  if not is_generating and has_json_envelope and stable_ticks >= 3 and (state["chat_done"] or stable_ticks >= 7):
                      log(f"Response complete! Captured {len(cleaned)} chars of JSON.")
                      return cleaned

                  if stable_ticks % 6 == 0 and len(cleaned) > 0:
                      log(f"   [Streaming progress] {len(cleaned)} chars received... still generating: {is_generating}")

                  page.wait_for_timeout(900)

              return last_text

          def extract_clean_json(raw_text: str) -> dict:
              clean = re.sub(r"^```(?:json)?", "", raw_text.strip(), flags=re.MULTILINE)
              clean = re.sub(r"```$", "", clean.strip(), flags=re.MULTILINE)
              match = re.search(r"\{.*\}", clean, re.DOTALL)
              if not match:
                  raise ValueError(f"No JSON found in response:\n{raw_text[:300]}")
              return json.loads(match.group(0))

          # Load transcript from root
          t_file = Path("transcript.json")
          if not t_file.exists():
              raise FileNotFoundError("Missing transcript.json in repository root!")

          with open(t_file, "r", encoding="utf-8") as f:
              transcript_data = json.load(f)

          segments = transcript_data.get("segments", [])
          if not segments:
              raise ValueError("transcript.json is empty!")

          # Group into ~11,000 character chunks (comfortably below 16,000 limit)
          chunks = []
          curr_chunk = []
          curr_len = 0

          for s in segments:
              line = f"[{s['start']:.2f}s - {s['end']:.2f}s] {s['text']}"
              curr_chunk.append(line)
              curr_len += len(line) + 1

              if curr_len >= 11000:
                  chunks.append("\n".join(curr_chunk))
                  curr_chunk = []
                  curr_len = 0

          if curr_chunk:
              chunks.append("\n".join(curr_chunk))

          log(f"Prepared {len(chunks)} chronological transcript chunks.")

          PART_1_PROMPT = """You are a movie recap writer. Convert this transcript into a flowing, synchronized recap in pure Hindi (Devanagari script only).

          STRICT GROUND-TRUTH & VISUAL CUT RULES:
          1. ZERO HALLUCINATION (NO WEB SEARCH): Rely ONLY on the transcript text. Never invent motives, facts, or actions not in the dialogue.
          2. STRICT 1-TO-1 VISUAL CUT SYNC (NO SKIPPING):
             - Do NOT summarize 5 minutes into 1 general sentence.
             - Break the dialogue into consecutive small exchanges (each 4 to 15 seconds long).
             - 1 Spoken Hindi sentence = 1 exact video segment from the transcript.
             - `start_sec`: Exact start time of the first line in this exchange.
             - `end_sec`: Exact end time of the last line in this exchange.
          3. SENSEFUL HINDI STORYTELLING:
             - Clear, conversational Hindi (Devanagari script only).
             - Use the real character names spoken in the dialogue (e.g. क्लोई, लेफ्टिनेंट, लूसिफर). NEVER say 'कोई व्यक्ति' or 'एक आदमी'.
             - Tell the story naturally: explain who says what, what problem they discuss, and what decision is made.
          4. OUTPUT FORMAT: Respond ONLY with a valid, raw JSON object (no markdown, no extra commentary).

          JSON FORMAT:
          {
            "characters": [
              {"name": "Chloe", "hindi_name": "डिटेक्टिव क्लोई", "role": "जासूस"}
            ],
            "beats": [
              {
                "beat_id": "B0001",
                "start_sec": 0.72,
                "end_sec": 13.68,
                "narration": "डिटेक्टिव क्लोई अपने सीनियर को अंदर बुलाती है और पूछती है कि क्या वो केस से जुड़ी नई जानकारी देखना चाहते हैं।"
              },
              {
                "beat_id": "B0002",
                "start_sec": 13.68,
                "end_sec": 24.30,
                "narration": "लेफ्टिनेंट पुष्टि करता है कि यह केस उसी का है, लेकिन चेतावनी देता है कि यह आसान केस है इसलिए ज़्यादा समय बर्बाद न करे।"
              }
            ]
          }

          TRANSCRIPT PART 1:
          """

          PART_N_PROMPT = """Continuing seamlessly in this SAME conversation, summarize the NEXT PART of the transcript.
          Rules:
          - Maintain 1-to-1 visual synchronization (1 sentence = 1 real dialogue clip window).
          - Do not skip scenes. Walk through the dialogue in order.
          - Pure Devanagari Hindi. Use names established earlier.
          - Exact start_sec and end_sec matching the lines.
          - Return RAW JSON ONLY matching schema:
          {
            "beats": [
              {
                "beat_id": "B0000",
                "start_sec": 0.0,
                "end_sec": 0.0,
                "narration": "हिंदी में अगला सीन..."
              }
            ]
          }

          NEXT TRANSCRIPT PART:
          """

          all_beats = []
          characters_list = []

          browser = None
          context = None
          page = None

          def start_fresh_browser(playwright_runner):
              global browser, context, page
              if browser:
                  try: browser.close()
                  except Exception: pass
              browser = playwright_runner.chromium.launch(
                  headless=not HEADED,
                  proxy={"server": BROWSER_PROXY},
                  args=["--disable-dev-shm-usage", "--disable-blink-features=AutomationControlled"]
              )
              context = browser.new_context(
                  viewport={"width": 1440, "height": 1000},
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36",
                  permissions=["clipboard-read", "clipboard-write"]
              )
              context.add_init_script("Object.defineProperty(navigator,'webdriver',{get:()=>undefined})")
              page = context.new_page()

          with sync_playwright() as p:
              start_fresh_browser(p)

              for idx, chunk_content in enumerate(chunks):
                  log(f"\n==================== PROCESSING PART {idx + 1}/{len(chunks)} ====================")
                  part_done = False

                  for attempt in range(1, MAX_ATTEMPTS + 1):
                      state = {"submitted": False, "chat_done": False}

                      def on_request_finished(req):
                          try:
                              if req.method == "POST" and "/duckchat/v1/chat" in req.url:
                                  state["chat_done"] = True
                          except Exception: pass
                      page.on("requestfinished", on_request_finished)

                      try:
                          is_in_chat = bool(page and "chatID=" in page.url)

                          if not is_in_chat:
                              log("Opening https://duck.ai/chat ...")
                              page.goto("https://duck.ai/chat", wait_until="domcontentloaded", timeout=75000)
                              page.wait_for_timeout(3000)
                              click_continue(page)

                          box = get_prompt_box(page)
                          box.wait_for(state="visible", timeout=40000)

                          prompt = (PART_1_PROMPT if idx == 0 else PART_N_PROMPT) + chunk_content
                          log(f"Entering prompt: {prompt[:90]}...")
                          human_paste_prompt(page, box, prompt)
                          state["submitted"] = True

                          if not is_in_chat:
                              dl = time.time() + 50
                              while time.time() < dl:
                                  click_continue(page)
                                  if "chatID=" in page.url: break
                                  page.wait_for_timeout(1200)

                          raw_reply = wait_for_chat_response(page, state, max_wait=180)

                          parsed = extract_clean_json(raw_reply)
                          if "characters" in parsed and not characters_list:
                              characters_list = parsed["characters"]

                          new_beats = parsed.get("beats", [])
                          log(f"[+] Successfully extracted {len(new_beats)} beats from Part {idx + 1}")
                          all_beats.extend(new_beats)

                          part_done = True
                          page.wait_for_timeout(2500)
                          break

                      except Exception as err:
                          log(f"Attempt {attempt} failed on Part {idx + 1}: {err}")
                          snap(page, f"err_p{idx+1}_a{attempt}")
                          new_tor_circuit()
                          start_fresh_browser(p)

                  if not part_done:
                      log(f"Could not complete Part {idx + 1}. Stopping execution.")
                      break

              if browser:
                  browser.close()

          # Re-index beats sequentially
          final_beats = []
          for i, b in enumerate(all_beats):
              s = float(b.get("start_sec", 0.0))
              e = float(b.get("end_sec", s + 4.0))
              final_beats.append({
                  "beat_id": f"B{i+1:04d}",
                  "target_window": {
                      "start": round(s, 2),
                      "end": round(e, 2)
                  },
                  "narration": b.get("narration", "").strip()
              })

          out_file = Path("story_beats.json")
          with open(out_file, "w", encoding="utf-8") as f:
              json.dump({
                  "movie_title": transcript_data.get("movie_title", "movie"),
                  "characters": characters_list,
                  "total_beats": len(final_beats),
                  "beats": final_beats
              }, f, indent=2, ensure_ascii=False)

          log(f"SUCCESS: SAVED {out_file} with {len(final_beats)} beats")
          PY

          if [ "$HEADED" = "true" ]; then
            xvfb-run -a --server-args="-screen 0 1440x1000x24" python generate_story.py
          else
            python generate_story.py
          fi

      - name: Kill leftover browser processes
        if: always()
        run: |
          pkill -9 -f chrome || true
          pkill -9 -f Xvfb || true

      - name: Commit and push story_beats.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f story_beats.json
          if git diff --cached --quiet; then
            echo "No new story beats to commit."
            exit 0
          fi
          git commit -m "Add ground-truth synchronized Hindi story_beats.json [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duck-ai-debug
          path: debug/
          if-no-files-found: ignore