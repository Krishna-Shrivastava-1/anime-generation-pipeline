name: Generate Hindi YouTube Movie Recap

on:
  workflow_dispatch:
    inputs:
      headed:
        description: "Run non-headless Chrome under Xvfb (less detectable)"
        required: true
        type: boolean
        default: true
      target_recap_mins:
        description: "Target recap duration in minutes (e.g. 5)"
        required: true
        default: "5"

permissions:
  contents: write

jobs:
  generate-recap:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Tor
        timeout-minutes: 4
        run: |
          sudo apt-get update
          sudo apt-get install -y tor netcat-openbsd xvfb
          sudo service tor start
          for i in {1..30}; do
            if nc -z 127.0.0.1 9050; then echo "Tor ready"; break; fi
            sleep 2
          done
          nc -z 127.0.0.1 9050

      - name: Install Python dependencies
        timeout-minutes: 6
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi playwright pillow requests
          playwright install --with-deps chromium

      - name: Verify connection (curl_cffi, Chrome TLS impersonation)
        timeout-minutes: 3
        run: |
          python - <<'PY'
          from curl_cffi import requests
          p = "socks5h://127.0.0.1:9050"
          r = requests.get("https://check.torproject.org/api/ip", proxies={"http": p, "https": p}, impersonate="chrome", timeout=60)
          r.raise_for_status()
          data = r.json()
          print("Connection info:", data)
          if not data.get("IsTor"):
              raise RuntimeError("Traffic is not using Tor.")
          PY

      - name: Automate Duck.ai Story Pipeline
        timeout-minutes: 110
        env:
          HEADED: ${{ inputs.headed }}
          TARGET_RECAP_MINS: ${{ inputs.target_recap_mins }}
        run: |
          mkdir -p debug
          cat > generate_story.py <<'PY'
          import os, re, sys, json, base64, subprocess, time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          HEADED = os.environ.get("HEADED") == "true"
          TARGET_MINS = float(os.environ.get("TARGET_RECAP_MINS", "5"))
          TARGET_WORDS = int(TARGET_MINS * 140)

          PART_SECONDS = 140
          PART_CHARS = 1400
          MAX_WAIT = 180
          DEBUG_DIR = Path("debug"); DEBUG_DIR.mkdir(parents=True, exist_ok=True)
          RUN_LOG = DEBUG_DIR / "run.log"

          TOR_PROXY = "socks5h://127.0.0.1:9050"
          BROWSER_PROXY = "socks5://127.0.0.1:9050"

          CONTINUE_LABELS = re.compile(
              r"^(agree and continue|continue|i agree|accept|accept all|get started|got it|next|done)$", re.I)

          def log(msg):
              line = f"[{time.strftime('%H:%M:%S')}] {msg}"
              print(line, flush=True)
              with open(RUN_LOG, "a", encoding="utf-8") as f:
                  f.write(line + "\n")

          def snap(page, name):
              try:
                  page.screenshot(path=str(DEBUG_DIR / f"{name}.png"), full_page=True, timeout=15000)
                  (DEBUG_DIR / f"{name}.html").write_text(page.content(), encoding="utf-8")
                  log(f"snapshot {name} | url={page.url}")
              except Exception as e:
                  log(f"snapshot failed: {e}")

          def new_tor_circuit():
              log("Restarting Tor for a new exit IP...")
              subprocess.run(["sudo", "timeout", "60", "service", "tor", "restart"], check=False)
              for _ in range(30):
                  if subprocess.run(["nc", "-z", "127.0.0.1", "9050"]).returncode == 0:
                      break
                  time.sleep(2)
              time.sleep(3)

          def click_continue(page):
              clicked_any = False
              for _ in range(3):
                  clicked = False
                  try:
                      buttons = page.get_by_role("button", name=CONTINUE_LABELS)
                      for i in range(buttons.count()):
                          btn = buttons.nth(i)
                          if btn.is_visible():
                              log(f"Clicking button: {(btn.inner_text() or '').strip()!r}")
                              btn.click(timeout=3000)
                              page.wait_for_timeout(1000)
                              clicked = clicked_any = True
                              break
                  except Exception:
                      pass
                  if not clicked:
                      break
              return clicked_any

          def get_prompt_box(page):
              return page.locator(
                  "textarea[name='user-prompt'], textarea[placeholder*='ask' i], "
                  "textarea[placeholder*='message' i], textarea").first

          def human_paste_prompt(page, box, text):
              box.click()
              page.wait_for_timeout(400)
              page.evaluate("t => navigator.clipboard.writeText(t)", text)
              page.wait_for_timeout(200)
              page.keyboard.press("Control+v")
              page.wait_for_timeout(500)
              box.press("Enter")

          def get_latest_assistant_response(page):
              """Extracts text strictly from the assistant message containers."""
              try:
                  locs = page.locator("article, [data-testid*='message' i], [class*='message' i]")
                  count = locs.count()
                  for i in range(count - 1, -1, -1):
                      txt = locs.nth(i).inner_text()
                      if "###START-" in txt or "scene" in txt.lower() or "narration" in txt.lower():
                          return txt
              except Exception:
                  pass
              return page.inner_text("body")

          def extract_payload(body, tag):
              start_m = f"###START-{tag}###"
              end_m = f"###END-{tag}###"
              idx = body.rfind(start_m)
              if idx != -1:
                  tail = body[idx + len(start_m):]
                  brace = tail.find("[") if "[" in tail else tail.find("{")
                  if brace != -1:
                      tail = tail[brace:]
                      e = tail.find(end_m)
                      if e != -1:
                          return tail[:e].strip(), True
                      return tail.strip(), False
              return None, False

          def parse_json_safely(text):
              if not text: return None
              clean = re.sub(r"```(?:json)?", "", text).strip()
              try: return json.loads(clean)
              except Exception: pass
              s = min([p for p in [clean.find("{"), clean.find("[")] if p != -1], default=-1)
              e = max([clean.rfind("}"), clean.rfind("]")])
              if s != -1 and e > s:
                  try: return json.loads(clean[s:e+1])
                  except Exception: pass
              return None

          def wait_for_stream_done(page, tag, state_dict, max_wait=MAX_WAIT):
              start_t = time.time()
              last_len = 0
              stable = 0
              while time.time() - start_t < max_wait:
                  click_continue(page)
                  content = get_latest_assistant_response(page)
                  extracted, finished = extract_payload(content, tag)

                  if finished:
                      return extracted

                  if len(content) == last_len and len(content) > 50:
                      stable += 1
                  else:
                      stable = 0
                  last_len = len(content)

                  if (state_dict.get("chat_done") or stable >= 6) and extracted:
                      return extracted

                  page.wait_for_timeout(1500)
              raise TimeoutError(f"Timeout waiting for tag {tag}")

          # Load Transcripts
          t_file = Path("transcript.json")
          if not t_file.exists():
              raise FileNotFoundError("transcript.json is missing in root!")
          transcript_data = json.loads(t_file.read_text(encoding="utf-8"))
          segs = transcript_data.get("segments", [])
          for i, s in enumerate(segs):
              s["_id"] = i + 1
              s["start"] = float(s["start"])
              s["end"] = float(s["end"])
              s["text"] = str(s["text"]).strip()

          chunks, cur_first, cur_chars = [], 1, 0
          for s in segs:
              cur_chars += len(s["text"]) + 15
              if s["end"] - segs[cur_first - 1]["start"] >= PART_SECONDS or cur_chars >= PART_CHARS:
                  chunks.append((cur_first, s["_id"]))
                  cur_first, cur_chars = s["_id"] + 1, 0
          if cur_first <= len(segs):
              chunks.append((cur_first, len(segs)))

          log(f"Transcript split into {len(chunks)} chronological parts.")
          all_story_beats = []

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=not HEADED,
                  proxy={"server": BROWSER_PROXY},
                  args=["--disable-dev-shm-usage", "--disable-blink-features=AutomationControlled"]
              )
              context = browser.new_context(
                  viewport={"width": 1440, "height": 1000},
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36",
                  permissions=["clipboard-read", "clipboard-write"]
              )
              context.add_init_script("Object.defineProperty(navigator,'webdriver',{get:()=>undefined})")
              page = context.new_page()

              log("Opening https://duck.ai/chat ...")
              page.goto("https://duck.ai/chat", wait_until="domcontentloaded", timeout=75000)
              page.wait_for_timeout(3000)
              click_continue(page)

              # Initialize chat session
              box = get_prompt_box(page)
              box.wait_for(state="visible", timeout=40000)
              init_prompt = (
                  "You are an expert Hindi YouTube Movie Recap narrator.\n"
                  "We will give you movie transcript pieces chronologically.\n"
                  "Rules:\n"
                  "- Write natural voiceover recap lines entirely in Hindi.\n"
                  "- Third-person storytelling ('कहानी में हम देखते हैं कि...', 'तभी एक बड़ा मोड़ आता है...').\n"
                  "- Output ONLY raw JSON array inside the requested markers."
              )
              human_paste_prompt(page, box, init_prompt)
              page.wait_for_timeout(4000)
              click_continue(page)

              # Loop each chronological part
              for ci, (f_id, l_id) in enumerate(chunks):
                  tag = f"PART{ci + 1}"
                  act_lines = [f"[{s['start']:.0f}s-{s['end']:.0f}s] {s['text']}" for s in segs[f_id - 1:l_id]]
                  part_start = segs[f_id-1]['start']
                  part_end = segs[l_id-1]['end']

                  state_dict = {"chat_done": False}
                  def on_request_finished(req):
                      if req.method == "POST" and "/duckchat/v1/chat" in req.url:
                          state_dict["chat_done"] = True
                  page.on("requestfinished", on_request_finished)

                  prompt = (
                      f"Part {ci + 1}/{len(chunks)} ({part_start:.0f}s to {part_end:.0f}s):\n"
                      f"TRANSCRIPT DIALOGUES:\n{' '.join(act_lines)}\n\n"
                      f"Write 2 to 3 chronological Hindi voiceover recap scenes covering this part.\n"
                      f"Format requirements:\n"
                      f"###START-{tag}###\n"
                      f"[\n"
                      f"  {{\"clip_start\": {part_start:.1f}, \"clip_end\": {min(part_start + 8.0, part_end):.1f}, \"narration\": \"<Detailed Hindi explanation of this scene>\"}}\n"
                      f"]\n"
                      f"###END-{tag}###"
                  )

                  log(f"Processing Part {ci + 1}/{len(chunks)} ({part_start:.0f}s - {part_end:.0f}s)...")
                  box = get_prompt_box(page)
                  human_paste_prompt(page, box, prompt)

                  try:
                      raw_text = wait_for_stream_done(page, tag, state_dict)
                      parsed = parse_json_safely(raw_text)
                  except Exception as e:
                      log(f"Error extracting Part {ci + 1}: {e}")
                      snap(page, f"err_part_{ci+1}")
                      parsed = None

                  # Verify that real Hindi narration was written
                  valid_scenes = []
                  if isinstance(parsed, list):
                      for item in parsed:
                          nar = str(item.get("narration", "")).strip()
                          # Reject prompt templates or unparsed markers
                          if "Detailed Hindi" in nar or len(nar) < 10:
                              continue
                          valid_scenes.append(item)

                  if valid_scenes:
                      all_story_beats.extend(valid_scenes)
                      log(f"[+] Part {ci + 1} added {len(valid_scenes)} valid Hindi scenes. Total: {len(all_story_beats)}")
                  else:
                      log(f"[-] Part {ci + 1} had no valid scenes. Extracting direct dialogue translation...")
                      sample_text = " ".join([s['text'] for s in segs[f_id - 1:l_id][:2]])
                      all_story_beats.append({
                          "clip_start": round(part_start, 2),
                          "clip_end": round(min(part_start + 7.0, part_end), 2),
                          "narration": f"कहानी के इस सीन में आगे की जांच शुरू होती है जिसमें दिखाया जाता है कि {sample_text}."
                      })

                  page.wait_for_timeout(2000)

              if len(all_story_beats) == 0:
                  raise RuntimeError("No story beats generated.")

              total_words = 0
              for idx, b in enumerate(all_story_beats):
                  b["scene"] = idx + 1
                  nar = b.get("narration", "")
                  w_count = len(nar.split())
                  total_words += w_count
                  b["words"] = w_count
                  cs = max(0.0, float(b.get("clip_start", 0)))
                  ce = max(cs + 2.0, float(b.get("clip_end", cs + 6.0)))
                  b["clip_start"] = round(cs, 2)
                  b["clip_end"] = round(ce, 2)
                  b["clip_duration"] = round(ce - cs, 2)

              output_data = {
                  "movie_title": transcript_data.get("movie_title", "movie"),
                  "total_original_duration": transcript_data.get("duration", segs[-1]["end"]),
                  "target_duration_minutes": TARGET_MINS,
                  "total_words": total_words,
                  "estimated_audio_minutes": round(total_words / 140, 2),
                  "scenes_count": len(all_story_beats),
                  "story_beats": all_story_beats,
              }

              Path("story_beats.json").write_text(json.dumps(output_data, indent=2, ensure_ascii=False), encoding="utf-8")
              log(f"SUCCESS! Wrote story_beats.json with {len(all_story_beats)} scenes ({total_words} Hindi words).")
              browser.close()
          PY

          if [ "$HEADED" = "true" ]; then
            xvfb-run -a --server-args="-screen 0 1440x1000x24" python generate_story.py
          else
            python generate_story.py
          fi

      - name: Kill leftover browser processes
        if: always()
        run: |
          pkill -9 -f chrome || true
          pkill -9 -f Xvfb || true

      - name: Commit and push story_beats.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f story_beats.json ]; then
            git add -f story_beats.json
            if ! git diff --cached --quiet; then
              git commit -m "Generate YouTube movie recap story beats [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
              echo "Successfully pushed story_beats.json"
            else
              echo "No changes in story_beats.json"
            fi
          fi

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duck-ai-debug
          path: debug/
          if-no-files-found: ignore
