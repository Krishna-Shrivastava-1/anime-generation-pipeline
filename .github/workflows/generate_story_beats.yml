name: Generate and Download Duck.ai Story Frames

on:
  workflow_dispatch:
    inputs:
      headed:
        description: "Run non-headless Chrome under Xvfb (less detectable)"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  generate-story-frames:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Tor
        timeout-minutes: 4
        run: |
          sudo apt-get update
          sudo apt-get install -y tor netcat-openbsd xvfb
          sudo service tor start
          for i in {1..30}; do
            if nc -z 127.0.0.1 9050; then echo "Tor ready"; break; fi
            sleep 2
          done
          nc -z 127.0.0.1 9050

      - name: Install Python dependencies
        timeout-minutes: 6
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi playwright pillow requests
          playwright install --with-deps chromium

      - name: Verify connection (curl_cffi, Chrome TLS impersonation)
        timeout-minutes: 3
        run: |
          python - <<'PY'
          from curl_cffi import requests
          p = "socks5h://127.0.0.1:9050"
          r = requests.get("https://check.torproject.org/api/ip", proxies={"http": p, "https": p}, impersonate="chrome", timeout=60)
          r.raise_for_status()
          data = r.json()
          print("Connection info:", data)
          if not data.get("IsTor"):
              raise RuntimeError("Traffic is not using Tor.")
          PY

      - name: Automate Duck.ai Story Pipeline
        timeout-minutes: 110
        env:
          HEADED: ${{ inputs.headed }}
        run: |
          mkdir -p debug
          cat > generate_story.py <<'PY'
          import os, re, sys, json, subprocess, time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          HEADED = os.environ.get("HEADED") == "true"
          MAX_ATTEMPTS = 3
          DEBUG_DIR = Path("debug")
          DEBUG_DIR.mkdir(parents=True, exist_ok=True)
          RUN_LOG = DEBUG_DIR / "run.log"
          BROWSER_PROXY = "socks5://127.0.0.1:9050"

          MODAL_LABELS = re.compile(
              r"^(agree and continue|continue|i agree|accept|accept all|get started|got it|next|done)$", re.I
          )

          def log(msg):
              line = f"[{time.strftime('%H:%M:%S')}] {msg}"
              print(line, flush=True)
              with open(RUN_LOG, "a", encoding="utf-8") as f:
                  f.write(line + "\n")

          def snap(page, name):
              try:
                  page.screenshot(path=str(DEBUG_DIR / f"{name}.png"), full_page=True, timeout=10000)
                  (DEBUG_DIR / f"{name}.html").write_text(page.content(), encoding="utf-8")
                  log(f"Snapshot saved: {name}")
              except Exception as e:
                  log(f"Snapshot failed: {e}")

          def new_tor_circuit():
              log("Restarting Tor for a new exit IP...")
              subprocess.run(["sudo", "timeout", "60", "service", "tor", "restart"], check=False)
              for _ in range(30):
                  if subprocess.run(["nc", "-z", "127.0.0.1", "9050"]).returncode == 0:
                      break
                  time.sleep(2)
              time.sleep(2)

          def dismiss_modals(page):
              """Dismiss any Duck.ai agreement, terms, or landing modals."""
              clicked_any = False
              for _ in range(3):
                  try:
                      buttons = page.get_by_role("button", name=MODAL_LABELS)
                      count = buttons.count()
                      clicked = False
                      for i in range(count):
                          btn = buttons.nth(i)
                          if btn.is_visible():
                              txt = (btn.inner_text() or "").strip()
                              log(f"Clicking modal button: {txt!r}")
                              btn.click(timeout=2500)
                              page.wait_for_timeout(800)
                              clicked = clicked_any = True
                              break
                      if not clicked:
                          break
                  except Exception:
                      break
              return clicked_any

          def check_and_click_continue_generating(page):
              """If Duck.ai cuts off mid-answer with 'Continue generating', click it."""
              try:
                  cont_btn = page.locator("button:has-text('Continue generating'), button:has-text('Continue response')").first
                  if cont_btn.count() > 0 and cont_btn.is_visible():
                      log("Duck.ai paused generation. Clicking 'Continue generating'...")
                      cont_btn.click(timeout=2000)
                      page.wait_for_timeout(1000)
                      return True
              except Exception:
                  pass
              return False

          def get_prompt_box(page):
              return page.locator(
                  "textarea[name='user-prompt'], textarea[placeholder*='ask' i], "
                  "textarea[placeholder*='message' i], textarea"
              ).first

          def submit_prompt(page, text):
              """Ensures prompt is injected and the actual send button is clicked."""
              dismiss_modals(page)
              box = get_prompt_box(page)
              box.wait_for(state="visible", timeout=30000)
              
              box.click()
              box.fill(text)
              page.wait_for_timeout(400)

              send_btn = page.locator("button[type='submit'], button[aria-label*='Send' i], button[aria-label*='submit' i]").first
              if send_btn.count() > 0 and send_btn.is_visible():
                  send_btn.click()
              else:
                  box.press("Enter")
              
              page.wait_for_timeout(1000)
              dismiss_modals(page)

          def get_last_assistant_text(page):
              """Extracts text strictly from the LAST ASSISTANT message bubble, ignoring prompt bubbles."""
              return page.evaluate("""() => {
                  // Strategy 1: Select Duck.ai assistant bubbles
                  const assistantBubbles = document.querySelectorAll(
                      '[data-testid*="assistant"], [class*="message-assistant"], [class*="chat-message"]:not([class*="user"])'
                  );
                  if (assistantBubbles.length > 0) {
                      const lastBubble = assistantBubbles[assistantBubbles.length - 1];
                      // If there is a code block inside, prefer its text
                      const code = lastBubble.querySelector('pre code, pre');
                      return code ? code.innerText : lastBubble.innerText;
                  }
                  
                  // Strategy 2: Pre / Code tags
                  const codeTags = document.querySelectorAll('pre code, pre');
                  if (codeTags.length > 0) {
                      return codeTags[codeTags.length - 1].innerText;
                  }

                  // Strategy 3: General message divs (exclude prompt textarea)
                  const allMessages = document.querySelectorAll('div[class*="message"]');
                  if (allMessages.length > 1) {
                      return allMessages[allMessages.length - 1].innerText;
                  }
                  return '';
              }""")

          def wait_for_duck_response(page, max_wait=140):
              """Waits for assistant response to stream and complete."""
              log("Waiting for response stream...")
              start = time.time()
              has_started = False
              last_text = ""
              stable_ticks = 0

              while time.time() - start < max_wait:
                  dismiss_modals(page)
                  check_and_click_continue_generating(page)

                  # 1. Check for Duck.ai error alerts
                  err_locator = page.locator("[role='alert'], .error-message").or_(page.get_by_text("Something went wrong"))
                  if err_locator.count() > 0 and err_locator.first.is_visible():
                      raise RuntimeError(f"Duck.ai Error displayed: {err_locator.first.inner_text()}")

                  # 2. Check if Stop Generating is visible
                  stop_btn = page.locator("button:has-text('Stop'), button[aria-label*='Stop' i]")
                  is_generating = (stop_btn.count() > 0 and stop_btn.first.is_visible())

                  # 3. Read ONLY assistant text
                  assistant_text = get_last_assistant_text(page)
                  curr_len = len(assistant_text)

                  if is_generating or curr_len > 80:
                      if not has_started:
                          log("-> Generation confirmed active.")
                          has_started = True

                  # Fail-Fast: If nothing starts in 15 seconds, exit early and retry
                  if not has_started and (time.time() - start) > 15:
                      raise TimeoutError("Prompt never started generating.")

                  if has_started:
                      if assistant_text == last_text and curr_len > 0:
                          stable_ticks += 1
                      else:
                          stable_ticks = 0
                          last_text = assistant_text

                      # Done if Stop button is gone AND text has stayed stable for 3 checks
                      if not is_generating and stable_ticks >= 3:
                          log(f"[+] Finished generating in {int(time.time() - start)}s ({curr_len} chars).")
                          return assistant_text

                  page.wait_for_timeout(1000)

              raise TimeoutError("Duck.ai stream timed out.")

          def extract_clean_json(raw_text: str) -> dict:
              """Extracts JSON object from text safely."""
              clean = re.sub(r"^```(?:json)?", "", raw_text.strip(), flags=re.MULTILINE)
              clean = re.sub(r"```$", "", clean.strip(), flags=re.MULTILINE)

              start_idx = clean.find('{')
              if start_idx == -1:
                  raise ValueError(f"No JSON object found in response:\n{raw_text[:250]}")

              decoder = json.JSONDecoder()
              try:
                  obj, _ = decoder.raw_decode(clean[start_idx:])
                  return obj
              except Exception:
                  match = re.search(r"\{\s*\"(?:characters|beats)\"[\s\S]*\}", clean)
                  if match:
                      return json.loads(match.group(0))
                  raise ValueError(f"Failed to parse valid JSON from text:\n{clean[start_idx:start_idx+350]}")

          # Load transcript.json
          t_file = Path("transcript.json")
          if not t_file.exists():
              raise FileNotFoundError("Missing transcript.json in repository root!")
          with open(t_file, "r", encoding="utf-8") as f:
              transcript_data = json.load(f)
          segments = transcript_data.get("segments", [])
          if not segments:
              raise ValueError("transcript.json is empty!")

          # Group into ~4,500 char chunks to give model room to narrate every line
          chunks = []
          curr_chunk = []
          curr_len = 0
          for s in segments:
              line = f"[{s['start']:.2f}s - {s['end']:.2f}s] {s['text']}"
              curr_chunk.append(line)
              curr_len += len(line) + 1
              if curr_len >= 4500:
                  chunks.append("\n".join(curr_chunk))
                  curr_chunk = []
                  curr_len = 0
          if curr_chunk:
              chunks.append("\n".join(curr_chunk))
          log(f"Prepared {len(chunks)} chronological transcript chunks.")

          # Prompts using neutral dummy placeholders to prevent copying
          PART_1_PROMPT = """You are a movie recap writer. Convert this entire transcript chunk into a flowing, synchronized movie recap in pure Hindi (Devanagari script only).

          CRITICAL INSTRUCTIONS:
          1. Rely ONLY on the transcript dialogue. ZERO hallucination.
          2. YOU MUST COVER THE ENTIRE CHUNK from the first line to the last line. Do NOT summarize or omit parts.
          3. STRICT 1-TO-1 VISUAL CUT SYNC:
             - Group dialogue into small sequential scenes (4-15 seconds each).
             - 1 Spoken Hindi sentence = 1 exact dialogue scene.
             - start_sec: Exact start time of the first line in that scene.
             - end_sec: Exact end time of the last line in that scene.
          4. Conversational Hindi (Devanagari only). Identify and use the actual character names spoken in the dialogue.
          5. OUTPUT ONLY A RAW JSON OBJECT (no chat commentary, no markdown text):

          {
            "characters": [
              {"name": "SpeakerA", "hindi_name": "व्यक्ति १", "role": "भूमिका"}
            ],
            "beats": [
              {
                "beat_id": "B0001",
                "start_sec": 0.0,
                "end_sec": 5.5,
                "narration": "हिंदी में दृश्य का विवरण..."
              }
            ]
          }

          TRANSCRIPT:
          """

          PART_N_PROMPT = """Continuing the recap for the NEXT sequential transcript chunk.
          Rules:
          - Cover EVERY part of this transcript chunk sequentially from start to finish.
          - Pure Devanagari Hindi. 1-to-1 dialogue synchronization with exact start_sec and end_sec.
          - Return RAW JSON ONLY (no markdown fences, no conversational text):
          {
            "beats": [
              {
                "beat_id": "B0000",
                "start_sec": 0.0,
                "end_sec": 0.0,
                "narration": "अगले सीन का विवरण..."
              }
            ]
          }

          NEXT TRANSCRIPT PART:
          """

          all_beats = []
          characters_list = []
          browser = None
          context = None
          page = None

          def start_fresh_browser(playwright_runner):
              global browser, context, page
              if browser:
                  try: browser.close()
                  except Exception: pass
              browser = playwright_runner.chromium.launch(
                  headless=not HEADED,
                  proxy={"server": BROWSER_PROXY},
                  args=["--disable-dev-shm-usage", "--disable-blink-features=AutomationControlled"]
              )
              context = browser.new_context(
                  viewport={"width": 1440, "height": 1000},
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36"
              )
              context.add_init_script("Object.defineProperty(navigator,'webdriver',{get:()=>undefined})")
              page = context.new_page()

          with sync_playwright() as p:
              start_fresh_browser(p)
              for idx, chunk_content in enumerate(chunks):
                  log(f"\n==================== PROCESSING PART {idx + 1}/{len(chunks)} ====================")
                  part_done = False
                  for attempt in range(1, MAX_ATTEMPTS + 1):
                      try:
                          is_in_chat = bool(page and "chatID=" in page.url)
                          if not is_in_chat:
                              log("Navigating to https://duck.ai/chat ...")
                              page.goto("https://duck.ai/chat", wait_until="domcontentloaded", timeout=60000)
                              page.wait_for_timeout(2000)
                              dismiss_modals(page)

                          prompt = (PART_1_PROMPT if idx == 0 else PART_N_PROMPT) + chunk_content
                          log(f"Entering prompt (Attempt {attempt})...")
                          submit_prompt(page, prompt)

                          raw_reply = wait_for_duck_response(page, max_wait=140)
                          parsed = extract_clean_json(raw_reply)

                          if "characters" in parsed and not characters_list:
                              characters_list = parsed["characters"]
                          new_beats = parsed.get("beats", [])
                          
                          # Verification: Ensure it's not the dummy placeholder
                          if new_beats and new_beats[0].get("narration") in ["हिंदी में दृश्य का विवरण...", "अगले सीन का विवरण..."]:
                              raise ValueError("Model regurgitated template placeholder!")

                          log(f"[+] Successfully extracted {len(new_beats)} beats from Part {idx + 1}")
                          all_beats.extend(new_beats)
                          part_done = True
                          page.wait_for_timeout(1500)
                          break
                      except Exception as err:
                          log(f"Attempt {attempt} failed on Part {idx + 1}: {err}")
                          snap(page, f"err_p{idx+1}_a{attempt}")
                          new_tor_circuit()
                          start_fresh_browser(p)

                  if not part_done:
                      log(f"Could not complete Part {idx + 1}. Aborting run.")
                      sys.exit(1)

              if browser:
                  browser.close()

          # Re-index beats sequentially
          final_beats = []
          for i, b in enumerate(all_beats):
              s = float(b.get("start_sec", 0.0))
              e = float(b.get("end_sec", s + 4.0))
              final_beats.append({
                  "beat_id": f"B{i+1:04d}",
                  "target_window": {
                      "start": round(s, 2),
                      "end": round(e, 2)
                  },
                  "narration": b.get("narration", "").strip()
              })

          out_file = Path("story_beats.json")
          with open(out_file, "w", encoding="utf-8") as f:
              json.dump({
                  "movie_title": transcript_data.get("movie_title", "movie"),
                  "characters": characters_list,
                  "total_beats": len(final_beats),
                  "beats": final_beats
              }, f, indent=2, ensure_ascii=False)
          log(f"SUCCESS: SAVED {out_file} with {len(final_beats)} beats")
          PY

          if [ "$HEADED" = "true" ]; then
            xvfb-run -a --server-args="-screen 0 1440x1000x24" python generate_story.py
          else
            python generate_story.py
          fi

      - name: Kill leftover browser processes
        if: always()
        run: |
          pkill -9 -f chrome || true
          pkill -9 -f Xvfb || true

      - name: Commit and push story_beats.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f story_beats.json
          if git diff --cached --quiet; then
            echo "No new story beats to commit."
            exit 0
          fi
          git commit -m "Add ground-truth synchronized Hindi story_beats.json [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duck-ai-debug
          path: debug/
          if-no-files-found: ignore
