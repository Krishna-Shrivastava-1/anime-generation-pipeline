          5. **Exact continuation point:** Copy the final 2–3 narration beats from the previous generated output VERBATIM, including their complete narration text. Identify the exact final sentence where continuation must begin.

          Important:
          - Preserve established facts and distinguish confirmed events from assumptions, accusations and character claims.
          - Do not introduce future spoilers beyond the supplied preview.
          - Do not invent missing story details.
          - Keep the handoff concise but sufficiently informative for a new chat to continue without the previous conversation.
          - Do not rewrite or improve the copied narration beats.

          **OUTPUT:** One clean, copy-ready continuity handoff. No JSON, no new narration and no additional commentary.

          PREVIEW TRANSCRIPT (NEXT ~100 LINES):
          __PREVIEW_JSON__""").strip()

          PROMPT_2_RECOVERY_TEMPLATE = textwrap.dedent("""\
          # PROMPT 2 — CONTINUITY HANDOFF

          Create a concise continuity handoff from the previously generated recap state below plus the next ~100 transcript lines provided as a **PREVIEW ONLY**.

          **Do NOT generate narration, recap beats, clips, or JSON for the preview.**

          Include:
          1. **Story so far:** Sequence of already-narrated events, relationships, revelations and unresolved conflicts.
          2. **Character context:** Canonical names, identities, relationships and verified spellings.
          3. **Audience knowledge:** What viewers already know vs what remains uncertain.
          4. **Upcoming scene preview:** Briefly explain what happens in the preview and how it connects (clearly marked as preview only, not yet narrated).
          5. **Exact continuation point:** Copy the final 2–3 narration beats provided below VERBATIM, and identify the exact final sentence where continuation must begin.

          **OUTPUT:** One clean, copy-ready continuity handoff. No JSON, no new narration and no extra commentary.

          ALREADY NARRATED STORY SYNOPSIS & CHARACTERS:
          __RECOVERY_STATE__

          FINAL GENERATED BEATS (COPY VERBATIM):
          __RECOVERY_BEATS__

          PREVIEW TRANSCRIPT (NEXT ~100 LINES):
          __PREVIEW_JSON__""").strip()

          PROMPT_3_TEMPLATE = textwrap.dedent("""\
          # PROMPT 3 — CONTINUE MOVIE / SERIES RECAP

          Continue an existing YouTube movie/series recap using the continuity handoff and new timestamped transcript provided below.

          Act as a professional Hindi recap writer and video editing planner. Follow the established narration style and editing rules.

          ## 1. CONTINUITY
          - Read the entire handoff and new transcript before writing.
          - Understand the previous story, character relationships, unresolved events and exact continuation point.
          - Continue smoothly from the last sentence of the previous narration. Do NOT repeat previously narrated events or restart the story.
          - Use the final 2–3 copied narration beats as the style and continuity reference.
          - The upcoming scene preview in the handoff is context only. Generate narration only for events supported by the new actual transcript.
          - Maintain consistent character names and correct previously established speech-to-text errors.

          ## 2. RESEARCH AND STORY ACCURACY
          If web search is available, verify character names, aliases, relationships and ambiguous references. Research must clarify the supplied material, never replace it. Avoid future spoilers.
          Read the complete new transcript, reconstruct events, and tell only meaningful story developments. Combine related exchanges into clear narration. Skip filler, repetitive conversations and insignificant banter.
          Distinguish sarcasm from real events, hypotheticals from actual events, suggestions from decisions, and accusations from confirmed facts. Never invent actions, reactions, motives or outcomes.

          ## 3. NARRATION
          - Write entirely in natural, simple, conversational Hindi using Devanagari script.
          - Short, fast-paced, third-person YouTube storyteller voice—NO dialogue reading, NO formal/literary words, NO viewer confusion.
          - Keep narration fluent and connected to the previous part.
          - Use ~130–150 spoken words per minute, paced naturally for this section without padding.
          - Create meaningful beats based on story developments, not individual transcript lines.

          ## 4. MICRO-LEVEL CLIP EDITING
          Original footage must visually cover the complete narration duration of every beat:
          - Prefer 1.5–2.5 seconds per clip. Never exceed 3 seconds.
          - A 24-second narration should generally have ~10–14 clips, not 2–4.
          - Select clips from anywhere in the supplied transcript (non-linear allowed), prioritizing visual variety.
          - Combined clip duration per beat must approximately match or exceed its `estimated_duration`.
          - Use ONLY timestamps present in the new transcript. Never fabricate or extend timestamps. Mark visual suggestions as unverified.

          ## 5. OUTPUT FORMAT
          Return strictly valid JSON only (no Markdown fences, no trailing commas, properly escaped quotes) using this exact schema:
          {"movie_title":"Title","content_type":"Movie or TV Series","season":null,"episode":null,"part_identifier":null,"target_minutes":null,"estimated_narration_minutes":0,"total_beats":0,"total_words":0,"characters":[{"name":"Name","description":"Role"}],"synopsis":"Summary of story covered so far","beats":[{"beat_id":"__NEXT_BEAT_ID__","narration":"Hindi Devanagari narration","word_count":0,"estimated_duration":0,"is_scene_bridge":false,"clips":[{"clip_id":"__NEXT_CLIP_ID__","start":0.0,"end":2.0,"duration":2.0,"scene_context":"Transcript context (mark visuals unverified)"}]}]}

          Continue beat IDs sequentially starting at __NEXT_BEAT_ID__ and clip IDs starting at __NEXT_CLIP_ID__.

          ## INPUT
          Production Details: Title=__MOVIE_TITLE__ | Type=__CONTENT_TYPE__ | Season=__SEASON__ | Episode=__EPISODE__ | Part=__PART_IDENTIFIER__ | Section Target=__TARGET_DURATION__

          **CONTINUITY HANDOFF:**
          __HANDOFF_TEXT__

          **NEW TIMESTAMPED TRANSCRIPT:**
          __TRANSCRIPT_JSON__""").strip()

          # ------------------ DYNAMIC TRANSCRIPT & PREVIEW BUILDERS ------------------
          def load_transcript(transcript_path="transcript.json"):
              p = Path(transcript_path)
              if not p.exists():
                  raise FileNotFoundError(f"'{transcript_path}' not found in repository root.")
              with open(p, "r", encoding="utf-8") as f:
                  return json.load(f)

          def calc_target_duration_text(chunk_segments, total_duration):
              if not TARGET_MINUTES:
                  return "null"
              try:
                  total_target_min = float(TARGET_MINUTES)
                  chunk_start = float(chunk_segments[0].get("start", 0.0))
                  chunk_end = float(chunk_segments[-1].get("end", chunk_start))
                  chunk_span = max(0.0, chunk_end - chunk_start)
                  if total_duration > 0 and chunk_span > 0:
                      prop_min = max(0.5, round(total_target_min * (chunk_span / total_duration), 1))
                      return f"~{prop_min} minutes for this section (full video target: {total_target_min} minutes)"
                  return f"{total_target_min} minutes"
              except Exception:
                  return f"{TARGET_MINUTES} minutes"

          def build_prompt_1_chunk(transcript_data, start_idx, initial_hints):
              movie_title = INPUT_MOVIE_TITLE or str(transcript_data.get("movie_title") or "Untitled")
              total_duration = float(transcript_data.get("duration") or 0.0)
              all_segments = transcript_data.get("segments", [])
              if start_idx >= len(all_segments):
                  return None, start_idx

              def render(dur_text, segs):
                  obj = {"movie_title": movie_title, "duration": total_duration, "segments": segs}
                  p = PROMPT_1_TEMPLATE
                  p = p.replace("__MOVIE_TITLE__", movie_title)
                  p = p.replace("__CONTENT_TYPE__", INPUT_CONTENT_TYPE or "null")
                  p = p.replace("__SEASON__", INPUT_SEASON or "null")
                  p = p.replace("__EPISODE__", INPUT_EPISODE or "null")
                  p = p.replace("__PART_IDENTIFIER__", INPUT_PART or "null")
                  p = p.replace("__TARGET_DURATION__", dur_text)
                  p = p.replace("__PREVIOUS_CONTEXT__", (initial_hints or "None")[:1000])
                  p = p.replace("__TRANSCRIPT_JSON__", json.dumps(obj, ensure_ascii=False, separators=(",", ":")))
                  return p

              base_len = len(render(f"{TARGET_MINUTES} minutes (section)" if TARGET_MINUTES else "null", []))
              budget = MAX_PROMPT_CHARS - base_len - 120
              if budget < 500:
                  raise RuntimeError(f"Prompt 1 template leaves insufficient space ({budget} chars) under {MAX_PROMPT_CHARS}.")

              selected = []
              used = 0
              idx = start_idx
              while idx < len(all_segments):
                  seg = all_segments[idx]
                  s_str = json.dumps(seg, ensure_ascii=False, separators=(",", ":"))
                  extra = len(s_str) + (1 if selected else 0)
                  if used + extra > budget:
                      if not selected:
                          selected.append(seg)
                          idx += 1
                      break
                  selected.append(seg)
                  used += extra
                  idx += 1

              dur_text = calc_target_duration_text(selected, total_duration)
              final_prompt = render(dur_text, selected)
              while len(final_prompt) > MAX_PROMPT_CHARS and len(selected) > 1:
                  selected.pop()
                  idx -= 1
                  final_prompt = render(calc_target_duration_text(selected, total_duration), selected)

              meta = {
                  "prompt_type": "PROMPT_1",
                  "movie_title": movie_title,
                  "start_idx": start_idx,
                  "end_idx": idx,
                  "segment_count": len(selected),
                  "time_start": selected[0].get("start"),
                  "time_end": selected[-1].get("end"),
                  "prompt_chars": len(final_prompt),
                  "prompt": final_prompt
              }
              return meta, idx

          def build_prompt_3_chunk(transcript_data, start_idx, handoff_text, next_beat_num, next_clip_num):
              movie_title = INPUT_MOVIE_TITLE or str(transcript_data.get("movie_title") or "Untitled")
              total_duration = float(transcript_data.get("duration") or 0.0)
              all_segments = transcript_data.get("segments", [])
              if start_idx >= len(all_segments):
                  return None, start_idx

              next_beat_id = f"B{next_beat_num:04d}"
              next_clip_id = f"C{next_clip_num:04d}"
              bounded_handoff = handoff_text.strip()
              if len(bounded_handoff) > 6500:
                  bounded_handoff = bounded_handoff[-6500:]

              def render(dur_text, segs):
                  obj = {"movie_title": movie_title, "duration": total_duration, "segments": segs}
                  p = PROMPT_3_TEMPLATE
                  p = p.replace("__MOVIE_TITLE__", movie_title)
                  p = p.replace("__CONTENT_TYPE__", INPUT_CONTENT_TYPE or "null")
                  p = p.replace("__SEASON__", INPUT_SEASON or "null")
                  p = p.replace("__EPISODE__", INPUT_EPISODE or "null")
                  p = p.replace("__PART_IDENTIFIER__", INPUT_PART or "null")
                  p = p.replace("__TARGET_DURATION__", dur_text)
                  p = p.replace("__NEXT_BEAT_ID__", next_beat_id)
                  p = p.replace("__NEXT_CLIP_ID__", next_clip_id)
                  p = p.replace("__HANDOFF_TEXT__", bounded_handoff)
                  p = p.replace("__TRANSCRIPT_JSON__", json.dumps(obj, ensure_ascii=False, separators=(",", ":")))
                  return p

              base_len = len(render(f"{TARGET_MINUTES} minutes (section)" if TARGET_MINUTES else "null", []))
              budget = MAX_PROMPT_CHARS - base_len - 120
              if budget < 600:
                  excess = 600 - budget + 200
                  bounded_handoff = bounded_handoff[-max(1500, len(bounded_handoff) - excess):]
                  base_len = len(render(f"{TARGET_MINUTES} minutes (section)" if TARGET_MINUTES else "null", []))
                  budget = MAX_PROMPT_CHARS - base_len - 120

              selected = []
              used = 0
              idx = start_idx
              while idx < len(all_segments):
                  seg = all_segments[idx]
                  s_str = json.dumps(seg, ensure_ascii=False, separators=(",", ":"))
                  extra = len(s_str) + (1 if selected else 0)
                  if used + extra > budget:
                      if not selected:
                          selected.append(seg)
                          idx += 1
                      break
                  selected.append(seg)
                  used += extra
                  idx += 1

              dur_text = calc_target_duration_text(selected, total_duration)
              final_prompt = render(dur_text, selected)
              while len(final_prompt) > MAX_PROMPT_CHARS and len(selected) > 1:
                  selected.pop()
                  idx -= 1
                  final_prompt = render(calc_target_duration_text(selected, total_duration), selected)

              meta = {
                  "prompt_type": "PROMPT_3",
                  "movie_title": movie_title,
                  "start_idx": start_idx,
                  "end_idx": idx,
                  "segment_count": len(selected),
                  "time_start": selected[0].get("start"),
                  "time_end": selected[-1].get("end"),
                  "prompt_chars": len(final_prompt),
                  "prompt": final_prompt
              }
              return meta, idx

          def build_prompt_2_preview(transcript_data, preview_start_idx, recovery_state=None, recovery_beats=None):
              all_segments = transcript_data.get("segments", [])
              if preview_start_idx >= len(all_segments):
                  return None

              preview_slice = all_segments[preview_start_idx : preview_start_idx + PREVIEW_LINES_LIMIT]

              def render(segs):
                  if recovery_state is None:
                      return PROMPT_2_TEMPLATE.replace(
                          "__PREVIEW_JSON__",
                          json.dumps(segs, ensure_ascii=False, separators=(",", ":"))
                      )
                  else:
                      p = PROMPT_2_RECOVERY_TEMPLATE
                      p = p.replace("__RECOVERY_STATE__", json.dumps(recovery_state, ensure_ascii=False))
                      p = p.replace("__RECOVERY_BEATS__", json.dumps(recovery_beats or [], ensure_ascii=False))
                      p = p.replace("__PREVIEW_JSON__", json.dumps(segs, ensure_ascii=False, separators=(",", ":")))
                      return p

              selected = []
              for seg in preview_slice:
                  candidate = selected + [seg]
                  if len(render(candidate)) > MAX_PROMPT_CHARS:
                      if not selected:
                          selected = candidate
                      break
                  selected = candidate

              final_prompt = render(selected)
              return {
                  "prompt_chars": len(final_prompt),
                  "preview_count": len(selected),
                  "prompt": final_prompt
              }

          def normalize_chunk_beats(raw_obj):
              obj = deep_repair(raw_obj)
              beats = obj.get("beats", [])
              norm_beats = []
              for b in beats:
                  if not isinstance(b, dict):
                      continue
                  narr = str(b.get("narration", "")).strip()
                  if not narr:
                      continue
                  wc = len(narr.split())
                  est_dur = round((wc / 140.0) * 60.0, 2)
                  raw_clips = b.get("clips", [])
                  norm_clips = []
                  if isinstance(raw_clips, list):
                      for c in raw_clips:
                          if not isinstance(c, dict):
                              continue
                          st = round(float(c.get("start", 0.0)), 2)
                          en = round(float(c.get("end", st)), 2)
                          if en <= st:
                              continue
                          dur = round(en - st, 2)
                          if dur > MAX_CLIP_DURATION:
                              en = round(st + MAX_CLIP_DURATION, 2)
                              dur = MAX_CLIP_DURATION
                          norm_clips.append({
                              "start": st,
                              "end": en,
                              "duration": dur,
                              "scene_context": str(c.get("scene_context", "")).strip()
                          })
                  norm_beats.append({
                      "narration": narr,
                      "word_count": wc,
                      "estimated_duration": b.get("estimated_duration") or est_dur,
                      "is_scene_bridge": bool(b.get("is_scene_bridge", False)),
                      "clips": norm_clips
                  })
              return {
                  "movie_title": obj.get("movie_title"),
                  "content_type": obj.get("content_type"),
                  "season": obj.get("season"),
                  "episode": obj.get("episode"),
                  "part_identifier": obj.get("part_identifier"),
                  "characters": obj.get("characters", []),
                  "synopsis": str(obj.get("synopsis", "")).strip(),
                  "beats": norm_beats
              }

          # ------------------ PLAYWRIGHT SETUP ------------------
          browser = None
          context = None
          page = None
          current_chat_state = {"raw_stream": [], "chat_done": False, "rate_limited": False}

          def launch_browser(pw):
              global browser, context, page, current_chat_state
              if browser:
                  try:
                      browser.close()
                  except Exception:
                      pass
              browser = pw.chromium.launch(
                  headless=not HEADED,
                  proxy={"server": BROWSER_PROXY},
                  args=["--disable-dev-shm-usage", "--disable-blink-features=AutomationControlled"]
              )
              context = browser.new_context(
                  viewport={"width": 1440, "height": 1000},
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36",
                  permissions=["clipboard-read", "clipboard-write"]
              )
              context.add_init_script(FETCH_HOOK_JS)
              page = context.new_page()

              def is_chat_req(req):
                  clean_u = req.url.split("?")[0]
                  return req.method == "POST" and ("/duckchat/v1/chat" in clean_u or clean_u.endswith("/chat"))

              def on_res(resp):
                  if is_chat_req(resp.request):
                      log(f"Network chat response headers: HTTP {resp.status} -> {resp.url}")
                      if resp.status in (418, 429):
                          current_chat_state["rate_limited"] = True
              page.on("response", on_res)

              def on_done(req):
                  if is_chat_req(req):
                      try:
                          resp = req.response()
                          if resp:
                              body = resp.body().decode("utf-8", errors="replace")
                              if body:
                                  current_chat_state["raw_stream"].append(body)
                      except Exception as e:
                          log(f"requestfinished body note: {e}")
                      current_chat_state["chat_done"] = True
              page.on("requestfinished", on_done)

          def open_fresh_duckai_chat(take_verify_snap=False):
              page.goto("https://duck.ai/chat", wait_until="domcontentloaded", timeout=75000)
              wait_for_duckai_ui_ready(page, timeout_ms=45000)
              page.wait_for_timeout(1500)
              configure_duckai_settings(
                  page,
                  TARGET_MODEL,
                  ENABLE_REASONING,
                  take_verify_snap=take_verify_snap
              )

          with sync_playwright() as p:
              launch_browser(p)

              # ==============================================================
              # MODE: PROBE
              # ==============================================================
              if RUN_MODE == "probe":
                  log("Starting probe test on Duck.ai...")
                  open_fresh_duckai_chat(take_verify_snap=True)
                  box = get_prompt_box(page)
                  box.wait_for(state="visible", timeout=40000)

                  probe_prompt = 'Output valid JSON only: {"status": "ready", "hindi": "कहानी शुरू"}'
                  if not send_and_confirm(page, box, probe_prompt, context, current_chat_state, "Probe", is_new_chat=True):
                      snap(page, "probe_submit_failed")
                      raise RuntimeError("Probe submission not acknowledged.")

                  out = wait_for_response(page, current_chat_state, prompt_text=probe_prompt, max_wait=60, expect_json=True, expect_beats=False)
                  parsed = parse_first_balanced_json(out, require_beats=False)
                  log(f"Probe Result: {parsed}")

                  if parsed and parsed.get("status") == "ready":
                      log("Probe PASSED successfully.")
                      if browser:
                          browser.close()
                      sys.exit(0)
                  else:
                      log("Probe FAILED.")
                      snap(page, "probe_failed")
                      if browser:
                          browser.close()
                      sys.exit(1)

              # ==============================================================
              # MODE: FULL RECAP ENGINE (PROMPT 1 -> PROMPT 2 <-> PROMPT 3)
              # ==============================================================
              log("Starting Recap Engine (PROMPT 1 once -> PROMPT 2 & PROMPT 3 alternating)...")
              transcript_data = load_transcript("transcript.json")
              total_segments = len(transcript_data.get("segments", []))
              movie_title = INPUT_MOVIE_TITLE or str(transcript_data.get("movie_title") or "Untitled")
              log(f"Loaded '{movie_title}': {total_segments} segments | Max prompt limit: {MAX_PROMPT_CHARS} chars.")

              pipeline_state = {
                  "next_segment_idx": 0,
                  "chunk_num": 0,
                  "beats": [],
                  "characters": {},
                  "synopses": [],
                  "continuity_handoff": ""
              }
              if STATE_FILE.exists():
                  try:
                      with open(STATE_FILE, "r", encoding="utf-8") as sf:
                          loaded = json.load(sf)
                          if isinstance(loaded, dict):
                              pipeline_state = deep_repair(loaded)
                  except Exception:
                      pass

              verify_snap_taken = False

              while pipeline_state["next_segment_idx"] < total_segments:
                  cur_idx = pipeline_state["next_segment_idx"]
                  chunk_num = pipeline_state["chunk_num"] + 1
                  next_beat_num = len(pipeline_state["beats"]) + 1
                  next_clip_num = sum(len(b.get("clips", [])) for b in pipeline_state["beats"]) + 1

                  if chunk_num == 1 or not pipeline_state.get("continuity_handoff"):
                      chunk_meta, next_idx = build_prompt_1_chunk(transcript_data, cur_idx, INPUT_HINTS)
                  else:
                      chunk_meta, next_idx = build_prompt_3_chunk(
                          transcript_data,
                          cur_idx,
                          pipeline_state["continuity_handoff"],
                          next_beat_num,
                          next_clip_num
                      )

                  if not chunk_meta:
                      break

                  log(
                      f"\n=== CHUNK {chunk_num} ({chunk_meta['prompt_type']}): segments {chunk_meta['start_idx']+1}..{chunk_meta['end_idx']}/{total_segments} "
                      f"({chunk_meta['time_start']}s - {chunk_meta['time_end']}s) | Prompt: {chunk_meta['prompt_chars']} chars ==="
                  )

                  # ---- STEP A: Run PROMPT 1 (first chunk) or PROMPT 3 (next chunks) ----
                  norm_chunk = None
                  for attempt in range(1, MAX_ATTEMPTS + 1):
                      try:
                          open_fresh_duckai_chat(take_verify_snap=(not verify_snap_taken))
                          verify_snap_taken = True

                          box = get_prompt_box(page)
                          box.wait_for(state="visible", timeout=40000)

                          log(f"Submitting {chunk_meta['prompt_type']} for Chunk {chunk_num} (attempt {attempt}/{MAX_ATTEMPTS})...")
                          if not send_and_confirm(page, box, chunk_meta["prompt"], context, current_chat_state, f"Chunk {chunk_num} {chunk_meta['prompt_type']}", is_new_chat=True):
                              snap(page, f"fail_submit_chunk_{chunk_num}_att_{attempt}")
                              raise RuntimeError(f"Chunk {chunk_num} submission not acknowledged.")

                          raw_resp = wait_for_response(
                              page,
                              current_chat_state,
                              prompt_text=chunk_meta["prompt"],
                              max_wait=TEXT_WAIT,
                              expect_json=True,
                              expect_beats=True
                          )
                          (DEBUG_DIR / f"raw_chunk_{chunk_num}_att_{attempt}.txt").write_text(raw_resp, encoding="utf-8")

                          parsed_json = parse_first_balanced_json(raw_resp, require_beats=True)
                          if not is_valid_recap_json(parsed_json):
                              # Try DOM extraction fallback if SSE stream had malformed/partial data
                              dom_fallback = page.evaluate(EXTRACT_ASSISTANT_JS, {
                                  "promptTail": chunk_meta["prompt"][-60:].strip(),
                                  "expectJson": True
                              })
                              dom_txt = (dom_fallback.get("text") or "").strip()
                              if dom_txt and dom_txt != raw_resp:
                                  (DEBUG_DIR / f"raw_chunk_{chunk_num}_att_{attempt}_dom.txt").write_text(dom_txt, encoding="utf-8")
                                  parsed_json = parse_first_balanced_json(dom_txt, require_beats=True)

                          if not is_valid_recap_json(parsed_json):
                              snap(page, f"bad_json_chunk_{chunk_num}_att_{attempt}")
                              raise RuntimeError(f"Invalid or empty JSON beats on Chunk {chunk_num}: {raw_resp[:220]}")

                          candidate_norm = normalize_chunk_beats(parsed_json)
                          if not candidate_norm["beats"]:
                              raise RuntimeError(f"Chunk {chunk_num} produced 0 valid beats.")

                          norm_chunk = candidate_norm
                          log(f"SUCCESS {chunk_meta['prompt_type']} Chunk {chunk_num}: +{len(norm_chunk['beats'])} beats.")
                          break

                      except Exception as err:
                          log(f"Chunk {chunk_num} ({chunk_meta['prompt_type']}) attempt {attempt} failed: {err}")
                          snap(page, f"err_chunk_{chunk_num}_att_{attempt}")
                          if attempt < MAX_ATTEMPTS:
                              renew_tor()
                              launch_browser(p)

                  if norm_chunk is None:
                      log(f"CRITICAL: Failed on Chunk {chunk_num}. Saving partial progress & exiting.")
                      break

                  pipeline_state["beats"].extend(norm_chunk["beats"])
                  if norm_chunk["synopsis"]:
                      pipeline_state["synopses"].append(norm_chunk["synopsis"])
                  for ch in norm_chunk.get("characters", []):
                      if isinstance(ch, dict) and ch.get("name"):
                          pipeline_state["characters"][ch["name"]] = ch
                  pipeline_state["next_segment_idx"] = next_idx
                  pipeline_state["chunk_num"] = chunk_num

                  # ---- STEP B: If more transcript remains, run PROMPT 2 (Continuity Handoff) ----
                  handoff_text = ""
                  if next_idx < total_segments:
                      p2_meta = build_prompt_2_preview(transcript_data, next_idx)
                      if p2_meta:
                          log(
                              f"Running PROMPT 2 (Continuity Handoff in SAME chat) with {p2_meta['preview_count']} preview lines "
                              f"({p2_meta['prompt_chars']} chars)..."
                          )
                          try:
                              page.wait_for_timeout(1500)
                              box = get_prompt_box(page)
                              box.wait_for(state="visible", timeout=30000)

                              if not send_and_confirm(page, box, p2_meta["prompt"], context, current_chat_state, f"Chunk {chunk_num} PROMPT_2", is_new_chat=False):
                                  raise RuntimeError("Prompt 2 submission not acknowledged in same chat.")

                              raw_handoff = wait_for_response(
                                  page,
                                  current_chat_state,
                                  prompt_text=p2_meta["prompt"],
                                  max_wait=TEXT_WAIT,
                                  expect_json=False,
                                  expect_beats=False
                              )
                              (DEBUG_DIR / f"handoff_chunk_{chunk_num}.txt").write_text(raw_handoff, encoding="utf-8")
                              if len(raw_handoff.strip()) < 150:
                                  raise RuntimeError(f"Prompt 2 returned too short handoff ({len(raw_handoff.strip())} chars).")
                              handoff_text = raw_handoff.strip()
                              log(f"SUCCESS PROMPT 2 (same chat): captured {len(handoff_text)} chars handoff.")
                          except Exception as p2_err:
                              log(f"Same-chat PROMPT 2 failed ({p2_err}); switching to recovery fresh-chat PROMPT 2...")
                              snap(page, f"err_handoff_chunk_{chunk_num}")

                      if not handoff_text:
                          rec_state = {
                              "characters": list(pipeline_state["characters"].values()),
                              "synopses": pipeline_state["synopses"][-3:]
                          }
                          rec_beats = pipeline_state["beats"][-3:]
                          p2_rec = build_prompt_2_preview(
                              transcript_data,
                              next_idx,
                              recovery_state=rec_state,
                              recovery_beats=rec_beats
                          )
                          for rec_att in range(1, 3):
                              try:
                                  renew_tor()
                                  launch_browser(p)
                                  open_fresh_duckai_chat(take_verify_snap=False)
                                  box = get_prompt_box(page)
                                  box.wait_for(state="visible", timeout=40000)
                                  if not send_and_confirm(page, box, p2_rec["prompt"], context, current_chat_state, f"Chunk {chunk_num} PROMPT_2_REC", is_new_chat=True):
                                      raise RuntimeError("Recovery Prompt 2 submission not acknowledged.")
                                  raw_handoff = wait_for_response(
                                      page,
                                      current_chat_state,
                                      prompt_text=p2_rec["prompt"],
                                      max_wait=TEXT_WAIT,
                                      expect_json=False,
                                      expect_beats=False
                                  )
                                  (DEBUG_DIR / f"handoff_chunk_{chunk_num}_rec.txt").write_text(raw_handoff, encoding="utf-8")
                                  if len(raw_handoff.strip()) >= 150:
                                      handoff_text = raw_handoff.strip()
                                      log(f"SUCCESS PROMPT 2 (recovery chat): captured {len(handoff_text)} chars.")
                                      break
                              except Exception as rec_err:
                                  log(f"Recovery PROMPT 2 attempt {rec_att} failed: {rec_err}")

                  if next_idx < total_segments and not handoff_text:
                      with open(STATE_FILE, "w", encoding="utf-8") as sf:
                          json.dump(pipeline_state, sf, indent=2, ensure_ascii=False)
                      log(f"CRITICAL: Could not generate Continuity Handoff after Chunk {chunk_num}. Saved progress & exiting.")
                      break

                  pipeline_state["continuity_handoff"] = handoff_text
                  with open(STATE_FILE, "w", encoding="utf-8") as sf:
                      json.dump(pipeline_state, sf, indent=2, ensure_ascii=False)

                  log(f"Saved state after Chunk {chunk_num} (total beats: {len(pipeline_state['beats'])}, next_idx: {next_idx}/{total_segments}).")
                  page.wait_for_timeout(1500)

              # ------------------ MERGE & EXPORT FINAL JSON ------------------
              final_beats = []
              total_words = 0
              clip_counter = 1

              for b_idx, b in enumerate(pipeline_state["beats"], 1):
                  b_copy = {
                      "beat_id": f"B{b_idx:04d}",
                      "narration": b["narration"],
                      "word_count": b["word_count"],
                      "estimated_duration": b["estimated_duration"],
                      "is_scene_bridge": b["is_scene_bridge"],
                      "clips": []
                  }
                  total_words += b["word_count"]
                  for c in b.get("clips", []):
                      b_copy["clips"].append({
                          "clip_id": f"C{clip_counter:04d}",
                          "start": c["start"],
                          "end": c["end"],
                          "duration": c["duration"],
                          "scene_context": c["scene_context"]
                      })
                      clip_counter += 1
                  final_beats.append(b_copy)

              target_min_val = None
              try:
                  target_min_val = float(TARGET_MINUTES) if TARGET_MINUTES else None
              except Exception:
                  target_min_val = None

              final_output = {
                  "movie_title": movie_title,
                  "content_type": INPUT_CONTENT_TYPE or None,
                  "season": INPUT_SEASON or None,
                  "episode": INPUT_EPISODE or None,
                  "part_identifier": INPUT_PART or None,
                  "target_minutes": target_min_val,
                  "estimated_narration_minutes": round(total_words / 140.0, 2),
                  "total_beats": len(final_beats),
                  "total_words": total_words,
                  "characters": list(pipeline_state.get("characters", {}).values()),
                  "synopsis": " ".join(pipeline_state.get("synopses", [])).strip(),
                  "beats": final_beats
              }

              Path("story_beats.json").write_text(
                  json.dumps(final_output, ensure_ascii=False, indent=2), encoding="utf-8"
              )

              preview_lines = [
                  f"=== YOUTUBE MOVIE RECAP SCRIPT: {final_output['movie_title']} ===",
                  f"Content Type: {final_output['content_type']} | Est. Runtime: ~{final_output['estimated_narration_minutes']} mins | Beats: {final_output['total_beats']} | Words: {final_output['total_words']}",
                  f"Synopsis: {final_output['synopsis']}\n",
                  "=" * 70
              ]
              for b in final_output["beats"]:
                  bridge_tag = " [SCENE BRIDGE]" if b.get("is_scene_bridge") else ""
                  preview_lines.append(
                      f"[{b['beat_id']} | Words: {b['word_count']} | Est: {b['estimated_duration']}s]{bridge_tag}"
                  )
                  preview_lines.append(f"Narration: {b['narration']}")
                  for c in b.get("clips", []):
                      preview_lines.append(
                          f"  - {c['clip_id']}: {c['start']}s -> {c['end']}s ({c['duration']}s) | {c['scene_context']}"
                      )
                  preview_lines.append("-" * 70)

              Path("script_preview.txt").write_text("\n".join(preview_lines), encoding="utf-8")
              log(f"GENERATION COMPLETE: {len(final_beats)} beats written to story_beats.json & script_preview.txt.")

              if browser:
                  browser.close()
          PY

          if [ "$HEADED" = "true" ]; then
            xvfb-run -a --server-args="-screen 0 1440x1000x24" python recap_engine.py
          else
            python recap_engine.py
          fi

      - name: Kill Background Browser Instances
        if: always()
        run: |
          pkill -9 -f chrome || true
          pkill -9 -f Xvfb || true

      - name: Commit and Push Story Assets & Verification Screenshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f story_beats.json script_preview.txt build/pipeline_state.json debug/model_settings_verified.png debug/settings_dropdown_open.png || true
          if ! git diff --cached --quiet; then
            git commit -m "Update Hindi recap JSON & Duck.ai settings verification screenshot [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload Debug Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recap-engine-artifacts
          path: |
            debug/
            script_preview.txt
            story_beats.json
          if-no-files-found: ignore
