name: Generate Hindi YouTube Movie Recap

on:
  workflow_dispatch:
    inputs:
      headed:
        description: "Run non-headless Chrome under Xvfb (less detectable)"
        required: true
        type: boolean
        default: true
      mode:
        description: "Execution mode (probe | full)"
        required: true
        type: choice
        options:
          - "probe"
          - "full"
        default: "probe"
      target_minutes:
        description: "Target recap duration in minutes (e.g. 12)"
        required: true
        default: "12"
      hints:
        description: "Optional notes / character name fixes"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate-recap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      LANG: "C.UTF-8"
      LC_ALL: "C.UTF-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tor
        timeout-minutes: 4
        run: |
          sudo apt-get update
          sudo apt-get install -y tor netcat-openbsd xvfb
          sudo service tor start
          for i in {1..30}; do
            if nc -z 127.0.0.1 9050; then echo "Tor ready"; break; fi
            sleep 2
          done
          nc -z 127.0.0.1 9050

      - name: Install Python dependencies
        timeout-minutes: 6
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi playwright pillow requests
          playwright install --with-deps chromium

      - name: Verify connection (curl_cffi, Chrome TLS impersonation)
        timeout-minutes: 3
        run: |
          python - <<'PY'
          from curl_cffi import requests
          p = "socks5h://127.0.0.1:9050"
          r = requests.get("https://check.torproject.org/api/ip", proxies={"http": p, "https": p}, impersonate="chrome", timeout=60)
          r.raise_for_status()
          data = r.json()
          print("Connection info:", data)
          if not data.get("IsTor"):
              raise RuntimeError("Traffic is not using Tor.")
          PY

      - name: Automate Duck.ai Story Pipeline
        timeout-minutes: 110
        env:
          HEADED: ${{ inputs.headed }}
          RUN_MODE: ${{ inputs.mode }}
          TARGET_MINUTES: ${{ inputs.target_minutes }}
          INPUT_HINTS: ${{ inputs.hints }}
          TEXT_WAIT_SECONDS: "180"
        run: |
          mkdir -p debug
          cat > generate_story.py <<'PY'
          import os, re, sys, json, base64, subprocess, time, math
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          if sys.platform != "win32":
              sys.stdout.reconfigure(encoding="utf-8")
              sys.stderr.reconfigure(encoding="utf-8")

          HEADED = os.environ.get("HEADED") == "true"
          RUN_MODE = os.environ.get("RUN_MODE", "probe").strip().lower()
          TARGET_MINUTES = float(os.environ.get("TARGET_MINUTES", "12"))
          INPUT_HINTS = os.environ.get("INPUT_HINTS", "").strip()
          TEXT_WAIT = int(os.environ.get("TEXT_WAIT_SECONDS", "180"))
          MAX_CLIP_DURATION = 3.0  # HARD LIMIT: Visual clips will NEVER exceed 3.0 seconds
          MAX_ATTEMPTS = 2

          DEBUG_DIR = Path("debug"); DEBUG_DIR.mkdir(parents=True, exist_ok=True)
          STATE_FILE = Path("build/pipeline_state.json")
          STATE_FILE.parent.mkdir(parents=True, exist_ok=True)
          RUN_LOG = DEBUG_DIR / "run.log"

          TOR_PROXY = "socks5h://127.0.0.1:9050"
          BROWSER_PROXY = "socks5://127.0.0.1:9050"

          CONTINUE_LABELS = re.compile(
              r"^(agree and continue|agree & continue|continue|i agree|accept|accept all|get started|got it|next|done|turn on|not now|no thanks|dismiss)$", re.I)

          def log(msg):
              line = f"[{time.strftime('%H:%M:%S')}] {msg}"
              print(line, flush=True)
              with open(RUN_LOG, "a", encoding="utf-8") as f:
                  f.write(line + "\n")

          def fix_mojibake(val):
              """Repairs any UTF-8 strings accidentally misinterpreted as Latin-1/ISO-8859-1."""
              if isinstance(val, str):
                  try:
                      if any(x in val for x in ["à¤", "à¥", "à¦", "à§", "â€™", "â€”", "Ã"]):
                          return val.encode("latin-1").decode("utf-8")
                  except Exception:
                      pass
                  return val
              elif isinstance(val, list):
                  return [fix_mojibake(item) for item in val]
              elif isinstance(val, dict):
                  return {k: fix_mojibake(v) for k, v in val.items()}
              return val

          def snap(page, name):
              try:
                  page.screenshot(path=str(DEBUG_DIR / f"{name}.png"), full_page=True, timeout=15000)
                  (DEBUG_DIR / f"{name}.html").write_text(page.content(), encoding="utf-8")
                  log(f"snapshot {name} | url={page.url}")
              except Exception as e:
                  log(f"snapshot failed: {e}")

          def new_tor_circuit():
              log("Restarting Tor for a new exit IP...")
              subprocess.run(["sudo", "timeout", "60", "service", "tor", "restart"], check=False)
              for _ in range(30):
                  if subprocess.run(["nc", "-z", "127.0.0.1", "9050"]).returncode == 0:
                      break
                  time.sleep(2)
              time.sleep(3)

          def click_continue(page):
              clicked_any = False
              for _ in range(3):
                  clicked = False
                  try:
                      buttons = page.get_by_role("button", name=CONTINUE_LABELS)
                      for i in range(buttons.count()):
                          btn = buttons.nth(i)
                          if btn.is_visible():
                              log(f"Clicking button: {(btn.inner_text() or '').strip()!r}")
                              btn.click(timeout=3000)
                              page.wait_for_timeout(1000)
                              clicked = clicked_any = True
                              break
                  except Exception:
                      pass
                  if not clicked:
                      break
              return clicked_any

          def get_prompt_box(page):
              return page.locator(
                  "textarea[name='user-prompt'], textarea[placeholder*='ask' i], "
                  "textarea[placeholder*='message' i], textarea").first

          def human_paste_prompt(page, box, text):
              """Directly fills textarea to avoid X11 clipboard UTF-8 corruption."""
              box.click()
              page.wait_for_timeout(300)
              box.fill("")
              box.fill(text)
              page.wait_for_timeout(400)
              send_btn = page.locator("button[type='submit'], button[aria-label*='Send' i]")
              if send_btn.count() > 0 and send_btn.first.is_visible() and send_btn.first.is_enabled():
                  send_btn.first.click()
              else:
                  box.press("Enter")

          def parse_sse_text(raw_sse: str) -> str:
              chunks = []
              for line in raw_sse.splitlines():
                  line = line.strip()
                  if not line.startswith("data:"):
                      continue
                  payload = line[5:].strip()
                  if not payload or payload == "[DONE]":
                      continue
                  try:
                      data = json.loads(payload)
                      chunk = data.get("message", "")
                      if chunk:
                          chunks.append(chunk)
                  except Exception:
                      continue
              return "".join(chunks)

          def strip_markdown(text: str) -> str:
              text = text.strip()
              text = re.sub(r"^```(?:json)?\s*", "", text, flags=re.IGNORECASE)
              text = re.sub(r"\s*```$", "", text)
              return text.strip()

          def parse_first_balanced_json(text: str):
              if not text:
                  return None
              cleaned = strip_markdown(text)
              try:
                  return fix_mojibake(json.loads(cleaned))
              except Exception:
                  pass

              start_idx = -1
              for i, ch in enumerate(cleaned):
                  if ch in ("{", "["):
                      start_idx = i
                      break
              if start_idx == -1:
                  return None

              open_char = cleaned[start_idx]
              close_char = "}" if open_char == "{" else "]"
              depth = 0
              in_string = False
              escape = False

              for idx in range(start_idx, len(cleaned)):
                  c = cleaned[idx]
                  if escape:
                      escape = False
                      continue
                  if c == "\\":
                      escape = True
                      continue
                  if c == '"':
                      in_string = not in_string
                      continue
                  if not in_string:
                      if c == open_char:
                          depth += 1
                      elif c == close_char:
                          depth -= 1
                          if depth == 0:
                              try:
                                  raw_obj = json.loads(cleaned[start_idx : idx + 1])
                                  return fix_mojibake(raw_obj)
                              except Exception:
                                  break
              return None

          def wait_for_text_generation(page, baseline_msgs_count, state, max_wait=TEXT_WAIT):
              log("Waiting for text generation to complete...")
              start = time.time()
              last_text = ""
              stable_ticks = 0

              while time.time() - start < max_wait:
                  click_continue(page)

                  if state["chat_done"] and state["raw_stream"]:
                      parsed_sse = parse_sse_text("".join(state["raw_stream"]))
                      if parsed_sse.strip():
                          log(f"Captured text via completed network SSE stream ({len(parsed_sse)} chars).")
                          return fix_mojibake(parsed_sse)

                  stop_btn = page.locator("button[aria-label*='Stop' i], button:has-text('Stop generating'), button:has-text('Stop')")
                  is_generating = False
                  try:
                      is_generating = stop_btn.count() > 0 and stop_btn.first.is_visible()
                  except Exception:
                      pass

                  try:
                      cur_text = page.evaluate("""
                          () => {
                              const articles = document.querySelectorAll('article, [data-testid="chat-message"]');
                              if (!articles || articles.length === 0) return '';
                              return (articles[articles.length - 1].innerText || '').trim();
                          }
                      """)
                      if cur_text and cur_text == last_text and not is_generating:
                          stable_ticks += 1
                      else:
                          stable_ticks = 0
                      last_text = cur_text

                      if stable_ticks >= 3 and len(last_text) > 10:
                          log(f"Captured text via DOM stability ({len(last_text)} chars).")
                          return fix_mojibake(last_text)
                  except Exception:
                      pass

                  page.wait_for_timeout(2000)

              if state["raw_stream"]:
                  return fix_mojibake(parse_sse_text("".join(state["raw_stream"])))
              return fix_mojibake(last_text)

          def build_timeline_chunks(transcript_path="transcript.json", max_chars=1800):
              """Uses 1800 chars (~45-60s) chunks so AI generates granular second-by-second cuts."""
              with open(transcript_path, "r", encoding="utf-8") as f:
                  data = json.load(f)

              movie_title = data.get("movie_title", "Untitled")
              segments = data.get("segments", [])

              lines = []
              for s in segments:
                  s_id = f"S{int(s['id']):04d}"
                  st = float(s["start"])
                  en = float(s["end"])
                  txt = str(s.get("text", "")).strip()
                  lines.append(f"[{s_id} | {st:.2f}s - {en:.2f}s] {txt}")

              chunks = []
              cur = []
              cur_len = 0
              for line in lines:
                  line_len = len(line) + 1
                  if cur_len + line_len > max_chars and cur:
                      chunks.append(list(cur))
                      overlap = cur[-2:] if len(cur) >= 2 else cur
                      cur = list(overlap)
                      cur_len = sum(len(l) + 1 for l in cur)
                  cur.append(line)
                  cur_len += line_len
              if cur:
                  chunks.append(cur)

              return movie_title, chunks

          def enforce_micro_beats(raw_beats, max_duration=MAX_CLIP_DURATION, max_words_per_cut=8):
              """
              Deterministic splitter: Enforces that NO clip exceeds max_duration (3.0s).
              Splits long scenes and distributes narration into snappy, synced micro-cuts.
              """
              refined = []
              for b in raw_beats:
                  narr = fix_mojibake(b.get("narration", "")).strip()
                  narr = re.sub(r"[a-zA-Z]", "", narr).strip()
                  if not narr:
                      continue

                  st = round(float(b.get("start_sec", 0.0)), 2)
                  en = round(float(b.get("end_sec", st + 3.0)), 2)
                  if en <= st:
                      en = round(st + 3.0, 2)

                  words = narr.split()
                  total_words = len(words)
                  dur = en - st

                  # If beat already satisfies <= 3.0s and <= 8 words, keep as is
                  if dur <= max_duration and total_words <= max_words_per_cut:
                      refined.append({
                          "narration": narr,
                          "start_sec": st,
                          "end_sec": en,
                          "word_count": total_words
                      })
                      continue

                  # Otherwise, chop this window into snappy 2.0s - 3.0s micro-cuts
                  splits_by_time = math.ceil(dur / max_duration)
                  splits_by_words = math.ceil(total_words / max_words_per_cut)
                  num_splits = max(int(splits_by_time), int(splits_by_words), 1)

                  step_time = round(dur / num_splits, 2)
                  if step_time > max_duration:
                      step_time = max_duration

                  step_words = max(1, math.ceil(total_words / num_splits))

                  cur_time = st
                  for i in range(num_splits):
                      sub_words = words[i * step_words : (i + 1) * step_words]
                      if not sub_words:
                          break
                      sub_narr = " ".join(sub_words)
                      sub_st = round(cur_time, 2)
                      sub_en = round(min(en, cur_time + step_time), 2)
                      if sub_en - sub_st < 1.5:
                          sub_en = round(sub_st + min(max_duration, 2.5), 2)
                      cur_time = sub_en

                      refined.append({
                          "narration": sub_narr,
                          "start_sec": sub_st,
                          "end_sec": sub_en,
                          "word_count": len(sub_words)
                      })
              return refined

          browser = None
          context = None
          page = None

          def start_fresh_browser(playwright_runner):
              global browser, context, page
              if browser:
                  try: browser.close()
                  except Exception: pass
              browser = playwright_runner.chromium.launch(
                  headless=not HEADED,
                  proxy={"server": BROWSER_PROXY},
                  args=["--disable-dev-shm-usage", "--disable-blink-features=AutomationControlled"]
              )
              context = browser.new_context(
                  viewport={"width": 1440, "height": 1000},
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36",
                  permissions=["clipboard-read", "clipboard-write"]
              )
              context.add_init_script("Object.defineProperty(navigator,'webdriver',{get:()=>undefined})")
              page = context.new_page()

          with sync_playwright() as p:
              start_fresh_browser(p)

              # PROBE MODE
              if RUN_MODE == "probe":
                  log("==================== RUNNING PROBE MODE ====================")
                  log("Opening https://duck.ai/chat ...")
                  page.goto("https://duck.ai/chat", wait_until="domcontentloaded", timeout=75000)
                  page.wait_for_timeout(3000)
                  click_continue(page)

                  box = get_prompt_box(page)
                  box.wait_for(state="visible", timeout=40000)

                  probe_prompt = 'Reply with exactly this JSON and nothing else: {"ok": true, "hindi": "नमस्ते"}'
                  state = {"submitted": False, "raw_stream": [], "chat_done": False}

                  def on_resp(resp):
                      if "/duckchat/v1/chat" in resp.url and resp.request.method == "POST":
                          try:
                              body = resp.body().decode("utf-8", errors="replace")
                              state["raw_stream"].append(body)
                          except Exception: pass
                  page.on("response", on_resp)

                  def on_req_finish(req):
                      if "/duckchat/v1/chat" in req.url and req.method == "POST":
                          state["chat_done"] = True
                  page.on("requestfinished", on_req_finish)

                  human_paste_prompt(page, box, probe_prompt)
                  state["submitted"] = True

                  result_text = wait_for_text_generation(page, 0, state, max_wait=45)
                  parsed = parse_first_balanced_json(result_text)
                  log(f"Probe Result Raw: {result_text!r}")
                  log(f"Probe Parsed JSON: {parsed}")

                  if parsed and parsed.get("ok") is True:
                      log("Probe SUCCESS! UTF-8 and connection validated.")
                      sys.exit(0)
                  else:
                      log("Probe FAILED validation.")
                      sys.exit(1)

              # FULL MODE
              log("==================== RUNNING FULL STORY PIPELINE ====================")
              movie_title, chunks = build_timeline_chunks("transcript.json", max_chars=1800)
              log(f"Loaded '{movie_title}' with {len(chunks)} chunks.")

              pipeline_state = {"completed_chunks": [], "beats": [], "characters": {}}
              if STATE_FILE.exists():
                  try:
                      with open(STATE_FILE, "r", encoding="utf-8") as sf:
                          loaded = json.load(sf)
                          if isinstance(loaded, dict):
                              pipeline_state = fix_mojibake(loaded)
                  except Exception: pass

              running_story_summary = "Beginning of the movie."
              all_beats = pipeline_state.get("beats", [])
              beat_counter = len(all_beats) + 1

              for c_idx, chunk_lines in enumerate(chunks):
                  chunk_id = f"chunk_{c_idx+1}"
                  if chunk_id in pipeline_state.get("completed_chunks", []):
                      log(f"Chunk {chunk_id} already generated. Skipping.")
                      continue

                  log(f"\n==================== PROCESSING: {chunk_id} ({c_idx+1}/{len(chunks)}) ====================")
                  chunk_done = False

                  for attempt in range(1, MAX_ATTEMPTS + 1):
                      state = {"submitted": False, "raw_stream": [], "chat_done": False}

                      def on_response(resp):
                          try:
                              if state["submitted"] and "/duckchat/v1/chat" in resp.url and resp.request.method == "POST":
                                  body = resp.body().decode("utf-8", errors="replace")
                                  state["raw_stream"].append(body)
                          except Exception: pass
                      page.on("response", on_response)

                      def on_request_finished(req):
                          try:
                              if req.method == "POST" and "/duckchat/v1/chat" in req.url:
                                  state["chat_done"] = True
                          except Exception: pass
                      page.on("requestfinished", on_request_finished)

                      try:
                          is_in_chat = bool(page and "chatID=" in page.url)

                          chunk_text = "\n".join(chunk_lines)
                          final_prompt = (
                              f"You are a professional Hindi YouTube movie-recap writer.\n"
                              f"Movie: {movie_title}.\n"
                              f"Context so far:\n{running_story_summary}\n\n"
                              f"Current Movie Segments:\n{chunk_text}\n\n"
                              "STRICT RULES (CRITICAL FOR VIDEO EDITING & FAIR USE):\n"
                              "1. MAXIMUM 3.0 SECONDS CLIP LENGTH: Every visual cut MUST be 2.0 to 3.0 seconds maximum (end_sec - start_sec <= 3.0). DO NOT output 10 or 30-second clips.\n"
                              "2. SNAPPY NARRATION: For every 3-second cut, write strictly 6 to 8 Hindi words (Devanagari script only, no Latin letters). It must be fast-paced, describing what is visible right now on screen.\n"
                              "3. NO PARAGRAPH DUMPING: Break every scene down into sequential, continuous 3-second micro-beats.\n"
                              "4. Output strictly valid JSON format matching this schema:\n"
                              '{"summary": "Short 2 sentence plot update", '
                              '"characters": [{"name": "EnglishName", "hindi_name": "हिंदी", "who": "विवरण"}], '
                              '"beats": [{"narration": "यहाँ सिर्फ छह से आठ शब्द होंगे।", "start_sec": 0.0, "end_sec": 3.0}]}'
                          )

                          if not is_in_chat:
                              log("Opening https://duck.ai/chat ...")
                              page.goto("https://duck.ai/chat", wait_until="domcontentloaded", timeout=75000)
                              page.wait_for_timeout(3000)
                              click_continue(page)

                          box = get_prompt_box(page)
                          box.wait_for(state="visible", timeout=40000)
                          click_continue(page)

                          log(f"Entering prompt for {chunk_id}...")
                          human_paste_prompt(page, box, final_prompt)
                          state["submitted"] = True

                          if not is_in_chat:
                              dl = time.time() + 50
                              while time.time() < dl:
                                  click_continue(page)
                                  if "chatID=" in page.url: break
                                  page.wait_for_timeout(1200)

                          result_raw = wait_for_text_generation(page, 0, state, max_wait=TEXT_WAIT)
                          parsed = parse_first_balanced_json(result_raw)

                          if not parsed or not isinstance(parsed.get("beats"), list) or len(parsed.get("beats")) == 0:
                              raise RuntimeError(f"Invalid or empty JSON response for {chunk_id}: {result_raw[:200]!r}")

                          running_story_summary = parsed.get("summary", running_story_summary)

                          if "characters" not in pipeline_state:
                              pipeline_state["characters"] = {}

                          for ch in parsed.get("characters", []):
                              if isinstance(ch, dict) and ch.get("name"):
                                  pipeline_state["characters"][ch["name"]] = ch

                          # Split long AI responses into strictly <= 3.0s micro-cuts
                          sanitized_beats = enforce_micro_beats(parsed.get("beats", []))

                          for b in sanitized_beats:
                              narr = b["narration"]
                              st_s = b["start_sec"]
                              en_s = b["end_sec"]

                              beat_obj = {
                                  "beat_id": f"B{beat_counter:04d}",
                                  "narration": narr,
                                  "target_window": {"start": st_s, "end": en_s},
                                  "portion": {"start": st_s, "end": en_s},
                                  "duration": round(en_s - st_s, 2),
                                  "word_count": b["word_count"]
                              }
                              all_beats.append(beat_obj)
                              beat_counter += 1

                          if "completed_chunks" not in pipeline_state:
                              pipeline_state["completed_chunks"] = []
                          pipeline_state["completed_chunks"].append(chunk_id)
                          pipeline_state["beats"] = all_beats

                          with open(STATE_FILE, "w", encoding="utf-8") as sf:
                              json.dump(pipeline_state, sf, indent=2, ensure_ascii=False)

                          log(f"SUCCESS: Completed {chunk_id} with {len(sanitized_beats)} micro-beats (all <= 3.0s).")
                          chunk_done = True
                          page.wait_for_timeout(2500)
                          break

                      except Exception as err:
                          log(f"Attempt {attempt} failed on {chunk_id}: {err}")
                          snap(page, f"err_{chunk_id}_a{attempt}")
                          new_tor_circuit()
                          start_fresh_browser(p)

                  if not chunk_done:
                      log(f"Could not complete {chunk_id}. Stopping execution.")
                      break

              total_words = sum(b["word_count"] for b in all_beats)
              final_output = {
                  "movie_title": movie_title,
                  "target_minutes": TARGET_MINUTES,
                  "characters": list(pipeline_state.get("characters", {}).values()),
                  "synopsis": running_story_summary,
                  "total_beats": len(all_beats),
                  "total_words": total_words,
                  "beats": all_beats
              }

              Path("story_beats.json").write_text(
                  json.dumps(final_output, ensure_ascii=False, indent=2), encoding="utf-8"
              )
              log(f"ALL CHUNKS COMPLETE: Wrote story_beats.json with {len(all_beats)} beats ({total_words} words).")

              if browser:
                  browser.close()
          PY

          if [ "$HEADED" = "true" ]; then
            xvfb-run -a --server-args="-screen 0 1440x1000x24" python generate_story.py
          else
            python generate_story.py
          fi

      - name: Kill leftover browser processes
        if: always()
        run: |
          pkill -9 -f chrome || true
          pkill -9 -f Xvfb || true

      - name: Commit and push generated story frames
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f story_beats.json ]; then
            git add -f story_beats.json build/pipeline_state.json || true
            if ! git diff --cached --quiet; then
              git commit -m "Generate YouTube Hindi movie recap story beats [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duck-ai-debug
          path: debug/
          if-no-files-found: ignore
