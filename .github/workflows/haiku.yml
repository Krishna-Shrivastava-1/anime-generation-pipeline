          - Combined clip duration for each beat must approximately match or exceed its `estimated_duration`.
          - Use ONLY timestamps present in the supplied transcript; never fabricate or extend timestamps. Mark unverified visual suggestions clearly as unverified.

          ## 5. REQUIRED JSON OUTPUT
          Return valid JSON only. Ensure all quotes inside strings are properly escaped and there are no trailing commas. Use this exact schema:
