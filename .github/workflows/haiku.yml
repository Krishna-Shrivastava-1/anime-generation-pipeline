          PROMPT_5_CRITIC_TEMPLATE = textwrap.dedent("""\
          # PROMPT 5 — HAIKU FINAL CROSS-CHECK, WEB-SEARCH VERIFICATION & YOUTUBE POLISH

          You are the **Senior Fact-Checker & Lead YouTube Storyteller** reviewing `6 Luna`'s draft JSON.
