name: Generate Hindi YouTube Movie Recap Engine

on:
  workflow_dispatch:
    inputs:
      reset_state:
        description: "Clear previous state and generate fresh"
        required: true
        type: boolean
        default: true
      headed:
        description: "Run non-headless Chrome under Xvfb (avoids bot detection)"
        required: true
        type: boolean
        default: true
      mode:
        description: "Execution mode (probe | full)"
        required: true
        type: choice
        options:
          - "probe"
          - "full"
        default: "full"
      model_name:
        description: "Duck.ai model to select"
        required: true
        default: "Claude Haiku 5.5"
      reasoning_mode:
        description: "Enable Reasoning mode in Duck.ai"
        required: true
        type: boolean
        default: true
      movie_title:
        description: "Movie/Series Title (optional, overrides transcript.json title)"
        required: false
        default: ""
      content_type:
        description: "Content Type (Movie | TV Series)"
        required: false
        default: "Movie"
      season:
        description: "Season (leave blank if Movie/N/A)"
        required: false
        default: ""
      episode:
        description: "Episode (leave blank if Movie/N/A)"
        required: false
        default: ""
      part_identifier:
        description: "Part Identifier (optional)"
        required: false
        default: ""
      target_minutes:
        description: "Target video duration in minutes (e.g. 12)"
        required: true
        default: "12"
      max_clip_sec:
        description: "Max duration per video cut (Fair Use safe <= 3.0s)"
        required: true
        default: "3.0"
      max_prompt_chars:
        description: "Hard max characters per Duck.ai prompt (<= 16000)"
        required: true
        default: "15500"
      hints:
        description: "Initial Story Context / character or plot notes (optional)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate-recap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      LANG: "C.UTF-8"
      LC_ALL: "C.UTF-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tor and System Utilities
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y tor netcat-openbsd xvfb curl
          sudo service tor start
          for i in {1..30}; do
            if nc -z 127.0.0.1 9050 && curl --socks5-hostname 127.0.0.1:9050 -sf --max-time 8 https://check.torproject.org/api/ip >/dev/null; then
              echo "Tor circuit is bootstrapped and ready"
              break
            fi
            sleep 2
          done
          nc -z 127.0.0.1 9050

      - name: Install Python Dependencies
        timeout-minutes: 6
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi playwright pillow requests ftfy
          playwright install --with-deps chromium

      - name: Verify Anonymous Tor Exit
        timeout-minutes: 4
        run: |
          python - <<'PY'
          import subprocess, time
          from curl_cffi import requests

          p = "socks5h://127.0.0.1:9050"
          last_err = None

          for attempt in range(1, 5):
              try:
                  print(f"Tor exit check attempt {attempt}/4...", flush=True)
                  r = requests.get(
                      "https://check.torproject.org/api/ip",
                      proxies={"http": p, "https": p},
                      impersonate="chrome",
                      timeout=25,
                  )
                  r.raise_for_status()
                  data = r.json()
                  print("Connection Info:", data, flush=True)
                  if not data.get("IsTor"):
                      raise RuntimeError("Traffic is not exiting through Tor.")
                  last_err = None
                  break
              except Exception as e:
                  last_err = e
                  print(f"Attempt {attempt} failed: {e}", flush=True)
                  if attempt < 4:
                      print("Restarting Tor for a fresh circuit...", flush=True)
                      subprocess.run(["sudo", "service", "tor", "restart"], check=False)
                      for _ in range(25):
                          if (
                              subprocess.run(["nc", "-z", "127.0.0.1", "9050"]).returncode == 0
                              and subprocess.run(
                                  ["curl", "--socks5-hostname", "127.0.0.1:9050", "-sf", "--max-time", "8", "https://check.torproject.org/api/ip"],
                                  stdout=subprocess.DEVNULL,
                                  stderr=subprocess.DEVNULL,
                              ).returncode == 0
                          ):
                              break
                          time.sleep(2)

          if last_err:
              raise RuntimeError(f"Tor verification failed after 4 attempts: {last_err}")
          PY

      - name: Run YouTube Recap Generation Engine
        timeout-minutes: 110
        env:
          HEADED: ${{ inputs.headed }}
          RUN_MODE: ${{ inputs.mode }}
          RESET_STATE: ${{ inputs.reset_state }}
          MODEL_NAME: ${{ inputs.model_name }}
          REASONING_MODE: ${{ inputs.reasoning_mode }}
          INPUT_MOVIE_TITLE: ${{ inputs.movie_title }}
          INPUT_CONTENT_TYPE: ${{ inputs.content_type }}
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_EPISODE: ${{ inputs.episode }}
          INPUT_PART: ${{ inputs.part_identifier }}
          TARGET_MINUTES: ${{ inputs.target_minutes }}
          MAX_CLIP_SEC: ${{ inputs.max_clip_sec }}
          MAX_PROMPT_CHARS: ${{ inputs.max_prompt_chars }}
          INPUT_HINTS: ${{ inputs.hints }}
          TEXT_WAIT_SECONDS: "420"
        run: |
          mkdir -p debug build
          cat > recap_engine.py <<'PY'
          import os, re, sys, json, subprocess, time, textwrap
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import ftfy

          if sys.platform != "win32":
              sys.stdout.reconfigure(encoding="utf-8")
              sys.stderr.reconfigure(encoding="utf-8")

          HEADED = os.environ.get("HEADED") == "true"
          RUN_MODE = os.environ.get("RUN_MODE", "full").strip().lower()
          RESET_STATE = os.environ.get("RESET_STATE", "false").strip().lower() == "true"
          TARGET_MODEL = os.environ.get("MODEL_NAME", "Claude Haiku 5.5").strip()
          ENABLE_REASONING = os.environ.get("REASONING_MODE", "true").strip().lower() == "true"

          INPUT_MOVIE_TITLE = os.environ.get("INPUT_MOVIE_TITLE", "").strip()
          INPUT_CONTENT_TYPE = os.environ.get("INPUT_CONTENT_TYPE", "Movie").strip()
          INPUT_SEASON = os.environ.get("INPUT_SEASON", "").strip()
          INPUT_EPISODE = os.environ.get("INPUT_EPISODE", "").strip()
          INPUT_PART = os.environ.get("INPUT_PART", "").strip()
          TARGET_MINUTES = os.environ.get("TARGET_MINUTES", "12").strip()
          MAX_CLIP_DURATION = float(os.environ.get("MAX_CLIP_SEC", "3.0"))
          MAX_PROMPT_CHARS = min(int(os.environ.get("MAX_PROMPT_CHARS", "15500")), 15900)
          INPUT_HINTS = os.environ.get("INPUT_HINTS", "").strip()
          TEXT_WAIT = int(os.environ.get("TEXT_WAIT_SECONDS", "420"))
          PREVIEW_LINES_LIMIT = 100
          MAX_ATTEMPTS = 3

          DEBUG_DIR = Path("debug")
          DEBUG_DIR.mkdir(parents=True, exist_ok=True)
          STATE_FILE = Path("build/pipeline_state.json")
          STATE_FILE.parent.mkdir(parents=True, exist_ok=True)
          RUN_LOG = DEBUG_DIR / "engine.log"

          BROWSER_PROXY = "socks5://127.0.0.1:9050"

          if RESET_STATE and STATE_FILE.exists():
              STATE_FILE.unlink()
              print("[INIT] Old pipeline state cleared for fresh story generation.", flush=True)

          def log(msg):
              line = f"[{time.strftime('%H:%M:%S')}] {msg}"
              print(line, flush=True)
              with open(RUN_LOG, "a", encoding="utf-8") as f:
                  f.write(line + "\n")

          # ------------------ ENCODING & MOJIBAKE DEFENSE ------------------
          CP1252_MAP = {
              '\u20ac': 0x80, '\u201a': 0x82, '\u0192': 0x83, '\u201e': 0x84, '\u2026': 0x85,
              '\u2020': 0x86, '\u2021': 0x87, '\u02c6': 0x88, '\u2030': 0x89, '\u0160': 0x8a,
              '\u2039': 0x8b, '\u0152': 0x8c, '\u017d': 0x8e, '\u2018': 0x91, '\u2019': 0x92,
              '\u201c': 0x93, '\u201d': 0x94, '\u2022': 0x95, '\u2013': 0x96, '\u2014': 0x97,
              '\u02dc': 0x98, '\u2122': 0x99, '\u0161': 0x9a, '\u203a': 0x9b, '\u0153': 0x9c,
              '\u017e': 0x9e, '\u0178': 0x9f,
          }

          def fix_hindi_text(s: str) -> str:
              if not isinstance(s, str) or not s:
                  return s
              try:
                  s = ftfy.fix_text(s)
              except Exception:
                  pass
              if any(m in s for m in ["à¤", "à¥", "â€™", "â€”", "Ã", "Â"]):
                  try:
                      return s.encode("cp1252").decode("utf-8")
                  except Exception:
                      try:
                          raw_bytes = bytearray()
                          for ch in s:
                              if ch in CP1252_MAP:
                                  raw_bytes.append(CP1252_MAP[ch])
                              elif ord(ch) < 256:
                                  raw_bytes.append(ord(ch))
                              else:
                                  raw_bytes.extend(ch.encode("utf-8"))
                          return raw_bytes.decode("utf-8", errors="replace")
                      except Exception:
                          pass
              return s

          def deep_repair(val):
              if isinstance(val, str):
                  return fix_hindi_text(val)
              elif isinstance(val, list):
                  return [deep_repair(item) for item in val]
              elif isinstance(val, dict):
                  return {k: deep_repair(v) for k, v in val.items()}
              return val

          def snap(page, name, save_html=True):
              try:
                  page.screenshot(path=str(DEBUG_DIR / f"{name}.png"), full_page=True, timeout=15000)
                  if save_html:
                      (DEBUG_DIR / f"{name}.html").write_text(page.content(), encoding="utf-8")
                  log(f"Snapshot taken: {name}")
              except Exception as e:
                  log(f"Snapshot failed ({name}): {e}")

          def renew_tor():
              log("Refreshing Tor IP circuit...")
              subprocess.run(["sudo", "service", "tor", "restart"], check=False)
              for i in range(25):
                  port_up = subprocess.run(["nc", "-z", "127.0.0.1", "9050"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0
                  if port_up:
                      circuit_ok = subprocess.run(
                          ["curl", "--socks5-hostname", "127.0.0.1:9050", "-sf", "--max-time", "8", "https://check.torproject.org/api/ip"],
                          stdout=subprocess.DEVNULL,
                          stderr=subprocess.DEVNULL,
                      ).returncode == 0
                      if circuit_ok:
                          log(f"Tor circuit ready after {(i+1)*2}s.")
                          return
                  time.sleep(2)
              log("Tor circuit refresh check timed out; continuing anyway.")

          # ------------------ IN-PAGE FETCH INTERCEPTOR ------------------
          # Strictly matches /duckchat/v1/chat (ignores /duckchat/v1/summarize, /status, etc.)
          FETCH_HOOK_JS = r"""
          (() => {
              Object.defineProperty(navigator, 'webdriver', { get: () => undefined });
              if (window.__duckai_hooked) return;
              window.__duckai_hooked = true;
              window.__duckai_stream = {
                  active: false,
                  done: false,
                  status: 0,
                  url: '',
                  rawChunks: [],
                  error: ''
              };

              const origFetch = window.fetch;
              window.fetch = async function(...args) {
                  const reqUrl = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url ? args[0].url : '');
                  const reqInit = args[1] || {};
                  const method = (reqInit.method || (args[0] && args[0].method) || 'GET').toUpperCase();
                  const cleanUrl = reqUrl.split('?')[0];
                  const isChatCall = method === 'POST' && (
                      cleanUrl.includes('/duckchat/v1/chat') ||
                      cleanUrl.endsWith('/chat')
                  );

                  const response = await origFetch.apply(this, args);
                  if (isChatCall) {
                      window.__duckai_stream = {
                          active: true,
                          done: false,
                          status: response.status,
                          url: reqUrl,
                          rawChunks: [],
                          error: ''
                      };
                      try {
                          const clone = response.clone();
                          const reader = clone.body ? clone.body.getReader() : null;
                          if (reader) {
                              const decoder = new TextDecoder('utf-8');
                              (async () => {
                                  try {
                                      while (true) {
                                          const { value, done } = await reader.read();
                                          if (done) break;
                                          if (value) {
                                              window.__duckai_stream.rawChunks.push(decoder.decode(value, { stream: true }));
                                          }
                                      }
                                      const tail = decoder.decode();
                                      if (tail) window.__duckai_stream.rawChunks.push(tail);
                                  } catch (err) {
                                      window.__duckai_stream.error = String(err);
                                  } finally {
                                      window.__duckai_stream.active = false;
                                      window.__duckai_stream.done = true;
                                  }
                              })();
                          } else {
                              clone.text().then(t => {
                                  if (t) window.__duckai_stream.rawChunks.push(t);
                                  window.__duckai_stream.active = false;
                                  window.__duckai_stream.done = true;
                              }).catch(() => {
                                  window.__duckai_stream.active = false;
                                  window.__duckai_stream.done = true;
                              });
                          }
                      } catch (e) {
                          window.__duckai_stream.error = String(e);
                          window.__duckai_stream.active = false;
                          window.__duckai_stream.done = true;
                      }
                  }
                  return response;
              };
          })();
          """

          # ------------------ DUCK.AI MODAL & SETTINGS CONFIG ------------------
          def dismiss_duckai_modals(page):
              consent_patterns = [
                  re.compile(r"^\s*get started\s*$", re.I),
                  re.compile(r"^\s*agree and continue\s*$", re.I),
                  re.compile(r"^\s*i agree\s*$", re.I),
                  re.compile(r"^\s*accept\s*$", re.I),
                  re.compile(r"^\s*next\s*$", re.I),
                  re.compile(r"^\s*continue\s*$", re.I),
              ]
              for _ in range(4):
                  clicked = False
                  for pat in consent_patterns:
                      btn = page.get_by_role("button", name=pat)
                      if btn.count() > 0 and btn.first.is_visible():
                          try:
                              btn.first.click(timeout=3000)
                              log(f"Dismissed onboarding button matching: {pat.pattern}")
                              page.wait_for_timeout(1200)
                              clicked = True
                              break
                          except Exception:
                              pass
                  if not clicked:
                      break

          def wait_for_duckai_ui_ready(page, timeout_ms=45000):
              start = time.time()
              while (time.time() - start) * 1000 < timeout_ms:
                  try:
                      if get_prompt_box(page).is_visible():
                          return
                  except Exception:
                      pass
                  try:
                      btn = page.get_by_role("button", name=re.compile(r"(get started|agree|accept|continue)", re.I))
                      if btn.count() > 0 and btn.first.is_visible():
                          return
                  except Exception:
                      pass
                  page.wait_for_timeout(500)

          def configure_duckai_settings(page, target_model="Claude Haiku 5.5", enable_reasoning=True, take_verify_snap=True):
              log(f"Configuring Duck.ai settings -> Model: '{target_model}' | Reasoning: {enable_reasoning}")
              wait_for_duckai_ui_ready(page)
              dismiss_duckai_modals(page)
              page.wait_for_timeout(1200)

              model_btn_selectors = [
                  "button[data-testid*='model' i]",
                  "button[aria-label*='model' i]",
                  "button:has-text('Luna')",
                  "button:has-text('Claude')",
                  "button:has-text('GPT')",
                  "button:has-text('Llama')",
                  "button:has-text('Mistral')",
                  "button:has-text('o3')",
                  "button:has-text('o4')",
                  "button:has-text('Model')",
              ]

              opened_model_menu = False
              for sel in model_btn_selectors:
                  loc = page.locator(sel)
                  for i in range(loc.count()):
                      b = loc.nth(i)
                      if b.is_visible() and b.is_enabled():
                          try:
                              txt = (b.inner_text() or "").strip()
                              log(f"Clicking model selector candidate ({sel}): '{txt}'")
                              b.click(timeout=4000)
                              page.wait_for_timeout(1200)
                              opened_model_menu = True
                              break
                          except Exception:
                              pass
                  if opened_model_menu:
                      break

              if not opened_model_menu:
                  settings_loc = page.locator("button[aria-label*='setting' i], button:has-text('Settings')")
                  if settings_loc.count() > 0 and settings_loc.first.is_visible():
                      settings_loc.first.click(timeout=4000)
                      page.wait_for_timeout(1200)

              if take_verify_snap:
                  visible_options = page.evaluate(r"""() => {
                      const els = Array.from(document.querySelectorAll('[role="menuitem"], [role="menuitemradio"], [role="option"], [role="radio"], [role="switch"], button, label'));
                      return els
                          .filter(el => el.offsetParent !== null)
                          .map(el => ({
                              tag: el.tagName,
                              role: el.getAttribute('role') || '',
                              aria: el.getAttribute('aria-label') || '',
                              checked: el.getAttribute('aria-checked') || el.getAttribute('aria-pressed') || '',
                              text: (el.innerText || '').trim().replace(/\s+/g, ' ')
                          }))
                          .filter(x => x.text.length > 0 && x.text.length < 120);
                  }""")
                  log(f"Visible UI options during settings config: {json.dumps(visible_options, ensure_ascii=False)}")
                  snap(page, "settings_dropdown_open", save_html=False)

              model_selected = False
              target_lower = target_model.lower()
              search_strategies = [
                  lambda t: target_lower in t,
                  lambda t: "claude" in t and "haiku" in t and "5.5" in t,
                  lambda t: "haiku" in t and "5.5" in t,
                  lambda t: "claude" in t and "haiku" in t,
                  lambda t: "haiku" in t,
              ]

              for strategy_idx, matcher in enumerate(search_strategies):
                  candidates = page.locator("[role='menuitem'], [role='menuitemradio'], [role='option'], [role='radio'], label, button")
                  for i in range(candidates.count()):
                      el = candidates.nth(i)
                      if not el.is_visible():
                          continue
                      txt = (el.inner_text() or "").strip()
                      if matcher(txt.lower()):
                          try:
                              el.click(timeout=4000)
                              log(f"Selected model option (strategy {strategy_idx+1}): '{txt}'")
                              model_selected = True
                              page.wait_for_timeout(1000)
                              break
                          except Exception as e:
                              log(f"Failed clicking model option '{txt}': {e}")
                  if model_selected:
                      break

              if not model_selected:
                  log(f"WARNING: Could not match model '{target_model}' automatically.")

              if enable_reasoning:
                  def try_enable_reasoning():
                      r_candidates = page.locator(
                          "button[aria-label*='Reasoning mode' i], button:has-text('Reasoning'), "
                          "button[aria-label*='reason' i], [role='switch']:has-text('Reason'), "
                          "[role='menuitemcheckbox']:has-text('Reason'), [role='menuitemradio']:has-text('Reason'), "
                          "[role='option']:has-text('Reason'), label:has-text('Reasoning')"
                      )
                      for i in range(r_candidates.count()):
                          el = r_candidates.nth(i)
                          if not el.is_visible():
                              continue
                          aria_checked = el.get_attribute("aria-checked")
                          aria_pressed = el.get_attribute("aria-pressed")
                          txt = (el.inner_text() or "").strip()
                          if aria_checked == "true" or aria_pressed == "true":
                              log(f"Reasoning mode already enabled on '{txt}'.")
                              return True
                          if "reasoning" in txt.lower() and "fast" not in txt.lower():
                              log(f"Reasoning mode already active ('{txt}').")
                              return True
                          try:
                              el.click(timeout=4000)
                              log(f"Clicked Reasoning mode control: '{txt}'")
                              page.wait_for_timeout(1000)
                              return True
                          except Exception:
                              pass
                      return False

                  reasoning_toggled = try_enable_reasoning()
                  if not reasoning_toggled:
                      gear = page.locator("button[aria-label*='setting' i], button:has-text('Settings'), button[title*='Setting' i]")
                      for i in range(gear.count()):
                          g = gear.nth(i)
                          if g.is_visible():
                              try:
                                  g.click(timeout=3000)
                                  page.wait_for_timeout(1000)
                                  if try_enable_reasoning():
                                      reasoning_toggled = True
                                      if take_verify_snap:
                                          snap(page, "settings_reasoning_panel", save_html=False)
                                  page.keyboard.press("Escape")
                                  page.wait_for_timeout(500)
                                  break
                              except Exception:
                                  pass
                  if not reasoning_toggled:
                      log("WARNING: Reasoning toggle not found on UI.")

              try:
                  page.keyboard.press("Escape")
              except Exception:
                  pass
              page.wait_for_timeout(1000)

              if take_verify_snap:
                  snap(page, "model_settings_verified", save_html=True)

          # ------------------ PLAYWRIGHT UTILITIES & SCROLLING ------------------
          def get_prompt_box(page):
              return page.locator(
                  "textarea[name='user-prompt'], textarea[placeholder*='ask' i], "
                  "textarea[placeholder*='message' i], textarea").first

          def click_ask_button(page):
              ask_btn = page.get_by_role("button", name=re.compile(r"^\s*(ask|send|submit)\s*$", re.I))
              if ask_btn.count() > 0 and ask_btn.first.is_visible() and ask_btn.first.is_enabled():
                  ask_btn.first.click(timeout=3000)
                  return True

              btn_text = page.locator("button:has-text('Ask')")
              for i in range(btn_text.count()):
                  b = btn_text.nth(i)
                  if b.is_visible() and b.is_enabled():
                      b.click(timeout=3000)
                      return True

              js_click = page.evaluate(r"""() => {
                  const buttons = Array.from(document.querySelectorAll('button'));
                  const ask = buttons.find(b => !b.disabled && (b.innerText || '').trim().toLowerCase() === 'ask');
                  if (ask) { ask.click(); return 'ask'; }
                  const send = buttons.find(b => !b.disabled && (
                      (b.getAttribute('aria-label') || '').toLowerCase().includes('send') ||
                      (b.getAttribute('aria-label') || '').toLowerCase().includes('submit') ||
                      (b.getAttribute('aria-label') || '').toLowerCase().includes('ask')
                  ));
                  if (send) { send.click(); return 'send'; }
                  const sub = buttons.find(b => b.type === 'submit' && !b.disabled);
                  if (sub) { sub.click(); return 'submit'; }
                  return null;
              }""")
              return bool(js_click)

          def submit_prompt(page, box, text, context):
              box.scroll_into_view_if_needed(timeout=5000)
              box.click()
              page.wait_for_timeout(200)
              box.fill("")
              page.wait_for_timeout(150)

              filled = False
              try:
                  box.fill(text, timeout=20000)
                  val_len = len(box.input_value())
                  if val_len >= int(len(text) * 0.95):
                      filled = True
                  else:
                      log(f"Warning: box.fill length {val_len} < expected {len(text)}; retrying via CDP insertText.")
              except Exception as e:
                  log(f"box.fill fallback triggered: {e}")
                  filled = False

              if not filled:
                  box.fill("")
                  box.click()
                  try:
                      cdp = context.new_cdp_session(page)
                      chunk_size = 2000
                      for idx in range(0, len(text), chunk_size):
                          cdp.send("Input.insertText", {"text": text[idx : idx + chunk_size]})
                      cdp.detach()
                  except Exception:
                      box.fill(text)

              page.wait_for_timeout(500)
              try:
                  page.evaluate("""(el) => {
                      el.dispatchEvent(new Event('input', { bubbles: true }));
                      el.dispatchEvent(new Event('change', { bubbles: true }));
                  }""", box.element_handle())
              except Exception:
                  pass

              page.wait_for_timeout(400)
              if not click_ask_button(page):
                  box.press("Enter")
              page.wait_for_timeout(600)

          def scroll_chat_to_bottom(page):
              try:
                  page.evaluate(r"""() => {
                      window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'instant' });
                      if (document.scrollingElement) {
                          document.scrollingElement.scrollTop = document.scrollingElement.scrollHeight;
                      }
                      const allEls = document.querySelectorAll('div, main, section, article');
                      for (const el of allEls) {
                          if (el.scrollHeight > el.clientHeight + 20) {
                              const style = window.getComputedStyle(el);
                              if (['auto', 'scroll', 'overlay'].includes(style.overflowY)) {
                                  el.scrollTop = el.scrollHeight;
                              }
                          }
                      }
                      const scrollBtns = Array.from(document.querySelectorAll('button')).filter(b => {
                          const aria = (b.getAttribute('aria-label') || '').toLowerCase();
                          const title = (b.getAttribute('title') || '').toLowerCase();
                          return (aria.includes('scroll') || aria.includes('bottom') || title.includes('bottom')) && b.offsetParent !== null;
                      });
                      if (scrollBtns.length > 0) {
                          try { scrollBtns[scrollBtns.length - 1].click(); } catch (_) {}
                      }
                      const mainEl = document.querySelector('main') || document.body;
                      const blocks = mainEl.querySelectorAll('pre, article, p, [data-testid]');
                      if (blocks.length > 0) {
                          try { blocks[blocks.length - 1].scrollIntoView({ behavior: 'instant', block: 'end' }); } catch (_) {}
                      }
                  }""")
              except Exception:
                  pass

          def reset_stream_tracking(page, current_chat_state):
              current_chat_state["raw_stream"].clear()
              current_chat_state["chat_done"] = False
              current_chat_state["rate_limited"] = False
              try:
                  page.evaluate("""() => {
                      window.__duckai_stream = {
                          active: false, done: false, status: 0, url: '', rawChunks: [], error: ''
                      };
                  }""")
              except Exception:
                  pass

          def get_inpage_stream_text(page):
              try:
                  st = page.evaluate("() => window.__duckai_stream || null")
                  if not st:
                      return None
                  raw = "".join(st.get("rawChunks") or [])
                  parsed = parse_sse_text(raw) if raw else ""
                  return {
                      "active": bool(st.get("active")),
                      "done": bool(st.get("done")),
                      "status": int(st.get("status") or 0),
                      "url": st.get("url") or "",
                      "raw_len": len(raw),
                      "parsed": parsed,
                      "raw": raw
                  }
              except Exception:
                  return None

          def send_and_confirm(page, box, prompt_text, context, current_chat_state, label, is_new_chat=True):
              url_before = page.url
              reset_stream_tracking(page, current_chat_state)
              submit_prompt(page, box, prompt_text, context)

              for wait_sec in range(15):
                  page.wait_for_timeout(1000)
                  inpage = get_inpage_stream_text(page)
                  box_cleared = False
                  try:
                      box_cleared = len(box.input_value().strip()) == 0
                  except Exception:
                      box_cleared = True

                  url_changed_to_chat = is_new_chat and ("chatID=" in page.url) and ("chatID=" not in url_before)

                  if (
                      url_changed_to_chat
                      or len(current_chat_state["raw_stream"]) > 0
                      or (inpage and (inpage["active"] or inpage["done"] or inpage["status"] > 0))
                      or box_cleared
                  ):
                      log(f"{label} acknowledged at +{wait_sec+1}s (box_cleared={box_cleared}, stream={bool(inpage and inpage['status'])}).")
                      return True

                  stop_btn = page.locator("button:has-text('Stop'), button[aria-label*='stop' i], button[title*='stop' i]")
                  if stop_btn.count() > 0 and stop_btn.first.is_visible():
                      log(f"{label} acknowledged via Stop button at +{wait_sec+1}s.")
                      return True

                  if wait_sec in (3, 7, 11):
                      click_ask_button(page)
                      box.press("Enter")

              return False

          def parse_sse_text(raw_sse: str) -> str:
              chunks = []
              for line in raw_sse.splitlines():
                  line = line.strip()
                  if not line.startswith("data:"):
                      continue
                  payload = line[5:].strip()
                  if not payload or payload == "[DONE]":
                      continue
                  try:
                      data = json.loads(payload)
                      if data.get("type") == "reasoning" or data.get("role") == "reasoning":
                          continue
                      chunk = (
                          data.get("message")
                          or data.get("delta")
                          or data.get("text")
                          or data.get("content")
                          or ""
                      )
                      if not chunk and isinstance(data.get("choices"), list) and data["choices"]:
                          c0 = data["choices"][0]
                          if isinstance(c0, dict):
                              chunk = (c0.get("delta") or {}).get("content") or (c0.get("message") or {}).get("content") or ""
                      if chunk:
                          chunks.append(chunk)
                  except Exception:
                      continue
              return "".join(chunks)

          def strip_thinking_blocks(text: str) -> str:
              if not text:
                  return text
              cleaned = re.sub(r"<think>[\s\S]*?</think>", "", text, flags=re.IGNORECASE)
              return cleaned.strip()

          def clean_handoff_text(text: str) -> str:
              cleaned = strip_thinking_blocks(text or "")
              for stop_marker in [
                  "\nCopy\n", "\nRegenerate\n", "\nAsk anything", "\nAI-generated",
                  "\nDuck.ai", "\nNew Chat"
              ]:
                  if stop_marker in cleaned:
                      cleaned = cleaned.split(stop_marker)[0]
              cleaned = re.sub(r"^(Thought for \d+s|Thinking\.\.\.)\s*", "", cleaned, flags=re.I)
              return cleaned.strip()

          def is_valid_recap_json(obj) -> bool:
              if not isinstance(obj, dict):
                  return False
              if obj.get("movie_title") == "Title" and obj.get("synopsis", "").startswith("Concise summary"):
                  return False
              beats = obj.get("beats")
              return isinstance(beats, list) and len(beats) > 0

          def try_json_loads_with_repair(raw_str: str):
              s = raw_str.strip()
              try:
                  return json.loads(s)
              except json.JSONDecodeError as first_err:
                  # 1. Remove trailing commas before } or ]
                  fixed = re.sub(r",(\s*[}\]])", r"\1", s)
                  try:
                      return json.loads(fixed)
                  except json.JSONDecodeError:
                      pass

                  # 2. If truncated mid-JSON inside "beats", salvage complete beat objects
                  if '"beats"' in fixed:
                      beats_pos = fixed.find('"beats"')
                      arr_start = fixed.find("[", beats_pos)
                      if arr_start != -1:
                          # Find the end of the last complete beat object inside beats array
                          depth = 0
                          in_str = False
                          esc = False
                          last_complete_beat_end = -1
                          for idx in range(arr_start + 1, len(fixed)):
                              c = fixed[idx]
                              if esc:
                                  esc = False
                                  continue
                              if c == "\\":
                                  esc = True
                                  continue
                              if c == '"':
                                  in_str = not in_str
                                  continue
                              if not in_str:
                                  if c == "{":
                                      depth += 1
                                  elif c == "}":
                                      depth -= 1
                                      if depth == 0:
                                          last_complete_beat_end = idx
                                  elif c == "]" and depth == 0:
                                      break
                          if last_complete_beat_end != -1:
                              repaired = fixed[: last_complete_beat_end + 1] + "]}"
                              try:
                                  obj = json.loads(repaired)
                                  if isinstance(obj.get("beats"), list) and len(obj["beats"]) > 0:
                                      log(f"JSON repaired by salvaging {len(obj['beats'])} complete beats (original err: {first_err}).")
                                      return obj
                              except Exception:
                                  pass
                  raise first_err

          def parse_first_balanced_json(text: str, require_beats: bool = False):
              if not text:
                  return None
              cleaned = strip_thinking_blocks(text)

              code_fences = re.findall(r"```(?:json)?\s*([\s\S]*?)\s*```", cleaned, re.IGNORECASE)
              for candidate in reversed(code_fences):
                  try:
                      parsed = deep_repair(try_json_loads_with_repair(candidate.strip()))
                      if not require_beats or is_valid_recap_json(parsed):
                          return parsed
                  except Exception:
                      pass

              try:
                  parsed = deep_repair(try_json_loads_with_repair(cleaned))
                  if not require_beats or is_valid_recap_json(parsed):
                      return parsed
              except Exception:
                  pass

              # Balanced extraction
              candidates = []
              i = 0
              n = len(cleaned)
              while i < n:
                  if cleaned[i] in ("{", "["):
                      open_char = cleaned[i]
                      close_char = "}" if open_char == "{" else "]"
                      depth = 0
                      in_string = False
                      escape = False
                      for idx in range(i, n):
                          c = cleaned[idx]
                          if escape:
                              escape = False
                              continue
                          if c == "\\":
                              escape = True
                              continue
                          if c == '"':
                              in_string = not in_string
                              continue
                          if not in_string:
                              if c == open_char:
                                  depth += 1
                              elif c == close_char:
                                  depth -= 1
                                  if depth == 0:
                                      snippet = cleaned[i : idx + 1]
                                      try:
                                          parsed = deep_repair(try_json_loads_with_repair(snippet))
                                          candidates.append(parsed)
                                      except Exception:
                                          pass
                                      i = idx
                                      break
                  i += 1

              for obj in reversed(candidates):
                  if not require_beats or is_valid_recap_json(obj):
                      return obj

              if candidates:
                  return candidates[-1]

              # Final fallback: repair from first '{' to end if truncated
              first_brace = cleaned.find("{")
              if first_brace != -1:
                  try:
                      parsed = deep_repair(try_json_loads_with_repair(cleaned[first_brace:]))
                      if not require_beats or is_valid_recap_json(parsed):
                          return parsed
                  except Exception as final_err:
                      log(f"JSON parse error details: {final_err}")

              return None

          # ------------------ MULTI-STRATEGY DOM EXTRACTOR ------------------
          EXTRACT_ASSISTANT_JS = r"""({ promptTail, expectJson }) => {
              const allEls = document.querySelectorAll('div, main, section, article');
              for (const el of allEls) {
                  if (el.scrollHeight > el.clientHeight + 20) {
                      const style = window.getComputedStyle(el);
                      if (['auto', 'scroll', 'overlay'].includes(style.overflowY)) {
                          el.scrollTop = el.scrollHeight;
                      }
                  }
              }
              window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'instant' });

              const stopButtons = Array.from(document.querySelectorAll('button')).filter(b => {
                  const txt = (b.innerText || '').toLowerCase();
                  const aria = (b.getAttribute('aria-label') || '').toLowerCase();
                  const title = (b.getAttribute('title') || '').toLowerCase();
                  const testid = (b.getAttribute('data-testid') || '').toLowerCase();
                  return (
                      txt.includes('stop') || aria.includes('stop') ||
                      title.includes('stop') || testid.includes('stop') ||
                      aria.includes('cancel')
                  ) && b.offsetParent !== null;
              });
              const streamActive = Boolean(window.__duckai_stream && window.__duckai_stream.active);
              const isGenerating = stopButtons.length > 0 || streamActive;

              const isPromptLeak = (t) => {
                  if (!t) return true;
                  return t.includes('PROMPT 1 — MOVIE / SERIES RECAP GENERATOR') ||
                         t.includes('PROMPT 2 — CONTINUITY HANDOFF') ||
                         t.includes('PROMPT 3 — CONTINUE MOVIE / SERIES RECAP') ||
                         t.includes('8. REQUIRED JSON OUTPUT') ||
                         t.includes('NEW TIMESTAMPED TRANSCRIPT:') ||
                         t.includes('PREVIEW TRANSCRIPT (NEXT ~100 LINES):');
              };

              const rootEl = document.querySelector('main') || document.body;
              const fullText = (rootEl.innerText || '').trim();

              if (!expectJson && promptTail && promptTail.length >= 12) {
                  const idx = fullText.lastIndexOf(promptTail);
                  if (idx !== -1) {
                      const after = fullText.slice(idx + promptTail.length).trim();
                      if (after.length > 30 && !isPromptLeak(after)) {
                          return { text: after, isGenerating, source: 'after_prompt_tail_handoff' };
                      }
                  }
              }

              if (expectJson) {
                  const codeBlocks = Array.from(document.querySelectorAll('pre code, pre'));
                  for (let i = codeBlocks.length - 1; i >= 0; i--) {
                      const block = codeBlocks[i];
                      const codeText = (block.innerText || '').trim();
                      if (!codeText || isPromptLeak(codeText)) continue;
                      if (codeText.includes('{') && (codeText.includes('beats') || codeText.includes('status') || codeText.includes('narration'))) {
                          return { text: codeText, isGenerating, source: 'code_block' };
                      }
                  }
              }

              const assistantSelectors = [
                  '[data-author="assistant"]',
                  '[data-testid*="assistant" i]',
                  '[data-testid*="response" i]',
                  '[class*="assistant" i]',
                  'article',
                  '[class*="message" i]',
                  '[data-testid*="message" i]'
              ];
              const seen = new Set();
              const candidates = [];
              for (const sel of assistantSelectors) {
                  for (const node of document.querySelectorAll(sel)) {
                      if (seen.has(node)) continue;
                      seen.add(node);
                      const t = (node.innerText || '').trim();
                      if (!t || t.length < 20) continue;
                      if (isPromptLeak(t)) continue;
                      if (node.getAttribute('data-author') === 'user') continue;
                      if (t.includes('How can I help you today?')) continue;
                      if (!expectJson && t.includes('"beats"') && t.includes('"clips"')) continue;
                      candidates.push(t);
                  }
              }
              if (candidates.length > 0) {
                  return { text: candidates[candidates.length - 1], isGenerating, source: 'assistant_node' };
              }

              if (expectJson) {
                  const copyBtns = Array.from(document.querySelectorAll('button')).filter(b => {
                      const txt = (b.innerText || '').toLowerCase();
                      const aria = (b.getAttribute('aria-label') || '').toLowerCase();
                      const title = (b.getAttribute('title') || '').toLowerCase();
                      return (txt === 'copy' || aria.includes('copy') || title.includes('copy')) && b.offsetParent !== null;
                  });
                  if (copyBtns.length > 0) {
                      const lastCopy = copyBtns[copyBtns.length - 1];
                      let parent = lastCopy.parentElement;
                      for (let depth = 0; depth < 6 && parent; depth++) {
                          const pt = (parent.innerText || '').trim();
                          if (pt.length > 25 && !isPromptLeak(pt) && pt.includes('{')) {
                              return { text: pt, isGenerating, source: 'copy_ancestor' };
                          }
                          parent = parent.parentElement;
                      }
                  }
              }

              if (promptTail && promptTail.length >= 12) {
                  const idx = fullText.lastIndexOf(promptTail);
                  if (idx !== -1) {
                      const after = fullText.slice(idx + promptTail.length).trim();
                      if (after.length > 20) {
                          return { text: after, isGenerating, source: 'after_prompt_tail' };
                      }
                  }
              }

              return { text: '', isGenerating, source: 'none' };
          }"""

          def wait_for_response(page, current_chat_state, prompt_text="", max_wait=TEXT_WAIT, expect_json=True, expect_beats=True):
              log(f"Waiting for Duck.ai response (max {max_wait}s | expect_json={expect_json})...")
              prompt_tail = prompt_text[-60:].strip() if prompt_text else ""
              start = time.time()
              last_text = ""
              stable_ticks = 0
              has_started_generating = False
              last_progress_log = 0.0

              while time.time() - start < max_wait:
                  elapsed = time.time() - start

                  if current_chat_state.get("rate_limited"):
                      raise RuntimeError("Duck.ai returned HTTP 418/429 (Tor IP rate-limited).")

                  # 1. Check in-page fetch stream interceptor
                  inpage = get_inpage_stream_text(page)
                  if inpage:
                      if inpage["status"] in (418, 429):
                          raise RuntimeError(f"Duck.ai fetch returned HTTP {inpage['status']} (Tor IP rate-limited).")
                      if inpage["active"] or inpage["raw_len"] > 0:
                          has_started_generating = True
                      if inpage["done"] and inpage["parsed"].strip():
                          parsed_sse = inpage["parsed"]
                          if expect_json:
                              if "{" in parsed_sse and (not expect_beats or '"beats"' in parsed_sse):
                                  log(f"Captured JSON via in-page fetch SSE ({len(parsed_sse)} chars).")
                                  return deep_repair(parsed_sse)
                          else:
                              if len(parsed_sse.strip()) > 80:
                                  log(f"Captured Handoff via in-page fetch SSE ({len(parsed_sse)} chars).")
                                  return deep_repair(clean_handoff_text(parsed_sse))

                  # 2. Check Playwright requestfinished network stream
                  if current_chat_state.get("chat_done") and current_chat_state.get("raw_stream"):
                      parsed_sse = parse_sse_text("".join(current_chat_state["raw_stream"]))
                      if parsed_sse.strip():
                          if expect_json:
                              if "{" in parsed_sse and (not expect_beats or '"beats"' in parsed_sse):
                                  log(f"Captured JSON via Playwright network SSE ({len(parsed_sse)} chars).")
                                  return deep_repair(parsed_sse)
                          else:
                              if len(parsed_sse.strip()) > 80:
                                  log(f"Captured Handoff via Playwright network SSE ({len(parsed_sse)} chars).")
                                  return deep_repair(clean_handoff_text(parsed_sse))

                  # 3. Scroll and extract via DOM
                  scroll_chat_to_bottom(page)
                  dom_source = "none"
                  dom_len = 0
                  is_generating = False
                  try:
                      dom_data = page.evaluate(EXTRACT_ASSISTANT_JS, {"promptTail": prompt_tail, "expectJson": expect_json})
                      cur_text = (dom_data.get("text") or "").strip()
                      if not expect_json:
                          cur_text = clean_handoff_text(cur_text)
                      is_generating = bool(dom_data.get("isGenerating", False))
                      dom_source = dom_data.get("source", "none")
                      dom_len = len(cur_text)

                      if any(m in cur_text for m in [
                          "PROMPT 1 — MOVIE / SERIES RECAP GENERATOR",
                          "PROMPT 2 — CONTINUITY HANDOFF",
                          "PROMPT 3 — CONTINUE MOVIE / SERIES RECAP",
                          "8. REQUIRED JSON OUTPUT"
                      ]):
                          cur_text = ""
                          dom_len = 0

                      if is_generating or dom_len > 25:
                          has_started_generating = True

                      min_len = 25 if expect_json else 80
                      if cur_text:
                          if cur_text == last_text and not is_generating:
                              stable_ticks += 1
                          else:
                              stable_ticks = 0
                          last_text = cur_text

                          if has_started_generating and not is_generating and stable_ticks >= 4 and len(last_text) > min_len:
                              log(f"Captured complete response via DOM stability ({dom_source}, {len(last_text)} chars).")
                              return deep_repair(last_text)
                  except Exception as e:
                      log(f"DOM poll notice: {e}")

                  if elapsed - last_progress_log >= 15.0:
                      last_progress_log = elapsed
                      stream_info = f"raw={inpage['raw_len']} done={inpage['done']} status={inpage['status']}" if inpage else "no_hook"
                      log(f"[WAIT {int(elapsed)}s/{max_wait}s] stream=({stream_info}) | dom=({dom_source}, {dom_len} chars, gen={is_generating}, stable={stable_ticks})")

                  page.wait_for_timeout(2000)

              inpage = get_inpage_stream_text(page)
              if inpage and inpage["parsed"].strip():
                  txt = inpage["parsed"]
                  return deep_repair(txt if expect_json else clean_handoff_text(txt))
              if current_chat_state.get("raw_stream"):
                  parsed_sse = parse_sse_text("".join(current_chat_state["raw_stream"]))
                  if parsed_sse.strip():
                      return deep_repair(parsed_sse if expect_json else clean_handoff_text(parsed_sse))
              if last_text and len(last_text) > 25:
                  return deep_repair(last_text)

              raise RuntimeError(f"Response timed out after {max_wait}s.")

          # ------------------ PROMPTS 1, 2, AND 3 ------------------
          PROMPT_1_TEMPLATE = textwrap.dedent("""\
          # PROMPT 1 — MOVIE / SERIES RECAP GENERATOR

          ## ROLE
          Act as a professional YouTube movie/series recap writer and video editing planner. Convert the supplied timestamped transcript into a short, simple, fast-paced Hindi voice-over recap in clear third-person storytelling style, paired with carefully selected original-footage clips.

