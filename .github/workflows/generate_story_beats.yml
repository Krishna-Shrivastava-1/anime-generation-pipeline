name: Generate Hindi YouTube Movie Recap Engine

on:
  workflow_dispatch:
    inputs:
      reset_state:
        description: "Clear previous state and generate fresh"
        required: true
        type: boolean
        default: true
      headed:
        description: "Run non-headless Chrome under Xvfb (avoids bot detection)"
        required: true
        type: boolean
        default: true
      mode:
        description: "Execution mode (probe | full)"
        required: true
        type: choice
        options:
          - "probe"
          - "full"
        default: "full"
      target_minutes:
        description: "Target video duration in minutes (e.g. 12)"
        required: true
        default: "12"
      max_clip_sec:
        description: "Max duration per video cut (Fair Use safe <= 3.0s)"
        required: true
        default: "3.0"
      hints:
        description: "Character names, tone (thriller/mystery), or specific plot notes"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate-recap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      LANG: "C.UTF-8"
      LC_ALL: "C.UTF-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tor and System Utilities
        timeout-minutes: 4
        run: |
          sudo apt-get update
          sudo apt-get install -y tor netcat-openbsd xvfb
          sudo service tor start
          for i in {1..30}; do
            if nc -z 127.0.0.1 9050; then echo "Tor is ready"; break; fi
            sleep 2
          done
          nc -z 127.0.0.1 9050

      - name: Install Python Dependencies
        timeout-minutes: 6
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi playwright pillow requests ftfy
          playwright install --with-deps chromium

      - name: Verify Anonymous Tor Exit
        timeout-minutes: 3
        run: |
          python - <<'PY'
          from curl_cffi import requests
          p = "socks5h://127.0.0.1:9050"
          r = requests.get("https://check.torproject.org/api/ip", proxies={"http": p, "https": p}, impersonate="chrome", timeout=60)
          r.raise_for_status()
          data = r.json()
          print("Connection Info:", data)
          if not data.get("IsTor"):
              raise RuntimeError("Tor connection failed. Traffic is not anonymous.")
          PY

      - name: Run YouTube Recap Generation Engine
        timeout-minutes: 110
        env:
          HEADED: ${{ inputs.headed }}
          RUN_MODE: ${{ inputs.mode }}
          RESET_STATE: ${{ inputs.reset_state }}
          TARGET_MINUTES: ${{ inputs.target_minutes }}
          MAX_CLIP_SEC: ${{ inputs.max_clip_sec }}
          INPUT_HINTS: ${{ inputs.hints }}
          TEXT_WAIT_SECONDS: "200"
        run: |
          mkdir -p debug build
          cat > recap_engine.py <<'PY'
          import os, re, sys, json, base64, subprocess, time, math
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import ftfy

          if sys.platform != "win32":
              sys.stdout.reconfigure(encoding="utf-8")
              sys.stderr.reconfigure(encoding="utf-8")

          HEADED = os.environ.get("HEADED") == "true"
          RUN_MODE = os.environ.get("RUN_MODE", "full").strip().lower()
          RESET_STATE = os.environ.get("RESET_STATE", "false").strip().lower() == "true"
          TARGET_MINUTES = float(os.environ.get("TARGET_MINUTES", "12"))
          MAX_CLIP_DURATION = float(os.environ.get("MAX_CLIP_SEC", "3.0"))
          INPUT_HINTS = os.environ.get("INPUT_HINTS", "").strip()
          TEXT_WAIT = int(os.environ.get("TEXT_WAIT_SECONDS", "200"))
          MAX_ATTEMPTS = 3

          DEBUG_DIR = Path("debug"); DEBUG_DIR.mkdir(parents=True, exist_ok=True)
          STATE_FILE = Path("build/pipeline_state.json")
          STATE_FILE.parent.mkdir(parents=True, exist_ok=True)
          RUN_LOG = DEBUG_DIR / "engine.log"

          BROWSER_PROXY = "socks5://127.0.0.1:9050"

          if RESET_STATE and STATE_FILE.exists():
              STATE_FILE.unlink()
              print("[INIT] Old pipeline state cleared for fresh story generation.", flush=True)

          def log(msg):
              line = f"[{time.strftime('%H:%M:%S')}] {msg}"
              print(line, flush=True)
              with open(RUN_LOG, "a", encoding="utf-8") as f:
                  f.write(line + "\n")

          # ------------------ ENCODING & MOJIBAKE DEFENSE ------------------
          CP1252_MAP = {
              '\u20ac': 0x80, '\u201a': 0x82, '\u0192': 0x83, '\u201e': 0x84, '\u2026': 0x85,
              '\u2020': 0x86, '\u2021': 0x87, '\u02c6': 0x88, '\u2030': 0x89, '\u0160': 0x8a,
              '\u2039': 0x8b, '\u0152': 0x8c, '\u017d': 0x8e, '\u2018': 0x91, '\u2019': 0x92,
              '\u201c': 0x93, '\u201d': 0x94, '\u2022': 0x95, '\u2013': 0x96, '\u2014': 0x97,
              '\u02dc': 0x98, '\u2122': 0x99, '\u0161': 0x9a, '\u203a': 0x9b, '\u0153': 0x9c,
              '\u017e': 0x9e, '\u0178': 0x9f,
          }

          def fix_hindi_text(s: str) -> str:
              if not isinstance(s, str) or not s:
                  return s
              try:
                  s = ftfy.fix_text(s)
              except Exception:
                  pass
              if any(m in s for m in ["à¤", "à¥", "â€™", "â€”", "Ã", "Â"]):
                  try:
                      return s.encode("cp1252").decode("utf-8")
                  except Exception:
                      try:
                          raw_bytes = bytearray()
                          for ch in s:
                              if ch in CP1252_MAP:
                                  raw_bytes.append(CP1252_MAP[ch])
                              elif ord(ch) < 256:
                                  raw_bytes.append(ord(ch))
                              else:
                                  raw_bytes.extend(ch.encode("utf-8"))
                          return raw_bytes.decode("utf-8", errors="replace")
                      except Exception:
                          pass
              return s

          def deep_repair(val):
              if isinstance(val, str):
                  return fix_hindi_text(val)
              elif isinstance(val, list):
                  return [deep_repair(item) for item in val]
              elif isinstance(val, dict):
                  return {k: deep_repair(v) for k, v in val.items()}
              return val

          def snap(page, name):
              try:
                  page.screenshot(path=str(DEBUG_DIR / f"{name}.png"), full_page=True, timeout=15000)
                  (DEBUG_DIR / f"{name}.html").write_text(page.content(), encoding="utf-8")
                  log(f"Snapshot taken: {name}")
              except Exception as e:
                  log(f"Snapshot failed: {e}")

          def renew_tor():
              log("Refreshing Tor IP circuit...")
              subprocess.run(["sudo", "service", "tor", "restart"], check=False)
              for _ in range(30):
                  if subprocess.run(["nc", "-z", "127.0.0.1", "9050"]).returncode == 0:
                      break
                  time.sleep(2)
              time.sleep(3)

          # ------------------ PLAYWRIGHT UTILITIES ------------------
          def get_prompt_box(page):
              return page.locator(
                  "textarea[name='user-prompt'], textarea[placeholder*='ask' i], "
                  "textarea[placeholder*='message' i], textarea").first

          def click_ask_button(page):
              ask_btn = page.get_by_role("button", name=re.compile(r"^\s*ask\s*$", re.I))
              if ask_btn.count() > 0 and ask_btn.first.is_visible():
                  ask_btn.first.click(timeout=3000)
                  return True

              btn_text = page.locator("button:has-text('Ask')")
              for i in range(btn_text.count()):
                  b = btn_text.nth(i)
                  if b.is_visible() and b.is_enabled():
                      b.click(timeout=3000)
                      return True

              js_click = page.evaluate("""() => {
                  const buttons = Array.from(document.querySelectorAll('button'));
                  const ask = buttons.find(b => !b.disabled && (b.innerText || '').trim().toLowerCase() === 'ask');
                  if (ask) { ask.click(); return 'ask'; }
                  const send = buttons.find(b => !b.disabled && (b.getAttribute('aria-label') || '').toLowerCase().includes('send'));
                  if (send) { send.click(); return 'send'; }
                  const sub = buttons.find(b => b.type === 'submit' && !b.disabled);
                  if (sub) { sub.click(); return 'submit'; }
                  return null;
              }""")
              return bool(js_click)

          def submit_prompt(page, box, text, context):
              box.click()
              page.wait_for_timeout(200)
              box.fill("")
              page.wait_for_timeout(100)

              try:
                  cdp = context.new_cdp_session(page)
                  cdp.send("Input.insertText", {"text": text})
                  cdp.detach()
              except Exception:
                  box.fill(text)

              page.wait_for_timeout(500)
              try:
                  page.evaluate("""(el) => {
                      el.dispatchEvent(new Event('input', { bubbles: true }));
                      el.dispatchEvent(new Event('change', { bubbles: true }));
                  }""", box.element_handle())
              except Exception:
                  pass

              page.wait_for_timeout(300)
              if not click_ask_button(page):
                  box.press("Enter")
              page.wait_for_timeout(600)

          def parse_sse_text(raw_sse: str) -> str:
              chunks = []
              for line in raw_sse.splitlines():
                  line = line.strip()
                  if not line.startswith("data:"):
                      continue
                  payload = line[5:].strip()
                  if not payload or payload == "[DONE]":
                      continue
                  try:
                      data = json.loads(payload)
                      chunk = data.get("message", "")
                      if chunk:
                          chunks.append(chunk)
                  except Exception:
                      continue
              return "".join(chunks)

          def parse_first_balanced_json(text: str):
              if not text:
                  return None
              cleaned = text.strip()

              # Priority 1: Match ```json ... ``` blocks
              code_fence_match = re.search(r"```(?:json)?\s*([\s\S]*?)\s*```", cleaned, re.IGNORECASE)
              if code_fence_match:
                  candidate = code_fence_match.group(1).strip()
                  try:
                      return deep_repair(json.loads(candidate))
                  except Exception:
                      pass

              # Priority 2: Direct full parse
              try:
                  return deep_repair(json.loads(cleaned))
              except Exception:
                  pass

              # Priority 3: Balanced bracket scanner
              start_idx = -1
              for i, ch in enumerate(cleaned):
                  if ch in ("{", "["):
                      start_idx = i
                      break
              if start_idx == -1:
                  return None

              open_char = cleaned[start_idx]
              close_char = "}" if open_char == "{" else "]"
              depth = 0
              in_string = False
              escape = False

              for idx in range(start_idx, len(cleaned)):
                  c = cleaned[idx]
                  if escape:
                      escape = False
                      continue
                  if c == "\\":
                      escape = True
                      continue
                  if c == '"':
                      in_string = not in_string
                      continue
                  if not in_string:
                      if c == open_char:
                          depth += 1
                      elif c == close_char:
                          depth -= 1
                          if depth == 0:
                              try:
                                  return deep_repair(json.loads(cleaned[start_idx : idx + 1]))
                              except Exception:
                                  break
              return None

          # ------------------ FAILSAFE ASSISTANT EXTRACTOR ------------------
          EXTRACT_ASSISTANT_JS = """() => {
              // Scroll body and chat containers to the bottom
              window.scrollTo({ top: document.body.scrollHeight, behavior: 'auto' });
              const scrollable = document.querySelectorAll('main, [class*="chat"], [class*="conversation"], [class*="scroll"], [data-testid*="scroll"]');
              scrollable.forEach(el => { el.scrollTop = el.scrollHeight; });

              // Check if Duck.ai is actively generating (Stop button check)
              const stopButtons = Array.from(document.querySelectorAll('button')).filter(b => {
                  const txt = (b.innerText || '').toLowerCase();
                  const aria = (b.getAttribute('aria-label') || '').toLowerCase();
                  return (txt.includes('stop') || aria.includes('stop')) && b.offsetParent !== null;
              });
              const isGenerating = stopButtons.length > 0;

              // Priority 1: Check code blocks (Assistant returns ```json ... ```)
              const codeBlocks = Array.from(document.querySelectorAll('pre code, pre'));
              for (let i = codeBlocks.length - 1; i >= 0; i--) {
                  const block = codeBlocks[i];
                  const codeText = (block.innerText || '').trim();
                  if (!codeText) continue;

                  // Skip if inside user message
                  const userParent = block.closest('[class*="user"], [data-user="true"]');
                  if (userParent) continue;
                  if (codeText.includes("You are the head scriptwriter") || codeText.includes("You said")) continue;

                  if (codeText.includes('{') && (codeText.includes('beats') || codeText.includes('synopsis') || codeText.includes('summary'))) {
                      return { text: codeText, isGenerating: isGenerating, source: 'code_block' };
                  }
              }

              // Priority 2: Filter for assistant message nodes (exclude anything from user)
              const messageNodes = Array.from(document.querySelectorAll('article, [class*="message"], [data-testid*="message"], [class*="chat-message"]'));
              const assistantNodes = messageNodes.filter(node => {
                  const t = node.innerText || '';
                  if (t.includes('You said')) return false;
                  if (t.includes('You are the head scriptwriter')) return false;
                  if (node.getAttribute('data-author') === 'user') return false;
                  if (node.querySelector('[aria-label*="user" i], [class*="user" i]')) return false;
                  return true;
              });

              if (assistantNodes.length > 0) {
                  const lastAssistant = assistantNodes[assistantNodes.length - 1];
                  const text = (lastAssistant.innerText || '').trim();
                  if (text.length > 25 && !text.includes('How can I help you today?')) {
                      return { text: text, isGenerating: isGenerating, source: 'assistant_message' };
                  }
              }

              return { text: '', isGenerating: isGenerating, source: 'none' };
          }"""

          def wait_for_response(page, current_chat_state, max_wait=TEXT_WAIT):
              log(f"Waiting for Duck.ai response (max {max_wait}s)...")
              start = time.time()
              last_text = ""
              stable_ticks = 0
              has_started_generating = False

              while time.time() - start < max_wait:
                  if current_chat_state.get("rate_limited"):
                      raise RuntimeError("Duck.ai returned HTTP 418 (Tor IP rate-limited).")

                  # Check SSE network stream if completed
                  if current_chat_state.get("chat_done") and current_chat_state.get("raw_stream"):
                      parsed_sse = parse_sse_text("".join(current_chat_state["raw_stream"]))
                      if parsed_sse.strip() and "{" in parsed_sse and "beats" in parsed_sse:
                          log(f"Captured response via completed SSE stream ({len(parsed_sse)} chars).")
                          return deep_repair(parsed_sse)

                  # Query DOM
                  try:
                      dom_data = page.evaluate(EXTRACT_ASSISTANT_JS)
                      cur_text = dom_data.get("text", "").strip()
                      is_generating = dom_data.get("isGenerating", False)
                      source = dom_data.get("source", "none")

                      # Guardrail: NEVER accept user prompt as response
                      if "You said" in cur_text or cur_text.startswith("You are the head scriptwriter"):
                          cur_text = ""

                      if is_generating or len(cur_text) > 40:
                          has_started_generating = True

                      if cur_text:
                          if cur_text == last_text and not is_generating:
                              stable_ticks += 1
                          else:
                              stable_ticks = 0
                          last_text = cur_text

                          # Must have started, stop button must be gone, and text unchanged for 4 checks (8s)
                          if has_started_generating and not is_generating and stable_ticks >= 4 and len(last_text) > 50:
                              log(f"Captured complete response via DOM stability ({source}, {len(last_text)} chars).")
                              return deep_repair(last_text)
                  except Exception as e:
                      log(f"DOM poll notice: {e}")

                  page.wait_for_timeout(2000)

              # Fallback to network stream if DOM was delayed
              if current_chat_state.get("raw_stream"):
                  parsed_sse = parse_sse_text("".join(current_chat_state["raw_stream"]))
                  if parsed_sse.strip() and "beats" in parsed_sse:
                      return deep_repair(parsed_sse)

              if last_text and len(last_text) > 50:
                  return deep_repair(last_text)

              raise RuntimeError(f"Response timed out after {max_wait}s.")

          # ------------------ TIMELINE CHUNKER & TRANSCRIPT LOADER ------------------
          def load_transcript_and_chunk(transcript_path="transcript.json", max_chars=2400):
              if not Path(transcript_path).exists():
                  log(f"Warning: '{transcript_path}' not found. Generating mock transcript.")
                  mock = {
                      "movie_title": "Mystery Recap Movie",
                      "segments": [
                          {"id": 1, "start": 5.0, "end": 12.0, "text": "Detective Chloe: Look at these marks on the floor. Someone dragged the body."},
                          {"id": 2, "start": 13.5, "end": 20.0, "text": "Officer Dan: It's just a normal drug case. Let's close it."},
                          {"id": 3, "start": 21.0, "end": 29.0, "text": "Detective Chloe: No, this is deliberate murder. Who owns this luxury club down the street?"},
                          {"id": 4, "start": 45.0, "end": 52.0, "text": "Bartender: Lucifer is upstairs in his private penthouse."},
                          {"id": 5, "start": 53.0, "end": 60.0, "text": "Lucifer: Welcome detective, can I pour you a drink?"}
                      ]
                  }
                  Path(transcript_path).write_text(json.dumps(mock, indent=2, ensure_ascii=False), encoding="utf-8")

              with open(transcript_path, "r", encoding="utf-8") as f:
                  data = json.load(f)

              movie_title = data.get("movie_title", "Untitled Recap")
              segments = data.get("segments", [])

              lines = []
              for s in segments:
                  s_id = f"S{int(s['id']):04d}"
                  st = float(s["start"])
                  en = float(s["end"])
                  txt = str(s.get("text", "")).strip()
                  lines.append(f"[{s_id} | {st:.2f}s - {en:.2f}s] {txt}")

              chunks = []
              cur = []
              cur_len = 0
              for line in lines:
                  line_len = len(line) + 1
                  if cur_len + line_len > max_chars and cur:
                      chunks.append(list(cur))
                      overlap = cur[-2:] if len(cur) >= 2 else cur
                      cur = list(overlap)
                      cur_len = sum(len(l) + 1 for l in cur)
                  cur.append(line)
                  cur_len += line_len
              if cur:
                  chunks.append(cur)

              return movie_title, chunks

          # ------------------ SCRIPT CLAMPING & NORMALIZATION ------------------
          def sanitize_and_clamp_beats(raw_beats, max_duration=MAX_CLIP_DURATION):
              cleaned = []
              for b in raw_beats:
                  narr = deep_repair(b.get("narration", "")).strip()
                  narr = re.sub(r"\b[A-Za-z]\b", "", narr).strip()
                  if not narr:
                      continue

                  st = round(float(b.get("start_sec") or b.get("target_window", {}).get("start", 0.0)), 2)
                  en = round(float(b.get("end_sec") or b.get("target_window", {}).get("end", st + 2.8)), 2)

                  if en <= st:
                      en = round(st + 2.8, 2)

                  dur = round(en - st, 2)
                  if dur > max_duration:
                      en = round(st + max_duration, 2)
                      dur = max_duration

                  scene_bridge = bool(b.get("is_scene_bridge", False))
                  reason_we_are_here = deep_repair(b.get("location_or_bridge_reason", "")).strip()

                  words = narr.split()
                  cleaned.append({
                      "narration": narr,
                      "start_sec": st,
                      "end_sec": en,
                      "duration": dur,
                      "word_count": len(words),
                      "is_scene_bridge": scene_bridge,
                      "scene_context": reason_we_are_here
                  })
              return cleaned

          # ------------------ PLAYWRIGHT SETUP ------------------
          browser = None
          context = None
          page = None
          current_chat_state = {"raw_stream": [], "chat_done": False, "rate_limited": False}

          def launch_browser(pw):
              global browser, context, page, current_chat_state
              if browser:
                  try: browser.close()
                  except Exception: pass
              browser = pw.chromium.launch(
                  headless=not HEADED,
                  proxy={"server": BROWSER_PROXY},
                  args=["--disable-dev-shm-usage", "--disable-blink-features=AutomationControlled"]
              )
              context = browser.new_context(
                  viewport={"width": 1440, "height": 1000},
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36",
                  permissions=["clipboard-read", "clipboard-write"]
              )
              context.add_init_script("Object.defineProperty(navigator,'webdriver',{get:()=>undefined})")
              page = context.new_page()

              def on_res(resp):
                  if "/duckchat/v1/chat" in resp.url and resp.request.method == "POST":
                      if resp.status == 418:
                          current_chat_state["rate_limited"] = True
                      try:
                          current_chat_state["raw_stream"].append(resp.body().decode("utf-8", errors="replace"))
                      except Exception:
                          pass
              page.on("response", on_res)

              def on_done(req):
                  if "/duckchat/v1/chat" in req.url and req.method == "POST":
                      current_chat_state["chat_done"] = True
              page.on("requestfinished", on_done)

          with sync_playwright() as p:
              launch_browser(p)

              # ==============================================================
              # MODE: PROBE
              # ==============================================================
              if RUN_MODE == "probe":
                  log("Starting probe test on Duck.ai...")
                  page.goto("https://duck.ai/chat", wait_until="domcontentloaded", timeout=75000)
                  page.wait_for_timeout(3000)

                  box = get_prompt_box(page)
                  box.wait_for(state="visible", timeout=40000)

                  probe_prompt = 'Output valid JSON only: {"status": "ready", "hindi": "कहानी शुरू"}'
                  current_chat_state["raw_stream"].clear()
                  current_chat_state["chat_done"] = False
                  current_chat_state["rate_limited"] = False

                  submit_prompt(page, box, probe_prompt, context)
                  out = wait_for_response(page, current_chat_state, max_wait=45)
                  parsed = parse_first_balanced_json(out)
                  log(f"Probe Result: {parsed}")

                  if parsed and parsed.get("status") == "ready":
                      log("Probe PASSED successfully.")
                      sys.exit(0)
                  else:
                      log("Probe FAILED.")
                      sys.exit(1)

              # ==============================================================
              # MODE: FULL RECAP ENGINE
              # ==============================================================
              log("Starting Full Story Explanation Engine...")
              movie_title, chunks = load_transcript_and_chunk("transcript.json", max_chars=2400)
              log(f"Target: '{movie_title}' | {len(chunks)} chunks.")

              pipeline_state = {
                  "completed_chunks": [],
                  "beats": [],
                  "characters": {},
                  "last_scene_location": "शुरुआती दृश्य",
                  "running_synopsis": "फिल्म की शुरुआत।"
              }
              if STATE_FILE.exists():
                  try:
                      with open(STATE_FILE, "r", encoding="utf-8") as sf:
                          loaded = json.load(sf)
                          if isinstance(loaded, dict):
                              pipeline_state = deep_repair(loaded)
                  except Exception:
                      pass

              all_beats = pipeline_state.get("beats", [])
              running_synopsis = pipeline_state.get("running_synopsis", "फिल्म की शुरुआत।")
              last_location = pipeline_state.get("last_scene_location", "शुरुआती दृश्य")
              beat_counter = len(all_beats) + 1

              hints_block = f"\nUSER PROVIDED CHARACTER & STORY HINTS:\n{INPUT_HINTS}\n" if INPUT_HINTS else ""

              for c_idx, chunk_lines in enumerate(chunks):
                  chunk_id = f"chunk_{c_idx+1}"
                  if chunk_id in pipeline_state.get("completed_chunks", []):
                      log(f"Skipping {chunk_id} (already completed).")
                      continue

                  log(f"\n==================== GENERATING: {chunk_id} ({c_idx+1}/{len(chunks)}) ====================")
                  chunk_success = False

                  for attempt in range(1, MAX_ATTEMPTS + 1):
                      current_chat_state["raw_stream"].clear()
                      current_chat_state["chat_done"] = False
                      current_chat_state["rate_limited"] = False

                      try:
                          is_in_chat = bool(page and "chatID=" in page.url)
                          chunk_text = "\n".join(chunk_lines)

                          # --------------------------------------------------
                          # PASS 1: OMNISCIENT THIRD-PERSON STORY SYNTHESIS
                          # --------------------------------------------------
                          pass1_prompt = (
                              f"You are the head scriptwriter for a top-tier YouTube Movie Explanation channel (like 'Movie Recaps' / 'Mystery Recapped').\n"
                              f"Movie Title: {movie_title}\n"
                              f"{hints_block}\n"
                              f"STORY CONTEXT UP TO THIS POINT:\n{running_synopsis}\n"
                              f"LAST ESTABLISHED LOCATION: {last_location}\n\n"
                              f"RAW TRANSCRIPT & SCENE TIMECODES:\n{chunk_text}\n\n"
                              "STRICT YOUTUBE RECAP WRITING RULES:\n"
                              "1. THIRD-PERSON OMNISCIENT VOICE ONLY: NEVER do dialogue-following (BANNED: 'वह उससे कहता है', 'उसने पूछा', 'वो बोली', 'वह जवाब देता है'). Instead, directly explain WHAT is happening, WHY it matters, and character motives (e.g. 'डिटेक्टिव को लाश के पास एक संदिग्ध लॉकेट मिलता है, जिससे केस नया मोड़ लेता है।').\n"
                              "2. ZERO SCENE-CUT JUMPS (EXPLAIN WHY WE ARE HERE): In movie recaps, jump cuts ruin the flow. Whenever the scene cuts to a new room, street, or building, the VERY FIRST beat of the new scene MUST explicitly tell the viewer why we moved here (e.g., 'सबूतों की तलाश में अब मैरी सीधे उस पुराने वेयरहाउस पहुंचती है...', 'इस खुलासे के बाद कहानी सीधे थाने में शिफ्ट होती है...').\n"
                              "3. COMPLETE INDEPENDENT SENTENCES: Every single beat MUST be a complete, self-contained Hindi sentence of 6 to 9 words in Devanagari script. Never split one sentence across multiple beats.\n"
                              "4. FAIR-USE TIMING: Each beat duration (end_sec - start_sec) MUST be strictly <= 3.0 seconds.\n"
                              "5. VOCABULARY: Use punchy conversational Hindi (बोलचाल की हिंदी) with natural loanwords (केस, क्राइम सीन, मर्डर, सबूत, शक, इन्वेस्टिगेशन, गवाह, प्लान). Avoid stiff textbook words like 'वरिष्ठ अधिकारी' or 'नशीला पदार्थ'.\n\n"
                              "OUTPUT STRICT JSON ONLY:\n"
                              "{\n"
                              '  "current_location": "वर्तमान दृश्य का स्थान (e.g. लक्स क्लब का पेंटहाउस)",\n'
                              '  "synopsis": "इस सीन में क्या घटा उसका 2 लाइन का स्पष्ट सारांश",\n'
                              '  "characters": [{"name": "Name", "hindi_name": "नाम", "role": "भूमिका"}],\n'
                              '  "beats": [\n'
                              '    {\n'
                              '      "narration": "डिटेक्टिव क्लो क्राइम सीन पर पहुंचकर बिखरे हुए सबूतों की जांच करती है।",\n'
                              '      "start_sec": 5.00,\n'
                              '      "end_sec": 7.80,\n'
                              '      "is_scene_bridge": false,\n'
                              '      "location_or_bridge_reason": "क्राइम सीन"\n'
                              '    },\n'
                              '    {\n'
                              '      "narration": "अब हत्या के चश्मदीद गवाह से पूछताछ करने वो सीधे लक्स क्लब पहुंचती है।",\n'
                              '      "start_sec": 45.00,\n'
                              '      "end_sec": 47.90,\n'
                              '      "is_scene_bridge": true,\n'
                              '      "location_or_bridge_reason": "क्लब की तरफ ट्रांजिशन"\n'
                              '    }\n'
                              '  ]\n'
                              "}"
                          )

                          if not is_in_chat:
                              page.goto("https://duck.ai/chat", wait_until="domcontentloaded", timeout=75000)
                              page.wait_for_timeout(3000)

                          box = get_prompt_box(page)
                          box.wait_for(state="visible", timeout=40000)

                          log(f"Submitting Pass 1 (Story Synthesis) for {chunk_id}...")
                          submit_prompt(page, box, pass1_prompt, context)

                          # Fast-fail confirmation check
                          confirmed = False
                          for _ in range(10):
                              page.wait_for_timeout(1000)
                              if "chatID=" in page.url or len(current_chat_state["raw_stream"]) > 0:
                                  confirmed = True; break
                              stop_btn = page.locator("button:has-text('Stop generating'), button:has-text('Stop')")
                              if stop_btn.count() > 0 and stop_btn.first.is_visible():
                                  confirmed = True; break
                              click_ask_button(page)
                              box.press("Enter")

                          if not confirmed:
                              snap(page, f"fail_submit_{chunk_id}")
                              raise RuntimeError(f"Prompt submission not acknowledged for {chunk_id}")

                          pass1_raw = wait_for_response(page, current_chat_state, max_wait=TEXT_WAIT)
                          pass1_data = parse_first_balanced_json(pass1_raw)

                          if not pass1_data or not isinstance(pass1_data.get("beats"), list) or len(pass1_data["beats"]) == 0:
                              raise RuntimeError(f"Pass 1 JSON parse failed: {pass1_raw[:180]}")

                          log(f"Pass 1 returned {len(pass1_data['beats'])} beats. Commencing Pass 2 (Script Doctor Audit)...")

                          # --------------------------------------------------
                          # PASS 2: SCRIPT DOCTOR / CONTINUITY AUDIT PASS
                          # --------------------------------------------------
                          pass1_json_str = json.dumps(pass1_data, ensure_ascii=False, indent=2)
                          pass2_prompt = (
                              "You are the Senior Editor & Script Doctor for the YouTube recap channel.\n"
                              "Here is the draft script just created:\n\n"
                              f"```json\n{pass1_json_str}\n```\n\n"
                              "Critically AUDIT and UPGRADE this script:\n"
                              "1. ELIMINATE DIALOGUE-TAG RESIDUE: Scan every beat. If any beat says 'वह कहता है', 'उसने पूछा', or reports back-and-forth talking, rewrite it into pure third-person omniscient explanation.\n"
                              "2. VERIFY SCENE BRIDGES: Does any cut jump without explaining why? If the camera moved to a new room or building, ensure the beat explicitly explains why we are here (e.g. 'सच का पता लगाने के लिए अब वो...').\n"
                              "3. HARD LIMIT TIMINGS & LENGTH: Narration for every beat MUST be 1 complete sentence of 6 to 9 words. Ensure duration (end_sec - start_sec) is strictly <= 3.0s.\n\n"
                              "Return the final perfected JSON with the same structure: {\"current_location\": ..., \"synopsis\": ..., \"characters\": [...], \"beats\": [...]}."
                          )

                          current_chat_state["raw_stream"].clear()
                          current_chat_state["chat_done"] = False

                          page.wait_for_timeout(1500)
                          box = get_prompt_box(page)
                          box.wait_for(state="visible", timeout=20000)
                          submit_prompt(page, box, pass2_prompt, context)

                          pass2_raw = wait_for_response(page, current_chat_state, max_wait=TEXT_WAIT)
                          pass2_data = parse_first_balanced_json(pass2_raw)

                          if pass2_data and isinstance(pass2_data.get("beats"), list) and len(pass2_data["beats"]) > 0:
                              final_chunk_data = pass2_data
                              log(f"Pass 2 audit succeeded for {chunk_id}!")
                          else:
                              log("Pass 2 missed; maintaining Pass 1 draft.")
                              final_chunk_data = pass1_data

                          running_synopsis = final_chunk_data.get("synopsis", running_synopsis)
                          last_location = final_chunk_data.get("current_location", last_location)

                          for ch in final_chunk_data.get("characters", []):
                              if isinstance(ch, dict) and ch.get("name"):
                                  pipeline_state["characters"][ch["name"]] = ch

                          sanitized_beats = sanitize_and_clamp_beats(final_chunk_data.get("beats", []), max_duration=MAX_CLIP_DURATION)

                          for b in sanitized_beats:
                              st_s = b["start_sec"]
                              en_s = b["end_sec"]
                              all_beats.append({
                                  "beat_id": f"B{beat_counter:04d}",
                                  "narration": b["narration"],
                                  "target_window": {"start": st_s, "end": en_s},
                                  "portion": {"start": st_s, "end": en_s},
                                  "duration": b["duration"],
                                  "word_count": b["word_count"],
                                  "is_scene_bridge": b["is_scene_bridge"],
                                  "scene_context": b["scene_context"]
                              })
                              beat_counter += 1

                          pipeline_state["completed_chunks"].append(chunk_id)
                          pipeline_state["beats"] = all_beats
                          pipeline_state["running_synopsis"] = running_synopsis
                          pipeline_state["last_scene_location"] = last_location

                          with open(STATE_FILE, "w", encoding="utf-8") as sf:
                              json.dump(pipeline_state, sf, indent=2, ensure_ascii=False)

                          log(f"SUCCESS: {chunk_id} added {len(sanitized_beats)} recap beats.")
                          chunk_success = True
                          page.wait_for_timeout(2000)
                          break

                      except Exception as err:
                          log(f"Attempt {attempt} failed on {chunk_id}: {err}")
                          snap(page, f"err_{chunk_id}_att_{attempt}")
                          renew_tor()
                          launch_browser(p)

                  if not chunk_success:
                      log(f"CRITICAL: Failed to generate {chunk_id} after {MAX_ATTEMPTS} attempts. Halting.")
                      break

              # --------------------------------------------------
              # EXPORT FINAL ASSETS (JSON + TXT PREVIEW)
              # --------------------------------------------------
              reindexed_beats = []
              for idx, b in enumerate(all_beats, 1):
                  b_copy = dict(b)
                  b_copy["beat_id"] = f"B{idx:04d}"
                  reindexed_beats.append(b_copy)

              total_words = sum(b["word_count"] for b in reindexed_beats)
              est_narration_minutes = round(total_words / 150.0, 2)

              final_output = {
                  "movie_title": movie_title,
                  "target_minutes": TARGET_MINUTES,
                  "estimated_narration_minutes": est_narration_minutes,
                  "total_beats": len(reindexed_beats),
                  "total_words": total_words,
                  "characters": list(pipeline_state.get("characters", {}).values()),
                  "synopsis": running_synopsis,
                  "beats": reindexed_beats
              }

              # 1. story_beats.json (for video rendering/TTS scripts)
              Path("story_beats.json").write_text(
                  json.dumps(final_output, ensure_ascii=False, indent=2), encoding="utf-8"
              )

              # 2. script_preview.txt (for reading/checking continuity)
              preview_lines = [
                  f"=== YOUTUBE MOVIE RECAP SCRIPT: {movie_title} ===",
                  f"Estimated Voiceover Runtime: ~{est_narration_minutes} mins | Total Cuts: {len(reindexed_beats)}",
                  f"Story Synopsis: {running_synopsis}\n",
                  "=" * 70
              ]
              for b in reindexed_beats:
                  bridge_tag = " [SCENE BRIDGE]" if b.get("is_scene_bridge") else ""
                  preview_lines.append(
                      f"[{b['beat_id']} | {b['target_window']['start']}s - {b['target_window']['end']}s ({b['duration']}s)]{bridge_tag}"
                  )
                  if b.get("scene_context"):
                      preview_lines.append(f"Visual Context: {b['scene_context']}")
                  preview_lines.append(f"Narration: {b['narration']}")
                  preview_lines.append("-" * 70)

              Path("script_preview.txt").write_text("\n".join(preview_lines), encoding="utf-8")
              log(f"GENERATION COMPLETE: {len(reindexed_beats)} beats written to story_beats.json & script_preview.txt")

              if browser:
                  browser.close()
          PY

          if [ "$HEADED" = "true" ]; then
            xvfb-run -a --server-args="-screen 0 1440x1000x24" python recap_engine.py
          else
            python recap_engine.py
          fi

      - name: Kill Background Browser Instances
        if: always()
        run: |
          pkill -9 -f chrome || true
          pkill -9 -f Xvfb || true

      - name: Commit and Push Story Assets
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f story_beats.json ]; then
            git add -f story_beats.json script_preview.txt build/pipeline_state.json || true
            if ! git diff --cached --quiet; then
              git commit -m "Generate YouTube Hindi recap beats with scene continuity [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi

      - name: Upload Debug Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recap-engine-artifacts
          path: |
            debug/
            script_preview.txt
            story_beats.json
          if-no-files-found: ignore
