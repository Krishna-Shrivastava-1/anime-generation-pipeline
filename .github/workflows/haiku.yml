          2. **CRYSTAL-CLEAR VIEWER EXPERIENCE & PACING (NEVER RUSHED!):**
             - **First-Mention Character Framing:** Whenever a major character appears for the first time (if not already introduced in Previous Verified Ending), naturally include their 2–4 word role/relationship inside the narration so the viewer never gets lost.
