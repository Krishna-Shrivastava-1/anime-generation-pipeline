                  "movie_title": obj.get("movie_title"),
                  "content_type": obj.get("content_type"),
                  "season": obj.get("season"),
                  "episode": obj.get("episode"),
                  "part_identifier": obj.get("part_identifier"),
                  "characters": obj.get("characters", []),
                  "synopsis": str(obj.get("synopsis", "")).strip(),
                  "beats": norm_beats
              }

          # ------------------ PLAYWRIGHT SETUP ------------------
          browser = None
          context = None
          page = None
          current_chat_state = {"raw_stream": [], "chat_done": False, "rate_limited": False}

          def launch_browser(pw):
              global browser, context, page, current_chat_state
              if browser:
                  try:
                      browser.close()
                  except Exception:
                      pass
              browser = pw.chromium.launch(
                  headless=not HEADED,
                  proxy={"server": BROWSER_PROXY},
                  args=["--disable-dev-shm-usage", "--disable-blink-features=AutomationControlled"]
              )
              context = browser.new_context(
                  viewport={"width": 1440, "height": 1000},
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36",
                  permissions=["clipboard-read", "clipboard-write"]
              )
              context.add_init_script(FETCH_HOOK_JS)
              page = context.new_page()

              def is_chat_req(req):
                  clean_u = req.url.split("?")[0]
                  return req.method == "POST" and ("/duckchat/v1/chat" in clean_u or clean_u.endswith("/chat"))

              def on_res(resp):
                  if is_chat_req(resp.request):
                      log(f"Network chat response headers: HTTP {resp.status} -> {resp.url}")
                      if resp.status in (418, 429):
                          current_chat_state["rate_limited"] = True
              page.on("response", on_res)

              def on_done(req):
                  if is_chat_req(req):
                      try:
                          resp = req.response()
                          if resp:
                              body = resp.body().decode("utf-8", errors="replace")
                              if body:
                                  current_chat_state["raw_stream"].append(body)
                      except Exception as e:
                          log(f"requestfinished body note: {e}")
                      current_chat_state["chat_done"] = True
              page.on("requestfinished", on_done)

          def open_fresh_duckai_chat(take_verify_snap=False):
              page.goto("https://duck.ai/chat", wait_until="domcontentloaded", timeout=75000)
              wait_for_duckai_ui_ready(page, timeout_ms=45000)
              page.wait_for_timeout(1500)
              configure_duckai_settings(
                  page,
                  TARGET_MODEL,
                  ENABLE_REASONING,
                  ENABLE_WEB_SEARCH,
                  take_verify_snap=take_verify_snap
              )

          with sync_playwright() as p:
              launch_browser(p)

              # ==============================================================
              # MODE: PROBE
              # ==============================================================
              if RUN_MODE == "probe":
                  log("Starting probe test on Duck.ai...")
                  open_fresh_duckai_chat(take_verify_snap=True)
                  box = get_prompt_box(page)
                  box.wait_for(state="visible", timeout=40000)

                  probe_prompt = 'Output valid JSON only: {"status": "ready", "hindi": "कहानी शुरू"}'
                  if not send_and_confirm(page, box, probe_prompt, context, current_chat_state, "Probe", is_new_chat=True):
                      snap(page, "probe_submit_failed")
                      raise RuntimeError("Probe submission not acknowledged.")

                  out = wait_for_response(page, current_chat_state, prompt_text=probe_prompt, max_wait=60, expect_json=True, expect_beats=False)
                  parsed = parse_first_balanced_json(out, require_beats=False)
                  log(f"Probe Result: {parsed}")

                  if parsed and parsed.get("status") == "ready":
                      log("Probe PASSED successfully.")
                      if browser:
                          browser.close()
                      sys.exit(0)
                  else:
                      log("Probe FAILED.")
                      snap(page, "probe_failed")
                      if browser:
                          browser.close()
                      sys.exit(1)

              # ==============================================================
              # MODE: FULL RECAP ENGINE (P0 -> [P1/P3 -> P2 -> P4 -> Merge])
              # ==============================================================
              log("Starting Recap Engine (PROMPT 0 -> [PROMPT 1/3 -> PROMPT 2 -> PROMPT 4])...")
              transcript_data = load_transcript("transcript.json")
              total_segments = len(transcript_data.get("segments", []))
              movie_title = INPUT_MOVIE_TITLE or str(transcript_data.get("movie_title") or "Untitled")
              log(f"Loaded '{movie_title}': {total_segments} segments | Target: {TARGET_MINUTES}m | Max prompt: {MAX_PROMPT_CHARS} chars.")

              pipeline_state = {
                  "episode_bible": "",
                  "next_segment_idx": 0,
                  "chunk_num": 0,
                  "beats": [],
                  "characters": {},
                  "synopses": [],
                  "continuity_handoff": ""
              }
              if STATE_FILE.exists():
                  try:
                      with open(STATE_FILE, "r", encoding="utf-8") as sf:
                          loaded = json.load(sf)
                          if isinstance(loaded, dict):
                              pipeline_state = deep_repair(loaded)
                  except Exception:
                      pass

              verify_snap_taken = False

              # ---- ONE-TIME PROMPT 0 (WEB SEARCH SCENE MAP) ----
              if ENABLE_WEB_SEARCH and not pipeline_state.get("episode_bible"):
                  log(f"Running 1-time PROMPT 0 (Web Search Scene Map for '{movie_title}')...")
                  p0_text = build_prompt_0(movie_title)
                  for p0_att in range(1, 3):
                      try:
                          open_fresh_duckai_chat(take_verify_snap=(not verify_snap_taken))
                          verify_snap_taken = True
                          box = get_prompt_box(page)
                          box.wait_for(state="visible", timeout=40000)
                          if not send_and_confirm(page, box, p0_text, context, current_chat_state, "PROMPT_0", is_new_chat=True):
                              raise RuntimeError("Prompt 0 submission not acknowledged.")
                          bible_txt = wait_for_response(
                              page,
                              current_chat_state,
                              prompt_text=p0_text,
                              max_wait=180,
                              expect_json=False,
                              expect_beats=False
                          )
                          if len(bible_txt.strip()) >= 80:
                              pipeline_state["episode_bible"] = bible_txt.strip()
                              (DEBUG_DIR / "episode_bible_p0.txt").write_text(bible_txt.strip(), encoding="utf-8")
                              with open(STATE_FILE, "w", encoding="utf-8") as sf:
                                  json.dump(pipeline_state, sf, indent=2, ensure_ascii=False)
                              log(f"SUCCESS PROMPT 0: captured {len(bible_txt.strip())} chars Scene Map.")
                              break
                      except Exception as p0_err:
                          log(f"PROMPT 0 attempt {p0_att} notice (non-fatal): {p0_err}")
                          if p0_att < 2:
                              renew_tor()
                              launch_browser(p)

              # ---- MAIN CHUNK LOOP ----
              while pipeline_state["next_segment_idx"] < total_segments:
                  cur_idx = pipeline_state["next_segment_idx"]
                  chunk_num = pipeline_state["chunk_num"] + 1
                  next_beat_num = len(pipeline_state["beats"]) + 1
                  next_clip_num = sum(len(b.get("clips", [])) for b in pipeline_state["beats"]) + 1
                  episode_bible = pipeline_state.get("episode_bible", "")

                  if chunk_num == 1 or not pipeline_state.get("continuity_handoff"):
                      chunk_meta, next_idx = build_prompt_1_chunk(transcript_data, cur_idx, episode_bible, INPUT_HINTS)
                  else:
                      chunk_meta, next_idx = build_prompt_3_chunk(
                          transcript_data,
                          cur_idx,
                          pipeline_state["continuity_handoff"],
                          episode_bible,
                          next_beat_num,
                          next_clip_num
                      )

                  if not chunk_meta:
                      break

                  log(
                      f"\n=== CHUNK {chunk_num} ({chunk_meta['prompt_type']}): segments {chunk_meta['start_idx']+1}..{chunk_meta['end_idx']}/{total_segments} "
                      f"({chunk_meta['time_start']}s - {chunk_meta['time_end']}s) | Target: {chunk_meta['dur_text']} (~{chunk_meta['words_text']} words) | Prompt: {chunk_meta['prompt_chars']} chars ==="
                  )

                  # ---- STEP A: PROMPT 1 or PROMPT 3 (Draft JSON) ----
                  draft_norm = None
                  for attempt in range(1, MAX_ATTEMPTS + 1):
                      try:
                          open_fresh_duckai_chat(take_verify_snap=(not verify_snap_taken))
                          verify_snap_taken = True

                          box = get_prompt_box(page)
                          box.wait_for(state="visible", timeout=40000)

                          log(f"Submitting {chunk_meta['prompt_type']} for Chunk {chunk_num} (attempt {attempt}/{MAX_ATTEMPTS})...")
                          if not send_and_confirm(page, box, chunk_meta["prompt"], context, current_chat_state, f"Chunk {chunk_num} {chunk_meta['prompt_type']}", is_new_chat=True):
                              snap(page, f"fail_submit_chunk_{chunk_num}_att_{attempt}")
                              raise RuntimeError(f"Chunk {chunk_num} submission not acknowledged.")

                          raw_resp = wait_for_response(
                              page,
                              current_chat_state,
                              prompt_text=chunk_meta["prompt"],
                              max_wait=TEXT_WAIT,
                              expect_json=True,
                              expect_beats=True,
                              prev_code_blocks=0
                          )
                          (DEBUG_DIR / f"raw_chunk_{chunk_num}_att_{attempt}.txt").write_text(raw_resp, encoding="utf-8")

                          parsed_json = parse_first_balanced_json(raw_resp, require_beats=True)
                          if not is_valid_recap_json(parsed_json):
                              dom_fallback = page.evaluate(EXTRACT_ASSISTANT_JS, {
                                  "promptTail": chunk_meta["prompt"][-60:].strip(),
                                  "expectJson": True,
                                  "prevCodeBlocks": 0
                              })
                              dom_txt = (dom_fallback.get("text") or "").strip()
                              if dom_txt and dom_txt != raw_resp:
                                  (DEBUG_DIR / f"raw_chunk_{chunk_num}_att_{attempt}_dom.txt").write_text(dom_txt, encoding="utf-8")
                                  parsed_json = parse_first_balanced_json(dom_txt, require_beats=True)

                          if not is_valid_recap_json(parsed_json):
                              snap(page, f"bad_json_chunk_{chunk_num}_att_{attempt}")
                              raise RuntimeError(f"Invalid or empty JSON beats on Chunk {chunk_num}: {raw_resp[:220]}")

                          candidate_norm = normalize_chunk_beats(parsed_json)
                          if not candidate_norm["beats"]:
                              raise RuntimeError(f"Chunk {chunk_num} produced 0 valid beats.")

                          draft_norm = candidate_norm
                          log(f"SUCCESS {chunk_meta['prompt_type']} Draft Chunk {chunk_num}: +{len(draft_norm['beats'])} beats.")
                          break

                      except Exception as err:
                          log(f"Chunk {chunk_num} ({chunk_meta['prompt_type']}) attempt {attempt} failed: {err}")
                          snap(page, f"err_chunk_{chunk_num}_att_{attempt}")
                          if attempt < MAX_ATTEMPTS:
                              renew_tor()
                              launch_browser(p)

                  if draft_norm is None:
                      log(f"CRITICAL: Failed on Chunk {chunk_num}. Saving partial progress & exiting.")
                      break

                  # ---- STEP B: PROMPT 2 (Continuity Handoff + 100-line Preview in SAME chat) ----
                  handoff_text = ""
                  if next_idx < total_segments:
                      p2_meta = build_prompt_2_preview(transcript_data, next_idx)
                      if p2_meta:
                          log(
                              f"Running PROMPT 2 (Continuity Handoff in SAME chat) with {p2_meta['preview_count']} preview lines "
                              f"({p2_meta['prompt_chars']} chars)..."
                          )
                          try:
                              page.wait_for_timeout(1500)
                              box = get_prompt_box(page)
                              box.wait_for(state="visible", timeout=30000)

                              if not send_and_confirm(page, box, p2_meta["prompt"], context, current_chat_state, f"Chunk {chunk_num} PROMPT_2", is_new_chat=False):
                                  raise RuntimeError("Prompt 2 submission not acknowledged in same chat.")

                              raw_handoff = wait_for_response(
                                  page,
                                  current_chat_state,
                                  prompt_text=p2_meta["prompt"],
                                  max_wait=TEXT_WAIT,
                                  expect_json=False,
                                  expect_beats=False,
                                  prev_code_blocks=count_code_blocks(page)
                              )
                              (DEBUG_DIR / f"handoff_chunk_{chunk_num}.txt").write_text(raw_handoff, encoding="utf-8")
                              if len(raw_handoff.strip()) < 150:
                                  raise RuntimeError(f"Prompt 2 returned too short handoff ({len(raw_handoff.strip())} chars).")
                              handoff_text = raw_handoff.strip()
                              log(f"SUCCESS PROMPT 2 (same chat): captured {len(handoff_text)} chars handoff.")
                          except Exception as p2_err:
                              log(f"Same-chat PROMPT 2 failed ({p2_err}); switching to recovery fresh-chat PROMPT 2...")
                              snap(page, f"err_handoff_chunk_{chunk_num}")

                      if not handoff_text:
                          rec_chars = dict(pipeline_state.get("characters", {}))
                          for ch in draft_norm.get("characters", []):
                              if isinstance(ch, dict) and ch.get("name"):
                                  rec_chars[ch["name"]] = ch
                          rec_syn = (pipeline_state.get("synopses", []) + ([draft_norm["synopsis"]] if draft_norm["synopsis"] else []))[-3:]
                          rec_beats = (pipeline_state.get("beats", []) + draft_norm["beats"])[-3:]
                          p2_rec = build_prompt_2_preview(
                              transcript_data,
                              next_idx,
                              recovery_state={"characters": list(rec_chars.values()), "synopses": rec_syn},
                              recovery_beats=rec_beats
                          )
                          for rec_att in range(1, 3):
                              try:
                                  renew_tor()
                                  launch_browser(p)
                                  open_fresh_duckai_chat(take_verify_snap=False)
                                  box = get_prompt_box(page)
                                  box.wait_for(state="visible", timeout=40000)
                                  if not send_and_confirm(page, box, p2_rec["prompt"], context, current_chat_state, f"Chunk {chunk_num} PROMPT_2_REC", is_new_chat=True):
                                      raise RuntimeError("Recovery Prompt 2 submission not acknowledged.")
                                  raw_handoff = wait_for_response(
                                      page,
                                      current_chat_state,
                                      prompt_text=p2_rec["prompt"],
                                      max_wait=TEXT_WAIT,
                                      expect_json=False,
                                      expect_beats=False,
                                      prev_code_blocks=0
                                  )
                                  (DEBUG_DIR / f"handoff_chunk_{chunk_num}_rec.txt").write_text(raw_handoff, encoding="utf-8")
                                  if len(raw_handoff.strip()) >= 150:
                                      handoff_text = raw_handoff.strip()
                                      log(f"SUCCESS PROMPT 2 (recovery chat): captured {len(handoff_text)} chars.")
                                      break
                              except Exception as rec_err:
                                  log(f"Recovery PROMPT 2 attempt {rec_att} failed: {rec_err}")

                  # ---- STEP C: PROMPT 4 (Enhancement, On-Screen Scene Audit & Filler Cut) ----
                  prev_ending = ""
                  if pipeline_state["beats"]:
                      prev_ending = pipeline_state["beats"][-1]["narration"]

                  p4_meta = build_prompt_4_enhance(
                      movie_title,
                      chunk_meta,
                      draft_norm,
                      episode_bible,
                      prev_ending,
                      handoff_text,
                      next_beat_num,
                      next_clip_num
                  )
                  enhanced_norm = None
                  log(f"Running PROMPT 4 (Script Enhancer & Scene Audit, {p4_meta['prompt_chars']} chars)...")

                  try:
                      page.wait_for_timeout(1200)
                      prev_cb = count_code_blocks(page)
                      box = get_prompt_box(page)
                      box.wait_for(state="visible", timeout=30000)
                      if not send_and_confirm(page, box, p4_meta["prompt"], context, current_chat_state, f"Chunk {chunk_num} PROMPT_4", is_new_chat=False):
                          raise RuntimeError("Prompt 4 submission not acknowledged in same chat.")
                      raw_enh = wait_for_response(
                          page,
                          current_chat_state,
                          prompt_text=p4_meta["prompt"],
                          max_wait=TEXT_WAIT,
                          expect_json=True,
                          expect_beats=True,
                          prev_code_blocks=prev_cb
                      )
                      (DEBUG_DIR / f"enhanced_chunk_{chunk_num}.txt").write_text(raw_enh, encoding="utf-8")
                      parsed_enh = parse_first_balanced_json(raw_enh, require_beats=True)
                      if is_valid_recap_json(parsed_enh):
                          cand_enh = normalize_chunk_beats(parsed_enh)
                          if cand_enh["beats"]:
                              enhanced_norm = cand_enh
                              log(f"SUCCESS PROMPT 4 (same chat): refined into {len(enhanced_norm['beats'])} tight beats.")
                  except Exception as p4_err:
                      log(f"Same-chat PROMPT 4 failed ({p4_err}); trying fresh-chat PROMPT 4 fallback...")
                      snap(page, f"err_p4_chunk_{chunk_num}")

                  if enhanced_norm is None:
                      try:
                          renew_tor()
                          launch_browser(p)
                          open_fresh_duckai_chat(take_verify_snap=False)
                          box = get_prompt_box(page)
                          box.wait_for(state="visible", timeout=40000)
                          if not send_and_confirm(page, box, p4_meta["prompt"], context, current_chat_state, f"Chunk {chunk_num} PROMPT_4_REC", is_new_chat=True):
                              raise RuntimeError("Fresh-chat Prompt 4 submission not acknowledged.")
                          raw_enh = wait_for_response(
                              page,
                              current_chat_state,
                              prompt_text=p4_meta["prompt"],
                              max_wait=TEXT_WAIT,
                              expect_json=True,
                              expect_beats=True,
                              prev_code_blocks=0
                          )
                          (DEBUG_DIR / f"enhanced_chunk_{chunk_num}_rec.txt").write_text(raw_enh, encoding="utf-8")
                          parsed_enh = parse_first_balanced_json(raw_enh, require_beats=True)
                          if is_valid_recap_json(parsed_enh):
                              cand_enh = normalize_chunk_beats(parsed_enh)
                              if cand_enh["beats"]:
                                  enhanced_norm = cand_enh
                                  log(f"SUCCESS PROMPT 4 (fresh chat): refined into {len(enhanced_norm['beats'])} tight beats.")
                      except Exception as p4_rec_err:
                          log(f"Fresh-chat PROMPT 4 fallback failed ({p4_rec_err}); keeping Draft Chunk {chunk_num} beats.")

                  final_chunk_norm = enhanced_norm if enhanced_norm is not None else draft_norm

                  pipeline_state["beats"].extend(final_chunk_norm["beats"])
                  if final_chunk_norm["synopsis"]:
                      pipeline_state["synopses"].append(final_chunk_norm["synopsis"])
                  for ch in final_chunk_norm.get("characters", []):
                      if isinstance(ch, dict) and ch.get("name"):
                          pipeline_state["characters"][ch["name"]] = ch
                  pipeline_state["next_segment_idx"] = next_idx
                  pipeline_state["chunk_num"] = chunk_num

                  if next_idx < total_segments:
                      if not handoff_text:
                          with open(STATE_FILE, "w", encoding="utf-8") as sf:
                              json.dump(pipeline_state, sf, indent=2, ensure_ascii=False)
                          log(f"CRITICAL: Could not generate Continuity Handoff after Chunk {chunk_num}. Saved progress & exiting.")
                          break
                      merged_handoff = build_merged_handoff_for_next_chunk(handoff_text, final_chunk_norm["beats"])
                      (DEBUG_DIR / f"merged_handoff_chunk_{chunk_num}.txt").write_text(merged_handoff, encoding="utf-8")
                      pipeline_state["continuity_handoff"] = merged_handoff
                  else:
                      pipeline_state["continuity_handoff"] = ""

                  with open(STATE_FILE, "w", encoding="utf-8") as sf:
                      json.dump(pipeline_state, sf, indent=2, ensure_ascii=False)

                  log(f"Saved state after Chunk {chunk_num} (total beats: {len(pipeline_state['beats'])}, next_idx: {next_idx}/{total_segments}).")
                  page.wait_for_timeout(1500)

              # ------------------ MERGE & EXPORT FINAL JSON ------------------
              final_beats = []
              total_words = 0
              clip_counter = 1

              for b_idx, b in enumerate(pipeline_state["beats"], 1):
                  b_copy = {
                      "beat_id": f"B{b_idx:04d}",
                      "narration": b["narration"],
                      "word_count": b["word_count"],
                      "estimated_duration": b["estimated_duration"],
                      "is_scene_bridge": b["is_scene_bridge"],
                      "clips": []
                  }
                  total_words += b["word_count"]
                  for c in b.get("clips", []):
                      b_copy["clips"].append({
                          "clip_id": f"C{clip_counter:04d}",
                          "start": c["start"],
                          "end": c["end"],
                          "duration": c["duration"],
                          "scene_context": c["scene_context"]
                      })
                      clip_counter += 1
                  final_beats.append(b_copy)

              target_min_val = None
              try:
                  target_min_val = float(TARGET_MINUTES) if TARGET_MINUTES else None
              except Exception:
                  target_min_val = None

              final_output = {
                  "movie_title": movie_title,
                  "content_type": INPUT_CONTENT_TYPE or None,
                  "season": INPUT_SEASON or None,
                  "episode": INPUT_EPISODE or None,
                  "part_identifier": INPUT_PART or None,
                  "target_minutes": target_min_val,
                  "estimated_narration_minutes": round(total_words / 140.0, 2),
                  "total_beats": len(final_beats),
                  "total_words": total_words,
                  "characters": list(pipeline_state.get("characters", {}).values()),
                  "synopsis": " ".join(pipeline_state.get("synopses", [])).strip(),
                  "beats": final_beats
              }

              Path("story_beats.json").write_text(
                  json.dumps(final_output, ensure_ascii=False, indent=2), encoding="utf-8"
              )

              preview_lines = [
                  f"=== YOUTUBE MOVIE RECAP SCRIPT: {final_output['movie_title']} ===",
                  f"Content Type: {final_output['content_type']} | Est. Runtime: ~{final_output['estimated_narration_minutes']} mins | Beats: {final_output['total_beats']} | Words: {final_output['total_words']}",
                  f"Synopsis: {final_output['synopsis']}\n",
                  "=" * 70
              ]
              for b in final_output["beats"]:
                  bridge_tag = " [SCENE BRIDGE]" if b.get("is_scene_bridge") else ""
                  preview_lines.append(
                      f"[{b['beat_id']} | Words: {b['word_count']} | Est: {b['estimated_duration']}s]{bridge_tag}"
                  )
                  preview_lines.append(f"Narration: {b['narration']}")
                  for c in b.get("clips", []):
                      preview_lines.append(
                          f"  - {c['clip_id']}: {c['start']}s -> {c['end']}s ({c['duration']}s) | {c['scene_context']}"
                      )
                  preview_lines.append("-" * 70)

              Path("script_preview.txt").write_text("\n".join(preview_lines), encoding="utf-8")
              log(f"GENERATION COMPLETE: {len(final_beats)} beats written to story_beats.json & script_preview.txt.")

              if browser:
                  browser.close()
          PY

          if [ "$HEADED" = "true" ]; then
            xvfb-run -a --server-args="-screen 0 1440x1000x24" python recap_engine.py
          else
            python recap_engine.py
          fi

      - name: Kill Background Browser Instances
        if: always()
        run: |
          pkill -9 -f chrome || true
          pkill -9 -f Xvfb || true

      - name: Commit and Push Story Assets & Verification Screenshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f story_beats.json script_preview.txt build/pipeline_state.json debug/model_settings_verified.png debug/settings_dropdown_open.png debug/tools_dropdown_open.png || true
          if ! git diff --cached --quiet; then
            git commit -m "Update Hindi recap JSON & Duck.ai settings verification screenshot [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload Debug Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recap-engine-artifacts
          path: |
            debug/
            script_preview.txt
            story_beats.json
          if-no-files-found: ignore
