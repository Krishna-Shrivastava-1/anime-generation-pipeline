          {"movie_title":"Title","content_type":"Movie or TV Series","season":null,"episode":null,"part_identifier":null,"target_minutes":null,"estimated_narration_minutes":0,"total_beats":0,"total_words":0,"characters":[{"name":"Name","description":"Role"}],"synopsis":"Summary so far","beats":[{"beat_id":"__NEXT_BEAT_ID__","narration":"Full Hindi beat narration","word_count":0,"estimated_duration":0,"is_scene_bridge":false,"clips":[{"clip_id":"__NEXT_CLIP_ID__","start":0.0,"end":2.0,"duration":2.0,"spoken_text":"Sequential Hindi phrase","spoken_word_count":0,"estimated_spoken_duration":0,"scene_context":"Transcript context (mark visuals unverified)"}]}]}

          ## INPUT
          Title: __MOVIE_TITLE__ | Type: __CONTENT_TYPE__ | Season: __SEASON__ | Episode: __EPISODE__ | Part: __PART_IDENTIFIER__
          Verified Scene Map: __EPISODE_BIBLE__

