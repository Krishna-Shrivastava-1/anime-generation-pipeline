                      b["clips"] = [{"start": c["start"], "end": c["end"], "duration": c["duration"], "spoken_text": c.get("spoken_text", "")} for c in b.get("clips", [])]
                  prompt = render(payload, (upcoming_handoff or "Final chunk.")[:1200], (episode_bible or "None")[:600])
              return {"prompt_chars": len(prompt), "prompt": prompt}

          def build_prompt_5_critic(movie_title, transcript_data, chunk_meta, luna_norm_obj, episode_bible, prev_ending, upcoming_handoff, next_beat_num, next_clip_num):
              all_segs = transcript_data.get("segments", [])
              chunk_segs = all_segs[chunk_meta["start_idx"] : chunk_meta["end_idx"]]
              compact_lines = [f"{round(float(s.get('start', 0)), 2)}-{round(float(s.get('end', 0)), 2)}|{str(s.get('text', '')).strip()}" for s in chunk_segs]

              luna_payload = {
                  "movie_title": movie_title, "content_type": INPUT_CONTENT_TYPE or None,
                  "season": INPUT_SEASON or None, "episode": INPUT_EPISODE or None, "part_identifier": INPUT_PART or None,
                  "characters": luna_norm_obj.get("characters", []), "synopsis": luna_norm_obj.get("synopsis", ""),
                  "beats": luna_norm_obj.get("beats", [])
              }

              def render(l_obj, raw_txt, up_ctx, bible_txt):
                  p = PROMPT_5_CRITIC_TEMPLATE
                  for k, v in [
                      ("__MOVIE_TITLE__", movie_title), ("__CONTENT_TYPE__", INPUT_CONTENT_TYPE or "N/A"),
                      ("__SEASON__", INPUT_SEASON or "N/A"), ("__EPISODE__", INPUT_EPISODE or "N/A"),
                      ("__TARGET_MINUTES__", TARGET_MINUTES or "4"),
                      ("__TOTAL_TARGET_WORDS__", chunk_meta.get("total_words_text", "560")),
                      ("__CHUNK_PCT__", chunk_meta.get("chunk_pct", "30")),
                      ("__TARGET_DURATION__", chunk_meta.get("dur_text", "proportional")),
                      ("__TARGET_WORDS__", chunk_meta.get("words_text", "180")),
                      ("__NEXT_BEAT_ID__", f"B{next_beat_num:04d}"), ("__NEXT_CLIP_ID__", f"C{next_clip_num:04d}"),
                      ("__EPISODE_BIBLE__", bible_txt), ("__PREV_ENDING__", prev_ending or "Start of supplied transcript"),
                      ("__UPCOMING_CONTEXT__", up_ctx), ("__RAW_TRANSCRIPT_COMPACT__", raw_txt),
                      ("__LUNA_JSON__", json.dumps(l_obj, ensure_ascii=False, separators=(",", ":")))
                  ]:
                      p = p.replace(k, v)
                  return p

              bible_txt = (episode_bible or "None")[:1000]
