name: Generate Hindi YouTube Movie Recap

on:
  workflow_dispatch:
    inputs:
      reset_state:
        description: "Clear old corrupted cache and regenerate fresh"
        required: true
        type: boolean
        default: true
      headed:
        description: "Run non-headless Chrome under Xvfb (less detectable)"
        required: true
        type: boolean
        default: true
      mode:
        description: "Execution mode (probe | full)"
        required: true
        type: choice
        options:
          - "probe"
          - "full"
        default: "full"
      target_minutes:
        description: "Target recap duration in minutes (e.g. 12)"
        required: true
        default: "12"
      hints:
        description: "Optional notes / character name fixes"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate-recap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      LANG: "C.UTF-8"
      LC_ALL: "C.UTF-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tor
        timeout-minutes: 4
        run: |
          sudo apt-get update
          sudo apt-get install -y tor netcat-openbsd xvfb
          sudo service tor start
          for i in {1..30}; do
            if nc -z 127.0.0.1 9050; then echo "Tor ready"; break; fi
            sleep 2
          done
          nc -z 127.0.0.1 9050

      - name: Install Python dependencies
        timeout-minutes: 6
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi playwright pillow requests ftfy
          playwright install --with-deps chromium

      - name: Verify connection (curl_cffi, Chrome TLS impersonation)
        timeout-minutes: 3
        run: |
          python - <<'PY'
          from curl_cffi import requests
          p = "socks5h://127.0.0.1:9050"
          r = requests.get("https://check.torproject.org/api/ip", proxies={"http": p, "https": p}, impersonate="chrome", timeout=60)
          r.raise_for_status()
          data = r.json()
          print("Connection info:", data)
          if not data.get("IsTor"):
              raise RuntimeError("Traffic is not using Tor.")
          PY

      - name: Automate Duck.ai Story Pipeline
        timeout-minutes: 110
        env:
          HEADED: ${{ inputs.headed }}
          RUN_MODE: ${{ inputs.mode }}
          RESET_STATE: ${{ inputs.reset_state }}
          TARGET_MINUTES: ${{ inputs.target_minutes }}
          INPUT_HINTS: ${{ inputs.hints }}
          TEXT_WAIT_SECONDS: "180"
        run: |
          mkdir -p debug
          cat > generate_story.py <<'PY'
          import os, re, sys, json, base64, subprocess, time, math
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import ftfy

          if sys.platform != "win32":
              sys.stdout.reconfigure(encoding="utf-8")
              sys.stderr.reconfigure(encoding="utf-8")

          HEADED = os.environ.get("HEADED") == "true"
          RUN_MODE = os.environ.get("RUN_MODE", "full").strip().lower()
          RESET_STATE = os.environ.get("RESET_STATE", "false").strip().lower() == "true"
          TARGET_MINUTES = float(os.environ.get("TARGET_MINUTES", "12"))
          INPUT_HINTS = os.environ.get("INPUT_HINTS", "").strip()
          TEXT_WAIT = int(os.environ.get("TEXT_WAIT_SECONDS", "180"))
          MAX_CLIP_DURATION = 3.0  # Video cuts strictly <= 3.0s
          MAX_ATTEMPTS = 2

          DEBUG_DIR = Path("debug"); DEBUG_DIR.mkdir(parents=True, exist_ok=True)
          STATE_FILE = Path("build/pipeline_state.json")
          STATE_FILE.parent.mkdir(parents=True, exist_ok=True)
          RUN_LOG = DEBUG_DIR / "run.log"

          TOR_PROXY = "socks5h://127.0.0.1:9050"
          BROWSER_PROXY = "socks5://127.0.0.1:9050"

          if RESET_STATE and STATE_FILE.exists():
              STATE_FILE.unlink()
              print("[INIT] Old pipeline_state.json removed for clean regeneration.", flush=True)

          def log(msg):
              line = f"[{time.strftime('%H:%M:%S')}] {msg}"
              print(line, flush=True)
              with open(RUN_LOG, "a", encoding="utf-8") as f:
                  f.write(line + "\n")

          CP1252_MAP = {
              '\u20ac': 0x80, '\u201a': 0x82, '\u0192': 0x83, '\u201e': 0x84, '\u2026': 0x85,
              '\u2020': 0x86, '\u2021': 0x87, '\u02c6': 0x88, '\u2030': 0x89, '\u0160': 0x8a,
              '\u2039': 0x8b, '\u0152': 0x8c, '\u017d': 0x8e, '\u2018': 0x91, '\u2019': 0x92,
              '\u201c': 0x93, '\u201d': 0x94, '\u2022': 0x95, '\u2013': 0x96, '\u2014': 0x97,
              '\u02dc': 0x98, '\u2122': 0x99, '\u0161': 0x9a, '\u203a': 0x9b, '\u0153': 0x9c,
              '\u017e': 0x9e, '\u0178': 0x9f,
          }

          def fix_mojibake_str(s: str) -> str:
              if not isinstance(s, str) or not s:
                  return s
              try:
                  s = ftfy.fix_text(s)
              except Exception:
                  pass

              if any(m in s for m in ["à¤", "à¥", "â€™", "â€”", "Ã", "Â"]):
                  try:
                      return s.encode("cp1252").decode("utf-8")
                  except Exception:
                      try:
                          raw_bytes = bytearray()
                          for ch in s:
                              if ch in CP1252_MAP:
                                  raw_bytes.append(CP1252_MAP[ch])
                              elif ord(ch) < 256:
                                  raw_bytes.append(ord(ch))
                              else:
                                  raw_bytes.extend(ch.encode("utf-8"))
                          return raw_bytes.decode("utf-8", errors="replace")
                      except Exception:
                          pass
              return s

          def deep_repair(val):
              if isinstance(val, str):
                  return fix_mojibake_str(val)
              elif isinstance(val, list):
                  return [deep_repair(item) for item in val]
              elif isinstance(val, dict):
                  return {k: deep_repair(v) for k, v in val.items()}
              return val

          def snap(page, name):
              try:
                  page.screenshot(path=str(DEBUG_DIR / f"{name}.png"), full_page=True, timeout=15000)
                  (DEBUG_DIR / f"{name}.html").write_text(page.content(), encoding="utf-8")
                  log(f"snapshot {name} | url={page.url}")
              except Exception as e:
                  log(f"snapshot failed: {e}")

          def new_tor_circuit():
              log("Restarting Tor for a new exit IP...")
              subprocess.run(["sudo", "timeout", "60", "service", "tor", "restart"], check=False)
              for _ in range(30):
                  if subprocess.run(["nc", "-z", "127.0.0.1", "9050"]).returncode == 0:
                      break
                  time.sleep(2)
              time.sleep(3)

          def get_prompt_box(page):
              return page.locator(
                  "textarea[name='user-prompt'], textarea[placeholder*='ask' i], "
                  "textarea[placeholder*='message' i], textarea").first

          def click_ask_button(page):
              ask_btn = page.get_by_role("button", name=re.compile(r"^\s*ask\s*$", re.I))
              if ask_btn.count() > 0 and ask_btn.first.is_visible():
                  ask_btn.first.click(timeout=3000)
                  return True

              btn_text = page.locator("button:has-text('Ask')")
              for i in range(btn_text.count()):
                  b = btn_text.nth(i)
                  if b.is_visible() and b.is_enabled():
                      b.click(timeout=3000)
                      return True

              js_click = page.evaluate("""() => {
                  const buttons = Array.from(document.querySelectorAll('button'));
                  const ask = buttons.find(b => !b.disabled && (b.innerText || '').trim().toLowerCase() === 'ask');
                  if (ask) { ask.click(); return 'ask_clicked'; }
                  const send = buttons.find(b => !b.disabled && (b.getAttribute('aria-label') || '').toLowerCase().includes('send'));
                  if (send) { send.click(); return 'send_clicked'; }
                  const sub = buttons.find(b => b.type === 'submit' && !b.disabled);
                  if (sub) { sub.click(); return 'submit_clicked'; }
                  return null;
              }""")
              return bool(js_click)

          def submit_prompt(page, box, text, context):
              log("Focusing prompt box...")
              box.click()
              page.wait_for_timeout(200)
              box.fill("")
              page.wait_for_timeout(100)

              try:
                  cdp = context.new_cdp_session(page)
                  cdp.send("Input.insertText", {"text": text})
                  cdp.detach()
              except Exception as e:
                  log(f"CDP typing fallback: {e}")
                  box.fill(text)

              page.wait_for_timeout(500)
              try:
                  page.evaluate("""(el) => {
                      el.dispatchEvent(new Event('input', { bubbles: true }));
                      el.dispatchEvent(new Event('change', { bubbles: true }));
                  }""", box.element_handle())
              except Exception:
                  pass

              page.wait_for_timeout(300)
              clicked = click_ask_button(page)
              if not clicked:
                  box.press("Enter")
              page.wait_for_timeout(500)

          def parse_sse_text(raw_sse: str) -> str:
              chunks = []
              for line in raw_sse.splitlines():
                  line = line.strip()
                  if not line.startswith("data:"):
                      continue
                  payload = line[5:].strip()
                  if not payload or payload == "[DONE]":
                      continue
                  try:
                      data = json.loads(payload)
                      chunk = data.get("message", "")
                      if chunk:
                          chunks.append(chunk)
                  except Exception:
                      continue
              return "".join(chunks)

          def strip_markdown(text: str) -> str:
              text = text.strip()
              text = re.sub(r"^```(?:json)?\s*", "", text, flags=re.IGNORECASE)
              text = re.sub(r"\s*```$", "", text)
              return text.strip()

          def parse_first_balanced_json(text: str):
              if not text:
                  return None
              cleaned = strip_markdown(text)
              try:
                  return deep_repair(json.loads(cleaned))
              except Exception:
                  pass

              start_idx = -1
              for i, ch in enumerate(cleaned):
                  if ch in ("{", "["):
                      start_idx = i
                      break
              if start_idx == -1:
                  return None

              open_char = cleaned[start_idx]
              close_char = "}" if open_char == "{" else "]"
              depth = 0
              in_string = False
              escape = False

              for idx in range(start_idx, len(cleaned)):
                  c = cleaned[idx]
                  if escape:
                      escape = False
                      continue
                  if c == "\\":
                      escape = True
                      continue
                  if c == '"':
                      in_string = not in_string
                      continue
                  if not in_string:
                      if c == open_char:
                          depth += 1
                      elif c == close_char:
                          depth -= 1
                          if depth == 0:
                              try:
                                  raw_obj = json.loads(cleaned[start_idx : idx + 1])
                                  return deep_repair(raw_obj)
                              except Exception:
                                  break
              return None

          def wait_for_text_generation(page, state, max_wait=TEXT_WAIT):
              log("Waiting for text generation to complete...")
              start = time.time()
              last_text = ""
              stable_ticks = 0

              while time.time() - start < max_wait:
                  if state.get("rate_limited"):
                      raise RuntimeError("Duck.ai returned HTTP 418 (Tor IP blocked).")

                  try:
                      page.evaluate("""() => {
                          window.scrollTo(0, document.body.scrollHeight);
                          const sc = document.querySelector('main, [class*="chat"], [class*="conversation"]');
                          if (sc) sc.scrollTop = sc.scrollHeight;
                      }""")
                  except Exception:
                      pass

                  if state.get("chat_done") and state.get("raw_stream"):
                      parsed_sse = parse_sse_text("".join(state["raw_stream"]))
                      if parsed_sse.strip():
                          log(f"Captured text via network SSE stream ({len(parsed_sse)} chars).")
                          return deep_repair(parsed_sse)

                  stop_btn = page.locator("button:has-text('Stop generating'), button:has-text('Stop'), button[aria-label*='Stop' i]")
                  is_generating = False
                  try:
                      is_generating = stop_btn.count() > 0 and stop_btn.first.is_visible()
                  except Exception:
                      pass

                  try:
                      cur_text = page.evaluate("""
                          () => {
                              const codes = document.querySelectorAll('pre code, code');
                              if (codes.length > 0) {
                                  const lastCode = (codes[codes.length - 1].innerText || '').trim();
                                  if (lastCode.includes('{') || lastCode.includes('beats')) return lastCode;
                              }
                              const msgs = document.querySelectorAll('[class*="message"], article, [data-testid*="message"]');
                              if (msgs.length > 0) {
                                  return (msgs[msgs.length - 1].innerText || '').trim();
                              }
                              return '';
                          }
                      """)
                      if cur_text and cur_text == last_text and not is_generating:
                          stable_ticks += 1
                      else:
                          stable_ticks = 0
                      last_text = cur_text

                      if stable_ticks >= 3 and len(last_text) > 30:
                          log(f"Captured text via DOM stability ({len(last_text)} chars).")
                          return deep_repair(last_text)
                  except Exception:
                      pass

                  page.wait_for_timeout(2000)

              if state.get("raw_stream"):
                  parsed_sse = parse_sse_text("".join(state["raw_stream"]))
                  if parsed_sse.strip():
                      return deep_repair(parsed_sse)
              if last_text:
                  return deep_repair(last_text)

              return ""

          def build_timeline_chunks(transcript_path="transcript.json", max_chars=2200):
              with open(transcript_path, "r", encoding="utf-8") as f:
                  data = json.load(f)

              movie_title = data.get("movie_title", "Untitled")
              segments = data.get("segments", [])

              lines = []
              for s in segments:
                  s_id = f"S{int(s['id']):04d}"
                  st = float(s["start"])
                  en = float(s["end"])
                  txt = str(s.get("text", "")).strip()
                  lines.append(f"[{s_id} | {st:.2f}s - {en:.2f}s] {txt}")

              chunks = []
              cur = []
              cur_len = 0
              for line in lines:
                  line_len = len(line) + 1
                  if cur_len + line_len > max_chars and cur:
                      chunks.append(list(cur))
                      overlap = cur[-2:] if len(cur) >= 2 else cur
                      cur = list(overlap)
                      cur_len = sum(len(l) + 1 for l in cur)
                  cur.append(line)
                  cur_len += line_len
              if cur:
                  chunks.append(cur)

              return movie_title, chunks

          def sanitize_and_clamp_beats(raw_beats, max_duration=MAX_CLIP_DURATION):
              """
              Preserves complete grammatical sentences.
              Never slices words in half. Clamps video cut window to <= 3.0s.
              """
              refined = []
              for b in raw_beats:
                  narr = deep_repair(b.get("narration", "")).strip()
                  # Strip stray English alphabetic noise if model outputted markdown labels
                  narr = re.sub(r"\b[A-Za-z]\b", "", narr).strip()
                  if not narr:
                      continue

                  st = round(float(b.get("start_sec") or b.get("target_window", {}).get("start", 0.0)), 2)
                  en = round(float(b.get("end_sec") or b.get("target_window", {}).get("end", st + 2.8)), 2)

                  if en <= st:
                      en = round(st + 2.8, 2)

                  # If window exceeds 3.0s, clamp the visual window without cutting narration!
                  dur = round(en - st, 2)
                  if dur > max_duration:
                      en = round(st + max_duration, 2)
                      dur = max_duration

                  words = narr.split()
                  refined.append({
                      "narration": narr,
                      "start_sec": st,
                      "end_sec": en,
                      "duration": dur,
                      "word_count": len(words)
                  })
              return refined

          browser = None
          context = None
          page = None

          def start_fresh_browser(playwright_runner):
              global browser, context, page
              if browser:
                  try: browser.close()
                  except Exception: pass
              browser = playwright_runner.chromium.launch(
                  headless=not HEADED,
                  proxy={"server": BROWSER_PROXY},
                  args=["--disable-dev-shm-usage", "--disable-blink-features=AutomationControlled"]
              )
              context = browser.new_context(
                  viewport={"width": 1440, "height": 1000},
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36",
                  permissions=["clipboard-read", "clipboard-write"]
              )
              context.add_init_script("Object.defineProperty(navigator,'webdriver',{get:()=>undefined})")
              page = context.new_page()

          with sync_playwright() as p:
              start_fresh_browser(p)

              # PROBE MODE
              if RUN_MODE == "probe":
                  log("==================== RUNNING PROBE MODE ====================")
                  log("Opening https://duck.ai/chat ...")
                  page.goto("https://duck.ai/chat", wait_until="domcontentloaded", timeout=75000)
                  page.wait_for_timeout(3000)

                  box = get_prompt_box(page)
                  box.wait_for(state="visible", timeout=40000)

                  probe_prompt = 'Reply with exactly this JSON and nothing else: {"ok": true, "hindi": "नमस्ते"}'
                  state = {"raw_stream": [], "chat_done": False, "rate_limited": False}

                  def on_resp(resp):
                      if "/duckchat/v1/chat" in resp.url and resp.request.method == "POST":
                          if resp.status == 418: state["rate_limited"] = True
                          try:
                              body = resp.body().decode("utf-8", errors="replace")
                              state["raw_stream"].append(body)
                          except Exception: pass
                  page.on("response", on_resp)

                  def on_req_finish(req):
                      if "/duckchat/v1/chat" in req.url and req.method == "POST":
                          state["chat_done"] = True
                  page.on("requestfinished", on_req_finish)

                  submit_prompt(page, box, probe_prompt, context)
                  result_text = wait_for_text_generation(page, state, max_wait=45)
                  parsed = parse_first_balanced_json(result_text)
                  log(f"Probe Parsed JSON: {parsed}")

                  if parsed and parsed.get("ok") is True and parsed.get("hindi") == "नमस्ते":
                      log("Probe SUCCESS!")
                      sys.exit(0)
                  else:
                      log("Probe FAILED validation.")
                      sys.exit(1)

              # FULL MODE
              log("==================== RUNNING FULL STORY PIPELINE ====================")
              movie_title, chunks = build_timeline_chunks("transcript.json", max_chars=2200)
              log(f"Loaded '{movie_title}' with {len(chunks)} chunks.")

              pipeline_state = {"completed_chunks": [], "beats": [], "characters": {}}
              if STATE_FILE.exists():
                  try:
                      with open(STATE_FILE, "r", encoding="utf-8") as sf:
                          loaded = json.load(sf)
                          if isinstance(loaded, dict):
                              pipeline_state = deep_repair(loaded)
                  except Exception: pass

              running_story_summary = "कहानी की शुरुआत।"
              all_beats = pipeline_state.get("beats", [])
              beat_counter = len(all_beats) + 1

              for c_idx, chunk_lines in enumerate(chunks):
                  chunk_id = f"chunk_{c_idx+1}"
                  if chunk_id in pipeline_state.get("completed_chunks", []):
                      log(f"Chunk {chunk_id} already generated. Skipping.")
                      continue

                  log(f"\n==================== PROCESSING: {chunk_id} ({c_idx+1}/{len(chunks)}) ====================")
                  chunk_done = False

                  for attempt in range(1, MAX_ATTEMPTS + 1):
                      state = {"raw_stream": [], "chat_done": False, "rate_limited": False}

                      def on_response(resp):
                          if "/duckchat/v1/chat" in resp.url and resp.request.method == "POST":
                              if resp.status == 418:
                                  state["rate_limited"] = True
                              try:
                                  body = resp.body().decode("utf-8", errors="replace")
                                  state["raw_stream"].append(body)
                              except Exception: pass
                      page.on("response", on_response)

                      def on_request_finished(req):
                          if req.method == "POST" and "/duckchat/v1/chat" in req.url:
                              state["chat_done"] = True
                      page.on("requestfinished", on_request_finished)

                      try:
                          is_in_chat = bool(page and "chatID=" in page.url)
                          chunk_text = "\n".join(chunk_lines)

                          # ------------------ PASS 1: DRAFT PROMPT ------------------
                          draft_prompt = (
                              f"You are a top-tier Hindi YouTube movie recap narrator (YouTube Movie Explanation style).\n"
                              f"Movie: {movie_title}.\n"
                              f"Previous Context: {running_story_summary}\n\n"
                              f"Transcript Segments:\n{chunk_text}\n\n"
                              "STORYTELLING & EDITING RULES:\n"
                              "1. NATURAL CONVERSATIONAL HINDI (बोलचाल की हिंदी): Narration must be written in Devanagari script using natural, engaging spoken Hindi. Use common conversational terms in Devanagari (केस, मर्डर, सस्पेक्ट, क्लब, ड्रग्स, डिटेक्टिव, पुलिस, विटनेस, सबूत, सीन). Do NOT use stiff Sanskrit bookish words like 'वरिष्ठ अधिकारी' or 'नशीले पदार्थ'.\n"
                              "2. SCENE LOGIC & WHO IS ON SCREEN: Clearly distinguish between who is physically ON SCREEN versus who is only being TALKED ABOUT. For example, if Dan tells Chloe about Lucifer, Dan and Chloe are on screen, NOT Lucifer. Explicitly narrate the transition when a character goes to a new location.\n"
                              "3. COMPLETE INDEPENDENT SENTENCES: Every single beat must be a complete, punchy sentence of 6 to 9 words. NEVER split a sentence across multiple beats!\n"
                              "4. CLIP TIMINGS: Every beat represents a cut between 2.0s and 3.0s max (end_sec - start_sec <= 3.0s).\n"
                              "5. OUTPUT STRICT JSON ONLY:\n"
                              "{\n"
                              '  "summary": "2 वाक्य में इस पूरे दृश्य का स्पष्ट सारांश",\n'
                              '  "characters": [{"name": "Chloe", "hindi_name": "क्लो", "who": "डिटेक्टिव"}],\n'
                              '  "beats": [\n'
                              '    {"narration": "डिटेक्टिव क्लो मर्डर सीन पर सबूत जुटाने पहुंचती है।", "start_sec": 1.2, "end_sec": 3.9},\n'
                              '    {"narration": "सीनियर ऑफिसर इस केस को मामूली ड्रग ओवरडोज बताता है।", "start_sec": 14.1, "end_sec": 16.8}\n'
                              '  ]\n'
                              "}"
                          )

                          if not is_in_chat:
                              log("Opening https://duck.ai/chat ...")
                              page.goto("https://duck.ai/chat", wait_until="domcontentloaded", timeout=75000)
                              page.wait_for_timeout(3000)

                          box = get_prompt_box(page)
                          box.wait_for(state="visible", timeout=40000)

                          log(f"Submitting PASS 1 (Drafting) for {chunk_id}...")
                          submit_prompt(page, box, draft_prompt, context)

                          # Fast-fail check
                          confirmed = False
                          for tick in range(1, 11):
                              page.wait_for_timeout(1000)
                              if "chatID=" in page.url or len(state["raw_stream"]) > 0:
                                  confirmed = True; break
                              stop_btn = page.locator("button:has-text('Stop generating'), button:has-text('Stop')")
                              if stop_btn.count() > 0 and stop_btn.first.is_visible():
                                  confirmed = True; break
                              click_ask_button(page)
                              box.press("Enter")

                          if not confirmed:
                              snap(page, f"submit_failed_{chunk_id}")
                              raise RuntimeError(f"Prompt failed to submit for {chunk_id}")

                          draft_raw = wait_for_text_generation(page, state, max_wait=TEXT_WAIT)
                          draft_parsed = parse_first_balanced_json(draft_raw)

                          if not draft_parsed or not isinstance(draft_parsed.get("beats"), list) or len(draft_parsed.get("beats")) == 0:
                              raise RuntimeError(f"Draft JSON invalid for {chunk_id}: {draft_raw[:150]}")

                          log(f"PASS 1 Draft received ({len(draft_parsed.get('beats', []))} beats). Starting PASS 2 (Audit & Polish)...")

                          # ------------------ PASS 2: AUDIT & POLISH PROMPT ------------------
                          # Sent directly in the same chat session
                          refine_prompt = (
                              "Now strictly AUDIT and POLISH your JSON response according to these 4 quality checks:\n"
                              "1. TONE CHECK: Is it natural conversational Hindi (Devanagari) that YouTube recap viewers love? Remove all stiff, robotic, or textbook phrases.\n"
                              "2. SCENE & CHARACTER CONTINUITY: Did you verify who is physically on screen vs who is being discussed? Make sure scene transitions (e.g., Chloe moving to the club) are clearly stated.\n"
                              "3. SENTENCE COMPLETENESS: Ensure EVERY beat is a 100% complete, standalone sentence (6-9 words). NO broken clauses, NO trailing phrases.\n"
                              "4. TIMINGS: Ensure every beat has (end_sec - start_sec) <= 3.0s.\n\n"
                              "Output ONLY the final, polished JSON with the exact same format: {\"summary\": ..., \"characters\": [...], \"beats\": [...]}."
                          )

                          state["raw_stream"] = []
                          state["chat_done"] = False

                          page.wait_for_timeout(1500)
                          box = get_prompt_box(page)
                          box.wait_for(state="visible", timeout=20000)
                          submit_prompt(page, box, refine_prompt, context)

                          refined_raw = wait_for_text_generation(page, state, max_wait=TEXT_WAIT)
                          refined_parsed = parse_first_balanced_json(refined_raw)

                          # Use refined JSON if valid; fallback to draft if polisher missed JSON format
                          if refined_parsed and isinstance(refined_parsed.get("beats"), list) and len(refined_parsed.get("beats")) > 0:
                              parsed = refined_parsed
                              log(f"PASS 2 Polish succeeded for {chunk_id}!")
                          else:
                              log(f"PASS 2 parsing missed, falling back to PASS 1 draft.")
                              parsed = draft_parsed

                          running_story_summary = parsed.get("summary", running_story_summary)

                          if "characters" not in pipeline_state:
                              pipeline_state["characters"] = {}

                          for ch in parsed.get("characters", []):
                              if isinstance(ch, dict) and ch.get("name"):
                                  pipeline_state["characters"][ch["name"]] = ch

                          sanitized_beats = sanitize_and_clamp_beats(parsed.get("beats", []))

                          for b in sanitized_beats:
                              st_s = b["start_sec"]
                              en_s = b["end_sec"]
                              beat_obj = {
                                  "beat_id": f"B{beat_counter:04d}",
                                  "narration": b["narration"],
                                  "target_window": {"start": st_s, "end": en_s},
                                  "portion": {"start": st_s, "end": en_s},
                                  "duration": b["duration"],
                                  "word_count": b["word_count"]
                              }
                              all_beats.append(beat_obj)
                              beat_counter += 1

                          if "completed_chunks" not in pipeline_state:
                              pipeline_state["completed_chunks"] = []
                          pipeline_state["completed_chunks"].append(chunk_id)
                          pipeline_state["beats"] = all_beats

                          with open(STATE_FILE, "w", encoding="utf-8") as sf:
                              json.dump(pipeline_state, sf, indent=2, ensure_ascii=False)

                          log(f"SUCCESS: Completed {chunk_id} with {len(sanitized_beats)} high-quality beats.")
                          chunk_done = True
                          page.wait_for_timeout(2500)
                          break

                      except Exception as err:
                          log(f"Attempt {attempt} failed on {chunk_id}: {err}")
                          snap(page, f"err_{chunk_id}_a{attempt}")
                          new_tor_circuit()
                          start_fresh_browser(p)

                  if not chunk_done:
                      log(f"Could not complete {chunk_id}. Stopping execution.")
                      break

              reindexed_beats = []
              for idx, b in enumerate(all_beats, 1):
                  b_copy = dict(b)
                  b_copy["beat_id"] = f"B{idx:04d}"
                  reindexed_beats.append(b_copy)

              total_words = sum(b["word_count"] for b in reindexed_beats)
              final_output = {
                  "movie_title": movie_title,
                  "target_minutes": TARGET_MINUTES,
                  "characters": list(pipeline_state.get("characters", {}).values()),
                  "synopsis": running_story_summary,
                  "total_beats": len(reindexed_beats),
                  "total_words": total_words,
                  "beats": reindexed_beats
              }

              Path("story_beats.json").write_text(
                  json.dumps(final_output, ensure_ascii=False, indent=2), encoding="utf-8"
              )
              log(f"ALL CHUNKS COMPLETE: Wrote story_beats.json with {len(reindexed_beats)} beats ({total_words} words).")

              if browser:
                  browser.close()
          PY

          if [ "$HEADED" = "true" ]; then
            xvfb-run -a --server-args="-screen 0 1440x1000x24" python generate_story.py
          else
            python generate_story.py
          fi

      - name: Kill leftover browser processes
        if: always()
        run: |
          pkill -9 -f chrome || true
          pkill -9 -f Xvfb || true

      - name: Commit and push generated story frames
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f story_beats.json ]; then
            git add -f story_beats.json build/pipeline_state.json || true
            if ! git diff --cached --quiet; then
              git commit -m "Generate YouTube Hindi movie recap story beats [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duck-ai-debug
          path: debug/
          if-no-files-found: ignore
