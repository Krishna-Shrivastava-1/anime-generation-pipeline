name: Generate Hindi YouTube Movie Recap

"on":
  workflow_dispatch:
    inputs:
      headed:
        description: "Run non-headless Chrome under Xvfb"
        required: true
        type: boolean
        default: true
      target_recap_mins:
        description: "Target recap duration in minutes (e.g. 5)"
        required: true
        default: "5"

permissions:
  contents: write

jobs:
  generate-recap:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tor & Dependencies
        timeout-minutes: 4
        run: |
          sudo apt-get update
          sudo apt-get install -y tor netcat-openbsd xvfb
          sudo service tor start
          for i in {1..30}; do
            if nc -z 127.0.0.1 9050; then echo "Tor ready"; break; fi
            sleep 2
          done
          nc -z 127.0.0.1 9050

      - name: Install Python dependencies
        timeout-minutes: 6
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Automate Duck.ai Story Pipeline
        timeout-minutes: 110
        env:
          HEADED: "${{ inputs.headed }}"
          TARGET_RECAP_MINS: "${{ inputs.target_recap_mins }}"
        run: |
          mkdir -p debug
          RUNNER_CMD="python3 -"
          if [ "$HEADED" = "true" ]; then
            RUNNER_CMD="xvfb-run -a --server-args=\"-screen 0 1440x1000x24\" python3 -"
          fi

          eval "$RUNNER_CMD" <<'EOF'
          import os, re, sys, json, subprocess, time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          HEADED = os.environ.get("HEADED") == "true"
          TARGET_MINS = float(os.environ.get("TARGET_RECAP_MINS", "5"))
          TARGET_WORDS = int(TARGET_MINS * 140)

          PART_SECONDS = 150
          PART_CHARS = 1500
          MAX_WAIT = 180
          BROWSER_PROXY = "socks5://127.0.0.1:9050"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36"
          MODAL_LABELS = re.compile(
              r"^(agree and continue|continue|i agree|accept|accept all|get started|got it|next|done|dismiss)$", re.I
          )

          state = {"browser": None, "context": None, "page": None}

          def log(msg):
              print(f"[{time.strftime('%H:%M:%S')}] {msg}", flush=True)

          def scroll_to_bottom(page):
              try:
                  page.evaluate("""() => {
                      window.scrollTo(0, document.body.scrollHeight);
                      for (const el of document.querySelectorAll('*')) {
                          if (el.scrollHeight > el.clientHeight + 20) { el.scrollTop = el.scrollHeight; }
                      }
                  }""")
              except Exception:
                  pass

          def start_browser(p):
              for key in ("context", "browser"):
                  if state[key]:
                      try: state[key].close()
                      except Exception: pass
                  state[key] = None
              state["browser"] = p.chromium.launch(
                  headless=not HEADED,
                  proxy={"server": BROWSER_PROXY},
                  args=["--disable-dev-shm-usage", "--disable-blink-features=AutomationControlled"],
              )

          def dismiss_modals(page):
              try:
                  buttons = page.get_by_role("button", name=MODAL_LABELS)
                  for i in range(buttons.count()):
                      btn = buttons.nth(i)
                      if btn.is_visible():
                          btn.click(timeout=1500)
                          page.wait_for_timeout(400)
                          break
              except Exception:
                  pass

          def open_chat():
              if state["context"]:
                  try: state["context"].close()
                  except Exception: pass
              ctx = state["browser"].new_context(viewport={"width": 1440, "height": 1000}, user_agent=UA)
              ctx.add_init_script("Object.defineProperty(navigator,'webdriver',{get:()=>undefined})")
              pg = ctx.new_page()
              state["context"], state["page"] = ctx, pg
              log("Navigating to https://duck.ai/chat ...")
              pg.goto("https://duck.ai/chat", wait_until="domcontentloaded", timeout=60000)
              pg.wait_for_timeout(2500)
              dismiss_modals(pg)
              return pg

          def check_and_click_continue(page):
              try:
                  btn = page.locator("button:has-text('Continue generating'), button:has-text('Continue response')").first
                  if btn.count() > 0 and btn.is_visible():
                      btn.click(timeout=2000)
                      page.wait_for_timeout(1000)
              except Exception:
                  pass

          def is_generating(page):
              try:
                  b = page.locator("button[aria-label*='Stop' i], button:has-text('Stop')")
                  return b.count() > 0 and b.first.is_visible()
              except Exception:
                  return False

          def submit_prompt(page, text):
              dismiss_modals(page)
              box = page.locator("textarea[name='user-prompt'], textarea").first
              box.wait_for(state="visible", timeout=30000)
              box.click()
              page.keyboard.press("Control+A")
              page.keyboard.press("Backspace")
              box.fill(text)
              box.dispatch_event("input")
              page.wait_for_timeout(500)

              send_btn = page.locator("button[type='submit']:not([disabled]), button[aria-label*='Send' i]:not([disabled])").first
              if send_btn.count() > 0 and send_btn.is_visible():
                  send_btn.click(timeout=2500)
              else:
                  box.press("Enter")
              page.wait_for_timeout(1500)
              dismiss_modals(page)

          def extract_payload(body, tag):
              start_m = f"###START-{tag}###"
              end_m = f"###END-{tag}###"
              idx = body.rfind(start_m)
              if idx != -1:
                  tail = body[idx + len(start_m):]
                  brace = tail.find("[") if "[" in tail else tail.find("{")
                  if brace != -1:
                      tail = tail[brace:]
                      e = tail.find(end_m)
                      if e != -1:
                          return tail[:e].strip(), True
                      return tail.strip(), False
              return None, False

          def wait_for_payload(page, tag, max_wait=MAX_WAIT):
              t0 = time.time()
              last_len, stable = -1, 0
              while time.time() - t0 < max_wait:
                  dismiss_modals(page)
                  check_and_click_continue(page)
                  scroll_to_bottom(page)
                  body = page.inner_text("body", timeout=5000)
                  text, finished = extract_payload(body, tag)
                  if finished:
                      return text
                  stable = stable + 1 if len(body) == last_len else 0
                  last_len = len(body)
                  if not is_generating(page) and stable >= 5 and text:
                      return text
                  page.wait_for_timeout(1000)
              raise TimeoutError(f"Response for {tag} timed out.")

          def parse_json_safely(text):
              if not text: return None
              clean = re.sub(r"```(?:json)?", "", text).strip()
              try: return json.loads(clean)
              except Exception: pass
              s = min([p for p in [clean.find("{"), clean.find("[")] if p != -1], default=-1)
              e = max([clean.rfind("}"), clean.rfind("]")])
              if s != -1 and e > s:
                  try: return json.loads(clean[s:e+1])
                  except Exception: pass
              return None

          t_file = Path("transcript.json")
          if not t_file.exists():
              raise FileNotFoundError("transcript.json missing!")
          transcript_data = json.loads(t_file.read_text(encoding="utf-8"))
          segs = transcript_data.get("segments", [])
          for i, s in enumerate(segs):
              s["_id"] = i + 1
              s["start"] = float(s["start"])
              s["end"] = float(s["end"])
              s["text"] = str(s["text"]).strip()

          chunks, cur_first, cur_chars = [], 1, 0
          for s in segs:
              cur_chars += len(s["text"]) + 15
              if s["end"] - segs[cur_first - 1]["start"] >= PART_SECONDS or cur_chars >= PART_CHARS:
                  chunks.append((cur_first, s["_id"]))
                  cur_first, cur_chars = s["_id"] + 1, 0
          if cur_first <= len(segs):
              chunks.append((cur_first, len(segs)))

          log(f"Transcript broken into {len(chunks)} chronological parts.")
          all_story_beats = []

          with sync_playwright() as p:
              start_browser(p)
              open_chat()
              page = state["page"]

              init_prompt = (
                  "You are a professional Hindi YouTube Movie Recap voiceover writer.\n"
                  "I will send transcript parts one by one. For each part, write 2 to 3 engaging recap scenes in Hindi.\n"
                  "RULES:\n"
                  "1. Write third-person voiceover narration explaining character actions and motives.\n"
                  "2. Use recap bridges ('कहानी की शुरुआत में', 'इसके बाद', 'तभी वहां', 'हालांकि').\n"
                  "3. Assign accurate video start and end timestamps from the lines provided.\n"
                  "4. Always output JSON inside the requested markers."
              )
              submit_prompt(page, init_prompt)
              time.sleep(2)

              for ci, (f_id, l_id) in enumerate(chunks):
                  tag = f"PART{ci + 1}"
                  act_lines = [f"[{s['start']:.0f}s-{s['end']:.0f}s] {s['text']}" for s in segs[f_id - 1:l_id]]
                  part_start = segs[f_id-1]['start']
                  part_end = segs[l_id-1]['end']

                  prompt = (
                      f"Write 2 to 3 Hindi recap voiceover scenes for Part {ci + 1}/{len(chunks)} ({part_start:.0f}s - {part_end:.0f}s):\n"
                      f"TRANSCRIPT:\n" + " ".join(act_lines) + "\n\n"
                      f"Return JSON:\n"
                      f"###START-{tag}###\n"
                      f"[\n"
                      f"  {{\n"
                      f"    \"clip_start\": {part_start:.1f},\n"
                      f"    \"clip_end\": {min(part_start + 6.0, part_end):.1f},\n"
                      f"    \"narration\": \"Hindi voiceover narration for this part...\"\n"
                      f"  }}\n"
                      f"]\n"
                      f"###END-{tag}###"
                  )

                  log(f"Generating recap for Part {ci + 1}/{len(chunks)} ({part_start:.0f}s - {part_end:.0f}s)...")
                  submit_prompt(page, prompt)
                  raw = wait_for_payload(page, tag)
                  parsed = parse_json_safely(raw)

                  if isinstance(parsed, list) and len(parsed) > 0:
                      all_story_beats.extend(parsed)
                      log(f"[+] Part {ci + 1} added {len(parsed)} scenes. (Total accumulated: {len(all_story_beats)})")
                  else:
                      log(f"[-] Part {ci + 1} parsing failed or empty. Skipping.")

              if len(all_story_beats) == 0:
                  raise ValueError("Failed to generate any scenes across all parts.")

              total_words = 0
              for idx, b in enumerate(all_story_beats):
                  b["scene"] = idx + 1
                  nar = b.get("narration", "")
                  w_count = len(nar.split())
                  total_words += w_count
                  b["words"] = w_count
                  cs = max(0.0, float(b.get("clip_start", 0)))
                  ce = max(cs + 2.0, float(b.get("clip_end", cs + 6.0)))
                  b["clip_start"] = round(cs, 2)
                  b["clip_end"] = round(ce, 2)
                  b["clip_duration"] = round(ce - cs, 2)

              output_data = {
                  "movie_title": transcript_data.get("movie_title", "movie"),
                  "total_original_duration": transcript_data.get("duration", segs[-1]["end"]),
                  "target_duration_minutes": TARGET_MINS,
                  "total_words": total_words,
                  "estimated_audio_minutes": round(total_words / 140, 2),
                  "scenes_count": len(all_story_beats),
                  "story_beats": all_story_beats,
              }

              Path("story_beats.json").write_text(json.dumps(output_data, indent=2, ensure_ascii=False), encoding="utf-8")
              log(f"SUCCESS! Created story_beats.json with {len(all_story_beats)} scenes ({total_words} words).")
              state["browser"].close()
          EOF

      - name: Commit and push story_beats.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f story_beats.json ]; then
            git add -f story_beats.json
            if ! git diff --cached --quiet; then
              git commit -m "Update story_beats.json [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
              echo "Successfully pushed story_beats.json"
            else
              echo "No changes in story_beats.json"
            fi
          fi

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duck-ai-debug
          path: debug/
          if-no-files-found: ignore
