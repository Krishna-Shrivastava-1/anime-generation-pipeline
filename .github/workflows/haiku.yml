              for idx, b in enumerate(tail_beats, 1):
                  verbatim_lines.append(f"[Final Enhanced Beat {idx}] {b['narration']}")
              last_sentence = tail_beats[-1]["narration"] if tail_beats else ""

              merged = (
                  handoff_text.strip()
                  + "\n\n---\n**FINAL ENHANCED CONTINUATION BEATS (AUTHORITATIVE VERBATIM FROM PROMPT 4 — CONTINUE FROM HERE):**\n"
                  + "\n".join(verbatim_lines)
                  + f"\n**EXACT LAST NARRATION BEAT TO CONTINUE AFTER:** {last_sentence}"
              )
              return merged

          def normalize_chunk_beats(raw_obj):
              obj = deep_repair(raw_obj)
              beats = obj.get("beats", [])
              norm_beats = []
              for b in beats:
                  if not isinstance(b, dict):
                      continue
                  narr = str(b.get("narration", "")).strip()
                  if not narr:
                      continue
                  wc = len(narr.split())
                  est_dur = round((wc / 140.0) * 60.0, 2)
                  raw_clips = b.get("clips", [])
                  norm_clips = []
                  if isinstance(raw_clips, list):
                      for c in raw_clips:
                          if not isinstance(c, dict):
                              continue
                          st = round(float(c.get("start", 0.0)), 2)
                          en = round(float(c.get("end", st)), 2)
                          if en <= st:
                              continue
                          dur = round(en - st, 2)
                          if dur > MAX_CLIP_DURATION:
                              en = round(st + MAX_CLIP_DURATION, 2)
                              dur = MAX_CLIP_DURATION
                          norm_clips.append({
                              "start": st,
                              "end": en,
                              "duration": dur,
                              "scene_context": str(c.get("scene_context", "")).strip()
                          })
                  norm_beats.append({
                      "narration": narr,
                      "word_count": wc,
                      "estimated_duration": b.get("estimated_duration") or est_dur,
                      "is_scene_bridge": bool(b.get("is_scene_bridge", False)),
                      "clips": norm_clips
                  })
