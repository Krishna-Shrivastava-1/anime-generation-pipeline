                  raw_joined = raw_joined[:max(1500, len(raw_joined) - over)]
                  prompt = render(luna_payload, raw_joined, up_ctx[:700], bible_txt[:500])

              return {"prompt_chars": len(prompt), "prompt": prompt}

          def build_merged_handoff_for_next_chunk(handoff_text, verified_beats):
              tail = verified_beats[-3:] if len(verified_beats) >= 3 else verified_beats
              lines = [f"[Verified Final Beat {i}] {b['narration']}" for i, b in enumerate(tail, 1)]
              last_line = tail[-1]["narration"] if tail else ""
              return (
                  handoff_text.strip()
                  + "\n\n---\n**AUTHORITATIVE VERIFIED ENDING BEATS (CONTINUE FROM HERE):**\n"
                  + "\n".join(lines)
                  + f"\n**EXACT LAST NARRATION BEAT TO CONTINUE AFTER:** {last_line}"
              )

          # ------------------ PLAYWRIGHT SETUP & EXECUTION ------------------
          browser = context = page = None
          current_chat_state = {"raw_stream": [], "chat_done": False, "rate_limited": False}

          def launch_browser(pw):
              global browser, context, page
              if browser:
                  try: browser.close()
                  except Exception: pass
              browser = pw.chromium.launch(headless=not HEADED, proxy={"server": BROWSER_PROXY}, args=["--disable-dev-shm-usage", "--disable-blink-features=AutomationControlled"])
              context = browser.new_context(viewport={"width": 1440, "height": 1000}, user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36", permissions=["clipboard-read", "clipboard-write"])
              context.add_init_script(FETCH_HOOK_JS)
              page = context.new_page()

              def is_chat_req(req):
                  cu = req.url.split("?")[0]
                  return req.method == "POST" and ("/duckchat/v1/chat" in cu or cu.endswith("/chat"))

              page.on("response", lambda r: (
                  log(f"Network chat HTTP {r.status} -> {r.url}"),
                  current_chat_state.__setitem__("rate_limited", True) if r.status in (418, 429) else None
              ) if is_chat_req(r.request) else None)

              def on_done(req):
                  if is_chat_req(req):
                      try:
                          resp = req.response()
                          if resp:
                              b = resp.body().decode("utf-8", errors="replace")
                              if b: current_chat_state["raw_stream"].append(b)
                      except Exception:
                          pass
                      current_chat_state["chat_done"] = True
              page.on("requestfinished", on_done)

          def open_fresh_duckai_chat(model_name, use_reasoning, take_verify_snap=False, snap_prefix="settings"):
              page.goto("https://duck.ai/chat", wait_until="domcontentloaded", timeout=75000)
              wait_for_duckai_ui_ready(page, timeout_ms=45000)
              page.wait_for_timeout(1500)
              configure_duckai_settings(page, model_name, use_reasoning, ENABLE_WEB_SEARCH, take_verify_snap=take_verify_snap, snap_prefix=snap_prefix)

          with sync_playwright() as p:
              launch_browser(p)

              if RUN_MODE == "probe":
                  open_fresh_duckai_chat(DRAFT_MODEL, False, take_verify_snap=True, snap_prefix="probe_draft")
                  box = get_prompt_box(page); box.wait_for(state="visible", timeout=40000)
                  probe_p = 'Output valid JSON only: {"status": "ready", "hindi": "कहानी शुरू"}'
                  send_and_confirm(page, box, probe_p, context, current_chat_state, "ProbeDraft", is_new_chat=True)
                  out = wait_for_response(page, current_chat_state, prompt_text=probe_p, max_wait=60, expect_json=True, expect_beats=False)
                  log(f"Probe Draft Result: {parse_first_balanced_json(out, require_beats=False)}")
                  open_fresh_duckai_chat(CRITIC_MODEL, ENABLE_REASONING, take_verify_snap=True, snap_prefix="probe_critic")
                  box = get_prompt_box(page); box.wait_for(state="visible", timeout=40000)
                  send_and_confirm(page, box, probe_p, context, current_chat_state, "ProbeCritic", is_new_chat=True)
                  out2 = wait_for_response(page, current_chat_state, prompt_text=probe_p, max_wait=60, expect_json=True, expect_beats=False)
                  parsed2 = parse_first_balanced_json(out2, require_beats=False)
                  log(f"Probe Critic Result: {parsed2}")
                  browser.close()
                  sys.exit(0 if (parsed2 and parsed2.get("status") == "ready") else 1)

              log(f"Starting Dual-Model Engine | Draft: '{DRAFT_MODEL}' | Critic: '{CRITIC_MODEL}' | Target: {TARGET_MINUTES}m")
              transcript_data = load_transcript("transcript.json")
              total_segments = len(transcript_data.get("segments", []))
              movie_title = INPUT_MOVIE_TITLE or str(transcript_data.get("movie_title") or "Untitled")

              pipeline_state = {"episode_bible": "", "next_segment_idx": 0, "chunk_num": 0, "beats": [], "characters": {}, "synopses": [], "continuity_handoff": ""}
              if STATE_FILE.exists():
                  try:
                      loaded = json.load(open(STATE_FILE, "r", encoding="utf-8"))
                      if isinstance(loaded, dict): pipeline_state = deep_repair(loaded)
                  except Exception:
                      pass

              draft_snap_done = False
              critic_snap_done = False

              if ENABLE_WEB_SEARCH and not pipeline_state.get("episode_bible"):
                  log(f"Running PROMPT 0 on '{CRITIC_MODEL}' (Web Search Scene Map)...")
                  p0_txt = build_prompt_0(movie_title)
                  for att in range(1, 3):
                      try:
                          open_fresh_duckai_chat(CRITIC_MODEL, ENABLE_REASONING, take_verify_snap=(not critic_snap_done), snap_prefix="critic")
                          critic_snap_done = True
                          box = get_prompt_box(page); box.wait_for(state="visible", timeout=40000)
                          if not send_and_confirm(page, box, p0_txt, context, current_chat_state, "PROMPT_0", is_new_chat=True):
                              raise RuntimeError("Prompt 0 not acknowledged.")
                          bible = wait_for_response(page, current_chat_state, prompt_text=p0_txt, max_wait=180, expect_json=False, expect_beats=False)
                          if len(bible.strip()) >= 80:
                              pipeline_state["episode_bible"] = bible.strip()
                              (DEBUG_DIR / "episode_bible_p0.txt").write_text(bible.strip(), encoding="utf-8")
                              json.dump(pipeline_state, open(STATE_FILE, "w", encoding="utf-8"), indent=2, ensure_ascii=False)
                              log(f"SUCCESS PROMPT 0 ({len(bible.strip())} chars).")
                              break
                      except Exception as e:
                          log(f"PROMPT 0 att {att} notice: {e}")
                          if att < 2: renew_tor(); launch_browser(p)

              while pipeline_state["next_segment_idx"] < total_segments:
                  cur_idx = pipeline_state["next_segment_idx"]
                  chunk_num = pipeline_state["chunk_num"] + 1
                  nb_num = len(pipeline_state["beats"]) + 1
                  nc_num = sum(len(b.get("clips", [])) for b in pipeline_state["beats"]) + 1
                  bible = pipeline_state.get("episode_bible", "")

                  if chunk_num == 1 or not pipeline_state.get("continuity_handoff"):
                      chunk_meta, next_idx = build_prompt_1_chunk(transcript_data, cur_idx, bible, INPUT_HINTS)
                  else:
                      chunk_meta, next_idx = build_prompt_3_chunk(transcript_data, cur_idx, pipeline_state["continuity_handoff"], bible, nb_num, nc_num)
                  if not chunk_meta:
                      break

                  log(f"\n=== CHUNK {chunk_num} ({chunk_meta['prompt_type']} on '{DRAFT_MODEL}'): segs {chunk_meta['start_idx']+1}..{chunk_meta['end_idx']}/{total_segments} ({chunk_meta['chunk_pct']}% -> ~{chunk_meta['words_text']} words) ===")

                  draft_norm = None
                  for att in range(1, MAX_ATTEMPTS + 1):
                      try:
                          open_fresh_duckai_chat(DRAFT_MODEL, False, take_verify_snap=(not draft_snap_done), snap_prefix="draft")
                          draft_snap_done = True
                          box = get_prompt_box(page); box.wait_for(state="visible", timeout=40000)
                          if not send_and_confirm(page, box, chunk_meta["prompt"], context, current_chat_state, f"Chunk {chunk_num} {chunk_meta['prompt_type']}", is_new_chat=True):
                              raise RuntimeError("Draft submission not acknowledged.")
                          raw = wait_for_response(page, current_chat_state, prompt_text=chunk_meta["prompt"], max_wait=TEXT_WAIT, expect_json=True, expect_beats=True, prev_code_blocks=0)
                          (DEBUG_DIR / f"raw_chunk_{chunk_num}_att_{att}.txt").write_text(raw, encoding="utf-8")
                          pj = parse_first_balanced_json(raw, require_beats=True)
                          if not is_valid_recap_json(pj):
                              raise RuntimeError("Invalid draft JSON beats.")
                          draft_norm = normalize_chunk_beats(pj)
                          log(f"SUCCESS {chunk_meta['prompt_type']} Draft: +{len(draft_norm['beats'])} beats.")
                          break
                      except Exception as e:
                          log(f"Draft Chunk {chunk_num} att {att} failed: {e}")
                          snap(page, f"err_draft_c{chunk_num}_a{att}")
                          if att < MAX_ATTEMPTS: renew_tor(); launch_browser(p)

                  if draft_norm is None:
                      log(f"CRITICAL: Draft failed on Chunk {chunk_num}. Exiting.")
                      break

                  handoff_text = ""
                  if next_idx < total_segments:
                      p2_meta = build_prompt_2_preview(transcript_data, next_idx)
                      if p2_meta:
                          try:
                              page.wait_for_timeout(1200)
                              box = get_prompt_box(page); box.wait_for(state="visible", timeout=30000)
                              if not send_and_confirm(page, box, p2_meta["prompt"], context, current_chat_state, f"Chunk {chunk_num} PROMPT_2", is_new_chat=False):
                                  raise RuntimeError("Prompt 2 not acknowledged.")
                              rh = wait_for_response(page, current_chat_state, prompt_text=p2_meta["prompt"], max_wait=TEXT_WAIT, expect_json=False, expect_beats=False, prev_code_blocks=count_code_blocks(page))
                              if len(rh.strip()) >= 150:
                                  handoff_text = rh.strip()
                                  (DEBUG_DIR / f"handoff_chunk_{chunk_num}.txt").write_text(handoff_text, encoding="utf-8")
                                  log(f"SUCCESS PROMPT 2 (same chat): {len(handoff_text)} chars.")
                          except Exception as e:
                              log(f"Same-chat PROMPT 2 notice: {e}")

                  prev_ending = pipeline_state["beats"][-1]["narration"] if pipeline_state["beats"] else ""
                  p4_meta = build_prompt_4_enhance(movie_title, chunk_meta, draft_norm, bible, prev_ending, handoff_text, nb_num, nc_num)
                  luna_final = draft_norm
                  try:
                      page.wait_for_timeout(1200)
                      prev_cb = count_code_blocks(page)
                      box = get_prompt_box(page); box.wait_for(state="visible", timeout=30000)
                      if send_and_confirm(page, box, p4_meta["prompt"], context, current_chat_state, f"Chunk {chunk_num} PROMPT_4", is_new_chat=False):
                          r4 = wait_for_response(page, current_chat_state, prompt_text=p4_meta["prompt"], max_wait=TEXT_WAIT, expect_json=True, expect_beats=True, prev_code_blocks=prev_cb)
                          (DEBUG_DIR / f"luna_p4_chunk_{chunk_num}.txt").write_text(r4, encoding="utf-8")
                          pj4 = parse_first_balanced_json(r4, require_beats=True)
                          if is_valid_recap_json(pj4):
                              luna_final = normalize_chunk_beats(pj4)
                              log(f"SUCCESS PROMPT 4 ('{DRAFT_MODEL}'): {len(luna_final['beats'])} beats.")
                  except Exception as e:
                      log(f"Same-chat PROMPT 4 notice: {e}")

                  if next_idx < total_segments and not handoff_text:
                      rec_beats = (pipeline_state["beats"] + luna_final["beats"])[-3:]
                      p2_rec = build_prompt_2_preview(transcript_data, next_idx, recovery_state={"synopses": pipeline_state["synopses"][-2:]}, recovery_beats=rec_beats)
                      for r_att in range(1, 3):
                          try:
                              renew_tor(); launch_browser(p)
                              open_fresh_duckai_chat(DRAFT_MODEL, False, take_verify_snap=False)
                              box = get_prompt_box(page); box.wait_for(state="visible", timeout=40000)
                              if send_and_confirm(page, box, p2_rec["prompt"], context, current_chat_state, f"Chunk {chunk_num} P2_REC", is_new_chat=True):
                                  rh = wait_for_response(page, current_chat_state, prompt_text=p2_rec["prompt"], max_wait=TEXT_WAIT, expect_json=False, expect_beats=False)
                                  if len(rh.strip()) >= 150:
                                      handoff_text = rh.strip()
                                      (DEBUG_DIR / f"handoff_chunk_{chunk_num}_rec.txt").write_text(handoff_text, encoding="utf-8")
                                      break
                          except Exception as re_err:
                              log(f"Recovery PROMPT 2 att {r_att} notice: {re_err}")

                  p5_meta = build_prompt_5_critic(movie_title, transcript_data, chunk_meta, luna_final, bible, prev_ending, handoff_text, nb_num, nc_num)
                  verified_norm = None
                  log(f"Running PROMPT 5 Cross-Check in NEW chat on '{CRITIC_MODEL}' ({p5_meta['prompt_chars']} chars)...")
                  for c_att in range(1, MAX_ATTEMPTS + 1):
                      try:
                          open_fresh_duckai_chat(CRITIC_MODEL, ENABLE_REASONING, take_verify_snap=(not critic_snap_done), snap_prefix="critic")
                          critic_snap_done = True
                          box = get_prompt_box(page); box.wait_for(state="visible", timeout=40000)
                          if not send_and_confirm(page, box, p5_meta["prompt"], context, current_chat_state, f"Chunk {chunk_num} PROMPT_5_CRITIC", is_new_chat=True):
                              raise RuntimeError("Prompt 5 submission not acknowledged.")
                          r5 = wait_for_response(page, current_chat_state, prompt_text=p5_meta["prompt"], max_wait=TEXT_WAIT, expect_json=True, expect_beats=True, prev_code_blocks=0)
                          (DEBUG_DIR / f"haiku_p5_chunk_{chunk_num}_att_{c_att}.txt").write_text(r5, encoding="utf-8")
                          pj5 = parse_first_balanced_json(r5, require_beats=True)
                          if not is_valid_recap_json(pj5):
                              raise RuntimeError("Invalid Prompt 5 JSON beats.")
                          verified_norm = normalize_chunk_beats(pj5)
                          log(f"SUCCESS PROMPT 5 ('{CRITIC_MODEL}'): verified {len(verified_norm['beats'])} beats.")
                          break
                      except Exception as c_err:
                          log(f"PROMPT 5 Chunk {chunk_num} att {c_att} failed: {c_err}")
                          snap(page, f"err_p5_c{chunk_num}_a{c_att}")
                          if c_att < MAX_ATTEMPTS: renew_tor(); launch_browser(p)

                  final_chunk = verified_norm if verified_norm is not None else luna_final
                  if verified_norm is None:
                      log(f"WARNING: Prompt 5 failed on Chunk {chunk_num}; falling back to Luna output.")

                  pipeline_state["beats"].extend(final_chunk["beats"])
                  if final_chunk["synopsis"]:
                      pipeline_state["synopses"].append(final_chunk["synopsis"])
                  for ch in final_chunk.get("characters", []):
                      if isinstance(ch, dict) and ch.get("name"):
                          pipeline_state["characters"][ch["name"]] = ch
                  pipeline_state["next_segment_idx"] = next_idx
                  pipeline_state["chunk_num"] = chunk_num

                  if next_idx < total_segments:
                      if not handoff_text:
                          json.dump(pipeline_state, open(STATE_FILE, "w", encoding="utf-8"), indent=2, ensure_ascii=False)
                          log("CRITICAL: Missing Continuity Handoff. Saved & exiting.")
                          break
                      merged = build_merged_handoff_for_next_chunk(handoff_text, final_chunk["beats"])
                      (DEBUG_DIR / f"merged_handoff_chunk_{chunk_num}.txt").write_text(merged, encoding="utf-8")
                      pipeline_state["continuity_handoff"] = merged
                  else:
                      pipeline_state["continuity_handoff"] = ""

                  json.dump(pipeline_state, open(STATE_FILE, "w", encoding="utf-8"), indent=2, ensure_ascii=False)
                  log(f"Saved Chunk {chunk_num} (total verified beats: {len(pipeline_state['beats'])}, next_idx: {next_idx}/{total_segments}).")

              # ------------------ MERGE & EXPORT FINAL JSON ------------------
              final_beats, total_words, clip_counter = [], 0, 1
              for b_idx, b in enumerate(pipeline_state["beats"], 1):
                  b_copy = {
                      "beat_id": f"B{b_idx:04d}",
                      "narration": b["narration"],
                      "word_count": b["word_count"],
                      "estimated_duration": b["estimated_duration"],
                      "is_scene_bridge": b["is_scene_bridge"],
                      "clips": []
                  }
                  total_words += b["word_count"]
                  for c in b.get("clips", []):
                      b_copy["clips"].append({
                          "clip_id": f"C{clip_counter:04d}",
                          "start": c["start"],
                          "end": c["end"],
                          "duration": c["duration"],
                          "spoken_text": c.get("spoken_text", ""),
                          "spoken_word_count": c.get("spoken_word_count", 0),
                          "estimated_spoken_duration": c.get("estimated_spoken_duration", 0.0),
                          "scene_context": c["scene_context"]
                      })
                      clip_counter += 1
                  final_beats.append(b_copy)

              target_min_val = float(TARGET_MINUTES) if TARGET_MINUTES else None
              final_output = {
                  "movie_title": movie_title,
                  "content_type": INPUT_CONTENT_TYPE or None,
                  "season": INPUT_SEASON or None,
                  "episode": INPUT_EPISODE or None,
                  "part_identifier": INPUT_PART or None,
                  "target_minutes": target_min_val,
                  "estimated_narration_minutes": round(total_words / 140.0, 2),
                  "total_beats": len(final_beats),
                  "total_words": total_words,
                  "characters": list(pipeline_state.get("characters", {}).values()),
                  "synopsis": " ".join(pipeline_state.get("synopses", [])).strip(),
                  "beats": final_beats
              }
              Path("story_beats.json").write_text(json.dumps(final_output, ensure_ascii=False, indent=2), encoding="utf-8")

              preview_lines = [
                  f"=== YOUTUBE MOVIE RECAP SCRIPT: {final_output['movie_title']} ===",
                  f"Est. Runtime: ~{final_output['estimated_narration_minutes']} mins | Target: {final_output['target_minutes']} mins | Beats: {final_output['total_beats']} | Words: {final_output['total_words']}",
                  f"Synopsis: {final_output['synopsis']}\n", "=" * 70
              ]
              for b in final_output["beats"]:
                  preview_lines.append(f"[{b['beat_id']} | Words: {b['word_count']} | Est: {b['estimated_duration']}s]")
                  preview_lines.append(f"Narration: {b['narration']}")
                  for c in b.get("clips", []):
                      preview_lines.append(
                          f"  - {c['clip_id']}: {c['start']}s->{c['end']}s ({c['duration']}s) | TTS~{c['estimated_spoken_duration']}s | Spoken: \"{c['spoken_text']}\""
                      )
                  preview_lines.append("-" * 70)
              Path("script_preview.txt").write_text("\n".join(preview_lines), encoding="utf-8")
              log(f"GENERATION COMPLETE: {len(final_beats)} beats written to story_beats.json & script_preview.txt.")
              if browser:
                  browser.close()
          PY

          if [ "$HEADED" = "true" ]; then
            xvfb-run -a --server-args="-screen 0 1440x1000x24" python recap_engine.py
          else
            python recap_engine.py
          fi

      - name: Kill Background Browser Instances
        if: always()
        run: |
          pkill -9 -f chrome || true
          pkill -9 -f Xvfb || true

      - name: Commit and Push Story Assets & Verification Screenshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f story_beats.json script_preview.txt build/pipeline_state.json debug/*_verified.png debug/*_dropdown_open.png debug/*_tools_open.png || true
          if ! git diff --cached --quiet; then
            git commit -m "Update dual-model phrase-synced Hindi recap JSON [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload Debug Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recap-engine-artifacts
          path: |
            debug/
            script_preview.txt
            story_beats.json
          if-no-files-found: ignore
