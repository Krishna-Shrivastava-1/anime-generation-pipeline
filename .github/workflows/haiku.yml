name: Generate Hindi YouTube Movie Recap Engine

on:
  workflow_dispatch:
    inputs:
      reset_state:
        description: "Clear previous state and generate fresh"
        required: true
        type: boolean
        default: true
      headed:
        description: "Run non-headless Chrome under Xvfb (avoids bot detection)"
        required: true
        type: boolean
        default: true
      mode:
        description: "Execution mode (probe | full)"
        required: true
        type: choice
        options:
          - "probe"
          - "full"
        default: "full"
      draft_model:
        description: "Duck.ai model for Prompt 1, Prompt 2, Prompt 3, and Prompt 4"
        required: true
        default: "6 Luna"
      critic_model:
        description: "Duck.ai model for Prompt 0 and Prompt 5 cross-check (new chat)"
        required: true
        default: "Claude Haiku 5.5"
      reasoning_mode:
        description: "Enable Reasoning mode for Critic model (Haiku)"
        required: true
        type: boolean
        default: true
      web_search:
        description: "Enable Web Search in Duck.ai Tools menu (both Luna & Haiku)"
        required: true
        type: boolean
        default: true
      movie_title:
        description: "Movie/Series Title (optional, overrides transcript.json title)"
        required: false
        default: ""
      content_type:
        description: "Content Type (Movie | TV Series)"
        required: false
        default: "Movie"
      season:
        description: "Season (leave blank if Movie/N/A)"
        required: false
        default: ""
      episode:
        description: "Episode (leave blank if Movie/N/A)"
        required: false
        default: ""
      part_identifier:
        description: "Part Identifier (optional)"
        required: false
        default: ""
      target_minutes:
        description: "Target video duration in minutes (e.g. 12)"
        required: true
        default: "12"
      max_clip_sec:
        description: "Max duration per video cut (Fair Use safe <= 3.0s)"
        required: true
        default: "3.0"
      max_prompt_chars:
        description: "Hard max characters per Duck.ai prompt (<= 16000)"
        required: true
        default: "15500"
      hints:
        description: "Initial Story Context / character or plot notes (optional)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate-recap:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      LANG: "C.UTF-8"
      LC_ALL: "C.UTF-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tor and System Utilities
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y tor netcat-openbsd xvfb curl
          sudo service tor start
          for i in {1..30}; do
            if nc -z 127.0.0.1 9050 && curl --socks5-hostname 127.0.0.1:9050 -sf --max-time 8 https://check.torproject.org/api/ip >/dev/null; then
              echo "Tor circuit is bootstrapped and ready"
              break
            fi
            sleep 2
          done
          nc -z 127.0.0.1 9050

      - name: Install Python Dependencies
        timeout-minutes: 6
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi playwright pillow requests ftfy
          playwright install --with-deps chromium

      - name: Verify Anonymous Tor Exit
        timeout-minutes: 4
        run: |
          python - <<'PY'
          import subprocess, time
          from curl_cffi import requests

          p = "socks5h://127.0.0.1:9050"
          last_err = None
          for attempt in range(1, 5):
              try:
                  print(f"Tor exit check attempt {attempt}/4...", flush=True)
                  r = requests.get("https://check.torproject.org/api/ip", proxies={"http": p, "https": p}, impersonate="chrome", timeout=25)
                  r.raise_for_status()
                  data = r.json()
                  print("Connection Info:", data, flush=True)
                  if not data.get("IsTor"):
                      raise RuntimeError("Traffic is not exiting through Tor.")
                  last_err = None
                  break
              except Exception as e:
                  last_err = e
                  print(f"Attempt {attempt} failed: {e}", flush=True)
                  if attempt < 4:
                      subprocess.run(["sudo", "service", "tor", "restart"], check=False)
                      for _ in range(25):
                          if (
                              subprocess.run(["nc", "-z", "127.0.0.1", "9050"]).returncode == 0
                              and subprocess.run(
                                  ["curl", "--socks5-hostname", "127.0.0.1:9050", "-sf", "--max-time", "8", "https://check.torproject.org/api/ip"],
                                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                              ).returncode == 0
                          ):
                              break
                          time.sleep(2)
          if last_err:
              raise RuntimeError(f"Tor verification failed after 4 attempts: {last_err}")
          PY

      - name: Run YouTube Recap Generation Engine
        timeout-minutes: 170
        env:
          HEADED: ${{ inputs.headed }}
          RUN_MODE: ${{ inputs.mode }}
          RESET_STATE: ${{ inputs.reset_state }}
          DRAFT_MODEL: ${{ inputs.draft_model }}
          CRITIC_MODEL: ${{ inputs.critic_model }}
          REASONING_MODE: ${{ inputs.reasoning_mode }}
          WEB_SEARCH: ${{ inputs.web_search }}
          INPUT_MOVIE_TITLE: ${{ inputs.movie_title }}
          INPUT_CONTENT_TYPE: ${{ inputs.content_type }}
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_EPISODE: ${{ inputs.episode }}
          INPUT_PART: ${{ inputs.part_identifier }}
          TARGET_MINUTES: ${{ inputs.target_minutes }}
          MAX_CLIP_SEC: ${{ inputs.max_clip_sec }}
          MAX_PROMPT_CHARS: ${{ inputs.max_prompt_chars }}
          INPUT_HINTS: ${{ inputs.hints }}
          TEXT_WAIT_SECONDS: "420"
        run: |
          mkdir -p debug build
          cat > recap_engine.py <<'PY'
          import os, re, sys, json, subprocess, time, textwrap
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import ftfy

          if sys.platform != "win32":
              sys.stdout.reconfigure(encoding="utf-8")
              sys.stderr.reconfigure(encoding="utf-8")

          HEADED = os.environ.get("HEADED") == "true"
          RUN_MODE = os.environ.get("RUN_MODE", "full").strip().lower()
          RESET_STATE = os.environ.get("RESET_STATE", "false").strip().lower() == "true"
          DRAFT_MODEL = os.environ.get("DRAFT_MODEL", "6 Luna").strip()
          CRITIC_MODEL = os.environ.get("CRITIC_MODEL", "Claude Haiku 5.5").strip()
          ENABLE_REASONING = os.environ.get("REASONING_MODE", "true").strip().lower() == "true"
          ENABLE_WEB_SEARCH = os.environ.get("WEB_SEARCH", "true").strip().lower() == "true"

          INPUT_MOVIE_TITLE = os.environ.get("INPUT_MOVIE_TITLE", "").strip()
          INPUT_CONTENT_TYPE = os.environ.get("INPUT_CONTENT_TYPE", "Movie").strip()
          INPUT_SEASON = os.environ.get("INPUT_SEASON", "").strip()
          INPUT_EPISODE = os.environ.get("INPUT_EPISODE", "").strip()
          INPUT_PART = os.environ.get("INPUT_PART", "").strip()
          TARGET_MINUTES = os.environ.get("TARGET_MINUTES", "12").strip()
          MAX_CLIP_DURATION = float(os.environ.get("MAX_CLIP_SEC", "3.0"))
          MAX_PROMPT_CHARS = min(int(os.environ.get("MAX_PROMPT_CHARS", "15500")), 15900)
          INPUT_HINTS = os.environ.get("INPUT_HINTS", "").strip()
          TEXT_WAIT = int(os.environ.get("TEXT_WAIT_SECONDS", "420"))
          PREVIEW_LINES_LIMIT = 100
          MAX_ATTEMPTS = 3

          DEBUG_DIR = Path("debug")
          DEBUG_DIR.mkdir(parents=True, exist_ok=True)
          STATE_FILE = Path("build/pipeline_state.json")
          STATE_FILE.parent.mkdir(parents=True, exist_ok=True)
          RUN_LOG = DEBUG_DIR / "engine.log"
          BROWSER_PROXY = "socks5://127.0.0.1:9050"

          if RESET_STATE and STATE_FILE.exists():
              STATE_FILE.unlink()
              print("[INIT] Old pipeline state cleared for fresh story generation.", flush=True)

          def log(msg):
              line = f"[{time.strftime('%H:%M:%S')}] {msg}"
              print(line, flush=True)
              with open(RUN_LOG, "a", encoding="utf-8") as f:
                  f.write(line + "\n")

          # ------------------ ENCODING & MOJIBAKE DEFENSE ------------------
          CP1252_MAP = {
              '\u20ac': 0x80, '\u201a': 0x82, '\u0192': 0x83, '\u201e': 0x84, '\u2026': 0x85,
              '\u2020': 0x86, '\u2021': 0x87, '\u02c6': 0x88, '\u2030': 0x89, '\u0160': 0x8a,
              '\u2039': 0x8b, '\u0152': 0x8c, '\u017d': 0x8e, '\u2018': 0x91, '\u2019': 0x92,
              '\u201c': 0x93, '\u201d': 0x94, '\u2022': 0x95, '\u2013': 0x96, '\u2014': 0x97,
              '\u02dc': 0x98, '\u2122': 0x99, '\u0161': 0x9a, '\u203a': 0x9b, '\u0153': 0x9c,
              '\u017e': 0x9e, '\u0178': 0x9f,
          }

          def fix_hindi_text(s: str) -> str:
              if not isinstance(s, str) or not s:
                  return s
              try:
                  s = ftfy.fix_text(s)
              except Exception:
                  pass
              if any(m in s for m in ["à¤", "à¥", "â€™", "â€”", "Ã", "Â"]):
                  try:
                      return s.encode("cp1252").decode("utf-8")
                  except Exception:
                      try:
                          raw_bytes = bytearray()
                          for ch in s:
                              if ch in CP1252_MAP:
                                  raw_bytes.append(CP1252_MAP[ch])
                              elif ord(ch) < 256:
                                  raw_bytes.append(ord(ch))
                              else:
                                  raw_bytes.extend(ch.encode("utf-8"))
                          return raw_bytes.decode("utf-8", errors="replace")
                      except Exception:
                          pass
              return s

          def deep_repair(val):
              if isinstance(val, str):
                  return fix_hindi_text(val)
              if isinstance(val, list):
                  return [deep_repair(item) for item in val]
              if isinstance(val, dict):
                  return {k: deep_repair(v) for k, v in val.items()}
              return val

          def snap(page, name, save_html=True):
              try:
                  page.screenshot(path=str(DEBUG_DIR / f"{name}.png"), full_page=True, timeout=15000)
                  if save_html:
                      (DEBUG_DIR / f"{name}.html").write_text(page.content(), encoding="utf-8")
                  log(f"Snapshot taken: {name}")
              except Exception as e:
                  log(f"Snapshot failed ({name}): {e}")

          def renew_tor():
              log("Refreshing Tor IP circuit...")
              subprocess.run(["sudo", "service", "tor", "restart"], check=False)
              for i in range(25):
                  port_up = subprocess.run(["nc", "-z", "127.0.0.1", "9050"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0
                  if port_up:
                      ok = subprocess.run(
                          ["curl", "--socks5-hostname", "127.0.0.1:9050", "-sf", "--max-time", "8", "https://check.torproject.org/api/ip"],
                          stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                      ).returncode == 0
                      if ok:
                          log(f"Tor circuit ready after {(i+1)*2}s.")
                          return
                  time.sleep(2)

          # ------------------ IN-PAGE FETCH INTERCEPTOR ------------------
          FETCH_HOOK_JS = r"""
          (() => {
              Object.defineProperty(navigator, 'webdriver', { get: () => undefined });
              if (window.__duckai_hooked) return;
              window.__duckai_hooked = true;
              window.__duckai_stream = { active: false, done: false, status: 0, url: '', rawChunks: [], error: '' };
              const origFetch = window.fetch;
              window.fetch = async function(...args) {
                  const reqUrl = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url ? args[0].url : '');
                  const reqInit = args[1] || {};
                  const method = (reqInit.method || (args[0] && args[0].method) || 'GET').toUpperCase();
                  const cleanUrl = reqUrl.split('?')[0];
                  const isChatCall = method === 'POST' && (cleanUrl.includes('/duckchat/v1/chat') || cleanUrl.endsWith('/chat'));
                  const response = await origFetch.apply(this, args);
                  if (isChatCall) {
                      window.__duckai_stream = { active: true, done: false, status: response.status, url: reqUrl, rawChunks: [], error: '' };
                      try {
                          const clone = response.clone();
                          const reader = clone.body ? clone.body.getReader() : null;
                          if (reader) {
                              const decoder = new TextDecoder('utf-8');
                              (async () => {
                                  try {
                                      while (true) {
                                          const { value, done } = await reader.read();
                                          if (done) break;
                                          if (value) window.__duckai_stream.rawChunks.push(decoder.decode(value, { stream: true }));
                                      }
                                      const tail = decoder.decode();
                                      if (tail) window.__duckai_stream.rawChunks.push(tail);
                                  } catch (err) {
                                      window.__duckai_stream.error = String(err);
                                  } finally {
                                      window.__duckai_stream.active = false;
                                      window.__duckai_stream.done = true;
                                  }
                              })();
                          } else {
                              clone.text().then(t => {
                                  if (t) window.__duckai_stream.rawChunks.push(t);
                                  window.__duckai_stream.active = false;
                                  window.__duckai_stream.done = true;
                              }).catch(() => {
                                  window.__duckai_stream.active = false;
                                  window.__duckai_stream.done = true;
                              });
                          }
                      } catch (e) {
                          window.__duckai_stream.error = String(e);
                          window.__duckai_stream.active = false;
                          window.__duckai_stream.done = true;
                      }
                  }
                  return response;
              };
          })();
          """

          # ------------------ DUCK.AI MODAL & SETTINGS ------------------
          def get_prompt_box(page):
              return page.locator("textarea[name='user-prompt'], textarea[placeholder*='ask' i], textarea[placeholder*='message' i], textarea").first

          def dismiss_duckai_modals(page):
              patterns = [re.compile(r"^\s*(get started|agree and continue|i agree|accept|next|continue)\s*$", re.I)]
              for _ in range(4):
                  clicked = False
                  for pat in patterns:
                      btn = page.get_by_role("button", name=pat)
                      if btn.count() > 0 and btn.first.is_visible():
                          try:
                              btn.first.click(timeout=3000)
                              page.wait_for_timeout(1200)
                              clicked = True
                              break
                          except Exception:
                              pass
                  if not clicked:
                      break

          def wait_for_duckai_ui_ready(page, timeout_ms=45000):
              start = time.time()
              while (time.time() - start) * 1000 < timeout_ms:
                  try:
                      m_btn = page.locator("button[data-testid*='model' i], button[aria-label*='model' i]")
                      if get_prompt_box(page).is_visible() and m_btn.count() > 0 and m_btn.first.is_visible():
                          return
                  except Exception:
                      pass
                  try:
                      btn = page.get_by_role("button", name=re.compile(r"(get started|agree|accept|continue)", re.I))
                      if btn.count() > 0 and btn.first.is_visible():
                          return
                  except Exception:
                      pass
                  page.wait_for_timeout(500)

          def build_model_matchers(target_model: str):
              t_low = target_model.lower().strip()
              tokens = [tok for tok in re.split(r"[\s\-_]+", t_low) if tok]
              non_gpt = [tok for tok in tokens if tok != "gpt"]
              strategies = [lambda txt: t_low in txt]
              if len(tokens) > 1:
                  strategies.append(lambda txt: all(tok in txt for tok in tokens))
              if non_gpt and non_gpt != tokens:
                  strategies.append(lambda txt: all(tok in txt for tok in non_gpt))
              key_tokens = [tok for tok in non_gpt if len(tok) > 2]
              if key_tokens:
                  strategies.append(lambda txt: all(tok in txt for tok in key_tokens))
                  strategies.append(lambda txt: key_tokens[-1] in txt)
              return strategies

          def configure_duckai_settings(page, target_model="6 Luna", enable_reasoning=True, enable_web_search=True, take_verify_snap=False, snap_prefix="settings"):
              log(f"Configuring Duck.ai -> Model: '{target_model}' | Reasoning: {enable_reasoning} | WebSearch: {enable_web_search}")
              wait_for_duckai_ui_ready(page)
              dismiss_duckai_modals(page)
              page.wait_for_timeout(1200)

              model_btn_selectors = [
                  "button[data-testid*='model' i]", "button[aria-label*='model' i]",
                  "button:has-text('Luna')", "button:has-text('Haiku')",
                  "button:has-text('Claude')", "button:has-text('GPT')", "button:has-text('Model')",
              ]
              opened = False
              btn_txt = ""
              for sel in model_btn_selectors:
                  loc = page.locator(sel)
                  for i in range(loc.count()):
                      b = loc.nth(i)
                      if b.is_visible() and b.is_enabled():
                          try:
                              btn_txt = (b.inner_text() or "").strip()
                              b.click(timeout=4000)
                              page.wait_for_timeout(1000)
                              opened = True
                              break
                          except Exception:
                              pass
                  if opened:
                      break

              if take_verify_snap:
                  snap(page, f"{snap_prefix}_dropdown_open", save_html=False)

              model_selected = False
              for idx, matcher in enumerate(build_model_matchers(target_model)):
                  cands = page.locator("[role='menuitem'], [role='menuitemradio'], [role='option'], [role='radio'], label, button")
                  for i in range(cands.count()):
                      el = cands.nth(i)
                      if not el.is_visible():
                          continue
                      txt = (el.inner_text() or "").strip()
                      if txt and matcher(txt.lower()):
                          try:
                              el.click(timeout=4000)
                              log(f"Selected model '{target_model}' (strategy {idx+1}): '{txt}'")
                              model_selected = True
                              page.wait_for_timeout(900)
                              break
                          except Exception:
                              pass
                  if model_selected:
                      break

              if not model_selected:
                  log(f"WARNING: Could not match model '{target_model}' (button showed '{btn_txt}').")

              try:
                  page.keyboard.press("Escape")
                  page.wait_for_timeout(350)
              except Exception:
                  pass

              if enable_reasoning:
                  r_cands = page.locator("button[aria-label*='Reasoning mode' i], button:has-text('Reasoning'), [role='switch']:has-text('Reason')")
                  for i in range(r_cands.count()):
                      el = r_cands.nth(i)
                      if not el.is_visible():
                          continue
                      txt = (el.inner_text() or "").strip()
                      if el.get_attribute("aria-checked") == "true" or el.get_attribute("aria-pressed") == "true" or ("reasoning" in txt.lower() and "fast" not in txt.lower()):
                          log(f"Reasoning already enabled ('{txt}').")
                          break
                      try:
                          el.click(timeout=4000)
                          log(f"Clicked Reasoning mode control: '{txt}'")
                          page.wait_for_timeout(900)
                          break
                      except Exception:
                          pass

              if enable_web_search:
                  try:
                      active_ws = page.locator("button[aria-label*='Remove Web Search' i], button:has-text('Web Search'):not(:has-text('Source answers'))")
                      if active_ws.count() > 0 and active_ws.first.is_visible():
                          log("Web Search already active.")
                      else:
                          tools_btn = page.locator("button:has-text('Tools'), button[aria-label*='tool' i]")
                          if tools_btn.count() > 0 and tools_btn.first.is_visible():
                              tools_btn.first.click(timeout=4000)
                              page.wait_for_timeout(900)
                              if take_verify_snap:
                                  snap(page, f"{snap_prefix}_tools_open", save_html=False)
                              ws_cands = page.locator(
                                  "[role='menuitemcheckbox']:has-text('Search'), [role='menuitem']:has-text('Search'), "
                                  "[role='switch']:has-text('Search'), [role='option']:has-text('Search'), "
                                  "button:has-text('Web Search'), button:has-text('Search'), div[role='menuitem']:has-text('Web')"
                              )
                              for i in range(ws_cands.count()):
                                  el = ws_cands.nth(i)
                                  if not el.is_visible():
                                      continue
                                  txt = (el.inner_text() or "").strip()
                                  if "chat suggestions" in txt.lower() or "how duck.ai" in txt.lower():
                                      continue
                                  if el.get_attribute("aria-checked") == "true" or el.get_attribute("aria-pressed") == "true":
                                      log(f"Web Search already enabled ('{txt}').")
                                      break
                                  try:
                                      el.click(timeout=3000)
                                      log(f"Clicked Web Search control: '{txt}'")
                                      page.wait_for_timeout(700)
                                      break
                                  except Exception:
                                      pass
                              page.keyboard.press("Escape")
                              page.wait_for_timeout(300)
                  except Exception as ws_err:
                      log(f"Web Search setup notice: {ws_err}")

              try:
                  page.keyboard.press("Escape")
              except Exception:
                  pass
              page.wait_for_timeout(700)
              if take_verify_snap:
                  snap(page, f"{snap_prefix}_verified", save_html=True)

          # ------------------ SUBMISSION, SCROLL & EXTRACTION ------------------
          def click_ask_button(page):
              ask_btn = page.get_by_role("button", name=re.compile(r"^\s*(ask|send|submit)\s*$", re.I))
              if ask_btn.count() > 0 and ask_btn.first.is_visible() and ask_btn.first.is_enabled():
                  ask_btn.first.click(timeout=3000)
                  return True
              return bool(page.evaluate(r"""() => {
                  const btns = Array.from(document.querySelectorAll('button'));
                  const ask = btns.find(b => !b.disabled && (b.innerText || '').trim().toLowerCase() === 'ask');
                  if (ask) { ask.click(); return true; }
                  const send = btns.find(b => !b.disabled && /send|submit|ask/i.test(b.getAttribute('aria-label') || ''));
                  if (send) { send.click(); return true; }
                  const sub = btns.find(b => b.type === 'submit' && !b.disabled);
                  if (sub) { sub.click(); return true; }
                  return false;
              }"""))

          def submit_prompt(page, box, text, context):
              box.scroll_into_view_if_needed(timeout=5000)
              box.click()
              page.wait_for_timeout(200)
              box.fill("")
              page.wait_for_timeout(150)
              filled = False
              try:
                  box.fill(text, timeout=20000)
                  if len(box.input_value()) >= int(len(text) * 0.95):
                      filled = True
              except Exception:
                  filled = False
              if not filled:
                  box.fill("")
                  box.click()
                  try:
                      cdp = context.new_cdp_session(page)
                      for idx in range(0, len(text), 2000):
                          cdp.send("Input.insertText", {"text": text[idx : idx + 2000]})
                      cdp.detach()
                  except Exception:
                      box.fill(text)
              page.wait_for_timeout(500)
              try:
                  page.evaluate("(el) => { el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true })); }", box.element_handle())
              except Exception:
                  pass
              page.wait_for_timeout(400)
              if not click_ask_button(page):
                  box.press("Enter")
              page.wait_for_timeout(600)

          def scroll_chat_to_bottom(page):
              try:
                  page.evaluate(r"""() => {
                      window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'instant' });
                      if (document.scrollingElement) document.scrollingElement.scrollTop = document.scrollingElement.scrollHeight;
                      for (const el of document.querySelectorAll('div, main, section, article')) {
                          if (el.scrollHeight > el.clientHeight + 20) {
                              const oy = window.getComputedStyle(el).overflowY;
                              if (['auto', 'scroll', 'overlay'].includes(oy)) el.scrollTop = el.scrollHeight;
                          }
                      }
                      const mainEl = document.querySelector('main') || document.body;
                      const blocks = mainEl.querySelectorAll('pre, article, p, [data-testid]');
                      if (blocks.length > 0) try { blocks[blocks.length - 1].scrollIntoView({ behavior: 'instant', block: 'end' }); } catch (_) {}
                  }""")
              except Exception:
                  pass

          def parse_sse_text(raw_sse: str) -> str:
              chunks = []
              for line in raw_sse.splitlines():
                  line = line.strip()
                  if not line.startswith("data:"):
                      continue
                  payload = line[5:].strip()
                  if not payload or payload == "[DONE]":
                      continue
                  try:
                      data = json.loads(payload)
                      if data.get("type") == "reasoning" or data.get("role") == "reasoning":
                          continue
                      chunk = data.get("message") or data.get("delta") or data.get("text") or data.get("content") or ""
                      if not chunk and isinstance(data.get("choices"), list) and data["choices"]:
                          c0 = data["choices"][0]
                          if isinstance(c0, dict):
                              chunk = (c0.get("delta") or {}).get("content") or (c0.get("message") or {}).get("content") or ""
                      if chunk:
                          chunks.append(chunk)
                  except Exception:
                      continue
              return "".join(chunks)

          def strip_thinking_blocks(text: str) -> str:
              return re.sub(r"<think>[\s\S]*?</think>", "", text or "", flags=re.IGNORECASE).strip()

          def clean_plain_text(text: str) -> str:
              cleaned = strip_thinking_blocks(text)
              for marker in ["\nCopy\n", "\nRegenerate\n", "\nAsk anything", "\nAI-generated", "\nDuck.ai", "\nNew Chat"]:
                  if marker in cleaned:
                      cleaned = cleaned.split(marker)[0]
              return re.sub(r"^(Thought for \d+s|Thinking\.\.\.)\s*", "", cleaned, flags=re.I).strip()

          def reset_stream_tracking(page, current_chat_state):
              current_chat_state["raw_stream"].clear()
              current_chat_state["chat_done"] = False
              current_chat_state["rate_limited"] = False
              try:
                  page.evaluate("() => { window.__duckai_stream = { active: false, done: false, status: 0, url: '', rawChunks: [], error: '' }; }")
              except Exception:
                  pass

          def get_inpage_stream_text(page):
              try:
                  st = page.evaluate("() => window.__duckai_stream || null")
                  if not st:
                      return None
                  raw = "".join(st.get("rawChunks") or [])
                  return {
                      "active": bool(st.get("active")),
                      "done": bool(st.get("done")),
                      "status": int(st.get("status") or 0),
                      "raw_len": len(raw),
                      "parsed": parse_sse_text(raw) if raw else "",
                      "raw": raw
                  }
              except Exception:
                  return None

          def count_code_blocks(page):
              try:
                  return int(page.evaluate("() => document.querySelectorAll('pre code, pre').length"))
              except Exception:
                  return 0

          def send_and_confirm(page, box, prompt_text, context, current_chat_state, label, is_new_chat=True):
              url_before = page.url
              reset_stream_tracking(page, current_chat_state)
              submit_prompt(page, box, prompt_text, context)
              for wait_sec in range(15):
                  page.wait_for_timeout(1000)
                  inpage = get_inpage_stream_text(page)
                  try:
                      box_cleared = len(box.input_value().strip()) == 0
                  except Exception:
                      box_cleared = True
                  url_changed = is_new_chat and ("chatID=" in page.url) and ("chatID=" not in url_before)
                  if url_changed or len(current_chat_state["raw_stream"]) > 0 or (inpage and (inpage["active"] or inpage["done"] or inpage["status"] > 0)) or box_cleared:
                      log(f"{label} acknowledged at +{wait_sec+1}s (box_cleared={box_cleared}).")
                      return True
                  stop_btn = page.locator("button:has-text('Stop'), button[aria-label*='stop' i], button[title*='stop' i]")
                  if stop_btn.count() > 0 and stop_btn.first.is_visible():
                      return True
                  if wait_sec in (3, 7, 11):
                      click_ask_button(page)
                      box.press("Enter")
              return False

          EXTRACT_ASSISTANT_JS = r"""({ promptTail, expectJson, prevCodeBlocks }) => {
              for (const el of document.querySelectorAll('div, main, section, article')) {
                  if (el.scrollHeight > el.clientHeight + 20) {
                      const oy = window.getComputedStyle(el).overflowY;
                      if (['auto', 'scroll', 'overlay'].includes(oy)) el.scrollTop = el.scrollHeight;
                  }
              }
              window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'instant' });
              const stopButtons = Array.from(document.querySelectorAll('button')).filter(b => {
                  const txt = (b.innerText || '').toLowerCase();
                  const aria = (b.getAttribute('aria-label') || '').toLowerCase();
                  const title = (b.getAttribute('title') || '').toLowerCase();
                  const testid = (b.getAttribute('data-testid') || '').toLowerCase();
                  return (txt.includes('stop') || aria.includes('stop') || title.includes('stop') || testid.includes('stop') || aria.includes('cancel')) && b.offsetParent !== null;
              });
              const isGenerating = stopButtons.length > 0 || Boolean(window.__duckai_stream && window.__duckai_stream.active);
              const isLeak = (t) => !t || t.includes('PROMPT 1 —') || t.includes('PROMPT 2 —') || t.includes('PROMPT 3 —') || t.includes('PROMPT 4 —') || t.includes('PROMPT 5 —') || t.includes('NEW TIMESTAMPED TRANSCRIPT:') || t.includes('CURRENT DRAFT JSON');
              const rootEl = document.querySelector('main') || document.body;
              const fullText = (rootEl.innerText || '').trim();
              if (promptTail && promptTail.length >= 12) {
                  const idx = fullText.lastIndexOf(promptTail);
                  if (idx !== -1) {
                      const after = fullText.slice(idx + promptTail.length).trim();
                      if (after.length > 30 && !isLeak(after) && (!expectJson || after.includes('"beats"'))) {
                          return { text: after, isGenerating, source: 'after_prompt_tail_exact' };
                      }
                  }
              }
              if (expectJson) {
                  const cbs = Array.from(document.querySelectorAll('pre code, pre'));
                  if (cbs.length > (prevCodeBlocks || 0)) {
                      for (let i = cbs.length - 1; i >= (prevCodeBlocks || 0); i--) {
                          const ct = (cbs[i].innerText || '').trim();
                          if (ct && !isLeak(ct) && ct.includes('{') && (ct.includes('beats') || ct.includes('status'))) {
                              return { text: ct, isGenerating, source: 'code_block' };
                          }
                      }
                  }
              }
              if (promptTail && promptTail.length >= 12) {
                  const idx = fullText.lastIndexOf(promptTail);
                  if (idx !== -1) {
                      const after = fullText.slice(idx + promptTail.length).trim();
                      if (after.length > 20) return { text: after, isGenerating, source: 'after_prompt_tail' };
                  }
              }
              return { text: '', isGenerating, source: 'none' };
          }"""

          def wait_for_response(page, current_chat_state, prompt_text="", max_wait=TEXT_WAIT, expect_json=True, expect_beats=True, prev_code_blocks=0):
              log(f"Waiting for Duck.ai response (max {max_wait}s | expect_json={expect_json})...")
              prompt_tail = prompt_text[-60:].strip() if prompt_text else ""
              start = time.time()
              last_text = ""
              stable_ticks = 0
              has_started = False
              last_log = 0.0

              while time.time() - start < max_wait:
                  elapsed = time.time() - start
                  if current_chat_state.get("rate_limited"):
                      raise RuntimeError("Duck.ai returned HTTP 418/429 (Tor IP rate-limited).")

                  inpage = get_inpage_stream_text(page)
                  if inpage:
                      if inpage["status"] in (418, 429):
                          raise RuntimeError(f"Duck.ai fetch returned HTTP {inpage['status']} (Tor IP rate-limited).")
                      if inpage["active"] or inpage["raw_len"] > 0:
                          has_started = True
                      if inpage["done"]:
                          page.wait_for_timeout(2000)
                          scroll_chat_to_bottom(page)
                          parsed_sse = inpage["parsed"]
                          dom_after = ""
                          try:
                              dom_res = page.evaluate(EXTRACT_ASSISTANT_JS, {"promptTail": prompt_tail, "expectJson": expect_json, "prevCodeBlocks": prev_code_blocks})
                              dom_after = (dom_res.get("text") or "").strip()
                          except Exception:
                              pass
                          if expect_json:
                              if "{" in parsed_sse and (not expect_beats or '"beats"' in parsed_sse):
                                  log(f"Captured JSON via SSE ({len(parsed_sse)} chars).")
                                  return deep_repair(parsed_sse)
                              if "{" in dom_after and (not expect_beats or '"beats"' in dom_after):
                                  log(f"Captured JSON via DOM ({len(dom_after)} chars).")
                                  return deep_repair(dom_after)
                              (DEBUG_DIR / f"failed_sse_{int(time.time())}.txt").write_text(f"PARSED:\n{parsed_sse}\n\nDOM:\n{dom_after}\n\nRAW:\n{inpage['raw'][-4000:]}", encoding="utf-8")
                              raise RuntimeError(f"Stream finished without valid JSON beats. Preview: {(parsed_sse or dom_after)[:200]!r}")
                          else:
                              out_txt = clean_plain_text(parsed_sse) if len(parsed_sse.strip()) >= 80 else clean_plain_text(dom_after)
                              if len(out_txt) >= 80:
                                  log(f"Captured text via SSE ({len(out_txt)} chars).")
                                  return deep_repair(out_txt)
                              raise RuntimeError(f"Text stream finished too short ({len(out_txt)} chars).")

                  if current_chat_state.get("chat_done") and current_chat_state.get("raw_stream"):
                      parsed_sse = parse_sse_text("".join(current_chat_state["raw_stream"]))
                      if parsed_sse.strip():
                          if expect_json and "{" in parsed_sse and (not expect_beats or '"beats"' in parsed_sse):
                              return deep_repair(parsed_sse)
                          if not expect_json and len(parsed_sse.strip()) >= 80:
                              return deep_repair(clean_plain_text(parsed_sse))

                  scroll_chat_to_bottom(page)
                  dom_source, dom_len, is_gen = "none", 0, False
                  try:
                      dom_data = page.evaluate(EXTRACT_ASSISTANT_JS, {"promptTail": prompt_tail, "expectJson": expect_json, "prevCodeBlocks": prev_code_blocks})
                      cur_text = (dom_data.get("text") or "").strip()
                      if not expect_json:
                          cur_text = clean_plain_text(cur_text)
                      is_gen = bool(dom_data.get("isGenerating", False))
                      dom_source = dom_data.get("source", "none")
                      dom_len = len(cur_text)
                      if is_gen or dom_len > 25:
                          has_started = True
                      min_len = 25 if expect_json else 80
                      if cur_text:
                          stable_ticks = (stable_ticks + 1) if (cur_text == last_text and not is_gen) else 0
                          last_text = cur_text
                          if has_started and not is_gen and stable_ticks >= 4 and len(last_text) > min_len:
                              log(f"Captured via DOM stability ({dom_source}, {len(last_text)} chars).")
                              return deep_repair(last_text)
                  except Exception:
                      pass

                  if elapsed - last_log >= 15.0:
                      last_log = elapsed
                      si = f"raw={inpage['raw_len']} done={inpage['done']} status={inpage['status']}" if inpage else "no_hook"
                      log(f"[WAIT {int(elapsed)}s/{max_wait}s] stream=({si}) | dom=({dom_source}, {dom_len} chars, gen={is_gen})")
                  page.wait_for_timeout(2000)

              raise RuntimeError(f"Response timed out after {max_wait}s.")

          # ------------------ JSON PARSE & PHRASE-TO-CLIP ALIGNMENT ------------------
          def is_valid_recap_json(obj) -> bool:
              if not isinstance(obj, dict):
                  return False
              if obj.get("movie_title") == "Title" and obj.get("synopsis", "").startswith("Concise summary"):
                  return False
              beats = obj.get("beats")
              return isinstance(beats, list) and len(beats) > 0

          def try_json_loads_with_repair(raw_str: str):
              s = raw_str.strip()
              try:
                  return json.loads(s)
              except json.JSONDecodeError as first_err:
                  fixed = re.sub(r",(\s*[}\]])", r"\1", s)
                  try:
                      return json.loads(fixed)
                  except json.JSONDecodeError:
                      pass
                  if '"beats"' in fixed:
                      arr_start = fixed.find("[", fixed.find('"beats"'))
                      if arr_start != -1:
                          depth, in_str, esc, last_end = 0, False, False, -1
                          for idx in range(arr_start + 1, len(fixed)):
                              c = fixed[idx]
                              if esc: esc = False; continue
                              if c == "\\": esc = True; continue
                              if c == '"': in_str = not in_str; continue
                              if not in_str:
                                  if c == "{": depth += 1
                                  elif c == "}":
                                      depth -= 1
                                      if depth == 0: last_end = idx
                                  elif c == "]" and depth == 0: break
                          if last_end != -1:
                              try:
                                  obj = json.loads(fixed[: last_end + 1] + "]}")
                                  if isinstance(obj.get("beats"), list) and obj["beats"]:
                                      log(f"JSON repaired by salvaging {len(obj['beats'])} complete beats.")
                                      return obj
                              except Exception:
                                  pass
                  raise first_err

          def parse_first_balanced_json(text: str, require_beats: bool = False):
              if not text:
                  return None
              cleaned = strip_thinking_blocks(text)
              for cand in reversed(re.findall(r"```(?:json)?\s*([\s\S]*?)\s*```", cleaned, re.IGNORECASE)):
                  try:
                      parsed = deep_repair(try_json_loads_with_repair(cand.strip()))
                      if not require_beats or is_valid_recap_json(parsed):
                          return parsed
                  except Exception:
                      pass
              try:
                  parsed = deep_repair(try_json_loads_with_repair(cleaned))
                  if not require_beats or is_valid_recap_json(parsed):
                      return parsed
              except Exception:
                  pass
              cands, i, n = [], 0, len(cleaned)
              while i < n:
                  if cleaned[i] in ("{", "["):
                      oc, cc = cleaned[i], "}" if cleaned[i] == "{" else "]"
                      depth, in_s, esc = 0, False, False
                      for idx in range(i, n):
                          c = cleaned[idx]
                          if esc: esc = False; continue
                          if c == "\\": esc = True; continue
                          if c == '"': in_s = not in_s; continue
                          if not in_s:
                              if c == oc: depth += 1
                              elif c == cc:
                                  depth -= 1
                                  if depth == 0:
                                      try:
                                          cands.append(deep_repair(try_json_loads_with_repair(cleaned[i : idx + 1])))
                                      except Exception:
                                          pass
                                      i = idx
                                      break
                  i += 1
              for obj in reversed(cands):
                  if not require_beats or is_valid_recap_json(obj):
                      return obj
              if cands:
                  return cands[-1]
              fb = cleaned.find("{")
              if fb != -1:
                  try:
                      parsed = deep_repair(try_json_loads_with_repair(cleaned[fb:]))
                      if not require_beats or is_valid_recap_json(parsed):
                          return parsed
                  except Exception as e:
                      log(f"JSON parse error: {e}")
              return None

          def ensure_phrase_sync(narration: str, clips: list):
              if not clips:
                  return clips
              words = narration.split()
              if not words:
                  return clips
              provided = [str(c.get("spoken_text", "")).strip() for c in clips]
              joined_words = " ".join(p for p in provided if p).split()
              if all(bool(p) for p in provided) and (0.75 * len(words) <= len(joined_words) <= 1.25 * len(words)):
                  for c in clips:
                      sw = len(str(c["spoken_text"]).split())
                      c["spoken_word_count"] = sw
                      c["estimated_spoken_duration"] = round((sw / 140.0) * 60.0, 2)
                  return clips
              total_dur = sum(max(0.5, float(c.get("duration", 2.0))) for c in clips)
              idx, n_words = 0, len(words)
              for i, c in enumerate(clips):
                  if i == len(clips) - 1:
                      chunk_words = words[idx:]
                  else:
                      rem = len(clips) - i - 1
                      share = max(1, round(n_words * (max(0.5, float(c.get("duration", 2.0))) / total_dur)))
                      take = min(share, max(1, (n_words - idx) - rem))
                      chunk_words = words[idx : idx + take]
                      idx += take
                  c["spoken_text"] = " ".join(chunk_words).strip()
                  c["spoken_word_count"] = len(chunk_words)
                  c["estimated_spoken_duration"] = round((len(chunk_words) / 140.0) * 60.0, 2)
              return clips

          def normalize_chunk_beats(raw_obj):
              obj = deep_repair(raw_obj)
              norm_beats = []
              for b in obj.get("beats", []):
                  if not isinstance(b, dict):
                      continue
                  narr = str(b.get("narration", "")).strip()
                  if not narr:
                      continue
                  wc = len(narr.split())
                  est_dur = round((wc / 140.0) * 60.0, 2)
                  norm_clips = []
                  for c in (b.get("clips") or []):
                      if not isinstance(c, dict):
                          continue
                      st = round(float(c.get("start", 0.0)), 2)
                      en = round(float(c.get("end", st)), 2)
                      if en <= st:
                          continue
                      dur = round(en - st, 2)
                      if dur > MAX_CLIP_DURATION:
                          en = round(st + MAX_CLIP_DURATION, 2)
                          dur = MAX_CLIP_DURATION
                      norm_clips.append({
                          "start": st, "end": en, "duration": dur,
                          "spoken_text": str(c.get("spoken_text", "")).strip(),
                          "spoken_word_count": 0, "estimated_spoken_duration": 0.0,
                          "scene_context": str(c.get("scene_context", "")).strip()
                      })
                  norm_clips = ensure_phrase_sync(narr, norm_clips)
                  norm_beats.append({
                      "narration": narr, "word_count": wc,
                      "estimated_duration": b.get("estimated_duration") or est_dur,
                      "is_scene_bridge": bool(b.get("is_scene_bridge", False)),
                      "clips": norm_clips
                  })
              return {
                  "movie_title": obj.get("movie_title"), "content_type": obj.get("content_type"),
                  "season": obj.get("season"), "episode": obj.get("episode"), "part_identifier": obj.get("part_identifier"),
                  "characters": obj.get("characters", []), "synopsis": str(obj.get("synopsis", "")).strip(),
                  "beats": norm_beats
              }

          # ------------------ UNIVERSAL PROMPTS 0, 1, 2, 3, 4, AND 5 ------------------
