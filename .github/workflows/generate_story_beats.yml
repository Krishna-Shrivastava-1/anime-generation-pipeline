name: Generate and Download Duck.ai Story Frames

on:
  workflow_dispatch:
    inputs:
      headed:
        description: "Run non-headless Chrome under Xvfb (less detectable)"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  generate-story-frames:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tor
        timeout-minutes: 4
        run: |
          sudo apt-get update
          sudo apt-get install -y tor netcat-openbsd xvfb
          sudo service tor start
          for i in {1..30}; do
            if nc -z 127.0.0.1 9050; then echo "Tor ready"; break; fi
            sleep 2
          done
          nc -z 127.0.0.1 9050

      - name: Install Python dependencies
        timeout-minutes: 6
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi playwright pillow requests
          playwright install --with-deps chromium

      - name: Verify connection (curl_cffi, Chrome TLS impersonation)
        timeout-minutes: 3
        run: |
          python - <<'PY'
          from curl_cffi import requests
          p = "socks5h://127.0.0.1:9050"
          r = requests.get("https://check.torproject.org/api/ip", proxies={"http": p, "https": p}, impersonate="chrome", timeout=60)
          r.raise_for_status()
          data = r.json()
          print("Connection info:", data)
          if not data.get("IsTor"):
              raise RuntimeError("Traffic is not using Tor.")
          PY

      - name: Automate Duck.ai Story Pipeline
        timeout-minutes: 110
        env:
          HEADED: ${{ inputs.headed }}
        run: |
          mkdir -p debug
          cat > generate_story.py <<'PY'
          import os, re, sys, json, subprocess, time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          HEADED = os.environ.get("HEADED") == "true"
          MAX_ATTEMPTS = 4
          MAX_ROUNDS = 2
          PART_SECONDS = 120        # Keeps prompt well below Duck.ai's ~4000 char input limit
          PART_CHARS = 1600         # Hard cap so messages never get blocked
          MAX_WAIT = 240
          CLIP_PAD = 0.15
          MIN_CLIP = 2.5
          MAX_CLIP = 6.0            # YouTube Fair-Use: clips capped strictly to 6 seconds
          WORDS_PER_SEC = 2.4
          FIT_LIMIT = 1.35
          DEBUG_DIR = Path("debug")
          DEBUG_DIR.mkdir(parents=True, exist_ok=True)
          RUN_LOG = DEBUG_DIR / "run.log"
          BROWSER_PROXY = "socks5://127.0.0.1:9050"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36"
          MODAL_LABELS = re.compile(
              r"^(agree and continue|continue|i agree|accept|accept all|get started|got it|next|done)$", re.I
          )
          ERR_RE = re.compile(r"something went wrong|too many requests|rate limit|try again|reached", re.I)

          state = {"browser": None, "context": None, "page": None}
          chat = {"primed": False}


          def log(msg):
              line = f"[{time.strftime('%H:%M:%S')}] {msg}"
              print(line, flush=True)
              with open(RUN_LOG, "a", encoding="utf-8") as f:
                  f.write(line + "\n")


          def scroll_to_bottom(page):
              try:
                  page.evaluate("""() => {
                      window.scrollTo(0, document.body.scrollHeight);
                      for (const el of document.querySelectorAll('*')) {
                          if (el.scrollHeight > el.clientHeight + 20) { el.scrollTop = el.scrollHeight; }
                      }
                  }""")
              except Exception:
                  pass


          def snap(page, name):
              try:
                  scroll_to_bottom(page)
                  page.wait_for_timeout(500)
                  page.screenshot(path=str(DEBUG_DIR / f"{name}.png"), full_page=False, timeout=10000)
                  (DEBUG_DIR / f"{name}.html").write_text(page.content(), encoding="utf-8")
                  (DEBUG_DIR / f"{name}.txt").write_text(page.inner_text("body", timeout=5000), encoding="utf-8")
                  log(f"Snapshot saved: {name}")
              except Exception as e:
                  log(f"Snapshot failed: {e}")


          def new_tor_circuit():
              log("Restarting Tor for a new exit IP...")
              subprocess.run(["sudo", "timeout", "60", "service", "tor", "restart"], check=False)
              for _ in range(30):
                  if subprocess.run(["nc", "-z", "127.0.0.1", "9050"]).returncode == 0:
                      break
                  time.sleep(2)
              time.sleep(2)


          def start_browser(p):
              for key in ("context", "browser"):
                  if state[key]:
                      try:
                          state[key].close()
                      except Exception:
                          pass
                  state[key] = None
              state["page"] = None
              state["browser"] = p.chromium.launch(
                  headless=not HEADED,
                  proxy={"server": BROWSER_PROXY},
                  args=["--disable-dev-shm-usage", "--disable-blink-features=AutomationControlled"],
              )


          def dismiss_modals(page):
              clicked_any = False
              for _ in range(3):
                  clicked = False
                  try:
                      buttons = page.get_by_role("button", name=MODAL_LABELS)
                      for i in range(buttons.count()):
                          btn = buttons.nth(i)
                          if btn.is_visible():
                              log(f"Clicking modal button: {(btn.inner_text() or '').strip()!r}")
                              btn.click(timeout=2500)
                              page.wait_for_timeout(800)
                              clicked = clicked_any = True
                              break
                  except Exception:
                      break
                  if not clicked:
                      break
              return clicked_any


          def open_chat():
              if state["context"]:
                  try:
                      state["context"].close()
                  except Exception:
                      pass
              ctx = state["browser"].new_context(
                  viewport={"width": 1440, "height": 1000}, user_agent=UA, locale="en-US"
              )
              ctx.add_init_script("Object.defineProperty(navigator,'webdriver',{get:()=>undefined})")
              pg = ctx.new_page()
              state["context"], state["page"] = ctx, pg
              log("Opening a new chat at https://duck.ai/chat ...")
              pg.goto("https://duck.ai/chat", wait_until="domcontentloaded", timeout=60000)
              pg.wait_for_timeout(2500)
              dismiss_modals(pg)
              return pg


          def check_and_click_continue_generating(page):
              try:
                  btn = page.locator(
                      "button:has-text('Continue generating'), button:has-text('Continue response')"
                  ).first
                  if btn.count() > 0 and btn.is_visible():
                      log("Clicking 'Continue generating'...")
                      btn.click(timeout=2000)
                      page.wait_for_timeout(1000)
              except Exception:
                  pass


          def check_error(page):
              try:
                  alerts = page.locator("[role='alert']")
                  for i in range(min(alerts.count(), 3)):
                      txt = alerts.nth(i).inner_text(timeout=1000)
                      if ERR_RE.search(txt):
                          raise RuntimeError(f"Duck.ai error displayed: {txt.strip()[:200]}")
              except RuntimeError:
                  raise
              except Exception:
                  pass


          def is_generating(page):
              try:
                  b = page.locator("button[aria-label*='Stop' i], button:has-text('Stop')")
                  return b.count() > 0 and b.first.is_visible()
              except Exception:
                  return False


          def get_prompt_box(page):
              return page.locator(
                  "textarea[name='user-prompt'], textarea[placeholder*='ask' i], "
                  "textarea[placeholder*='message' i], textarea"
              ).first


          def submit_prompt(page, text):
              dismiss_modals(page)
              box = get_prompt_box(page)
              box.wait_for(state="visible", timeout=30000)
              box.click()
              box.fill("")
              page.wait_for_timeout(200)
              box.fill(text)
              page.wait_for_timeout(600)

              sent = False
              for method in range(3):
                  try:
                      if method == 0:
                          send_btn = page.locator(
                              "button[type='submit']:not([disabled]), button[aria-label*='Send' i]:not([disabled])"
                          ).first
                          if send_btn.count() > 0 and send_btn.is_visible():
                              send_btn.click(timeout=2500)
                          else:
                              box.press("Enter")
                      elif method == 1:
                          box.press("Enter")
                      else:
                          box.press("Control+Enter")
                  except Exception:
                      pass

                  page.wait_for_timeout(1500)
                  try:
                      left = box.input_value()
                  except Exception:
                      left = ""
                  if len(left.strip()) < 20:
                      sent = True
                      break

              if not sent:
                  raise RuntimeError(f"Message ({len(text)} chars) was pasted but never sent (input box still full).")
              page.wait_for_timeout(1000)
              dismiss_modals(page)


          def extract_payload(body, tag):
              start_re = re.compile(r"RECAPSTART-" + re.escape(tag) + r"(?![A-Za-z0-9])")
              end_re = re.compile(r"RECAPEND-" + re.escape(tag) + r"(?![A-Za-z0-9])")
              for m in reversed(list(start_re.finditer(body))):
                  tail = body[m.end():]
                  mm = re.match(r"[\s`]*(?:json)?[\s`]*(\{)", tail, re.I)
                  if mm:
                      tail = tail[mm.start(1):]
                      e = end_re.search(tail)
                      if e:
                          return tail[:e.start()], True
                      return tail, False
              return None, False


          def wait_for_payload(page, tag, max_wait=MAX_WAIT):
              log(f"Waiting for reply [{tag}] ...")
              t0 = time.time()
              last_len, stable = -1, 0
              while time.time() - t0 < max_wait:
                  dismiss_modals(page)
                  check_and_click_continue_generating(page)
                  check_error(page)
                  scroll_to_bottom(page)
                  try:
                      body = page.inner_text("body", timeout=5000)
                  except Exception:
                      body = ""
                  gen = is_generating(page)
                  text, finished = extract_payload(body, tag)
                  if finished:
                      page.wait_for_timeout(1500)
                      try:
                          body = page.inner_text("body", timeout=5000)
                      except Exception:
                          pass
                      text, _ = extract_payload(body, tag)
                      log(f"[+] Complete reply captured ({len(text)} chars) in {int(time.time() - t0)}s")
                      return text, True
                  stable = stable + 1 if len(body) == last_len else 0
                  last_len = len(body)
                  elapsed = time.time() - t0
                  if not gen and stable >= 6:
                      if text is not None:
                          log(f"[!] Reply ended without RECAPEND ({len(text)} chars) - salvaging complete beats")
                          return text, False
                      if elapsed > 30:
                          raise TimeoutError("No reply with the expected RECAPSTART marker appeared.")
                  page.wait_for_timeout(1000)
              scroll_to_bottom(page)
              try:
                  body = page.inner_text("body", timeout=5000)
              except Exception:
                  body = ""
              text, _ = extract_payload(body, tag)
              if text:
                  log("[!] Hit max wait; salvaging what we have")
                  return text, False
              raise TimeoutError("Duck.ai reply timed out.")


          def salvage_list(clean, key):
              m = re.search(r'"' + key + r'"\s*:\s*\[', clean)
              if not m:
                  return []
              dec = json.JSONDecoder()
              i, out = m.end(), []
              while i < len(clean):
                  while i < len(clean) and clean[i] in " \t\r\n,":
                      i += 1
                  if i >= len(clean) or clean[i] != "{":
                      break
                  try:
                      obj, j = dec.raw_decode(clean, i)
                  except Exception:
                      break
                  out.append(obj)
                  i = j
              return out


          def parse_payload(text):
              clean = re.sub(r"```(?:json)?", "", text).strip()
              try:
                  obj, _ = json.JSONDecoder().raw_decode(clean)
                  if isinstance(obj, dict):
                      return obj
              except Exception:
                  pass
              return {
                  "characters": salvage_list(clean, "characters"),
                  "beats": salvage_list(clean, "beats"),
                  "fixes": salvage_list(clean, "fixes"),
              }


          def valid_hindi(t):
              if len(t) < 15 or "Hindi" in t or "<" in t or ">" in t:
                  return False
              dev = len(re.findall(r"[\u0900-\u097F]", t))
              letters = len(re.findall(r"[A-Za-z\u0900-\u097F]", t))
              return letters > 0 and dev / letters >= 0.8


          t_file = Path("transcript.json")
          if not t_file.exists():
              raise FileNotFoundError("Missing transcript.json in repository root!")
          transcript_data = json.loads(t_file.read_text(encoding="utf-8"))
          segs = transcript_data.get("segments", [])
          if not segs:
              raise ValueError("transcript.json is empty!")
          for i, s in enumerate(segs):
              s["_id"] = i + 1
              s["start"] = float(s["start"])
              s["end"] = float(s["end"])
              s["text"] = str(s["text"]).strip()
          TOTAL_DUR = float(transcript_data.get("duration") or segs[-1]["end"])


          def fmt_line(s):
              return f"#{s['_id']} [{s['start']:.2f}-{s['end']:.2f}] {s['text']}"


          chunks, cur_first, cur_chars = [], 1, 0
          for s in segs:
              cur_chars += len(fmt_line(s)) + 1
              if s["end"] - segs[cur_first - 1]["start"] >= PART_SECONDS or cur_chars >= PART_CHARS:
                  chunks.append((cur_first, s["_id"]))
                  cur_first, cur_chars = s["_id"] + 1, 0
          if cur_first <= len(segs):
              chunks.append((cur_first, len(segs)))
          if len(chunks) > 1:
              lf, ll = chunks[-1]
              if segs[ll - 1]["end"] - segs[lf - 1]["start"] < 30:
                  chunks[-2] = (chunks[-2][0], ll)
                  chunks.pop()
          log(f"{len(segs)} transcript lines, {TOTAL_DUR:.0f}s -> {len(chunks)} parts, ONE recap chat")

          # Concise YouTube recap instructions (kept under 600 chars to avoid Duck.ai limit)
          SETUP = (
              "You are a Hindi YouTube Movie Recap Narrator (Hindi Explained style).\n"
              "RULES:\n"
              "1. NEVER dub dialogues. Summarize the key plot in natural Hindi (Devanagari).\n"
              "2. BRIDGE SCENES: Explain scene transitions and context (e.g. who goes where and why, introducing characters) before describing dialogues.\n"
              "3. SHORT FAIR-USE CLIPS: Pick 1 key moment per beat (3-6 seconds only). Avoid long blocks.\n"
              "4. Keep 2-4 major beats per part so total recap is ~20% of movie length.\n"
              "5. JSON shape: {\"characters\":[{\"name\":\"X\",\"hindi_name\":\"एक्स\",\"role\":\"Role\"}],\"beats\":[{\"from_id\":1,\"to_id\":2,\"narration\":\"Hindi narration\"}]}\n"
          )


          def reply_format(tag):
              return ("Reply format: marker RECAPSTART-" + tag + " on its line, raw JSON, marker RECAPEND-" + tag + " on its line.")


          def part_message(ci, cursor, first, last, kind, tag, with_text):
              t0 = segs[cursor - 1]["start"]
              t1 = segs[last - 1]["end"]
              head = (f"PART {ci + 1}/{len(chunks)} ({t0:.0f}s-{t1:.0f}s, lines #{first}-#{last}).\n"
                      f"Give 2 to 4 key story beats in Hindi YouTube recap style with scene context bridges. "
                      f"Keep clips short (3 to 6 seconds each).\n" + reply_format(tag))
              if with_text:
                  head += "\nTRANSCRIPT:\n" + "\n".join(fmt_line(segs[i - 1]) for i in range(cursor, last + 1))
              return head


          def story_summary(beats, characters):
              if not beats:
                  return ""
              names = ", ".join(f"{c.get('name', '')} ({c.get('hindi_name', '')})" for c in characters[:5])
              recent = " ".join(b["narration"] for b in beats[-4:])
              recent = recent[-500:]
              return f"\nContext so far: Characters ({names}). Earlier: {recent}\n"


          def score(b):
              w = len(b["narration"].split())
              clip = b["target_window"]["end"] - b["target_window"]["start"]
              b["narration_words"] = w
              b["narration_sec_est"] = round(w / WORDS_PER_SEC, 1)
              b["clip_sec"] = round(clip, 1)
              b["fit"] = round((w / WORDS_PER_SEC) / max(clip, 0.1), 2)


          def integrate(parsed, prev_to, prev_clip_end, first, last, part_no):
              accepted = []
              for b in parsed.get("beats", []):
                  try:
                      f, t = int(b["from_id"]), int(b["to_id"])
                  except Exception:
                      continue
                  nar = str(b.get("narration", "")).strip().replace('"', "'")
                  t = min(t, last)
                  if f < first or f > last or f > t:
                      continue
                  if f <= prev_to:
                      f = prev_to + 1
                      if f > t:
                          continue
                  if not valid_hindi(nar):
                      log(f"Beat #{f}-#{t} skipped (not valid Hindi narrative).")
                      continue

                  raw_start = segs[f - 1]["start"]
                  raw_end = segs[t - 1]["end"]

                  cs = max(raw_start - CLIP_PAD, prev_clip_end)
                  cs = max(cs, 0.0)
                  ce = raw_end + CLIP_PAD

                  if ce - cs > MAX_CLIP:
                      ce = cs + MAX_CLIP
                  if ce - cs < MIN_CLIP:
                      ce = min(TOTAL_DUR, cs + MIN_CLIP)

                  beat = {
                      "part": part_no,
                      "source_segment_ids": [f, t],
                      "target_window": {"start": round(cs, 2), "end": round(ce, 2)},
                      "narration": nar,
                      "source_text": " ".join(segs[i - 1]["text"] for i in range(f, t + 1)),
                  }
                  score(beat)
                  accepted.append(beat)
                  prev_to, prev_clip_end = t, ce
              return accepted


          def build_output(beats, characters, parts_info):
              clip_sum = sum(b["clip_sec"] for b in beats)
              return {
                  "movie_title": transcript_data.get("movie_title", "movie"),
                  "duration": TOTAL_DUR,
                  "recap_duration_seconds": round(clip_sum, 1),
                  "recap_percentage": f"{round((clip_sum / TOTAL_DUR) * 100, 1)}%",
                  "characters": characters,
                  "total_beats": len(beats),
                  "parts": parts_info,
                  "beats": [dict({"beat_id": f"B{i + 1:04d}"}, **b) for i, b in enumerate(beats)],
              }


          def write_json(name, beats, characters, parts_info):
              Path(name).write_text(
                  json.dumps(build_output(beats, characters, parts_info), indent=2, ensure_ascii=False), encoding="utf-8"
              )


          def repair_long_narrations(page, ci, part_beats):
              bad = [b for b in part_beats if b["fit"] > FIT_LIMIT]
              if not bad:
                  return
              tag = f"P{ci + 1}X"
              lines = []
              for b in bad:
                  max_words = max(5, int(b["clip_sec"] * WORDS_PER_SEC * 1.05))
                  lines.append(f"from_id={b['source_segment_ids'][0]} | clip {b['clip_sec']}s | max {max_words} words | current: {b['narration']}")
              msg = ("Make these Hindi narrations shorter to fit YouTube clips (Devanagari only, no quotes):\n"
                     '{"fixes":[{"from_id":<number>,"narration":"<shorter narration>"}]}\n'
                     + reply_format(tag) + "\n" + "\n".join(lines))
              log(f"Requesting {len(bad)} shorter voiceovers in part {ci + 1}")
              submit_prompt(page, msg)
              text, _ = wait_for_payload(page, tag)
              fixes = parse_payload(text).get("fixes", [])
              by_id = {b["source_segment_ids"][0]: b for b in bad}
              applied = 0
              for fx in fixes:
                  try:
                      b = by_id.get(int(fx["from_id"]))
                  except Exception:
                      continue
                  nar = str(fx.get("narration", "")).strip().replace('"', "'")
                  if not b or not valid_hindi(nar):
                      continue
                  old_fit, old_nar = b["fit"], b["narration"]
                  b["narration"] = nar
                  score(b)
                  if b["fit"] < old_fit:
                      applied += 1
                  else:
                      b["narration"] = old_nar
                      score(b)
              log(f"Applied {applied}/{len(bad)} tighter narrations")


          all_beats, characters, parts_info = [], [], []

          with sync_playwright() as p:
              start_browser(p)
              for ci, (first, last) in enumerate(chunks):
                  part_dur = segs[last - 1]["end"] - segs[first - 1]["start"]
                  log(f"\n===== PART {ci + 1}/{len(chunks)} (lines #{first}-#{last}, {part_dur:.0f}s) =====")
                  part_beats, cursor, prev_to, rounds = [], first, first - 1, 0

                  while True:
                      rounds += 1
                      if rounds > MAX_ROUNDS:
                          break
                      kind = "new_part" if rounds == 1 else "continue"
                      tag = f"P{ci + 1}R{rounds}"
                      ok = False
                      for attempt in range(1, MAX_ATTEMPTS + 1):
                          try:
                              new_chat = False
                              if not chat["primed"] or state["page"] is None:
                                  open_chat()
                                  new_chat = True
                              page = state["page"]
                              msg = part_message(ci, cursor, first, last, kind, tag, with_text=(kind == "new_part" or new_chat))
                              if new_chat:
                                  msg = SETUP + story_summary(all_beats + part_beats, characters) + "\n" + msg
                              log(f"Sending [{tag}] attempt {attempt} ({len(msg)} chars, new chat: {new_chat})")
                              submit_prompt(page, msg)
                              text, finished = wait_for_payload(page, tag)
                              parsed = parse_payload(text)
                              prev_list = part_beats or all_beats
                              prev_clip_end = prev_list[-1]["target_window"]["end"] if prev_list else 0.0
                              accepted = integrate(parsed, prev_to, prev_clip_end, first, last, ci + 1)
                              if not accepted:
                                  raise ValueError("No usable beats returned")
                              chat["primed"] = True
                              known = {str(c.get("name", "")).lower() for c in characters}
                              for c in parsed.get("characters", []):
                                  if isinstance(c, dict) and str(c.get("name", "")).lower() not in known:
                                      characters.append(c)
                                      known.add(str(c.get("name", "")).lower())
                              part_beats.extend(accepted)
                              prev_to = part_beats[-1]["source_segment_ids"][1]
                              write_json("debug/story_beats.partial.json", all_beats + part_beats, characters, parts_info)
                              log(f"[+] +{len(accepted)} beats; covered up to line #{prev_to} of #{last}")
                              ok = True
                              break
                          except Exception as err:
                              log(f"Attempt {attempt} failed: {err}")
                              if state["page"]:
                                  snap(state["page"], f"err_{tag}_a{attempt}")
                              new_tor_circuit()
                              start_browser(p)
                              chat["primed"] = False

                      if not ok:
                          log(f"Could not complete part {ci + 1}. Saving partial results.")
                          sys.exit(1)

                      # 2 to 4 major story beats per scene are sufficient for a YouTube recap
                      if len(part_beats) >= 2 or prev_to >= last - 5:
                          break
                      cursor = prev_to + 1

                  try:
                      repair_long_narrations(state["page"], ci, part_beats)
                  except Exception as err:
                      log(f"Narration adjustment skipped: {err}")
                      chat["primed"] = False

                  clip_total = sum(b["clip_sec"] for b in part_beats)
                  parts_info.append({
                      "part": ci + 1,
                      "source_start": round(segs[first - 1]["start"], 2),
                      "source_end": round(segs[last - 1]["end"], 2),
                      "source_seconds": round(part_dur, 1),
                      "recap_clip_seconds": round(clip_total, 1),
                      "ratio": round(clip_total / part_dur, 2),
                      "beats": len(part_beats),
                  })
                  log(f"Part {ci + 1} Done: {len(part_beats)} beats, {clip_total:.0f}s clips for {part_dur:.0f}s video")
                  all_beats.extend(part_beats)
                  write_json("debug/story_beats.partial.json", all_beats, characters, parts_info)

              if state["browser"]:
                  state["browser"].close()

          write_json("story_beats.json", all_beats, characters, parts_info)
          total_recap_dur = sum(b["clip_sec"] for b in all_beats)
          log(f"SUCCESS: story_beats.json produced with {len(all_beats)} beats.")
          log(f"Total Video: {TOTAL_DUR:.0f}s | Recap Clips: {total_recap_dur:.0f}s ({round((total_recap_dur/TOTAL_DUR)*100)}%)")
          PY
          if [ "$HEADED" = "true" ]; then
            xvfb-run -a --server-args="-screen 0 1440x1000x24" python generate_story.py
          else
            python generate_story.py
          fi

      - name: Kill leftover browser processes
        if: always()
        run: |
          pkill -9 -f chrome || true
          pkill -9 -f Xvfb || true

      - name: Commit and push story_beats.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f story_beats.json ]; then
            echo "story_beats.json not produced."
            exit 1
          fi
          git add -f story_beats.json
          if git diff --cached --quiet; then
            echo "No new story beats to commit."
            exit 0
          fi
          git commit -m "Add synchronized YouTube-style Hindi story_beats.json [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duck-ai-debug
          path: debug/
          if-no-files-found: ignore
