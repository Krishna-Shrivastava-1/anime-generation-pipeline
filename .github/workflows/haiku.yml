                  else:
                      prop_min = max(1.0, round(total_target_min / 3.0, 2))
                  target_words = max(60, int(round(prop_min * 140)))
                  return f"~{prop_min} minutes (full video target: {total_target_min} minutes)", str(target_words)
              except Exception:
                  return f"{TARGET_MINUTES} minutes", "250"

