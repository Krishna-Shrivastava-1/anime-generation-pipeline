          PROMPT_4_TEMPLATE = textwrap.dedent("""\
          # PROMPT 4 — LUNA SELF-REFINEMENT & PACING EDITOR

          You have this chunk's transcript, the draft JSON below, and the upcoming ~100-line preview from Prompt 2.
          Use Web Search on `__MOVIE_TITLE__` (`__CONTENT_TYPE__`, Season `__SEASON__`, Episode `__EPISODE__`) + the transcript to refine the JSON:
          1. **On-Screen Accuracy & Character Intros:** Verify Beat 1 starts strictly with the opening scene of this transcript (NO off-screen intro), fix any speaker mix-ups, and ensure every newly introduced character has a brief 2–4 word role label on first mention.
          2. **Balanced Pacing (Not Rushed!):** Full video target is ~__TARGET_MINUTES__m (~__TOTAL_TARGET_WORDS__ words); this chunk (**__CHUNK_PCT__%** of runtime) budget is **~__TARGET_WORDS__ words (~__TARGET_DURATION__)**. Keep beats at **~30–50 words each** (split overcrowded 65+ word beats or drop minor filler so viewers easily follow **What, Why, and How**). Avoid "इसके बाद".
          3. **Phrase-Synced Clips:** Every clip (`<= 3.0s`, valid chunk timestamps) must carry its exact sequential `spoken_text` phrase from `narration` so joining all `spoken_text` equals `narration`.

