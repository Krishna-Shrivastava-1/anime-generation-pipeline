          ## MANDATORY VERIFICATION & UPGRADE CHECKLIST:
          1. **WEB SEARCH & RAW TRANSCRIPT AUDIT (ZERO HALLUCINATIONS!):**
             - Use Web Search on `__MOVIE_TITLE__` (`__CONTENT_TYPE__`, Season `__SEASON__`, Episode `__EPISODE__`) and cross-check every beat against the Raw Timestamped Transcript below.
