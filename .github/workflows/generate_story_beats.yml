name: Generate Hindi YouTube Movie Recap

on:
  workflow_dispatch:
    inputs:
      headed:
        description: "Run non-headless Chrome under Xvfb"
        required: true
        type: boolean
        default: true
      target_recap_mins:
        description: "Target recap duration in minutes (e.g. 5)"
        required: true
        default: "5"

permissions:
  contents: write

jobs:
  generate-recap:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tor & Dependencies
        timeout-minutes: 4
        run: |
          sudo apt-get update
          sudo apt-get install -y tor netcat-openbsd xvfb
          sudo service tor start
          for i in {1..30}; do
            if nc -z 127.0.0.1 9050; then echo "Tor ready"; break; fi
            sleep 2
          done
          nc -z 127.0.0.1 9050

      - name: Install Python dependencies
        timeout-minutes: 6
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi playwright pillow requests
          playwright install --with-deps chromium

      - name: Automate Duck.ai Story Pipeline
        timeout-minutes: 110
        env:
          HEADED: ${{ inputs.headed }}
          TARGET_RECAP_MINS: ${{ inputs.target_recap_mins }}
        run: |
          mkdir -p debug
          cat > generate_story.py <<'PY'
          import os, re, sys, json, subprocess, time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          HEADED = os.environ.get("HEADED") == "true"
          TARGET_MINS = float(os.environ.get("TARGET_RECAP_MINS", "5"))
          TARGET_WORDS = int(TARGET_MINS * 140)  # Standard 140 words/min voiceover rate

          PART_SECONDS = 180
          PART_CHARS = 1800
          MAX_WAIT = 260
          BROWSER_PROXY = "socks5://127.0.0.1:9050"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36"
          MODAL_LABELS = re.compile(
              r"^(agree and continue|continue|i agree|accept|accept all|get started|got it|next|done|dismiss)$", re.I
          )
          ERR_RE = re.compile(r"something went wrong|too many requests|rate limit|try again|reached your daily limit", re.I)

          state = {"browser": None, "context": None, "page": None}

          def log(msg):
              line = f"[{time.strftime('%H:%M:%S')}] {msg}"
              print(line, flush=True)

          def scroll_to_bottom(page):
              try:
                  page.evaluate("""() => {
                      window.scrollTo(0, document.body.scrollHeight);
                      for (const el of document.querySelectorAll('*')) {
                          if (el.scrollHeight > el.clientHeight + 20) { el.scrollTop = el.scrollHeight; }
                      }
                  }""")
              except Exception:
                  pass

          def new_tor_circuit():
              log("Restarting Tor circuit...")
              subprocess.run(["sudo", "service", "tor", "restart"], check=False)
              for _ in range(30):
                  if subprocess.run(["nc", "-z", "127.0.0.1", "9050"]).returncode == 0:
                      break
                  time.sleep(2)
              time.sleep(2)

          def start_browser(p):
              for key in ("context", "browser"):
                  if state[key]:
                      try: state[key].close()
                      except Exception: pass
                  state[key] = None
              state["browser"] = p.chromium.launch(
                  headless=not HEADED,
                  proxy={"server": BROWSER_PROXY},
                  args=["--disable-dev-shm-usage", "--disable-blink-features=AutomationControlled"],
              )

          def dismiss_modals(page):
              try:
                  buttons = page.get_by_role("button", name=MODAL_LABELS)
                  for i in range(buttons.count()):
                      btn = buttons.nth(i)
                      if btn.is_visible():
                          btn.click(timeout=2000)
                          page.wait_for_timeout(500)
                          break
              except Exception:
                  pass

          def open_chat():
              if state["context"]:
                  try: state["context"].close()
                  except Exception: pass
              ctx = state["browser"].new_context(viewport={"width": 1440, "height": 1000}, user_agent=UA)
              ctx.add_init_script("Object.defineProperty(navigator,'webdriver',{get:()=>undefined})")
              pg = ctx.new_page()
              state["context"], state["page"] = ctx, pg
              log("Navigating to https://duck.ai/chat ...")
              pg.goto("https://duck.ai/chat", wait_until="domcontentloaded", timeout=60000)
              pg.wait_for_timeout(2500)
              dismiss_modals(pg)
              return pg

          def check_and_click_continue(page):
              try:
                  btn = page.locator("button:has-text('Continue generating'), button:has-text('Continue response')").first
                  if btn.count() > 0 and btn.is_visible():
                      btn.click(timeout=2000)
                      page.wait_for_timeout(1000)
              except Exception:
                  pass

          def is_generating(page):
              try:
                  b = page.locator("button[aria-label*='Stop' i], button:has-text('Stop')")
                  return b.count() > 0 and b.first.is_visible()
              except Exception:
                  return False

          def submit_prompt(page, text):
              dismiss_modals(page)
              box = page.locator("textarea[name='user-prompt'], textarea").first
              box.wait_for(state="visible", timeout=30000)
              box.click()
              page.keyboard.press("Control+A")
              page.keyboard.press("Backspace")
              box.fill(text)
              box.dispatch_event("input")
              page.wait_for_timeout(500)

              send_btn = page.locator("button[type='submit']:not([disabled]), button[aria-label*='Send' i]:not([disabled])").first
              if send_btn.count() > 0 and send_btn.is_visible():
                  send_btn.click(timeout=2500)
              else:
                  box.press("Enter")
              page.wait_for_timeout(1500)
              dismiss_modals(page)

          def extract_payload(body, tag):
              start_m = f"###START-{tag}###"
              end_m = f"###END-{tag}###"
              idx = body.rfind(start_m)
              if idx != -1:
                  tail = body[idx + len(start_m):]
                  brace = tail.find("[") if "[" in tail else tail.find("{")
                  if brace != -1:
                      tail = tail[brace:]
                      e = tail.find(end_m)
                      if e != -1:
                          return tail[:e].strip(), True
                      return tail.strip(), False
              return None, False

          def wait_for_payload(page, tag, max_wait=MAX_WAIT):
              t0 = time.time()
              last_len, stable = -1, 0
              while time.time() - t0 < max_wait:
                  dismiss_modals(page)
                  check_and_click_continue(page)
                  scroll_to_bottom(page)
                  body = page.inner_text("body", timeout=5000)
                  text, finished = extract_payload(body, tag)
                  if finished:
                      return text
                  stable = stable + 1 if len(body) == last_len else 0
                  last_len = len(body)
                  if not is_generating(page) and stable >= 5 and text:
                      return text
                  page.wait_for_timeout(1000)
              raise TimeoutError(f"Response for {tag} timed out.")

          # Clean and parse JSON safely
          def parse_json_safely(text):
              if not text: return None
              clean = re.sub(r"```(?:json)?", "", text).strip()
              # Try direct parse
              try: return json.loads(clean)
              except Exception: pass
              # Try slice
              s = min([p for p in [clean.find("{"), clean.find("[")] if p != -1], default=-1)
              e = max([clean.rfind("}"), clean.rfind("]")])
              if s != -1 and e > s:
                  try: return json.loads(clean[s:e+1])
                  except Exception: pass
              return None

          # Load transcripts
          t_file = Path("transcript.json")
          if not t_file.exists():
              raise FileNotFoundError("transcript.json missing!")
          transcript_data = json.loads(t_file.read_text(encoding="utf-8"))
          segs = transcript_data.get("segments", [])
          for i, s in enumerate(segs):
              s["_id"] = i + 1
              s["start"] = float(s["start"])
              s["end"] = float(s["end"])
              s["text"] = str(s["text"]).strip()

          chunks, cur_first, cur_chars = [], 1, 0
          for s in segs:
              cur_chars += len(s["text"]) + 15
              if s["end"] - segs[cur_first - 1]["start"] >= PART_SECONDS or cur_chars >= PART_CHARS:
                  chunks.append((cur_first, s["_id"]))
                  cur_first, cur_chars = s["_id"] + 1, 0
          if cur_first <= len(segs):
              chunks.append((cur_first, len(segs)))

          log(f"Transcript broken into {len(chunks)} structural acts.")

          # ----------------- PASS 1: MAP (Plot Fact Extraction) -----------------
          all_act_facts = []

          with sync_playwright() as p:
              start_browser(p)
              open_chat()
              page = state["page"]

              # Prime chat for Plot Extraction
              init_prompt = (
                  "You are an assistant for a YouTube Movie Recap channel.\n"
                  "We are analyzing a movie transcript act by act.\n"
                  "STRICT RULES FOR PASS 1:\n"
                  "- DO NOT write narration yet.\n"
                  "- DO NOT translate or quote dialogues.\n"
                  "- Extract 2-3 third-person plot actions: who did what, what secret was revealed, what changed.\n"
                  "- Output ONLY raw JSON wrapped in ###START-ACTX### and ###END-ACTX###."
              )
              submit_prompt(page, init_prompt)
              time.sleep(3)

              for ci, (f_id, l_id) in enumerate(chunks):
                  tag = f"ACT{ci + 1}"
                  act_lines = [f"#{s['_id']} [{s['start']:.0f}s-{s['end']:.0f}s] {s['text']}" for s in segs[f_id - 1:l_id]]
                  prompt = (
                      f"Analyze ACT {ci + 1}/{len(chunks)} ({segs[f_id-1]['start']:.0f}s - {segs[l_id-1]['end']:.0f}s):\n"
                      f"TRANSCRIPT:\n" + "\n".join(act_lines) + "\n\n"
                      f"Return JSON format:\n"
                      f"###START-{tag}###\n"
                      f"[\n"
                      f"  {{\"action\": \"Third-person description of action or revelation\", \"clip_start\": {segs[f_id-1]['start']:.1f}, \"clip_end\": {segs[l_id-1]['end']:.1f}}}\n"
                      f"]\n"
                      f"###END-{tag}###"
                  )
                  log(f"Pass 1: Extracting story facts for Act {ci + 1}...")
                  submit_prompt(page, prompt)
                  raw = wait_for_payload(page, tag)
                  parsed = parse_json_safely(raw)
                  if isinstance(parsed, list):
                      all_act_facts.extend(parsed)
                  log(f"[+] Act {ci + 1} parsed: {len(parsed) if isinstance(parsed, list) else 0} events.")

              # ----------------- PASS 2: REDUCE (Unified YouTube Recap) -----------------
              log("\n===== PASS 2: Synthesizing Unified YouTube Recap Script =====")
              reduce_tag = "FINALRECAP"
              reduce_prompt = (
                  f"Now write the complete Hindi YouTube Movie Recap voiceover script based on all the acts above.\n"
                  f"TARGET WORD COUNT: ~{TARGET_WORDS} words in Hindi (~{TARGET_MINS} minutes spoken duration).\n\n"
                  "RECAP NARRATION RULES (CRITICAL):\n"
                  "1. VOICE: Enthusiastic YouTube Movie Recap narrator in Hindi (third-person).\n"
                  "   Example: 'कहानी की शुरुआत में हम देखते हैं...', 'दूसरी तरफ...', 'तभी एक बड़ा खुलासा होता है...'\n"
                  "2. NEVER quote characters line by line. Explain their motives, actions, and the unfolding mystery.\n"
                  "3. SEAMLESS BRIDGING: Every scene change MUST use bridge words ('कुछ देर बाद', 'तभी वहां', 'हालांकि') to prevent choppy jumps.\n"
                  "4. CLIPS: Link each narration line to a focused 4 to 8 second video clip timestamp from the facts gathered.\n\n"
                  f"Return ONLY valid JSON wrapped in ###START-{reduce_tag}### and ###END-{reduce_tag}###:\n"
                  f"###START-{reduce_tag}###\n"
                  "[\n"
                  "  {\n"
                  "    \"scene\": 1,\n"
                  "    \"clip_start\": 0.0,\n"
                  "    \"clip_end\": 6.5,\n"
                  "    \"narration\": \"कहानी की शुरुआत में हम देखते हैं कि डिटेक्टिव क्लोई को एक नया मर्डर केस सौंपा जाता है...\"\n"
                  "  }\n"
                  "]\n"
                  f"###END-{reduce_tag}###"
              )

              submit_prompt(page, reduce_prompt)
              final_raw = wait_for_payload(page, reduce_tag, max_wait=300)
              final_beats = parse_json_safely(final_raw)

              if not final_beats or not isinstance(final_beats, list):
                  raise ValueError("Failed to obtain final unified recap list from LLM.")

              # Calculate stats and enforce safe clip bounds
              total_words = 0
              for b in final_beats:
                  nar = b.get("narration", "")
                  w_count = len(nar.split())
                  total_words += w_count
                  b["words"] = w_count
                  # Clamp clip to avoid negative or oversized video slices
                  cs = max(0.0, float(b.get("clip_start", 0)))
                  ce = max(cs + 2.0, float(b.get("clip_end", cs + 6.0)))
                  b["clip_start"] = round(cs, 2)
                  b["clip_end"] = round(ce, 2)
                  b["clip_duration"] = round(ce - cs, 2)

              output_data = {
                  "movie_title": transcript_data.get("movie_title", "movie"),
                  "total_original_duration": transcript_data.get("duration", segs[-1]["end"]),
                  "target_duration_minutes": TARGET_MINS,
                  "total_words": total_words,
                  "estimated_audio_minutes": round(total_words / 140, 2),
                  "scenes_count": len(final_beats),
                  "story_beats": final_beats
              }

              Path("story_beats.json").write_text(json.dumps(output_data, indent=2, ensure_ascii=False), encoding="utf-8")
              log(f"SUCCESS! story_beats.json generated with {len(final_beats)} seamless scenes ({total_words} Hindi words).")
              state["browser"].close()
          PY

          if [ "$HEADED" = "true" ]; then
            xvfb-run -a --server-args="-screen 0 1440x1000x24" python generate_story.py
          else
            python generate_story.py
          fi

      - name: Commit and push story_beats.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f story_beats.json ]; then
            git add -f story_beats.json
            if ! git diff --cached --quiet; then
              git commit -m "Update YouTube-style Hindi movie recap story_beats.json [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
              echo "Successfully pushed story_beats.json"
            else
              echo "No changes in story_beats.json"
            fi
          fi

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duck-ai-debug
          path: debug/
          if-no-files-found: ignore
