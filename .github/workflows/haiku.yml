                  }
                ]
              }
            ]
          }

          ## INPUT
          Movie/Series Title: __MOVIE_TITLE__
          Content Type: __CONTENT_TYPE__
          Season: __SEASON__
          Episode: __EPISODE__
          Part Identifier: __PART_IDENTIFIER__
          Target Narration Duration: __TARGET_DURATION__
          Initial Context Notes: __PREVIOUS_CONTEXT__

          Timestamped Transcript:
          __TRANSCRIPT_JSON__""").strip()

          PROMPT_2_TEMPLATE = textwrap.dedent("""\
          # PROMPT 2 — CONTINUITY HANDOFF

          You have already processed the earlier part of this movie/series in this conversation. I am providing the next approximately 100 transcript lines as a **PREVIEW ONLY**.

          Read the preview carefully to understand upcoming events, identify characters and speakers, clarify dialogue references, and understand how the next scene connects to the existing story.

          **Do NOT generate narration, recap beats, clips, or JSON for the preview.**

          Create a concise continuity handoff that I can copy into a completely new chat so another model can continue the recap seamlessly.

