          # ------------------ DYNAMIC BUILDERS ------------------
          def load_transcript(transcript_path="transcript.json"):
              p = Path(transcript_path)
              if not p.exists():
                  raise FileNotFoundError(f"'{transcript_path}' not found in repository root.")
              with open(p, "r", encoding="utf-8") as f:
                  return json.load(f)

          def calc_target_budget(chunk_segments, total_duration):
              if not TARGET_MINUTES:
                  return "null", "150", "560", "25"
              try:
                  total_target_min = float(TARGET_MINUTES)
                  total_words_budget = max(120, int(round(total_target_min * 140)))
                  cs = float(chunk_segments[0].get("start", 0.0))
                  ce = float(chunk_segments[-1].get("end", cs))
                  span = max(0.0, ce - cs)
                  if total_duration > 0 and span > 0:
                      ratio = min(1.0, span / total_duration)
                  else:
                      ratio = 0.33
                  pct = max(5, int(round(ratio * 100)))
                  prop_min = max(0.4, round(total_target_min * ratio, 2))
                  chunk_words = max(60, int(round(prop_min * 140)))
                  return f"~{prop_min} minutes (full video target: {total_target_min} minutes)", str(chunk_words), str(total_words_budget), str(pct)
              except Exception:
                  return f"{TARGET_MINUTES} minutes", "200", "560", "33"

          def build_prompt_0(movie_title):
              p = PROMPT_0_TEMPLATE
              for k, v in [("__MOVIE_TITLE__", movie_title), ("__CONTENT_TYPE__", INPUT_CONTENT_TYPE or "N/A"), ("__SEASON__", INPUT_SEASON or "N/A"), ("__EPISODE__", INPUT_EPISODE or "N/A"), ("__PART_IDENTIFIER__", INPUT_PART or "N/A")]:
                  p = p.replace(k, v)
              return p

          def build_prompt_1_chunk(transcript_data, start_idx, episode_bible, initial_hints):
              movie_title = INPUT_MOVIE_TITLE or str(transcript_data.get("movie_title") or "Untitled")
              total_duration = float(transcript_data.get("duration") or 0.0)
              all_segs = transcript_data.get("segments", [])
              if start_idx >= len(all_segs):
                  return None, start_idx
              ctx = " | ".join([x for x in [episode_bible[:1400], ("Notes: " + initial_hints[:500]) if initial_hints else ""] if x]) or "None"

              def render(dur_t, words_t, tot_w, pct_t, segs):
                  obj = {"movie_title": movie_title, "duration": total_duration, "segments": segs}
                  p = PROMPT_1_TEMPLATE
                  for k, v in [
                      ("__MOVIE_TITLE__", movie_title), ("__CONTENT_TYPE__", INPUT_CONTENT_TYPE or "null"),
                      ("__SEASON__", INPUT_SEASON or "null"), ("__EPISODE__", INPUT_EPISODE or "null"),
                      ("__PART_IDENTIFIER__", INPUT_PART or "null"), ("__TARGET_MINUTES__", TARGET_MINUTES or "4"),
                      ("__TOTAL_TARGET_WORDS__", tot_w), ("__CHUNK_PCT__", pct_t),
                      ("__TARGET_DURATION__", dur_t), ("__TARGET_WORDS__", words_t),
                      ("__PREVIOUS_CONTEXT__", ctx),
                      ("__TRANSCRIPT_JSON__", json.dumps(obj, ensure_ascii=False, separators=(",", ":")))
                  ]:
                      p = p.replace(k, v)
                  return p

              budget = MAX_PROMPT_CHARS - len(render("~1.5m", "210", "560", "30", [])) - 120
              selected, used, idx = [], 0, start_idx
              while idx < len(all_segs):
                  s_str = json.dumps(all_segs[idx], ensure_ascii=False, separators=(",", ":"))
                  extra = len(s_str) + (1 if selected else 0)
                  if used + extra > budget:
                      if not selected:
                          selected.append(all_segs[idx]); idx += 1
                      break
                  selected.append(all_segs[idx]); used += extra; idx += 1

              dur_t, words_t, tot_w, pct_t = calc_target_budget(selected, total_duration)
              final_p = render(dur_t, words_t, tot_w, pct_t, selected)
              while len(final_p) > MAX_PROMPT_CHARS and len(selected) > 1:
                  selected.pop(); idx -= 1
                  dur_t, words_t, tot_w, pct_t = calc_target_budget(selected, total_duration)
                  final_p = render(dur_t, words_t, tot_w, pct_t, selected)

              return {
                  "prompt_type": "PROMPT_1", "movie_title": movie_title, "start_idx": start_idx, "end_idx": idx,
                  "segment_count": len(selected), "time_start": selected[0].get("start"), "time_end": selected[-1].get("end"),
                  "dur_text": dur_t, "words_text": words_t, "total_words_text": tot_w, "chunk_pct": pct_t,
                  "prompt_chars": len(final_p), "prompt": final_p
              }, idx

          def build_prompt_3_chunk(transcript_data, start_idx, handoff_text, episode_bible, next_beat_num, next_clip_num):
              movie_title = INPUT_MOVIE_TITLE or str(transcript_data.get("movie_title") or "Untitled")
              total_duration = float(transcript_data.get("duration") or 0.0)
              all_segs = transcript_data.get("segments", [])
              if start_idx >= len(all_segs):
                  return None, start_idx
              nb_id, nc_id = f"B{next_beat_num:04d}", f"C{next_clip_num:04d}"
              bible = (episode_bible or "None")[:1200]
              handoff = handoff_text.strip()[-6000:]

              def render(dur_t, words_t, tot_w, pct_t, segs, h_txt):
                  obj = {"movie_title": movie_title, "duration": total_duration, "segments": segs}
                  p = PROMPT_3_TEMPLATE
                  for k, v in [
                      ("__MOVIE_TITLE__", movie_title), ("__CONTENT_TYPE__", INPUT_CONTENT_TYPE or "null"),
                      ("__SEASON__", INPUT_SEASON or "null"), ("__EPISODE__", INPUT_EPISODE or "null"),
                      ("__PART_IDENTIFIER__", INPUT_PART or "null"), ("__TARGET_MINUTES__", TARGET_MINUTES or "4"),
                      ("__TOTAL_TARGET_WORDS__", tot_w), ("__CHUNK_PCT__", pct_t),
                      ("__TARGET_DURATION__", dur_t), ("__TARGET_WORDS__", words_t),
                      ("__NEXT_BEAT_ID__", nb_id), ("__NEXT_CLIP_ID__", nc_id),
                      ("__EPISODE_BIBLE__", bible), ("__HANDOFF_TEXT__", h_txt),
                      ("__TRANSCRIPT_JSON__", json.dumps(obj, ensure_ascii=False, separators=(",", ":")))
                  ]:
                      p = p.replace(k, v)
                  return p

              budget = MAX_PROMPT_CHARS - len(render("~1.5m", "210", "560", "30", [], handoff)) - 120
              if budget < 600:
                  handoff = handoff[-max(1500, len(handoff) - (800 - budget)):]
                  budget = MAX_PROMPT_CHARS - len(render("~1.5m", "210", "560", "30", [], handoff)) - 120

              selected, used, idx = [], 0, start_idx
              while idx < len(all_segs):
                  s_str = json.dumps(all_segs[idx], ensure_ascii=False, separators=(",", ":"))
                  extra = len(s_str) + (1 if selected else 0)
                  if used + extra > budget:
                      if not selected:
                          selected.append(all_segs[idx]); idx += 1
                      break
                  selected.append(all_segs[idx]); used += extra; idx += 1

              dur_t, words_t, tot_w, pct_t = calc_target_budget(selected, total_duration)
              final_p = render(dur_t, words_t, tot_w, pct_t, selected, handoff)
              while len(final_p) > MAX_PROMPT_CHARS and len(selected) > 1:
                  selected.pop(); idx -= 1
                  dur_t, words_t, tot_w, pct_t = calc_target_budget(selected, total_duration)
                  final_p = render(dur_t, words_t, tot_w, pct_t, selected, handoff)

              return {
                  "prompt_type": "PROMPT_3", "movie_title": movie_title, "start_idx": start_idx, "end_idx": idx,
                  "segment_count": len(selected), "time_start": selected[0].get("start"), "time_end": selected[-1].get("end"),
                  "dur_text": dur_t, "words_text": words_t, "total_words_text": tot_w, "chunk_pct": pct_t,
                  "prompt_chars": len(final_p), "prompt": final_p
              }, idx

          def build_prompt_2_preview(transcript_data, preview_start_idx, recovery_state=None, recovery_beats=None):
              all_segs = transcript_data.get("segments", [])
              if preview_start_idx >= len(all_segs):
                  return None
              preview_slice = all_segs[preview_start_idx : preview_start_idx + PREVIEW_LINES_LIMIT]

              def render(segs):
                  if recovery_state is None:
                      return PROMPT_2_TEMPLATE.replace("__PREVIEW_JSON__", json.dumps(segs, ensure_ascii=False, separators=(",", ":")))
                  p = PROMPT_2_RECOVERY_TEMPLATE
                  p = p.replace("__RECOVERY_STATE__", json.dumps(recovery_state, ensure_ascii=False))
                  p = p.replace("__RECOVERY_BEATS__", json.dumps(recovery_beats or [], ensure_ascii=False))
                  p = p.replace("__PREVIEW_JSON__", json.dumps(segs, ensure_ascii=False, separators=(",", ":")))
                  return p

              selected = []
              for seg in preview_slice:
                  if len(render(selected + [seg])) > MAX_PROMPT_CHARS:
                      if not selected: selected = [seg]
                      break
                  selected.append(seg)
              final_p = render(selected)
              return {"prompt_chars": len(final_p), "preview_count": len(selected), "prompt": final_p}

          def build_prompt_4_enhance(movie_title, chunk_meta, draft_norm_obj, episode_bible, prev_ending, upcoming_handoff, next_beat_num, next_clip_num):
              payload = {
