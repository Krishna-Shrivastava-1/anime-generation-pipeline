             - **Global Budget Discipline:** The full recap must finish in **~__TARGET_MINUTES__ minutes (~__TOTAL_TARGET_WORDS__ Hindi words total)**. This chunk (**__CHUNK_PCT__%** of runtime) budget is **~__TARGET_WORDS__ words (~__TARGET_DURATION__)**. Keep only essential plot + future-relevant setups in gripping, natural third-person Hindi (Devanagari only, no dialogue reading, no robotic disclaimers, avoid repeating "इसके बाद") so viewers say: *"I understood the whole movie effortlessly!"*
          3. **PHRASE-SYNCED CLIP ALIGNMENT (STRICT!):**
             - Divide each beat's `narration` sequentially into short spoken phrases (`spoken_text`, ~3–8 words each) and pair **each phrase** with one relevant `<= 3.0s` clip whose timestamp exists in the Raw Transcript below.
