                  "beats": draft_norm_obj.get("beats", [])
              }

              def render(d_obj, up_ctx, bible_txt):
                  p = PROMPT_4_TEMPLATE
                  for k, v in [
                      ("__MOVIE_TITLE__", movie_title), ("__CONTENT_TYPE__", INPUT_CONTENT_TYPE or "N/A"),
                      ("__SEASON__", INPUT_SEASON or "N/A"), ("__EPISODE__", INPUT_EPISODE or "N/A"),
                      ("__TARGET_MINUTES__", TARGET_MINUTES or "4"),
                      ("__TOTAL_TARGET_WORDS__", chunk_meta.get("total_words_text", "560")),
                      ("__CHUNK_PCT__", chunk_meta.get("chunk_pct", "30")),
                      ("__TARGET_DURATION__", chunk_meta.get("dur_text", "proportional")),
                      ("__TARGET_WORDS__", chunk_meta.get("words_text", "180")),
                      ("__EPISODE_BIBLE__", bible_txt), ("__PREV_ENDING__", prev_ending or "Start of transcript"),
                      ("__UPCOMING_CONTEXT__", up_ctx),
                      ("__DRAFT_JSON__", json.dumps(d_obj, ensure_ascii=False, separators=(",", ":")))
                  ]:
                      p = p.replace(k, v)
                  return p

              prompt = render(payload, (upcoming_handoff or "Final chunk.")[:2200], (episode_bible or "None")[:1000])
              if len(prompt) > MAX_PROMPT_CHARS:
