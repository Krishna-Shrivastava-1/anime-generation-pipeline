name: Generate Hindi YouTube Movie Recap Engine

on:
  workflow_dispatch:
    inputs:
      story_summary:
        description: "Paste the complete Story Summary here (or leave blank to use summary.txt / Web Search)"
        required: false
        default: ""
      reset_state:
        description: "Clear previous state and generate fresh"
        required: true
        type: boolean
        default: true
      headed:
        description: "Run non-headless Chrome under Xvfb (avoids bot detection)"
        required: true
        type: boolean
        default: true
      mode:
        description: "Execution mode (probe | full)"
        required: true
        type: choice
        options:
          - "probe"
          - "full"
        default: "full"
      draft_model:
        description: "Duck.ai model for Summary-to-Beats & Clip Draft"
        required: true
        default: "6 Luna"
      critic_model:
        description: "Duck.ai model for Transcript & Clip Cross-Check (set 'skip' to disable)"
        required: true
        default: "Claude Haiku 5.5"
      reasoning_mode:
        description: "Enable Reasoning mode for Critic model (Haiku)"
        required: true
        type: boolean
        default: true
      web_search:
        description: "Enable Web Search in Duck.ai Tools menu (used if summary is missing or for extra verification)"
        required: true
        type: boolean
        default: false
      movie_title:
        description: "Movie/Series Title (optional, overrides transcript.json title)"
        required: false
        default: ""
      content_type:
        description: "Content Type (Movie | Series)"
        required: false
        default: "Series"
      season:
        description: "Season (leave blank if Movie/N/A)"
        required: false
        default: ""
      episode:
        description: "Episode (leave blank if Movie/N/A)"
        required: false
        default: ""
      part_identifier:
        description: "Part Identifier (optional)"
        required: false
        default: ""
      target_minutes:
        description: "Target video duration in minutes (e.g. 4 or 12)"
        required: true
        default: "4"
      max_clip_sec:
        description: "Max duration per video cut (Fair Use safe <= 3.0s)"
        required: true
        default: "3.0"
      max_prompt_chars:
        description: "Hard max characters per Duck.ai prompt (<= 16000)"
        required: true
        default: "11500"

permissions:
  contents: write

jobs:
  generate-recap:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      LANG: "C.UTF-8"
      LC_ALL: "C.UTF-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tor and System Utilities
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y tor netcat-openbsd xvfb curl
          sudo service tor start
          for i in {1..30}; do
            if nc -z 127.0.0.1 9050 && curl --socks5-hostname 127.0.0.1:9050 -sf --max-time 8 https://check.torproject.org/api/ip >/dev/null; then
              echo "Tor circuit is bootstrapped and ready"
              break
            fi
            sleep 2
          done
          nc -z 127.0.0.1 9050

      - name: Install Python Dependencies
        timeout-minutes: 6
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi playwright pillow requests ftfy
          playwright install --with-deps chromium

      - name: Verify Anonymous Tor Exit
        timeout-minutes: 4
        run: |
          python - <<'PY'
          import subprocess, time
          from curl_cffi import requests

          p = "socks5h://127.0.0.1:9050"
          last_err = None
          for attempt in range(1, 5):
              try:
                  print(f"Tor exit check attempt {attempt}/4...", flush=True)
                  r = requests.get("https://check.torproject.org/api/ip", proxies={"http": p, "https": p}, impersonate="chrome", timeout=25)
                  r.raise_for_status()
                  data = r.json()
                  print("Connection Info:", data, flush=True)
                  if not data.get("IsTor"):
                      raise RuntimeError("Traffic is not exiting through Tor.")
                  last_err = None
                  break
              except Exception as e:
                  last_err = e
                  print(f"Attempt {attempt} failed: {e}", flush=True)
                  if attempt < 4:
                      subprocess.run(["sudo", "service", "tor", "restart"], check=False)
                      for _ in range(25):
                          if (
                              subprocess.run(["nc", "-z", "127.0.0.1", "9050"]).returncode == 0
                              and subprocess.run(
                                  ["curl", "--socks5-hostname", "127.0.0.1:9050", "-sf", "--max-time", "8", "https://check.torproject.org/api/ip"],
                                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                              ).returncode == 0
                          ):
                              break
                          time.sleep(2)
          if last_err:
              raise RuntimeError(f"Tor verification failed after 4 attempts: {last_err}")
          PY

      - name: Run Summary-Driven Recap & Clip Engine
        timeout-minutes: 170
        env:
          STORY_SUMMARY: ${{ inputs.story_summary }}
          HEADED: ${{ inputs.headed }}
          RUN_MODE: ${{ inputs.mode }}
          RESET_STATE: ${{ inputs.reset_state }}
          DRAFT_MODEL: ${{ inputs.draft_model }}
          CRITIC_MODEL: ${{ inputs.critic_model }}
          REASONING_MODE: ${{ inputs.reasoning_mode }}
          WEB_SEARCH: ${{ inputs.web_search }}
          INPUT_MOVIE_TITLE: ${{ inputs.movie_title }}
          INPUT_CONTENT_TYPE: ${{ inputs.content_type }}
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_EPISODE: ${{ inputs.episode }}
          INPUT_PART: ${{ inputs.part_identifier }}
          TARGET_MINUTES: ${{ inputs.target_minutes }}
          MAX_CLIP_SEC: ${{ inputs.max_clip_sec }}
          MAX_PROMPT_CHARS: ${{ inputs.max_prompt_chars }}
          TEXT_WAIT_SECONDS: "420"
        run: |
          mkdir -p debug build
          cat > recap_engine.py <<'PY'
          import os, re, sys, json, subprocess, time, textwrap
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import ftfy

          if sys.platform != "win32":
              sys.stdout.reconfigure(encoding="utf-8")
              sys.stderr.reconfigure(encoding="utf-8")

          STORY_SUMMARY_ENV = os.environ.get("STORY_SUMMARY", "").strip()
          HEADED = os.environ.get("HEADED") == "true"
          RUN_MODE = os.environ.get("RUN_MODE", "full").strip().lower()
          RESET_STATE = os.environ.get("RESET_STATE", "false").strip().lower() == "true"
          DRAFT_MODEL = os.environ.get("DRAFT_MODEL", "6 Luna").strip()
          CRITIC_MODEL = os.environ.get("CRITIC_MODEL", "Claude Haiku 5.5").strip()
          ENABLE_REASONING = os.environ.get("REASONING_MODE", "true").strip().lower() == "true"
          ENABLE_WEB_SEARCH = os.environ.get("WEB_SEARCH", "false").strip().lower() == "true"

          INPUT_MOVIE_TITLE = os.environ.get("INPUT_MOVIE_TITLE", "").strip()
          INPUT_CONTENT_TYPE = os.environ.get("INPUT_CONTENT_TYPE", "Series").strip()
          INPUT_SEASON = os.environ.get("INPUT_SEASON", "").strip()
          INPUT_EPISODE = os.environ.get("INPUT_EPISODE", "").strip()
          INPUT_PART = os.environ.get("INPUT_PART", "").strip()
          TARGET_MINUTES = os.environ.get("TARGET_MINUTES", "4").strip()
          MAX_CLIP_DURATION = float(os.environ.get("MAX_CLIP_SEC", "3.0"))
          MAX_PROMPT_CHARS = min(int(os.environ.get("MAX_PROMPT_CHARS", "11500")), 15500)
          DRAFT_MAX_CHARS = min(MAX_PROMPT_CHARS, 11500)
          CRITIC_MAX_CHARS = min(MAX_PROMPT_CHARS, 10200)
          TEXT_WAIT = int(os.environ.get("TEXT_WAIT_SECONDS", "420"))
          MAX_ATTEMPTS = 3

          DEBUG_DIR = Path("debug")
          DEBUG_DIR.mkdir(parents=True, exist_ok=True)
          STATE_FILE = Path("build/pipeline_state.json")
          STATE_FILE.parent.mkdir(parents=True, exist_ok=True)
          RUN_LOG = DEBUG_DIR / "engine.log"
          BROWSER_PROXY = "socks5://127.0.0.1:9050"

          if RESET_STATE and STATE_FILE.exists():
              STATE_FILE.unlink()
              print("[INIT] Old pipeline state cleared for fresh generation.", flush=True)

          def log(msg):
              line = f"[{time.strftime('%H:%M:%S')}] {msg}"
              print(line, flush=True)
              with open(RUN_LOG, "a", encoding="utf-8") as f:
                  f.write(line + "\n")

          # ------------------ ENCODING & MOJIBAKE DEFENSE ------------------
          CP1252_MAP = {
              '\u20ac': 0x80, '\u201a': 0x82, '\u0192': 0x83, '\u201e': 0x84, '\u2026': 0x85,
              '\u2020': 0x86, '\u2021': 0x87, '\u02c6': 0x88, '\u2030': 0x89, '\u0160': 0x8a,
              '\u2039': 0x8b, '\u0152': 0x8c, '\u017d': 0x8e, '\u2018': 0x91, '\u2019': 0x92,
              '\u201c': 0x93, '\u201d': 0x94, '\u2022': 0x95, '\u2013': 0x96, '\u2014': 0x97,
              '\u02dc': 0x98, '\u2122': 0x99, '\u0161': 0x9a, '\u203a': 0x9b, '\u0153': 0x9c,
              '\u017e': 0x9e, '\u0178': 0x9f,
          }

          def fix_hindi_text(s: str) -> str:
              if not isinstance(s, str) or not s:
                  return s
              try:
                  s = ftfy.fix_text(s)
              except Exception:
                  pass
              if any(m in s for m in ["à¤", "à¥", "â€™", "â€”", "Ã", "Â"]):
                  try:
                      return s.encode("cp1252").decode("utf-8")
                  except Exception:
                      try:
                          raw_bytes = bytearray()
                          for ch in s:
                              if ch in CP1252_MAP:
                                  raw_bytes.append(CP1252_MAP[ch])
                              elif ord(ch) < 256:
                                  raw_bytes.append(ord(ch))
                              else:
                                  raw_bytes.extend(ch.encode("utf-8"))
                          return raw_bytes.decode("utf-8", errors="replace")
                      except Exception:
                          pass
              return s

          def deep_repair(val):
              if isinstance(val, str):
                  return fix_hindi_text(val)
              if isinstance(val, list):
                  return [deep_repair(item) for item in val]
              if isinstance(val, dict):
                  return {k: deep_repair(v) for k, v in val.items()}
              return val

          def snap(page, name, save_html=True):
              try:
                  page.screenshot(path=str(DEBUG_DIR / f"{name}.png"), full_page=True, timeout=15000)
                  if save_html:
                      (DEBUG_DIR / f"{name}.html").write_text(page.content(), encoding="utf-8")
                  log(f"Snapshot taken: {name}")
              except Exception as e:
                  log(f"Snapshot failed ({name}): {e}")

          def renew_tor():
              log("Refreshing Tor IP circuit...")
              subprocess.run(["sudo", "service", "tor", "restart"], check=False)
              for i in range(25):
                  port_up = subprocess.run(["nc", "-z", "127.0.0.1", "9050"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0
                  if port_up:
                      ok = subprocess.run(
                          ["curl", "--socks5-hostname", "127.0.0.1:9050", "-sf", "--max-time", "8", "https://check.torproject.org/api/ip"],
                          stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                      ).returncode == 0
                      if ok:
                          log(f"Tor circuit ready after {(i+1)*2}s.")
                          return
                  time.sleep(2)

          # ------------------ IN-PAGE FETCH INTERCEPTOR ------------------
          FETCH_HOOK_JS = r"""
          (() => {
              Object.defineProperty(navigator, 'webdriver', { get: () => undefined });
              if (window.__duckai_hooked) return;
              window.__duckai_hooked = true;
              window.__duckai_stream = { active: false, done: false, status: 0, url: '', rawChunks: [], error: '' };
              const origFetch = window.fetch;
              window.fetch = async function(...args) {
                  const reqUrl = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url ? args[0].url : '');
                  const reqInit = args[1] || {};
                  const method = (reqInit.method || (args[0] && args[0].method) || 'GET').toUpperCase();
                  const cleanUrl = reqUrl.split('?')[0];
                  const isChatCall = method === 'POST' && (cleanUrl.includes('/duckchat/v1/chat') || cleanUrl.endsWith('/chat'));
                  const response = await origFetch.apply(this, args);
                  if (isChatCall) {
                      window.__duckai_stream = { active: true, done: false, status: response.status, url: reqUrl, rawChunks: [], error: '' };
                      try {
                          const clone = response.clone();
                          const reader = clone.body ? clone.body.getReader() : null;
                          if (reader) {
                              const decoder = new TextDecoder('utf-8');
                              (async () => {
                                  try {
                                      while (true) {
                                          const { value, done } = await reader.read();
                                          if (done) break;
                                          if (value) window.__duckai_stream.rawChunks.push(decoder.decode(value, { stream: true }));
                                      }
                                      const tail = decoder.decode();
                                      if (tail) window.__duckai_stream.rawChunks.push(tail);
                                  } catch (err) {
                                      window.__duckai_stream.error = String(err);
                                  } finally {
                                      window.__duckai_stream.active = false;
                                      window.__duckai_stream.done = true;
                                  }
                              })();
                          } else {
                              clone.text().then(t => {
                                  if (t) window.__duckai_stream.rawChunks.push(t);
                                  window.__duckai_stream.active = false;
                                  window.__duckai_stream.done = true;
                              }).catch(() => {
                                  window.__duckai_stream.active = false;
                                  window.__duckai_stream.done = true;
                              });
                          }
                      } catch (e) {
                          window.__duckai_stream.error = String(e);
                          window.__duckai_stream.active = false;
                          window.__duckai_stream.done = true;
                      }
                  }
                  return response;
              };
          })();
          """

          # ------------------ DUCK.AI MODAL & SETTINGS ------------------
          def get_prompt_box(page):
              return page.locator("textarea[name='user-prompt'], textarea[placeholder*='ask' i], textarea[placeholder*='message' i], textarea").first

          def dismiss_duckai_modals(page):
              patterns = [re.compile(r"^\s*(get started|agree and continue|i agree|accept|next|continue)\s*$", re.I)]
              for _ in range(4):
                  clicked = False
                  for pat in patterns:
                      btn = page.get_by_role("button", name=pat)
                      if btn.count() > 0 and btn.first.is_visible():
                          try:
                              btn.first.click(timeout=3000)
                              page.wait_for_timeout(1200)
                              clicked = True
                              break
                          except Exception:
                              pass
                  if not clicked:
                      break

          def wait_for_duckai_ui_ready(page, timeout_ms=45000):
              start = time.time()
              while (time.time() - start) * 1000 < timeout_ms:
                  try:
                      m_btn = page.locator("button[data-testid*='model' i], button[aria-label*='model' i]")
                      if get_prompt_box(page).is_visible() and m_btn.count() > 0 and m_btn.first.is_visible():
                          return
                  except Exception:
                      pass
                  try:
                      btn = page.get_by_role("button", name=re.compile(r"(get started|agree|accept|continue)", re.I))
                      if btn.count() > 0 and btn.first.is_visible():
                          return
                  except Exception:
                      pass
                  page.wait_for_timeout(500)

          def build_model_matchers(target_model: str):
              t_low = target_model.lower().strip()
              tokens = [tok for tok in re.split(r"[\s\-_]+", t_low) if tok]
              non_gpt = [tok for tok in tokens if tok != "gpt"]
              strategies = [lambda txt: t_low in txt]
              if len(tokens) > 1:
                  strategies.append(lambda txt: all(tok in txt for tok in tokens))
              if non_gpt and non_gpt != tokens:
                  strategies.append(lambda txt: all(tok in txt for tok in non_gpt))
              key_tokens = [tok for tok in non_gpt if len(tok) > 2]
              if key_tokens:
                  strategies.append(lambda txt: all(tok in txt for tok in key_tokens))
                  strategies.append(lambda txt: key_tokens[-1] in txt)
              return strategies

          def configure_duckai_settings(page, target_model="6 Luna", enable_reasoning=True, enable_web_search=False, take_verify_snap=False, snap_prefix="settings"):
              log(f"Configuring Duck.ai -> Model: '{target_model}' | Reasoning: {enable_reasoning} | WebSearch: {enable_web_search}")
              wait_for_duckai_ui_ready(page)
              dismiss_duckai_modals(page)
              page.wait_for_timeout(1200)

              model_btn_selectors = [
                  "button[data-testid*='model' i]", "button[aria-label*='model' i]",
                  "button:has-text('Luna')", "button:has-text('Haiku')",
                  "button:has-text('Claude')", "button:has-text('GPT')", "button:has-text('Model')",
              ]
              opened = False
              btn_txt = ""
              for sel in model_btn_selectors:
                  loc = page.locator(sel)
                  for i in range(loc.count()):
                      b = loc.nth(i)
                      if b.is_visible() and b.is_enabled():
                          try:
                              btn_txt = (b.inner_text() or "").strip()
                              b.click(timeout=4000)
                              page.wait_for_timeout(1000)
                              opened = True
                              break
                          except Exception:
                              pass
                  if opened:
                      break

              if take_verify_snap:
                  snap(page, f"{snap_prefix}_dropdown_open", save_html=False)

              model_selected = False
              for idx, matcher in enumerate(build_model_matchers(target_model)):
                  cands = page.locator("[role='menuitem'], [role='menuitemradio'], [role='option'], [role='radio'], label, button")
                  for i in range(cands.count()):
                      el = cands.nth(i)
                      if not el.is_visible():
                          continue
                      txt = (el.inner_text() or "").strip()
                      if txt and matcher(txt.lower()):
                          try:
                              el.click(timeout=4000)
                              log(f"Selected model '{target_model}' (strategy {idx+1}): '{txt}'")
                              model_selected = True
                              page.wait_for_timeout(900)
                              break
                          except Exception:
                              pass
                  if model_selected:
                      break

              if not model_selected:
                  log(f"WARNING: Could not match model '{target_model}' (button showed '{btn_txt}').")

              try:
                  page.keyboard.press("Escape")
                  page.wait_for_timeout(350)
              except Exception:
                  pass

              if enable_reasoning:
                  r_cands = page.locator("button[aria-label*='Reasoning mode' i], button:has-text('Reasoning'), [role='switch']:has-text('Reason')")
                  for i in range(r_cands.count()):
                      el = r_cands.nth(i)
                      if not el.is_visible():
                          continue
                      txt = (el.inner_text() or "").strip()
                      if el.get_attribute("aria-checked") == "true" or el.get_attribute("aria-pressed") == "true" or ("reasoning" in txt.lower() and "fast" not in txt.lower()):
                          log(f"Reasoning already enabled ('{txt}').")
                          break
                      try:
                          el.click(timeout=4000)
                          log(f"Clicked Reasoning mode control: '{txt}'")
                          page.wait_for_timeout(900)
                          break
                      except Exception:
                          pass

              if enable_web_search:
                  try:
                      active_ws = page.locator("button[aria-label*='Remove Web Search' i], button:has-text('Web Search'):not(:has-text('Source answers'))")
                      if active_ws.count() > 0 and active_ws.first.is_visible():
                          log("Web Search already active.")
                      else:
                          tools_btn = page.locator("button:has-text('Tools'), button[aria-label*='tool' i]")
                          if tools_btn.count() > 0 and tools_btn.first.is_visible():
                              tools_btn.first.click(timeout=4000)
                              page.wait_for_timeout(900)
                              if take_verify_snap:
                                  snap(page, f"{snap_prefix}_tools_open", save_html=False)
                              ws_cands = page.locator(
                                  "[role='menuitemcheckbox']:has-text('Search'), [role='menuitem']:has-text('Search'), "
                                  "[role='switch']:has-text('Search'), [role='option']:has-text('Search'), "
                                  "button:has-text('Web Search'), button:has-text('Search'), div[role='menuitem']:has-text('Web')"
                              )
                              for i in range(ws_cands.count()):
                                  el = ws_cands.nth(i)
                                  if not el.is_visible():
                                      continue
                                  txt = (el.inner_text() or "").strip()
                                  if "chat suggestions" in txt.lower() or "how duck.ai" in txt.lower():
                                      continue
                                  if el.get_attribute("aria-checked") == "true" or el.get_attribute("aria-pressed") == "true":
                                      log(f"Web Search already enabled ('{txt}').")
                                      break
                                  try:
                                      el.click(timeout=3000)
                                      log(f"Clicked Web Search control: '{txt}'")
                                      page.wait_for_timeout(700)
                                      break
                                  except Exception:
                                      pass
                              page.keyboard.press("Escape")
                              page.wait_for_timeout(300)
                  except Exception as ws_err:
                      log(f"Web Search setup notice: {ws_err}")

              try:
                  page.keyboard.press("Escape")
              except Exception:
                  pass
              page.wait_for_timeout(700)
              if take_verify_snap:
                  snap(page, f"{snap_prefix}_verified", save_html=True)

          # ------------------ SUBMISSION, SCROLL & EXTRACTION ------------------
          def click_ask_button(page):
              ask_btn = page.get_by_role("button", name=re.compile(r"^\s*(ask|send|submit)\s*$", re.I))
              if ask_btn.count() > 0 and ask_btn.first.is_visible() and ask_btn.first.is_enabled():
                  ask_btn.first.click(timeout=3000)
                  return True
              return bool(page.evaluate(r"""() => {
                  const btns = Array.from(document.querySelectorAll('button'));
                  const ask = btns.find(b => !b.disabled && (b.innerText || '').trim().toLowerCase() === 'ask');
                  if (ask) { ask.click(); return true; }
                  const send = btns.find(b => !b.disabled && /send|submit|ask/i.test(b.getAttribute('aria-label') || ''));
                  if (send) { send.click(); return true; }
                  const sub = btns.find(b => b.type === 'submit' && !b.disabled);
                  if (sub) { sub.click(); return true; }
                  return false;
              }"""))

          def submit_prompt(page, box, text, context):
              box.scroll_into_view_if_needed(timeout=5000)
              box.click()
              page.wait_for_timeout(200)
              box.fill("")
              page.wait_for_timeout(150)
              filled = False
              try:
                  box.fill(text, timeout=20000)
                  if len(box.input_value()) >= int(len(text) * 0.95):
                      filled = True
              except Exception:
                  filled = False
              if not filled:
                  box.fill("")
                  box.click()
                  try:
                      cdp = context.new_cdp_session(page)
                      for idx in range(0, len(text), 2000):
                          cdp.send("Input.insertText", {"text": text[idx : idx + 2000]})
                      cdp.detach()
                  except Exception:
                      box.fill(text)
              page.wait_for_timeout(500)
              try:
                  page.evaluate("(el) => { el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true })); }", box.element_handle())
              except Exception:
                  pass
              page.wait_for_timeout(400)
              if not click_ask_button(page):
                  box.press("Enter")
              page.wait_for_timeout(600)

          def scroll_chat_to_bottom(page):
              try:
                  page.evaluate(r"""() => {
                      window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'instant' });
                      if (document.scrollingElement) document.scrollingElement.scrollTop = document.scrollingElement.scrollHeight;
                      for (const el of document.querySelectorAll('div, main, section, article')) {
                          if (el.scrollHeight > el.clientHeight + 20) {
                              const oy = window.getComputedStyle(el).overflowY;
                              if (['auto', 'scroll', 'overlay'].includes(oy)) el.scrollTop = el.scrollHeight;
                          }
                      }
                      const mainEl = document.querySelector('main') || document.body;
                      const blocks = mainEl.querySelectorAll('pre, article, p, [data-testid]');
                      if (blocks.length > 0) try { blocks[blocks.length - 1].scrollIntoView({ behavior: 'instant', block: 'end' }); } catch (_) {}
                  }""")
              except Exception:
                  pass

          def parse_sse_text(raw_sse: str) -> str:
              chunks = []
              for line in raw_sse.splitlines():
                  line = line.strip()
                  if not line.startswith("data:"):
                      continue
                  payload = line[5:].strip()
                  if not payload or payload == "[DONE]":
                      continue
                  try:
                      data = json.loads(payload)
                      if data.get("type") == "reasoning" or data.get("role") == "reasoning":
                          continue
                      chunk = data.get("message") or data.get("delta") or data.get("text") or data.get("content") or ""
                      if not chunk and isinstance(data.get("choices"), list) and data["choices"]:
                          c0 = data["choices"][0]
                          if isinstance(c0, dict):
                              chunk = (c0.get("delta") or {}).get("content") or (c0.get("message") or {}).get("content") or ""
                      if chunk:
                          chunks.append(chunk)
                  except Exception:
                      continue
              return "".join(chunks)

          def strip_thinking_blocks(text: str) -> str:
              return re.sub(r"<think>[\s\S]*?</think>", "", text or "", flags=re.IGNORECASE).strip()

          def clean_plain_text(text: str) -> str:
              cleaned = strip_thinking_blocks(text)
              for marker in ["\nCopy\n", "\nRegenerate\n", "\nAsk anything", "\nAI-generated", "\nDuck.ai", "\nNew Chat"]:
                  if marker in cleaned:
                      cleaned = cleaned.split(marker)[0]
              return re.sub(r"^(Thought for \d+s|Thinking\.\.\.)\s*", "", cleaned, flags=re.I).strip()

          def reset_stream_tracking(page, current_chat_state):
              current_chat_state["raw_stream"].clear()
              current_chat_state["chat_done"] = False
              current_chat_state["rate_limited"] = False
              try:
                  page.evaluate("() => { window.__duckai_stream = { active: false, done: false, status: 0, url: '', rawChunks: [], error: '' }; }")
              except Exception:
                  pass

          def get_inpage_stream_text(page):
              try:
                  st = page.evaluate("() => window.__duckai_stream || null")
                  if not st:
                      return None
                  raw = "".join(st.get("rawChunks") or [])
                  return {
                      "active": bool(st.get("active")),
                      "done": bool(st.get("done")),
                      "status": int(st.get("status") or 0),
                      "raw_len": len(raw),
                      "parsed": parse_sse_text(raw) if raw else "",
                      "raw": raw
                  }
              except Exception:
                  return None

          def count_code_blocks(page):
              try:
                  return int(page.evaluate("() => document.querySelectorAll('pre code, pre').length"))
              except Exception:
                  return 0

          def send_and_confirm(page, box, prompt_text, context, current_chat_state, label, is_new_chat=True):
              url_before = page.url
              reset_stream_tracking(page, current_chat_state)
              submit_prompt(page, box, prompt_text, context)
              for wait_sec in range(15):
                  page.wait_for_timeout(1000)
                  inpage = get_inpage_stream_text(page)
                  try:
                      box_cleared = len(box.input_value().strip()) == 0
                  except Exception:
                      box_cleared = True
                  url_changed = is_new_chat and ("chatID=" in page.url) and ("chatID=" not in url_before)
                  if url_changed or len(current_chat_state["raw_stream"]) > 0 or (inpage and (inpage["active"] or inpage["done"] or inpage["status"] > 0)) or box_cleared:
                      log(f"{label} acknowledged at +{wait_sec+1}s (box_cleared={box_cleared}).")
                      return True
                  stop_btn = page.locator("button:has-text('Stop'), button[aria-label*='stop' i], button[title*='stop' i]")
                  if stop_btn.count() > 0 and stop_btn.first.is_visible():
                      return True
                  if wait_sec in (3, 7, 11):
                      click_ask_button(page)
                      box.press("Enter")
              return False

          EXTRACT_ASSISTANT_JS = r"""({ promptTail, expectJson, prevCodeBlocks }) => {
              for (const el of document.querySelectorAll('div, main, section, article')) {
                  if (el.scrollHeight > el.clientHeight + 20) {
                      const oy = window.getComputedStyle(el).overflowY;
                      if (['auto', 'scroll', 'overlay'].includes(oy)) el.scrollTop = el.scrollHeight;
                  }
              }
              window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'instant' });
              const stopButtons = Array.from(document.querySelectorAll('button')).filter(b => {
                  const txt = (b.innerText || '').toLowerCase();
                  const aria = (b.getAttribute('aria-label') || '').toLowerCase();
                  const title = (b.getAttribute('title') || '').toLowerCase();
                  const testid = (b.getAttribute('data-testid') || '').toLowerCase();
                  return (txt.includes('stop') || aria.includes('stop') || title.includes('stop') || testid.includes('stop') || aria.includes('cancel')) && b.offsetParent !== null;
              });
              const isGenerating = stopButtons.length > 0 || Boolean(window.__duckai_stream && window.__duckai_stream.active);
              const isLeak = (t) => !t || t.includes('STEP 1 —') || t.includes('STEP 2 —') || t.includes('TIMESTAMPED TRANSCRIPT CHUNK') || t.includes('DRAFT JSON TO VERIFY');
              const rootEl = document.querySelector('main') || document.body;
              const fullText = (rootEl.innerText || '').trim();
              if (promptTail && promptTail.length >= 12) {
                  const idx = fullText.lastIndexOf(promptTail);
                  if (idx !== -1) {
                      const after = fullText.slice(idx + promptTail.length).trim();
                      if (after.length > 30 && !isLeak(after) && (!expectJson || after.includes('"beats"'))) {
                          return { text: after, isGenerating, source: 'after_prompt_tail_exact' };
                      }
                  }
              }
              if (expectJson) {
                  const cbs = Array.from(document.querySelectorAll('pre code, pre'));
                  if (cbs.length > (prevCodeBlocks || 0)) {
                      for (let i = cbs.length - 1; i >= (prevCodeBlocks || 0); i--) {
                          const ct = (cbs[i].innerText || '').trim();
                          if (ct && !isLeak(ct) && ct.includes('{') && (ct.includes('beats') || ct.includes('status'))) {
                              return { text: ct, isGenerating, source: 'code_block' };
                          }
                      }
                  }
              }
              if (promptTail && promptTail.length >= 12) {
                  const idx = fullText.lastIndexOf(promptTail);
                  if (idx !== -1) {
                      const after = fullText.slice(idx + promptTail.length).trim();
                      if (after.length > 20) return { text: after, isGenerating, source: 'after_prompt_tail' };
                  }
              }
              return { text: '', isGenerating, source: 'none' };
          }"""

          def wait_for_response(page, current_chat_state, prompt_text="", max_wait=TEXT_WAIT, expect_json=True, expect_beats=True, prev_code_blocks=0):
              log(f"Waiting for Duck.ai response (max {max_wait}s | expect_json={expect_json})...")
              prompt_tail = prompt_text[-60:].strip() if prompt_text else ""
              start = time.time()
              last_text = ""
              stable_ticks = 0
              has_started = False
              last_log = 0.0

              while time.time() - start < max_wait:
                  elapsed = time.time() - start
                  if current_chat_state.get("rate_limited"):
                      raise RuntimeError("Duck.ai returned HTTP 418/429 (Tor IP rate-limited).")

                  inpage = get_inpage_stream_text(page)
                  if inpage:
                      if inpage["status"] in (418, 429):
                          raise RuntimeError(f"Duck.ai fetch returned HTTP {inpage['status']} (Tor IP rate-limited).")
                      if inpage["active"] or inpage["raw_len"] > 0:
                          has_started = True
                      if inpage["done"]:
                          page.wait_for_timeout(2000)
                          scroll_chat_to_bottom(page)
                          parsed_sse = inpage["parsed"]
                          dom_after = ""
                          try:
                              dom_res = page.evaluate(EXTRACT_ASSISTANT_JS, {"promptTail": prompt_tail, "expectJson": expect_json, "prevCodeBlocks": prev_code_blocks})
                              dom_after = (dom_res.get("text") or "").strip()
                          except Exception:
                              pass
                          combined_err = (parsed_sse + "\n" + dom_after).lower()
                          if "maximum length for this chat" in combined_err:
                              raise RuntimeError("PROMPT_TOO_LONG: Duck.ai chat hit maximum length.")
                          if expect_json:
                              if "{" in parsed_sse and (not expect_beats or '"beats"' in parsed_sse):
                                  log(f"Captured JSON via SSE ({len(parsed_sse)} chars).")
                                  return deep_repair(parsed_sse)
                              if "{" in dom_after and (not expect_beats or '"beats"' in dom_after):
                                  log(f"Captured JSON via DOM ({len(dom_after)} chars).")
                                  return deep_repair(dom_after)
                              (DEBUG_DIR / f"failed_sse_{int(time.time())}.txt").write_text(f"PARSED:\n{parsed_sse}\n\nDOM:\n{dom_after}\n\nRAW:\n{inpage['raw'][-4000:]}", encoding="utf-8")
                              raise RuntimeError(f"Stream finished without valid JSON beats. Preview: {(parsed_sse or dom_after)[:200]!r}")
                          else:
                              out_txt = clean_plain_text(parsed_sse) if len(parsed_sse.strip()) >= 80 else clean_plain_text(dom_after)
                              if len(out_txt) >= 80:
                                  log(f"Captured text via SSE ({len(out_txt)} chars).")
                                  return deep_repair(out_txt)
                              raise RuntimeError(f"Text stream finished too short ({len(out_txt)} chars).")

                  if current_chat_state.get("chat_done") and current_chat_state.get("raw_stream"):
                      parsed_sse = parse_sse_text("".join(current_chat_state["raw_stream"]))
                      if "maximum length for this chat" in parsed_sse.lower():
                          raise RuntimeError("PROMPT_TOO_LONG: Duck.ai chat hit maximum length.")
                      if parsed_sse.strip():
                          if expect_json and "{" in parsed_sse and (not expect_beats or '"beats"' in parsed_sse):
                              return deep_repair(parsed_sse)
                          if not expect_json and len(parsed_sse.strip()) >= 80:
                              return deep_repair(clean_plain_text(parsed_sse))

                  scroll_chat_to_bottom(page)
                  dom_source, dom_len, is_gen = "none", 0, False
                  try:
                      dom_data = page.evaluate(EXTRACT_ASSISTANT_JS, {"promptTail": prompt_tail, "expectJson": expect_json, "prevCodeBlocks": prev_code_blocks})
                      cur_text = (dom_data.get("text") or "").strip()
                      if "maximum length for this chat" in cur_text.lower():
                          raise RuntimeError("PROMPT_TOO_LONG: Duck.ai chat hit maximum length.")
                      if not expect_json:
                          cur_text = clean_plain_text(cur_text)
                      is_gen = bool(dom_data.get("isGenerating", False))
                      dom_source = dom_data.get("source", "none")
                      dom_len = len(cur_text)
                      if is_gen or dom_len > 25:
                          has_started = True
                      min_len = 25 if expect_json else 80
                      if cur_text:
                          stable_ticks = (stable_ticks + 1) if (cur_text == last_text and not is_gen) else 0
                          last_text = cur_text
                          if has_started and not is_gen and stable_ticks >= 4 and len(last_text) > min_len:
                              log(f"Captured via DOM stability ({dom_source}, {len(last_text)} chars).")
                              return deep_repair(last_text)
                  except RuntimeError:
                      raise
                  except Exception:
                      pass

                  if elapsed - last_log >= 15.0:
                      last_log = elapsed
                      si = f"raw={inpage['raw_len']} done={inpage['done']} status={inpage['status']}" if inpage else "no_hook"
                      log(f"[WAIT {int(elapsed)}s/{max_wait}s] stream=({si}) | dom=({dom_source}, {dom_len} chars, gen={is_gen})")
                  page.wait_for_timeout(2000)

              raise RuntimeError(f"Response timed out after {max_wait}s.")

          # ------------------ JSON PARSE, CLIP CLAMPING & PHRASE SYNC ------------------
          def is_valid_recap_json(obj) -> bool:
              if not isinstance(obj, dict):
                  return False
              if obj.get("movie_title") == "Title" and str(obj.get("synopsis", "")).startswith("Concise summary"):
                  return False
              beats = obj.get("beats")
              return isinstance(beats, list) and len(beats) > 0

          def try_json_loads_with_repair(raw_str: str):
              s = raw_str.strip()
              try:
                  return json.loads(s)
              except json.JSONDecodeError as first_err:
                  fixed = re.sub(r",(\s*[}\]])", r"\1", s)
                  try:
                      return json.loads(fixed)
                  except json.JSONDecodeError:
                      pass
                  if '"beats"' in fixed:
                      arr_start = fixed.find("[", fixed.find('"beats"'))
                      if arr_start != -1:
                          depth, in_str, esc, last_end = 0, False, False, -1
                          for idx in range(arr_start + 1, len(fixed)):
                              c = fixed[idx]
                              if esc: esc = False; continue
                              if c == "\\": esc = True; continue
                              if c == '"': in_str = not in_str; continue
                              if not in_str:
                                  if c == "{": depth += 1
                                  elif c == "}":
                                      depth -= 1
                                      if depth == 0: last_end = idx
                                  elif c == "]" and depth == 0: break
                          if last_end != -1:
                              try:
                                  obj = json.loads(fixed[: last_end + 1] + "]}")
                                  if isinstance(obj.get("beats"), list) and obj["beats"]:
                                      log(f"JSON repaired by salvaging {len(obj['beats'])} complete beats.")
                                      return obj
                              except Exception:
                                  pass
                  raise first_err

          def parse_first_balanced_json(text: str, require_beats: bool = False):
              if not text:
                  return None
              cleaned = strip_thinking_blocks(text)
              for cand in reversed(re.findall(r"```(?:json)?\s*([\s\S]*?)\s*```", cleaned, re.IGNORECASE)):
                  try:
                      parsed = deep_repair(try_json_loads_with_repair(cand.strip()))
                      if not require_beats or is_valid_recap_json(parsed):
                          return parsed
                  except Exception:
                      pass
              try:
                  parsed = deep_repair(try_json_loads_with_repair(cleaned))
                  if not require_beats or is_valid_recap_json(parsed):
                      return parsed
              except Exception:
                  pass
              cands, i, n = [], 0, len(cleaned)
              while i < n:
                  if cleaned[i] in ("{", "["):
                      oc, cc = cleaned[i], "}" if cleaned[i] == "{" else "]"
                      depth, in_s, esc = 0, False, False
                      for idx in range(i, n):
                          c = cleaned[idx]
                          if esc: esc = False; continue
                          if c == "\\": esc = True; continue
                          if c == '"': in_s = not in_s; continue
                          if not in_s:
                              if c == oc: depth += 1
                              elif c == cc:
                                  depth -= 1
                                  if depth == 0:
                                      try:
                                          cands.append(deep_repair(try_json_loads_with_repair(cleaned[i : idx + 1])))
                                      except Exception:
                                          pass
                                      i = idx
                                      break
                  i += 1
              for obj in reversed(cands):
                  if not require_beats or is_valid_recap_json(obj):
                      return obj
              if cands:
                  return cands[-1]
              fb = cleaned.find("{")
              if fb != -1:
                  try:
                      parsed = deep_repair(try_json_loads_with_repair(cleaned[fb:]))
                      if not require_beats or is_valid_recap_json(parsed):
                          return parsed
                  except Exception as e:
                      log(f"JSON parse error: {e}")
              return None

          def ensure_phrase_sync(narration: str, clips: list):
              if not clips:
                  return clips
              words = narration.split()
              if not words:
                  return clips
              provided = [str(c.get("spoken_text", "")).strip() for c in clips]
              joined_words = " ".join(p for p in provided if p).split()
              if all(bool(p) for p in provided) and (0.80 * len(words) <= len(joined_words) <= 1.20 * len(words)):
                  for c in clips:
                      sw = len(str(c["spoken_text"]).split())
                      c["spoken_word_count"] = sw
                      c["estimated_spoken_duration"] = round((sw / 140.0) * 60.0, 2)
                  return clips
              total_dur = sum(max(0.5, float(c.get("duration", 2.0))) for c in clips)
              idx, n_words = 0, len(words)
              for i, c in enumerate(clips):
                  if i == len(clips) - 1:
                      chunk_words = words[idx:]
                  else:
                      rem = len(clips) - i - 1
                      share = max(1, round(n_words * (max(0.5, float(c.get("duration", 2.0))) / total_dur)))
                      take = min(share, max(1, (n_words - idx) - rem))
                      chunk_words = words[idx : idx + take]
                      idx += take
                  c["spoken_text"] = " ".join(chunk_words).strip()
                  c["spoken_word_count"] = len(chunk_words)
                  c["estimated_spoken_duration"] = round((len(chunk_words) / 140.0) * 60.0, 2)
              return clips

          def build_fallback_clips(chunk_segs, beat_idx, total_beats, max_dur):
              if not chunk_segs:
                  return []
              n = len(chunk_segs)
              start_pos = min(n - 1, max(0, int((beat_idx / max(1, total_beats)) * n)))
              clips = []
              for offset in range(min(4, max(2, n - start_pos))):
                  seg = chunk_segs[min(n - 1, start_pos + offset)]
                  st = round(float(seg.get("start", 0.0)), 2)
                  raw_en = float(seg.get("end", st + 2.0))
                  en = round(min(raw_en, st + max_dur), 2)
                  if en <= st:
                      en = round(st + min(2.0, max_dur), 2)
                  clips.append({
                      "start": st, "end": en, "duration": round(en - st, 2),
                      "spoken_text": "", "spoken_word_count": 0, "estimated_spoken_duration": 0.0,
                      "scene_context": str(seg.get("text", "")).strip()[:80]
                  })
              return clips

          def normalize_chunk_beats(raw_obj, chunk_segs=None, min_ts=0.0, max_ts=None):
              obj = deep_repair(raw_obj)
              raw_beats = [b for b in obj.get("beats", []) if isinstance(b, dict) and str(b.get("narration", "")).strip()]
              norm_beats = []
              for b_i, b in enumerate(raw_beats):
                  narr = str(b.get("narration", "")).strip()
                  wc = len(narr.split())
                  est_dur = round((wc / 140.0) * 60.0, 2)
                  norm_clips = []
                  for c in (b.get("clips") or []):
                      if not isinstance(c, dict):
                          continue
                      try:
                          st = round(float(c.get("start", 0.0)), 2)
                          en = round(float(c.get("end", st)), 2)
                      except Exception:
                          continue
                      if st < 0:
                          st = 0.0
                      if max_ts is not None and st >= max_ts:
                          continue
                      if max_ts is not None and en > max_ts:
                          en = round(max_ts, 2)
                      if en <= st:
                          continue
                      dur = round(en - st, 2)
                      if dur > MAX_CLIP_DURATION:
                          en = round(st + MAX_CLIP_DURATION, 2)
                          dur = MAX_CLIP_DURATION
                      if dur < 0.4:
                          continue
                      norm_clips.append({
                          "start": st, "end": en, "duration": dur,
                          "spoken_text": str(c.get("spoken_text", "")).strip(),
                          "spoken_word_count": 0, "estimated_spoken_duration": 0.0,
                          "scene_context": str(c.get("scene_context", "")).strip()
                      })
                  if not norm_clips and chunk_segs:
                      norm_clips = build_fallback_clips(chunk_segs, b_i, len(raw_beats), MAX_CLIP_DURATION)
                  norm_clips = ensure_phrase_sync(narr, norm_clips)
                  norm_beats.append({
                      "narration": narr, "word_count": wc,
                      "estimated_duration": round(float(b.get("estimated_duration") or est_dur), 2),
                      "is_scene_bridge": bool(b.get("is_scene_bridge", False)),
                      "clips": norm_clips
                  })
              return {
                  "movie_title": obj.get("movie_title"), "content_type": obj.get("content_type"),
                  "season": obj.get("season"), "episode": obj.get("episode"), "part_identifier": obj.get("part_identifier"),
                  "characters": obj.get("characters", []), "synopsis": str(obj.get("synopsis", "")).strip(),
                  "beats": norm_beats
              }

          # ------------------ SUMMARY-DRIVEN PROMPTS ------------------
          PROMPT_0_FETCH_SUMMARY = textwrap.dedent("""\
          # FETCH COMPLETE STORY SUMMARY

          Use Web Search right now to look up the complete chronological plot summary of:
          Title: __MOVIE_TITLE__ | Type: __CONTENT_TYPE__ | Season: __SEASON__ | Episode: __EPISODE__ | Part: __PART_IDENTIFIER__

          Output one clean, detailed plain-text plot summary (under 3,000 chars) covering all characters (with roles), locations, key twists, and ending in chronological order.""").strip()

          PROMPT_DRAFT_FROM_SUMMARY = textwrap.dedent("""\
          # STEP 1 — SUMMARY-DRIVEN HINDI RECAP & JUMP-CUT CLIP EXTRACTOR

          You are a YouTube movie/series recap writer and video editor.
          I am giving you:
          1) The **MASTER STORY SUMMARY** (verified plot flow, real character names, roles, motivations, and true settings).
          2) A **TIMESTAMPED TRANSCRIPT CHUNK** (`start-end|text` in seconds, plus `[SILENT_GAP start-end]` markers for silent/action scenes).

          ## YOUR JOB (FOLLOW STRICTLY):
          1. **Follow the Master Story Summary Flow, Anchored to This Transcript Chunk:**
             - Use the **MASTER STORY SUMMARY** for all real character names, roles, relationships, true settings, and plot clarity (automatically fix ASR typos like "Darlala" -> "डेलिला").
             - Narrate **ONLY the scenes and plot events occurring in this Timestamped Transcript Chunk** in chronological order. Do NOT repeat events in `ALREADY NARRATED`, and do NOT skip ahead to future scenes.
             - Explain **What happens, Why it matters, and How it connects** in crisp, gripping third-person Hindi (Devanagari only, clean phonetic Hindi spellings for English names). No dialogue reading, no robotic disclaimers, avoid repeating "इसके बाद".
          2. **Global Budget & Beat Sizing:**
             - Full video target: **~__TARGET_MINUTES__ minutes (~__TOTAL_TARGET_WORDS__ Hindi words total)**.
             - This chunk (**__CHUNK_PCT__%** of runtime) budget: **~__TARGET_WORDS__ Hindi words (~__TARGET_DURATION__)** across beats of **~30–50 words per beat**.
          3. **Extract Forward, Non-Overlapping Jump-Cut Clips (`<= __MAX_CLIP_SEC__s` each):**
             - Break each beat's `narration` sequentially into short spoken phrases (`spoken_text`, ~3–7 words each).
             - Pair **each phrase** with **1 jump-cut video clip (`start`, `end`, `duration <= __MAX_CLIP_SEC__`)** from this chunk (`__CHUNK_START__s` to `__CHUNK_END__s`) matching that character/action/scene (use `[SILENT_GAP]` windows when narrating silent action).
             - Keep clip timestamps **moving forward and non-overlapping** (`next clip start >= previous clip end` wherever possible, no duplicate clips).
             - Joining every clip's `spoken_text` in order MUST equal the beat's `narration`.
          4. **Canonical Hindi Character List:**
             - List characters appearing in this chunk using **only their clean Hindi Devanagari name** + brief Hindi role (no duplicate English/Hindi entries).

          ## OUTPUT STRICTLY VALID JSON ONLY (no markdown, no extra commentary):
          {"movie_title":"__MOVIE_TITLE__","content_type":"__CONTENT_TYPE__","season":__SEASON_JSON__,"episode":__EPISODE_JSON__,"part_identifier":__PART_JSON__,"target_minutes":__TARGET_MINUTES__,"estimated_narration_minutes":0,"total_beats":0,"total_words":0,"characters":[{"name":"हिंदी नाम","description":"संक्षिप्त भूमिका"}],"synopsis":"इस भाग का संक्षिप्त हिंदी सारांश।","beats":[{"beat_id":"__NEXT_BEAT_ID__","narration":"पूरा हिंदी वॉइस-ओवर बीट।","word_count":0,"estimated_duration":0,"is_scene_bridge":false,"clips":[{"clip_id":"__NEXT_CLIP_ID__","start":0.0,"end":2.5,"duration":2.5,"spoken_text":"पहला छोटा हिंदी वाक्यखंड","spoken_word_count":0,"estimated_spoken_duration":0,"scene_context":"Brief scene description"}]}]}

          ## INPUT DATA
          **MASTER STORY SUMMARY:**
          __MASTER_SUMMARY__

          **ALREADY NARRATED (DO NOT REPEAT):**
          __ALREADY_NARRATED__

          **UPCOMING TRANSCRIPT LOOKAHEAD (FOR BOUNDARY ONLY, DO NOT NARRATE):**
          __LOOKAHEAD__

          **TIMESTAMPED TRANSCRIPT CHUNK (`start-end|text`):**
          __COMPACT_TRANSCRIPT__""").strip()

          PROMPT_CRITIC_VERIFY = textwrap.dedent("""\
          # STEP 2 — CLIP TIMESTAMP, JUMP-CUT & HINDI VERIFIER

          Audit the Draft JSON against the **MASTER STORY SUMMARY** and **RAW TIMESTAMPED TRANSCRIPT CHUNK**:
          1. **Clip Timestamps (`<= __MAX_CLIP_SEC__s`):** Verify every clip's `start` and `end` is within `__CHUNK_START__s..__CHUNK_END__s`, matches that spoken phrase's scene/action, and moves forward without overlapping.
          2. **Phrase Sync:** Joining all `spoken_text` in each beat MUST equal `narration`.
          3. **Summary & Hindi Polish:** Fix any ASR mishearings/wrong names/settings using Master Story Summary. Smoothly follow: `__PREV_ENDING__`. Target ~__TARGET_WORDS__ Hindi words (~30–50 words/beat). Clean Hindi Devanagari `characters` (no duplicates). Continue IDs from `__NEXT_BEAT_ID__` / `__NEXT_CLIP_ID__`.

          ## MASTER STORY SUMMARY:
          __MASTER_SUMMARY__

          ## RAW TRANSCRIPT (`start-end|text`):
          __COMPACT_TRANSCRIPT__

          ## DRAFT JSON TO AUDIT:
          __DRAFT_JSON__

          Return strictly valid final JSON only (no Markdown fences, no extra text).""").strip()

          # ------------------ LOADERS & CHUNK BUILDERS ------------------
          def load_transcript(transcript_path="transcript.json"):
              p = Path(transcript_path)
              if not p.exists():
                  raise FileNotFoundError(f"'{transcript_path}' not found in repository root.")
              with open(p, "r", encoding="utf-8") as f:
                  return json.load(f)

          def load_initial_summary():
              if STORY_SUMMARY_ENV:
                  log(f"Loaded Story Summary directly from workflow input ({len(STORY_SUMMARY_ENV)} chars).")
                  return STORY_SUMMARY_ENV
              for candidate in ["summary.txt", "story_summary.txt"]:
                  p = Path(candidate)
                  if p.exists():
                      txt = p.read_text(encoding="utf-8").strip()
                      if txt:
                          log(f"Loaded Story Summary from '{candidate}' ({len(txt)} chars).")
                          return txt
              return ""

          def json_or_null(val):
              return json.dumps(val, ensure_ascii=False) if val else "null"

          def calc_target_budget(chunk_segments, total_duration):
              try:
                  total_target_min = float(TARGET_MINUTES or "4")
                  total_words_budget = max(80, int(round(total_target_min * 140)))
                  cs = float(chunk_segments[0].get("start", 0.0))
                  ce = float(chunk_segments[-1].get("end", cs))
                  span = max(0.0, ce - cs)
                  ratio = min(1.0, span / total_duration) if (total_duration > 0 and span > 0) else 0.5
                  pct = max(5, int(round(ratio * 100)))
                  prop_min = max(0.3, round(total_target_min * ratio, 2))
                  chunk_words = max(50, int(round(prop_min * 140)))
                  return f"~{prop_min} minutes (full target: {total_target_min} minutes)", str(chunk_words), str(total_words_budget), str(pct)
              except Exception:
                  return f"{TARGET_MINUTES} minutes", "180", "560", "33"

          def format_segs_with_gaps(segs):
              lines = []
              prev_end = None
              for seg in segs:
                  st = round(float(seg.get("start", 0.0)), 2)
                  en = round(float(seg.get("end", st)), 2)
                  if prev_end is not None and (st - prev_end) >= 4.0:
                      gap_dur = round(st - prev_end, 1)
                      lines.append(f"[SILENT_GAP {prev_end}-{st} ({gap_dur}s)]")
                  txt = str(seg.get("text", "")).strip().replace("\n", " ")
                  lines.append(f"{st}-{en}|{txt}")
                  prev_end = en
              return "\n".join(lines)

          def build_prompt_0_summary(movie_title):
              p = PROMPT_0_FETCH_SUMMARY
              for k, v in [
                  ("__MOVIE_TITLE__", movie_title), ("__CONTENT_TYPE__", INPUT_CONTENT_TYPE or "N/A"),
                  ("__SEASON__", INPUT_SEASON or "N/A"), ("__EPISODE__", INPUT_EPISODE or "N/A"),
                  ("__PART_IDENTIFIER__", INPUT_PART or "N/A")
              ]:
                  p = p.replace(k, v)
              return p

          def build_draft_prompt_chunk(movie_title, transcript_data, start_idx, master_summary, already_narrated, next_beat_num, next_clip_num):
              all_segs = transcript_data.get("segments", [])
              total_duration = float(transcript_data.get("duration") or 0.0)
              if start_idx >= len(all_segs):
                  return None, start_idx

              nb_id, nc_id = f"B{next_beat_num:04d}", f"C{next_clip_num:04d}"
              summary_trimmed = master_summary.strip()[:3200]
              narrated_trimmed = (already_narrated or "None (this is the start of the video).")[-1200:]

              def render(dur_t, words_t, tot_w, pct_t, segs, lookahead_txt, sum_txt):
                  c_start = round(float(segs[0].get("start", 0.0)), 2) if segs else 0.0
                  c_end = round(float(segs[-1].get("end", 0.0)), 2) if segs else 0.0
                  compact = format_segs_with_gaps(segs)
                  p = PROMPT_DRAFT_FROM_SUMMARY
                  for k, v in [
                      ("__MOVIE_TITLE__", movie_title),
                      ("__CONTENT_TYPE__", INPUT_CONTENT_TYPE or "Series"),
                      ("__SEASON_JSON__", json_or_null(INPUT_SEASON)),
                      ("__EPISODE_JSON__", json_or_null(INPUT_EPISODE)),
                      ("__PART_JSON__", json_or_null(INPUT_PART)),
                      ("__TARGET_MINUTES__", TARGET_MINUTES or "4"),
                      ("__TOTAL_TARGET_WORDS__", tot_w),
                      ("__CHUNK_PCT__", pct_t),
                      ("__TARGET_DURATION__", dur_t),
                      ("__TARGET_WORDS__", words_t),
                      ("__MAX_CLIP_SEC__", str(MAX_CLIP_DURATION)),
                      ("__CHUNK_START__", str(c_start)),
                      ("__CHUNK_END__", str(c_end)),
                      ("__NEXT_BEAT_ID__", nb_id),
                      ("__NEXT_CLIP_ID__", nc_id),
                      ("__MASTER_SUMMARY__", sum_txt),
                      ("__ALREADY_NARRATED__", narrated_trimmed),
                      ("__LOOKAHEAD__", lookahead_txt or "End of transcript."),
                      ("__COMPACT_TRANSCRIPT__", compact),
                  ]:
                      p = p.replace(k, v)
                  return p

              # Keep chunks around ~3500-4200 chars of transcript so Critic stays safely under Haiku's limit
              target_draft_cap = min(DRAFT_MAX_CHARS, 9500)
              base_len = len(render("~1.5m", "180", "560", "30", [], "x" * 300, summary_trimmed))
              budget = target_draft_cap - base_len - 120
              if budget < 2000:
                  summary_trimmed = summary_trimmed[:max(1200, len(summary_trimmed) - (2200 - budget))]
                  budget = target_draft_cap - len(render("~1.5m", "180", "560", "30", [], "x" * 300, summary_trimmed)) - 120

              selected, used, idx = [], 0, start_idx
              while idx < len(all_segs):
                  seg = all_segs[idx]
                  line = f"{round(float(seg.get('start', 0.0)), 2)}-{round(float(seg.get('end', 0.0)), 2)}|{str(seg.get('text', '')).strip()}"
                  extra = len(line) + 32
                  if used + extra > budget:
                      if not selected:
                          selected.append(seg); idx += 1
                      break
                  selected.append(seg); used += extra; idx += 1

              lookahead_segs = all_segs[idx : idx + 8]
              lookahead_txt = " | ".join(str(s.get("text", "")).strip() for s in lookahead_segs)[:300] if lookahead_segs else "End of transcript."
              dur_t, words_t, tot_w, pct_t = calc_target_budget(selected, total_duration)
              final_p = render(dur_t, words_t, tot_w, pct_t, selected, lookahead_txt, summary_trimmed)

              while len(final_p) > DRAFT_MAX_CHARS and len(selected) > 1:
                  selected.pop(); idx -= 1
                  lookahead_segs = all_segs[idx : idx + 8]
                  lookahead_txt = " | ".join(str(s.get("text", "")).strip() for s in lookahead_segs)[:300] if lookahead_segs else "End of transcript."
                  dur_t, words_t, tot_w, pct_t = calc_target_budget(selected, total_duration)
                  final_p = render(dur_t, words_t, tot_w, pct_t, selected, lookahead_txt, summary_trimmed)

              return {
                  "movie_title": movie_title, "start_idx": start_idx, "end_idx": idx,
                  "chunk_segs": selected, "time_start": round(float(selected[0].get("start", 0.0)), 2),
                  "time_end": round(float(selected[-1].get("end", 0.0)), 2),
                  "dur_text": dur_t, "words_text": words_t, "total_words_text": tot_w, "chunk_pct": pct_t,
                  "prompt_chars": len(final_p), "prompt": final_p
              }, idx

          def build_critic_prompt_chunk(movie_title, chunk_meta, draft_norm, master_summary, prev_ending, next_beat_num, next_clip_num, compress_level=0):
              compact = format_segs_with_gaps(chunk_meta["chunk_segs"])
              slim_beats = []
              for b in draft_norm.get("beats", []):
                  if compress_level >= 1:
                      slim_clips = [{"start": c["start"], "end": c["end"], "duration": c["duration"], "spoken_text": c.get("spoken_text", "")} for c in b.get("clips", [])]
                  else:
                      slim_clips = [{"start": c["start"], "end": c["end"], "duration": c["duration"], "spoken_text": c.get("spoken_text", ""), "scene_context": c.get("scene_context", "")} for c in b.get("clips", [])]
                  slim_beats.append({"narration": b.get("narration", ""), "is_scene_bridge": b.get("is_scene_bridge", False), "clips": slim_clips})

              draft_payload = {
                  "movie_title": movie_title, "content_type": INPUT_CONTENT_TYPE or None,
                  "season": INPUT_SEASON or None, "episode": INPUT_EPISODE or None, "part_identifier": INPUT_PART or None,
                  "characters": draft_norm.get("characters", []), "synopsis": draft_norm.get("synopsis", ""),
                  "beats": slim_beats
              }

              def render(d_obj, raw_txt, sum_txt):
                  p = PROMPT_CRITIC_VERIFY
                  for k, v in [
                      ("__TARGET_MINUTES__", TARGET_MINUTES or "4"),
                      ("__TARGET_WORDS__", chunk_meta.get("words_text", "180")),
                      ("__MAX_CLIP_SEC__", str(MAX_CLIP_DURATION)),
                      ("__CHUNK_START__", str(chunk_meta["time_start"])),
                      ("__CHUNK_END__", str(chunk_meta["time_end"])),
                      ("__NEXT_BEAT_ID__", f"B{next_beat_num:04d}"),
                      ("__NEXT_CLIP_ID__", f"C{next_clip_num:04d}"),
                      ("__PREV_ENDING__", prev_ending or "Start of video"),
                      ("__MASTER_SUMMARY__", sum_txt),
                      ("__COMPACT_TRANSCRIPT__", raw_txt),
                      ("__DRAFT_JSON__", json.dumps(d_obj, ensure_ascii=False, separators=(",", ":")))
                  ]:
                      p = p.replace(k, v)
                  return p

              hard_cap = CRITIC_MAX_CHARS if compress_level == 0 else max(6500, CRITIC_MAX_CHARS - (compress_level * 1600))
              sum_cap = 2600 if compress_level == 0 else (1500 if compress_level == 1 else 800)
              sum_txt = master_summary.strip()[:sum_cap]
              prompt = render(draft_payload, compact, sum_txt)

              if len(prompt) > hard_cap:
                  for b in draft_payload["beats"]:
                      b["clips"] = [{"start": c["start"], "end": c["end"], "duration": c["duration"], "spoken_text": c.get("spoken_text", "")} for c in b.get("clips", [])]
                  prompt = render(draft_payload, compact, sum_txt[:1500])
              if len(prompt) > hard_cap:
                  over = len(prompt) - hard_cap + 120
                  sum_txt = sum_txt[:max(600, len(sum_txt) - over)]
                  prompt = render(draft_payload, compact, sum_txt)
              if len(prompt) > hard_cap:
                  over = len(prompt) - hard_cap + 120
                  compact = compact[:max(1200, len(compact) - over)]
                  prompt = render(draft_payload, compact, sum_txt)

              return {"prompt_chars": len(prompt), "prompt": prompt}

          def dedupe_characters(char_dict_or_list):
              items = list(char_dict_or_list.values()) if isinstance(char_dict_or_list, dict) else list(char_dict_or_list or [])
              merged = {}
              for ch in items:
                  if not isinstance(ch, dict):
                      continue
                  name = str(ch.get("name", "")).strip()
                  desc = str(ch.get("description", "")).strip()
                  if not name:
                      continue
                  key = re.sub(r"[\s\.]+", "", name.lower())
                  if key not in merged or len(desc) > len(merged[key]["description"]):
                      merged[key] = {"name": name, "description": desc}
              return list(merged.values())

          # ------------------ PLAYWRIGHT SETUP & EXECUTION ------------------
          browser = context = page = None
          current_chat_state = {"raw_stream": [], "chat_done": False, "rate_limited": False}

          def launch_browser(pw):
              global browser, context, page
              if browser:
                  try: browser.close()
                  except Exception: pass
              browser = pw.chromium.launch(headless=not HEADED, proxy={"server": BROWSER_PROXY}, args=["--disable-dev-shm-usage", "--disable-blink-features=AutomationControlled"])
              context = browser.new_context(viewport={"width": 1440, "height": 1000}, user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36", permissions=["clipboard-read", "clipboard-write"])
              context.add_init_script(FETCH_HOOK_JS)
              page = context.new_page()

              def is_chat_req(req):
                  cu = req.url.split("?")[0]
                  return req.method == "POST" and ("/duckchat/v1/chat" in cu or cu.endswith("/chat"))

              page.on("response", lambda r: (
                  log(f"Network chat HTTP {r.status} -> {r.url}"),
                  current_chat_state.__setitem__("rate_limited", True) if r.status in (418, 429) else None
              ) if is_chat_req(r.request) else None)

              def on_done(req):
                  if is_chat_req(req):
                      try:
                          resp = req.response()
                          if resp:
                              b = resp.body().decode("utf-8", errors="replace")
                              if b: current_chat_state["raw_stream"].append(b)
                      except Exception:
                          pass
                      current_chat_state["chat_done"] = True
              page.on("requestfinished", on_done)

          def open_fresh_duckai_chat(model_name, use_reasoning, use_web_search=False, take_verify_snap=False, snap_prefix="settings"):
              page.goto("https://duck.ai/chat", wait_until="domcontentloaded", timeout=75000)
              wait_for_duckai_ui_ready(page, timeout_ms=45000)
              page.wait_for_timeout(1500)
              configure_duckai_settings(page, model_name, use_reasoning, use_web_search, take_verify_snap=take_verify_snap, snap_prefix=snap_prefix)

          with sync_playwright() as p:
              launch_browser(p)

              if RUN_MODE == "probe":
                  open_fresh_duckai_chat(DRAFT_MODEL, False, ENABLE_WEB_SEARCH, take_verify_snap=True, snap_prefix="probe_draft")
                  box = get_prompt_box(page); box.wait_for(state="visible", timeout=40000)
                  probe_p = 'Output valid JSON only: {"status": "ready", "hindi": "कहानी शुरू"}'
                  send_and_confirm(page, box, probe_p, context, current_chat_state, "ProbeDraft", is_new_chat=True)
                  out = wait_for_response(page, current_chat_state, prompt_text=probe_p, max_wait=60, expect_json=True, expect_beats=False)
                  log(f"Probe Draft Result: {parse_first_balanced_json(out, require_beats=False)}")
                  if CRITIC_MODEL.lower() not in ("", "none", "skip"):
                      open_fresh_duckai_chat(CRITIC_MODEL, ENABLE_REASONING, ENABLE_WEB_SEARCH, take_verify_snap=True, snap_prefix="probe_critic")
                      box = get_prompt_box(page); box.wait_for(state="visible", timeout=40000)
                      send_and_confirm(page, box, probe_p, context, current_chat_state, "ProbeCritic", is_new_chat=True)
                      out2 = wait_for_response(page, current_chat_state, prompt_text=probe_p, max_wait=60, expect_json=True, expect_beats=False)
                      parsed2 = parse_first_balanced_json(out2, require_beats=False)
                      log(f"Probe Critic Result: {parsed2}")
                      browser.close()
                      sys.exit(0 if (parsed2 and parsed2.get("status") == "ready") else 1)
                  browser.close()
                  sys.exit(0)

              transcript_data = load_transcript("transcript.json")
              all_segs = transcript_data.get("segments", [])
              total_segments = len(all_segs)
              if total_segments == 0:
                  raise RuntimeError("transcript.json contains 0 segments.")
              movie_title = INPUT_MOVIE_TITLE or str(transcript_data.get("movie_title") or "Untitled")
              transcript_max_ts = float(transcript_data.get("duration") or all_segs[-1].get("end") or 0.0)

              pipeline_state = {
                  "master_summary": load_initial_summary(),
                  "next_segment_idx": 0,
                  "chunk_num": 0,
                  "beats": [],
                  "characters": {},
                  "synopses": []
              }
              if STATE_FILE.exists():
                  try:
                      loaded = json.load(open(STATE_FILE, "r", encoding="utf-8"))
                      if isinstance(loaded, dict):
                          pasted = pipeline_state["master_summary"]
                          pipeline_state = deep_repair(loaded)
                          if pasted:
                              pipeline_state["master_summary"] = pasted
                  except Exception:
                      pass

              draft_snap_done = False
              critic_snap_done = False

              if not pipeline_state.get("master_summary"):
                  log(f"No pasted story_summary or summary.txt found. Fetching via Web Search on '{CRITIC_MODEL}'...")
                  p0_txt = build_prompt_0_summary(movie_title)
                  fetch_model = CRITIC_MODEL if CRITIC_MODEL.lower() not in ("", "none", "skip") else DRAFT_MODEL
                  for att in range(1, 3):
                      try:
                          open_fresh_duckai_chat(fetch_model, ENABLE_REASONING, use_web_search=True, take_verify_snap=(not critic_snap_done), snap_prefix="critic")
                          critic_snap_done = True
                          box = get_prompt_box(page); box.wait_for(state="visible", timeout=40000)
                          if not send_and_confirm(page, box, p0_txt, context, current_chat_state, "FETCH_SUMMARY", is_new_chat=True):
                              raise RuntimeError("Summary fetch not acknowledged.")
                          fetched = wait_for_response(page, current_chat_state, prompt_text=p0_txt, max_wait=180, expect_json=False, expect_beats=False)
                          if len(fetched.strip()) >= 120:
                              pipeline_state["master_summary"] = fetched.strip()
                              (DEBUG_DIR / "fetched_summary.txt").write_text(fetched.strip(), encoding="utf-8")
                              json.dump(pipeline_state, open(STATE_FILE, "w", encoding="utf-8"), indent=2, ensure_ascii=False)
                              log(f"Fetched summary ({len(fetched.strip())} chars).")
                              break
                      except Exception as e:
                          log(f"Summary fetch att {att} notice: {e}")
                          if att < 2: renew_tor(); launch_browser(p)
                  if not pipeline_state.get("master_summary"):
                      raise RuntimeError("No story_summary provided and automatic Web Search fetch failed.")

              master_summary = pipeline_state["master_summary"]
              (DEBUG_DIR / "active_summary.txt").write_text(master_summary, encoding="utf-8")
              log(f"Starting Summary-Driven Clip Engine | Title: '{movie_title}' | Summary: {len(master_summary)} chars | Segments: {total_segments}")

              while pipeline_state["next_segment_idx"] < total_segments:
                  cur_idx = pipeline_state["next_segment_idx"]
                  chunk_num = pipeline_state["chunk_num"] + 1
                  nb_num = len(pipeline_state["beats"]) + 1
                  nc_num = sum(len(b.get("clips", [])) for b in pipeline_state["beats"]) + 1

                  recent_beats = [b.get("narration", "") for b in pipeline_state["beats"][-4:] if b.get("narration")]
                  already_narrated = ""
                  if pipeline_state["synopses"] or recent_beats:
                      already_narrated = (
                          "Synopsis covered so far: " + " ".join(pipeline_state["synopses"][-3:])
                          + "\nExact last narrated beats (continue right after the last one):\n- "
                          + "\n- ".join(recent_beats)
                      )

                  chunk_meta, next_idx = build_draft_prompt_chunk(
                      movie_title, transcript_data, cur_idx, master_summary, already_narrated, nb_num, nc_num
                  )
                  if not chunk_meta:
                      break

                  log(f"\n=== CHUNK {chunk_num} on '{DRAFT_MODEL}': segs {chunk_meta['start_idx']+1}..{chunk_meta['end_idx']}/{total_segments} ({chunk_meta['time_start']}s..{chunk_meta['time_end']}s | {chunk_meta['chunk_pct']}% -> ~{chunk_meta['words_text']} words, {chunk_meta['prompt_chars']} chars) ===")

                  draft_norm = None
                  for att in range(1, MAX_ATTEMPTS + 1):
                      try:
                          open_fresh_duckai_chat(DRAFT_MODEL, False, use_web_search=ENABLE_WEB_SEARCH, take_verify_snap=(not draft_snap_done), snap_prefix="draft")
                          draft_snap_done = True
                          box = get_prompt_box(page); box.wait_for(state="visible", timeout=40000)
                          if not send_and_confirm(page, box, chunk_meta["prompt"], context, current_chat_state, f"Chunk {chunk_num} DRAFT", is_new_chat=True):
                              raise RuntimeError("Draft submission not acknowledged.")
                          raw = wait_for_response(page, current_chat_state, prompt_text=chunk_meta["prompt"], max_wait=TEXT_WAIT, expect_json=True, expect_beats=True, prev_code_blocks=0)
                          (DEBUG_DIR / f"raw_draft_c{chunk_num}_a{att}.txt").write_text(raw, encoding="utf-8")
                          pj = parse_first_balanced_json(raw, require_beats=True)
                          if not is_valid_recap_json(pj):
                              raise RuntimeError("Invalid draft JSON beats.")
                          draft_norm = normalize_chunk_beats(pj, chunk_segs=chunk_meta["chunk_segs"], min_ts=chunk_meta["time_start"], max_ts=transcript_max_ts)
                          log(f"SUCCESS Draft Chunk {chunk_num}: +{len(draft_norm['beats'])} beats.")
                          break
                      except Exception as e:
                          log(f"Draft Chunk {chunk_num} att {att} failed: {e}")
                          snap(page, f"err_draft_c{chunk_num}_a{att}")
                          if att < MAX_ATTEMPTS: renew_tor(); launch_browser(p)

                  if draft_norm is None:
                      raise RuntimeError(f"Draft failed on Chunk {chunk_num} after {MAX_ATTEMPTS} attempts.")

                  verified_norm = None
                  if CRITIC_MODEL.lower() not in ("", "none", "skip"):
                      prev_ending = pipeline_state["beats"][-1].get("narration", "") if pipeline_state["beats"] else ""
                      compress_lvl = 0
                      for c_att in range(1, MAX_ATTEMPTS + 1):
                          critic_meta = build_critic_prompt_chunk(
                              movie_title, chunk_meta, draft_norm, master_summary, prev_ending, nb_num, nc_num, compress_level=compress_lvl
                          )
                          log(f"Running Critic Clip & Summary Verification on '{CRITIC_MODEL}' ({critic_meta['prompt_chars']} chars, compress={compress_lvl})...")
                          try:
                              open_fresh_duckai_chat(CRITIC_MODEL, ENABLE_REASONING, use_web_search=ENABLE_WEB_SEARCH, take_verify_snap=(not critic_snap_done), snap_prefix="critic")
                              critic_snap_done = True
                              box = get_prompt_box(page); box.wait_for(state="visible", timeout=40000)
                              if not send_and_confirm(page, box, critic_meta["prompt"], context, current_chat_state, f"Chunk {chunk_num} CRITIC", is_new_chat=True):
                                  raise RuntimeError("Critic submission not acknowledged.")
                              r5 = wait_for_response(page, current_chat_state, prompt_text=critic_meta["prompt"], max_wait=TEXT_WAIT, expect_json=True, expect_beats=True, prev_code_blocks=0)
                              (DEBUG_DIR / f"raw_critic_c{chunk_num}_a{c_att}.txt").write_text(r5, encoding="utf-8")
                              pj5 = parse_first_balanced_json(r5, require_beats=True)
                              if not is_valid_recap_json(pj5):
                                  raise RuntimeError("Invalid critic JSON beats.")
                              verified_norm = normalize_chunk_beats(pj5, chunk_segs=chunk_meta["chunk_segs"], min_ts=chunk_meta["time_start"], max_ts=transcript_max_ts)
                              log(f"SUCCESS Critic Chunk {chunk_num}: verified {len(verified_norm['beats'])} beats.")
                              break
                          except Exception as c_err:
                              log(f"Critic Chunk {chunk_num} att {c_att} failed: {c_err}")
                              snap(page, f"err_critic_c{chunk_num}_a{c_att}")
                              if "PROMPT_TOO_LONG" in str(c_err):
                                  compress_lvl += 1
                                  log(f"Prompt exceeded Haiku limit -> increasing compression to level {compress_lvl}.")
                              elif c_att < MAX_ATTEMPTS:
                                  renew_tor(); launch_browser(p)

                  final_chunk = verified_norm if verified_norm is not None else draft_norm
                  if verified_norm is None and CRITIC_MODEL.lower() not in ("", "none", "skip"):
                      log(f"WARNING: Critic failed on Chunk {chunk_num}; falling back to normalized Draft output.")

                  pipeline_state["beats"].extend(final_chunk["beats"])
                  if final_chunk["synopsis"]:
                      pipeline_state["synopses"].append(final_chunk["synopsis"])
                  for ch in dedupe_characters(final_chunk.get("characters", [])):
                      key = re.sub(r"[\s\.]+", "", ch["name"].lower())
                      if key not in pipeline_state["characters"] or len(ch["description"]) > len(pipeline_state["characters"][key]["description"]):
                          pipeline_state["characters"][key] = ch
                  pipeline_state["next_segment_idx"] = next_idx
                  pipeline_state["chunk_num"] = chunk_num

                  json.dump(pipeline_state, open(STATE_FILE, "w", encoding="utf-8"), indent=2, ensure_ascii=False)
                  log(f"Saved Chunk {chunk_num} (total beats: {len(pipeline_state['beats'])}, next_idx: {next_idx}/{total_segments}).")

              # ------------------ MERGE & EXPORT FINAL JSON ------------------
              final_beats, total_words, clip_counter = [], 0, 1
              for b_idx, b in enumerate(pipeline_state.get("beats", []), 1):
                  narr = str(b.get("narration", "")).strip()
                  wc = int(b.get("word_count") or len(narr.split()))
                  est_dur = round(float(b.get("estimated_duration") or ((wc / 140.0) * 60.0)), 2)
                  b_copy = {
                      "beat_id": f"B{b_idx:04d}",
                      "narration": narr,
                      "word_count": wc,
                      "estimated_duration": est_dur,
                      "is_scene_bridge": bool(b.get("is_scene_bridge", False)),
                      "clips": []
                  }
                  total_words += wc
                  for c in b.get("clips", []):
                      st = round(float(c.get("start", 0.0)), 2)
                      en = round(float(c.get("end", st)), 2)
                      dur = round(float(c.get("duration") or max(0.0, en - st)), 2)
                      b_copy["clips"].append({
                          "clip_id": f"C{clip_counter:04d}",
                          "start": st,
                          "end": en,
                          "duration": dur,
                          "spoken_text": str(c.get("spoken_text", "")).strip(),
                          "spoken_word_count": int(c.get("spoken_word_count", 0)),
                          "estimated_spoken_duration": round(float(c.get("estimated_spoken_duration", 0.0)), 2),
                          "scene_context": str(c.get("scene_context", "")).strip()
                      })
                      clip_counter += 1
                  final_beats.append(b_copy)

              target_min_val = float(TARGET_MINUTES) if TARGET_MINUTES else None
              final_output = {
                  "movie_title": movie_title,
                  "content_type": INPUT_CONTENT_TYPE or None,
                  "season": INPUT_SEASON or None,
                  "episode": INPUT_EPISODE or None,
                  "part_identifier": INPUT_PART or None,
                  "target_minutes": target_min_val,
                  "estimated_narration_minutes": round(total_words / 140.0, 2),
                  "total_beats": len(final_beats),
                  "total_words": total_words,
                  "characters": dedupe_characters(pipeline_state.get("characters", {})),
                  "synopsis": " ".join(pipeline_state.get("synopses", [])).strip(),
                  "beats": final_beats
              }
              Path("story_beats.json").write_text(json.dumps(final_output, ensure_ascii=False, indent=2), encoding="utf-8")

              preview_lines = [
                  f"=== YOUTUBE MOVIE RECAP SCRIPT: {final_output['movie_title']} ===",
                  f"Est. Runtime: ~{final_output['estimated_narration_minutes']} mins | Target: {final_output['target_minutes']} mins | Beats: {final_output['total_beats']} | Words: {final_output['total_words']}",
                  f"Synopsis: {final_output['synopsis']}\n", "=" * 70
              ]
              for b in final_output["beats"]:
                  preview_lines.append(f"[{b['beat_id']} | Words: {b['word_count']} | Est: {b['estimated_duration']}s]")
                  preview_lines.append(f"Narration: {b['narration']}")
                  for c in b.get("clips", []):
                      preview_lines.append(
                          f"  - {c['clip_id']}: {c['start']}s->{c['end']}s ({c['duration']}s) | TTS~{c['estimated_spoken_duration']}s | Spoken: \"{c['spoken_text']}\""
                      )
                  preview_lines.append("-" * 70)
              Path("script_preview.txt").write_text("\n".join(preview_lines), encoding="utf-8")
              log(f"GENERATION COMPLETE: {len(final_beats)} beats & {clip_counter - 1} clips written to story_beats.json & script_preview.txt.")
              if browser:
                  browser.close()
          PY

          if [ "$HEADED" = "true" ]; then
            xvfb-run -a --server-args="-screen 0 1440x1000x24" python recap_engine.py
          else
            python recap_engine.py
          fi

      - name: Kill Background Browser Instances
        if: always()
        run: |
          pkill -9 -f chrome || true
          pkill -9 -f Xvfb || true

      - name: Commit and Push Story Assets & Verification Screenshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f story_beats.json script_preview.txt build/pipeline_state.json debug/*_verified.png debug/*_dropdown_open.png debug/*_tools_open.png || true
          if ! git diff --cached --quiet; then
            git commit -m "Update summary-driven phrase-synced Hindi recap JSON [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload Debug Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recap-engine-artifacts
          path: |
            debug/
            script_preview.txt
            story_beats.json
          if-no-files-found: ignore
